# Argus dogfood configuration — we scan ourselves
version: "1.0"

scanners:
  bandit:
    enabled: true
    path: "."
    config_file: "pyproject.toml"
    exclude: ".venv,.git,node_modules,.claude,__pycache__"

  gitleaks:
    enabled: true

  opengrep:
    enabled: true
    path: "."

  clamav:
    enabled: true
    path: "."

  osv:
    enabled: true

  supply-chain:
    enabled: true

  # Not applicable to this repo
  trivy-iac:
    enabled: false
  checkov:
    enabled: false
  container:
    enabled: false
  zap:
    enabled: false

reporting:
  formats:
    - terminal
    - markdown
    - sarif
    - json
  severity_threshold: high
  output_dir: "./argus-results"

execution:
  # auto: local tools first, Docker fallback for dev machines
  # CI sets ARGUS_EXECUTION_BACKEND=local via env override
  backend: auto
  pull_policy: if-not-present
