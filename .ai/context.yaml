# .ai/context.yaml
# Project metadata and high-level overview
# AICaC Specification v1.0

version: "1.0"
schema: "https://aicac.dev/schema/v1"

project:
  name: argus
  type: security-pipeline
  purpose: "Automated security scanning via Python SDK and GitHub Actions"
  primary_language: python  # SDK and scanner scripts
  secondary_languages: [yaml]
  version: "0.7.0"
  license: "AGPL-3.0"
  repository: "huntridge-labs/argus"

  one_liner: >
    Python SDK and composite GitHub Actions that orchestrate 14+ security
    scanners with unified CLI, SARIF upload, and PR comments.

  solves:
    - Running multiple security scanners from a single CLI command or workflow
    - Unified severity thresholds across different scanner outputs
    - Platform-independent scanning (local, CI, GHES)
    - PR feedback with inline code annotations (via composite actions)

  does_not_solve:
    - Remediation of found vulnerabilities (reporting only)
    - Custom scanner development (uses existing tools)
    - Security policy enforcement (provides data, not gates)

entrypoints:
  sdk: "argus/"
  sdk_cli: "python -m argus scan --config argus.yml"
  actions: ".github/actions/"
  examples: "examples/workflows/"
  documentation: "docs/"
  agent_skills: ".agents/skills/"
  docsite: "scripts/docsite/"
  docsite_config: "docsite.yml"
  docsite_url: "https://huntridge-labs.github.io/argus/"

common_tasks:
  run_all_scanners: "Run the full scanner suite via python -m argus scan --config argus.yml."
  run_subset: "Run specific scanners via python -m argus scan <scanner1> <scanner2>."
  recommend_scanners: "Use the argus-scanner-selection skill to map a target repository or local change set to the right Argus scanners."
  view_reports: "Review terminal, markdown, SARIF, or JSON output from the SDK."
  update_versions: "Bump scanner or action versions and validate outputs."
  troubleshoot_failures: "Inspect CLI output or workflow logs to resolve errors."

primary_users:
  - DevSecOps engineers setting up CI/CD pipelines
  - Security teams wanting automated scanning
  - Platform teams supporting multiple repositories

platforms:
  supported:
    - github-actions
    - github-enterprise-server
  constraints:
    - "Composite actions work on any GHES with github.com access"
    - "Must support air-gapped environments"

context_modules:
  architecture: "architecture.yaml"
  workflows: "workflows.yaml"
  decisions: "decisions.yaml"
  errors: "errors.yaml"

glossary:
  SARIF: "Static Analysis Results Interchange Format - JSON standard for findings"
  SAST: "Static Application Security Testing - analyze code without running it"
  DAST: "Dynamic Application Security Testing - test running application"
  IaC: "Infrastructure as Code - Terraform, Kubernetes, CloudFormation"
  SBOM: "Software Bill of Materials - inventory of dependencies"
  GHES: "GitHub Enterprise Server - self-hosted GitHub"
  Composite Action: "GitHub Action that runs steps directly (vs calling another workflow)"
  Reusable Workflow: "GitHub workflow that can be called from other workflows"
  Matrix: "GitHub Actions feature to run job with different parameter combinations"
