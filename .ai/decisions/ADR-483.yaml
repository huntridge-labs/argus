id: ADR-483
title: Issue-keyed ADRs, one file per decision
date: '2026-10-22'
status: accepted
context: |-
  Every ADR lived in one file, .ai/decisions.yaml, and a new one took "the
  next free number" at the end of it. Two pull requests open at the same time
  both picked ADR-043 and both appended at the same spot, so the second to
  merge hit a conflict. YAML also keeps the last of two duplicate keys
  without complaint, so a clean textual merge could silently drop a decision.
  Nothing tied a branch or an ADR to the issue that asked for it either.

  The other shared .ai/ files were checked for the same problem.
  errors.yaml and workflows.yaml are keyed by descriptive names, not
  allocated numbers, so two PRs never fight over an ID and a textual
  conflict there is rare and easy to resolve. index.yaml is generated by the
  AICaC tooling and is not regenerated in CI, so PRs don't edit it.
  CHANGELOG.md is written by release-it. None of them changed.
decision: |-
  Key every new record to the GitHub issue that asked for it.

  - Every change starts with an issue, one issue per PR. Branches are named
    `<prefix>/<issue>-<description>` with a prefix the branch-name ruleset
    allows (feat, fix, chore, docs, ...).
  - A new ADR is its own file, `.ai/decisions/ADR-<issue>.yaml`, with the
    same fields as a decisions.yaml entry plus `id`. Issue numbers are
    unique, so two PRs can't pick the same ID and never edit the same lines.
  - ADR-001 to ADR-044 stay in .ai/decisions.yaml with their numbers. The
    file is closed to new entries; existing entries can still be edited.
    Legacy IDs are zero-padded three digits. Issue-keyed IDs are not padded
    and must be at least 100, so the two ranges can't collide.
  - There is no hand-kept index. `python -m scripts.ci.adr_records list`
    merges both stores at read time; the docsite architecture map reads
    both too.
  - The ADR Records workflow runs scripts/ci/adr_records.py on every PR and
    push to main. It fails on a new ADR whose number isn't the branch's
    issue, on duplicate IDs (including duplicate keys inside
    decisions.yaml), on new entries appended to decisions.yaml, and on
    issue-keyed files missing the fields the AICaC decisions schema
    requires. A branch with no issue number that adds no ADR only gets a
    warning, so Dependabot, Renovate and fork PRs still merge.
  - AGENTS.md is the single entry point for coding agents and holds the
    how-to under "Issues, branches, and records". CLAUDE.md imports it and
    .github/copilot-instructions.md links to it.
rationale:
- An issue number is already a unique, shared allocator; reusing it removes
  the race instead of detecting it after the fact.
- One file per ADR means parallel PRs touch different files, so there is
  nothing to conflict on.
- Leaving the legacy ADRs where they are keeps every existing "ADR-0xx in
  .ai/decisions.yaml" reference valid and keeps the AICaC adoption check at
  the same compliance level.
alternatives_considered:
- name: Move all 44 legacy ADRs into per-file records
  rejected_because: Breaks every existing reference to .ai/decisions.yaml
    and the AICaC validator only reads that file, so the move buys nothing
    the frozen file doesn't already give.
- name: Generate .ai/decisions.yaml from per-file records and commit it
  rejected_because: Every PR that adds an ADR would regenerate the same file
    at the same append point, which is the conflict this decision removes.
- name: Keep sequential numbers and add a CI duplicate check only
  rejected_because: It catches the collision after both PRs are written,
    and someone still has to renumber and fix references by hand.
consequences:
  positive:
  - Parallel PRs can each add an ADR without conflicts or renumbering.
  - An ADR's ID says which issue it came from.
  - Duplicate keys in decisions.yaml are caught instead of silently dropped.
  negative:
  - ADRs live in two places; readers use the list command or both paths.
  - The AICaC validator only schema-checks decisions.yaml, so
    adr_records.py repeats its required-field checks for the new files.
  - A legacy ADR can't name an issue-keyed successor in `superseded_by`
    (the AICaC validator only resolves IDs inside decisions.yaml); the new
    ADR lists it under `supersedes` instead.
implementation: |-
  scripts/ci/adr_records.py (check, list, new), tests/unit/test_adr_records.py,
  .github/workflows/adr-records.yml, scripts/docsite/architecture.py
  (load_inputs merges .ai/decisions/), AGENTS.md "Issues, branches, and
  records", .github/PULL_REQUEST_TEMPLATE.md.
