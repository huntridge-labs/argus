version: '2.0'
decisions:
  ADR-001:
    title: Composite actions as primary architecture
    date: '2024-11-15'
    status: accepted
    context: 'GitHub Enterprise Server doesn''t support cross-repository workflow_call

      for reusable workflows. Composite actions are self-contained and work

      on any GHES with github.com access.

      '
    decision: Use composite actions as the primary architecture. Maintain reusable workflows as thin backwards-compatible
      wrappers.
    alternatives_considered:
    - name: Reusable workflows only
      rejected_because: Excludes GHES users without github.com access
    - name: External CI tool (Jenkins, Dagger)
      rejected_because: Adds external dependency, less GitHub-native
    consequences:
      positive:
      - Supports both github.com and GHES
      - Self-contained actions with bundled scripts
      - Easier to compose and test
      - No cross-repo workflow call overhead
      negative:
      - Reusable workflow wrappers add maintenance burden
      - More boilerplate for github.com users vs single workflow call
    implementation: 'Primary: .github/actions/

      Backwards compat: .github/workflows/

      '
  ADR-002:
    title: SARIF as universal output format
    date: '2024-11-20'
    status: accepted
    context: 'Each security scanner has its own output format (JSON, text, XML).

      GitHub Security tab requires SARIF format for integration.

      '
    decision: Convert all scanner outputs to SARIF format
    alternatives_considered:
    - name: Keep native formats
      rejected_because: No unified severity thresholds, no GitHub Security integration
    - name: Custom unified format
      rejected_because: Not GitHub-native, requires custom tooling
    consequences:
      positive:
      - Unified severity thresholds across scanners
      - GitHub Security tab integration
      - PR annotations for findings
      - Industry standard, tooling ecosystem exists
      negative:
      - Some scanner-specific nuances lost in translation
      - Requires parse scripts for each scanner
    implementation: Each scanner has scripts/parse-results.py that outputs SARIF-compatible JSON
  ADR-003:
    title: Bash scripts for parsing over Node.js/Python
    date: '2024-12-01'
    status: superseded
    context: 'Parse scripts run inside GitHub Actions. Need to convert scanner

      output to structured JSON quickly and reliably.

      '
    decision: Use bash + jq/yq for parsing scripts
    alternatives_considered:
    - name: Node.js scripts
      rejected_because: Requires npm install step, slower action startup
    - name: Python scripts
      rejected_because: Requires Python setup, heavier runtime
    - name: Go binaries
      rejected_because: Compilation step, harder to debug
    consequences:
      positive:
      - No runtime dependencies to install
      - Fast action execution
      - jq/yq commonly available in GitHub runners
      - Easy to debug (view script inline)
      negative:
      - Less maintainable than typed languages
      - Limited testing frameworks for bash
      - Complex string manipulation harder
    implementation: .github/actions/*/scripts/parse-results.py
  ADR-004:
    title: Co-located tests with actions
    date: '2024-12-05'
    status: accepted
    context: 'Each composite action needs tests. Question: where should tests live?

      '
    decision: Tests live in .github/actions/*/tests/ alongside the action
    alternatives_considered:
    - name: Centralized tests/ directory
      rejected_because: Tests divorced from code they test, harder to maintain
    - name: Separate test repository
      rejected_because: Even more divorced, harder to keep in sync
    consequences:
      positive:
      - Tests next to code they test
      - Easy to see test coverage at a glance
      - Natural to update tests when changing action
      - Self-contained actions (action + tests together)
      negative:
      - Larger action directories
      - Must traverse multiple directories to run all tests
    implementation: .github/actions/scanner-*/tests/
  ADR-005:
    title: Single version.yaml as source of truth
    date: '2024-12-10'
    status: accepted
    context: 'Version number appears in 20+ files: README, examples, action references,

      CONTRIBUTING docs, etc. Keeping them in sync is error-prone.

      '
    decision: Use version.yaml as single source, release-it updates all references
    alternatives_considered:
    - name: Manual version updates
      rejected_because: Error-prone, easy to miss files
    - name: Git tags only
      rejected_because: Docs still need hardcoded versions for examples
    consequences:
      positive:
      - Single place to check/update version
      - Automated consistency across all files
      - release-it handles version bumping
      negative:
      - Requires release-it configuration maintenance
      - Must remember to use release-it (not manual git tag)
    implementation: 'version.yaml - source of truth

      .release-it.json - configuration for version replacement patterns

      '
  ADR-006:
    title: Matrix strategy for parallel scanner execution
    date: '2024-11-25'
    status: accepted
    context: 'Running 10+ scanners sequentially is slow. GitHub Actions supports

      matrix strategy for parallel job execution.

      '
    decision: Use matrix strategy to run scanners in parallel
    alternatives_considered:
    - name: Sequential execution
      rejected_because: Too slow (30+ minutes vs 5-10 minutes)
    - name: Single job with all scanners
      rejected_because: No parallelism, harder to isolate failures
    consequences:
      positive:
      - Much faster execution (parallel)
      - Each scanner isolated (failures don't cascade)
      - Easy to add/remove scanners from matrix
      negative:
      - More complex workflow syntax
      - Matrix job limit (256) could be hit with many containers
    implementation: "strategy:\n  matrix:\n    scanner: [codeql, bandit, gitleaks, ...]\n  fail-fast:\
      \ false\n"
  ADR-007:
    title: Severity-based failure thresholds
    date: '2024-12-15'
    status: accepted
    context: 'Different branches need different failure criteria. Main branch should

      fail on critical findings, dev branches might allow medium severity.

      '
    decision: 'Implement fail_on_severity input with levels: critical/high/medium/low/none'
    alternatives_considered:
    - name: Always fail on any finding
      rejected_because: Too strict for development branches
    - name: Never fail (report only)
      rejected_because: Defeats purpose of security scanning
    - name: Branch-specific defaults
      rejected_because: User should control, not us
    consequences:
      positive:
      - User controls failure behavior
      - Supports different policies for different branches
      - 'Can run report-only scans (fail_on_severity: none)'
      negative:
      - Users might set too lenient thresholds
    implementation: "inputs:\n  fail_on_severity:\n    description: 'Minimum severity to fail workflow'\n\
      \    default: 'high'\n    type: choice\n    options: [critical, high, medium, low, none]\n"
  ADR-008:
    title: 'Flexible PR commenting: standalone vs aggregated'
    date: '2026-02-05'
    status: accepted
    context: 'Scanner actions can be used individually or via reusable workflows.

      Individual usage benefits from scanner-specific PR comments.

      Multiple scanners benefit from single aggregated PR comment.

      Need to support both patterns without PR comment spam.

      '
    decision: 'All scanner composite actions include comment-pr step with post_pr_comment

      input defaulting to false. Reusable workflows set post_pr_comment: false

      for all scanners, only security-summary job posts comprehensive comment.

      '
    alternatives_considered:
    - name: Always post individual comments
      rejected_because: Spams PRs with 10+ comments when using reusable workflow
    - name: Never post individual comments
      rejected_because: Poor UX when using scanners individually
    - name: Remove comment logic from actions entirely
      rejected_because: Forces users to implement their own PR commenting
    consequences:
      positive:
      - Standalone scanners can post focused PR comments
      - Reusable workflows produce single comprehensive comment
      - Users control behavior via post_pr_comment input
      - No PR comment spam from multiple scanners
      negative:
      - Requires post_pr_comment input on all scanner actions
      - Must document when to use true vs false
    implementation: "Scanner actions (.github/actions/scanner-*/action.yml):\n  inputs:\n    post_pr_comment:\n\
      \      default: 'false'\n  steps:\n    - name: Comment PR\n      if: github.event_name == 'pull_request'\
      \ && inputs.post_pr_comment == 'true'\n      uses: ./.github/actions/comment-pr\n\nReusable workflow\
      \ (.github/workflows/reusable-security-hardening.yml):\n  scanner-codeql:\n    with:\n      post_pr_comment:\
      \ false  # All scanners set to false\n  scanner-opengrep:\n    with:\n      post_pr_comment: false\n\
      \  # ... all other scanners with post_pr_comment: false\n\n  security-summary:\n    steps:\n   \
      \   - name: Comment PR with security summary\n        uses: actions/github-script@v8  # Only job\
      \ that posts PR comment\n"
    usage_examples:
      standalone: "# Individual scanner posts its own PR comment\n- uses: huntridge-labs/argus/.github/actions/scanner-bandit@1.8.1
        \  with:\n    post_pr_comment: true\n"
      reusable: "# Only security-summary posts comprehensive comment\nuses: huntridge-labs/argus/.github/workflows/reusable-security-hardening.yml@1.8.1
        with:\n  scanners: all\n  post_pr_comment: true  # Controls security-summary, not individual scanners\n"
  ADR-009:
    title: Consolidate scripts and tests to Python
    date: '2026-02-08'
    status: accepted
    context: 'Project maintained three languages for action scripts (Bash, JavaScript, Python)

      plus Ruby for Bash coverage via bashcov/SimpleCov. This fragmentation created:

      - Three test frameworks with different patterns

      - Three coverage tools with incompatible reporting

      - Higher contributor barrier (must learn multiple languages)

      - Harder to maintain and refactor code

      - CI complexity (multiple setup/teardown steps)

      '
    decision: Migrate all action scripts and tests to Python with pytest
    alternatives_considered:
    - name: Keep multi-language approach
      rejected_because: Undermines trust in coverage metrics and raises contributor barrier
    - name: Migrate only to Bash
      rejected_because: Bash lacks type safety, harder to test complex logic
    - name: Migrate only to JavaScript
      rejected_because: Adds Node.js dependency; Python already used for some actions
    consequences:
      positive:
      - Single test framework (pytest) with consistent patterns
      - One coverage tool (pytest-cov) producing unified metrics
      - Lower contributor barrier (Python widely known, standard on CI runners)
      - Better readability (200-line Bash becomes ~80 lines Python)
      - Simplified CI/CD (no Ruby, no Node.js for tests)
      - Eliminated duplicate script pairs (container/container-summary, zap/zap-summary)
      - Shared utility modules (sarif.py, summary.py, severity.py)
      negative:
      - Initial migration effort across 18 scripts + 15 test files
      - Python 3.11+ runtime requirement (but pre-installed on ubuntu-latest)
    implementation: 'All action scripts and tests are Python with pytest.

      Coverage enforced at 80% via pytest-cov.

      Node.js remains only for release tooling (release-it, commitlint, husky).

      '
    supersedes: ADR-003 (Bash for scripts with no runtime dependencies)
    note: 'Python is now the lingua franca for action scripts and tests.

      Node.js remains for release tooling (release-it, commitlint, husky) which is

      appropriate as those are developer workflow tools, not pipeline logic.

      '
  ADR-010:
    title: Hybrid rule-based + AI classification for FedRAMP SCN detection
    date: '2026-02-21'
    status: accepted
    context: 'FedRAMP 20X requires classifying IaC changes into SCN categories (Routine,

      Adaptive, Transformative, Impact). Some changes map cleanly to rules (e.g.,

      tag changes are always Routine), but many are ambiguous and require judgment.

      The project also has an air-gap constraint — some environments cannot make

      external API calls.

      '
    decision: 'Use a hybrid classification approach:

      1. Rule-based pattern matching first (deterministic, fast, air-gap safe)

      2. AI fallback via Claude Haiku for ambiguous cases (optional, requires API key)

      3. MANUAL_REVIEW category when neither method can classify with confidence

      '
    alternatives_considered:
    - name: Rules only
      rejected_because: Cannot handle novel resource types or complex attribute interactions
    - name: AI only
      rejected_because: Violates air-gap constraint, adds latency and cost to every classification
    - name: ML model trained on FedRAMP data
      rejected_because: Insufficient training data, high maintenance burden, still needs API
    consequences:
      positive:
      - Works fully offline with rule-based classification
      - AI improves accuracy for ambiguous cases when available
      - Graceful degradation — MANUAL_REVIEW instead of wrong classification
      - Configurable confidence threshold prevents low-confidence AI results
      - Audit trail records which method was used per classification
      negative:
      - AI fallback requires Anthropic API key and network access
      - Rule maintenance burden grows with supported IaC providers
      - Two code paths to test and maintain
    implementation: ".github/actions/scn-detector/scripts/classify_changes.py:\n  - ChangeClassifier.classify_with_rules()\
      \ — pattern matching\n  - ChangeClassifier.classify_with_ai() — multi-provider AI fallback\n  -\
      \ classify_change() orchestrates: rules first, AI if unmatched\nProvider abstraction in ai_providers.py\
      \ (see ADR-011)\nEach provider SDK is optional (try/except ImportError)\nrequests library used as\
      \ HTTP fallback when SDK unavailable\n"
  ADR-011:
    title: Multi-provider AI abstraction for SCN classifier
    date: '2026-02-21'
    status: accepted
    context: 'ADR-010 established hybrid rule-based + AI classification but hardcoded

      the AI provider to Anthropic Claude Haiku. Users need to:

      1. Choose their preferred AI model (e.g., claude-3-5-sonnet, gpt-4o-mini)

      2. Choose their preferred provider (Anthropic or OpenAI)

      3. Use OpenAI-compatible APIs (Azure OpenAI, Ollama, vLLM) via custom base URLs

      The classifier was tightly coupled to Anthropic''s API format, SDK, and env vars.

      '
    decision: 'Add a lightweight provider abstraction layer in ai_providers.py with:

      1. Registry pattern (PROVIDERS dict) mapping provider names to classes

      2. Factory function (create_provider) for instantiation

      3. Each provider implements call(prompt) → str with SDK-first + HTTP fallback

      4. Provider-aware API key resolution (resolve_api_key)

      5. Config-driven via ai_fallback.provider field in scn-config.yml

      '
    alternatives_considered:
    - name: Abstract base class hierarchy
      rejected_because: Over-engineered for two providers; registry pattern is simpler
    - name: LiteLLM or similar library
      rejected_because: Adds external dependency; violates air-gap constraint for offline use
    - name: OpenAI-compatible only (both providers use OpenAI format)
      rejected_because: Anthropic API format differs significantly; would require Anthropic proxy
    consequences:
      positive:
      - Users can choose Anthropic or OpenAI models via config
      - Custom base URL enables Azure OpenAI, Ollama, vLLM support
      - Backward compatible — missing provider field defaults to anthropic
      - ai_classifier.py simplified (183 → 130 lines) by extracting API plumbing
      - Easy to add new providers (implement call/ENV_VAR/DEFAULT_BASE_URL)
      negative:
      - One additional Python file (ai_providers.py, ~175 lines)
      - Two SDKs to conditionally install (anthropic, openai)
    implementation: "New file: .github/actions/scn-detector/scripts/ai_providers.py\n  - AnthropicProvider:\
      \ SDK + HTTP, x-api-key header, /v1/messages endpoint\n  - OpenAIProvider: SDK + HTTP, Bearer token,\
      \ /v1/chat/completions endpoint\n  - PROVIDERS registry, create_provider factory, resolve_api_key\
      \ helper\n\nModified: ai_classifier.py\n  - Uses create_provider() instead of direct Anthropic calls\n\
      \  - Provider-agnostic: self.provider.call(prompt)\n\nModified: classify_changes.py\n  - Dynamic\
      \ API key resolution per provider\n  - Provider-specific env var in warning messages\n\nModified:\
      \ action.yml\n  - Installs openai SDK when OPENAI_API_KEY is set\n  - Passes both API keys to classify\
      \ step\n\nConfig: scn-config.yml ai_fallback section\n  provider: \"anthropic\" | \"openai\"\n \
      \ model: \"<provider-specific model name>\"\n  api_base_url: \"<optional custom endpoint>\"\n"
    supersedes: Refines ADR-010 (which assumed Anthropic-only)
  ADR-012:
    title: 'Dual dependency scanning: OSV-Scanner + dependency-review-action'
    date: '2026-03-11'
    status: accepted
    context: 'Argus lacked source-code dependency vulnerability scanning. Container-level

      scanning (Trivy/Grype/Syft) catches OS package vulnerabilities but misses

      application dependency vulnerabilities in lockfiles (npm, pip, cargo, etc.).

      Supply chain attacks increasingly target application dependencies.

      '
    decision: "Add two complementary dependency scanners mirroring the Trivy/Grype dual-scanner\npattern\
      \ for containers:\n1. scanner-osv: Google OSV-Scanner binary — any trigger, GHES-compatible,\n \
      \  scans lockfiles against the OSV database\n2. scanner-dependency-review: GitHub's dependency-review-action\
      \ — PR-only,\n   compares dependency diffs, supports license compliance checking\n"
    alternatives_considered:
    - name: OSV-Scanner only
      rejected_because: Misses PR diff context and license compliance checking
    - name: dependency-review-action only
      rejected_because: PR-only limitation; no scheduled or push-triggered scanning
    - name: Snyk or commercial tool
      rejected_because: Adds external dependency; violates air-gap constraint
    - name: npm audit / pip-audit per-ecosystem
      rejected_because: Fragmented; would need separate actions per ecosystem
    consequences:
      positive:
      - Complete dependency vulnerability coverage (any trigger + PR diff)
      - License compliance checking via dependency-review-action
      - GHES-compatible via OSV binary install (no marketplace dependency)
      - Zero changes to security-summary (artifact-driven aggregation)
      - Mirrors proven Trivy/Grype dual-scanner pattern
      negative:
      - Two scanners to maintain for dependency category
      - dependency-review-action limited to PR events only
    implementation: "New actions:\n  .github/actions/scanner-osv/\n  .github/actions/scanner-dependency-review/\n\
      \nBoth follow established patterns (ADR-009 Python scripts, ADR-007 severity\nthresholds, ADR-008\
      \ flexible PR commenting). scanner-dependency-review\nemits a warning annotation and zero-count\
      \ summary on non-PR events for\ngraceful degradation.\n"
  ADR-013:
    title: Python SDK + CLI + thin CI adapters for cross-platform portability
    date: '2026-04-11'
    status: accepted
    accepted_date: '2026-04-15'
    note: Phases 1-2 shipped as the argus SDK; Phase 3 thin-composite migration is the active integration
      target. See docs/developer/SDK-ROADMAP.md.
    context: 'Argus is tightly coupled to GitHub Actions. All 31 composite actions use

      GitHub-specific features: $GITHUB_OUTPUT, $GITHUB_STEP_SUMMARY,

      actions/upload-artifact, actions/github-script (PR comments),

      github/codeql-action/upload-sarif, and github.* context variables.

      This limits Argus to GitHub Actions only. Users want to run the same

      security scanning pipeline in GitLab CI, Jenkins, Azure DevOps, and

      locally on developer machines.


      Analysis reveals that ~90% of scanner logic (tool installation, execution,

      result parsing, severity counting) is already portable. Only the reporting

      phase (Phase 4: artifacts, PR comments, step summaries, SARIF upload) is

      GitHub-coupled. The existing Python parsers have zero GitHub dependencies.

      '
    decision: "Adopt a layered architecture with four components:\n1. Argus Core SDK (argus/core/) — Scanner\
      \ protocol, result models, engine,\n   config loading. Pure Python, zero CI dependencies.\n2. Scanner\
      \ Modules (argus/scanners/) — One Python file per scanner\n   implementing the Scanner protocol.\
      \ Reuses existing parse_*.py logic.\n3. Reporters (argus/reporters/) — Output plugins per platform:\
      \ terminal,\n   markdown, SARIF, JSON, GitHub, GitLab, JUnit.\n4. CI Adapters — Thin wrappers: GitHub\
      \ composite actions call\n   `argus scan` + `argus report github`; GitLab CI templates call\n  \
      \ `argus scan` + `argus report gitlab`; CLI for local/Jenkins.\n\nMigration is incremental over\
      \ 4 phases:\n  Phase 1: Core SDK + CLI + 2-3 proof-of-concept scanners (no existing changes)\n \
      \ Phase 2: Port remaining scanners, build GitHub reporter\n  Phase 3: Simplify composite actions\
      \ to thin wrappers (backward compatible)\n  Phase 4: Add GitLab/Jenkins reporters, publish to PyPI\n"
    alternatives_considered:
    - name: Dagger.io portable pipelines
      rejected_because: Heavy external dependency; ADR-001 rejected external CI tools
    - name: Docker-per-scanner containerization
      rejected_because: Docker not available in air-gapped GHES; massive images; slow
    - name: Monolithic CLI bundling everything
      rejected_because: Violates scalability requirement; tribal knowledge to modify
    - name: Rewrite in Go/Rust
      rejected_because: Abandons Python investment (ADR-009); less accessible to contributors
    consequences:
      positive:
      - Runs anywhere Python runs (GitHub, GitLab, Jenkins, local, Azure DevOps)
      - Adding a scanner = one Python file implementing Scanner protocol
      - 'Removing a scanner = delete file or set enabled: false in config'
      - Existing GitHub Actions users unaffected until Phase 3
      - Phase 3 composite actions shrink from ~300 lines to ~15 lines
      - Consistent with ADR-009 (Python standardization)
      - argus.yml provides single configuration file for all environments
      negative:
      - Significant initial investment to build core SDK and CLI
      - Two systems coexist during migration (legacy actions + SDK)
      - Package distribution adds complexity (pip install, PyPI)
      - Some scanners are inherently GitHub-only (dependency-review)
    implementation: 'See docs/developer/portability-research.md for full architecture details,

      package structure, migration phases, and risk mitigations.

      '
  ADR-014:
    title: Docker execution backend for portable scanner execution
    date: '2026-04-11'
    status: accepted
    context: 'The argus SDK (ADR-013) decouples scanning logic from GitHub Actions,

      but users still need 10+ scanner tools installed to run all scanners.

      Installing trivy, grype, gitleaks, clamav, checkov, etc. on a developer

      laptop is impractical. The SDK needs a way to run scanners without

      requiring local tool installation.

      '
    decision: "Add a Docker execution backend to ArgusEngine:\n1. Each scanner declares its official container\
      \ image (author-published)\n2. Engine checks is_available() first (local tool), falls back to\n\
      \   docker run with volume mounts if tool not installed\n3. Parsing always runs on host (SDK parses\
      \ JSON/SARIF output from container)\n4. Prefer official tool author images (aquasec/trivy, anchore/grype,\
      \ etc.)\n5. Only build custom images when no official image exists (bandit, opengrep,\n   supply-chain\
      \ combined)\n6. Publish all-in-one image for CI convenience\n7. Container image versions managed\
      \ via Dependabot docker ecosystem\n"
    alternatives_considered:
    - name: Single fat Docker image only
      rejected_because: 2GB+ image, slow to pull, hard to update individual tools
    - name: Build custom images for every scanner
      rejected_because: Unnecessary maintenance when official images exist
    - name: Nix flakes for reproducible environments
      rejected_because: Nix adoption barrier too high for most users
    - name: Install tools on demand (auto pip/curl)
      rejected_because: Modifies host machine, permission issues, not reproducible
    consequences:
      positive:
      - Users run argus scan with zero tool installation (just Docker)
      - Official images get security updates from tool authors
      - Local tools preferred when available (fastest path)
      - 'Air-gapped support via private registry + pull_policy: never'
      - Dependabot maintains container image versions automatically
      negative:
      - Requires Docker/Podman for container backend
      - Container execution adds startup overhead vs local tools
      - 3 custom Dockerfiles to maintain (bandit, opengrep, supply-chain)
    implementation: 'argus/core/engine.py: _run_in_container() method with docker run

      argus/core/config.py: ExecutionConfig (backend, registry, pull_policy)

      argus/scanners/*.py: container_image property on each scanner

      argus/containers.py: Central image manifest for version tracking

      docker/: Dockerfiles for custom images (bandit, opengrep, supply-chain, cli)

      .github/dependabot.yml: docker ecosystem for Dockerfile base images

      '
  ADR-015:
    title: 'Agentic substrate: CLI + MCP server + skill as complementary layers'
    date: '2026-04-12'
    status: accepted
    accepted_date: '2026-04-20'
    note: 'argus mcp ships in 0.7.x; the slim skill at .agents/skills/argus-scanner-selection/ is published.
      PR #102 added the unified security_review MCP tool and cache-freshness signals.'
    context: "AI coding assistants (Claude Code, Cursor, Windsurf, VS Code Copilot) are\nincreasingly\
      \ used to drive developer workflows. Argus has a CLI and a\ncurated skill file at .agents/skills/argus-scanner-selection/.\
      \ The industry\nis converging on a three-layer pattern for AI-ready products:\n\n1. CLI — universal\
      \ fallback for humans, CI, and environments without AI\n2. MCP server — structured execution layer\
      \ with typed tools and JSON responses\n3. Skill — lightweight routing layer that tells the agent\
      \ when and how to\n   use the product, without eagerly loading tool schemas into context\n\nOur\
      \ initial analysis (April 2026) framed MCP as a replacement for skills,\nbased on valid concerns:\
      \ skill files copied into projects go stale, there\nwas no universal format, and the skill duplicated\
      \ logic from the engine.\n\nExternal feedback and industry observation corrected this framing. The\
      \ three\nlayers serve different purposes and have different context costs:\n- MCP tool definitions\
      \ are eagerly loaded into every conversation, consuming\n  token budget even when the user isn't\
      \ doing security scanning.\n- A skill acts as a deferred-loading gatekeeper: it tells the agent\
      \ \"reach\n  for the Argus MCP when security scanning is relevant\" without loading the\n  full\
      \ tool schema upfront.\n- The staleness concern dissolves when the skill is a strategy/routing layer\n\
      \  rather than an implementation reference. A skill that says \"use Argus for\n  security scanning,\
      \ prefer MCP tools when available\" rarely changes because\n  it describes purpose, not API surface.\n\
      \nCompanies across the developer tooling space are shipping all three layers.\nSkill registries\
      \ like skills.sh are emerging as distribution channels.\n"
    decision: "Ship all three layers as the Argus \"agentic substrate\":\n\n1. CLI (existing): `argus\
      \ scan`, `argus validate`, `argus init` — already done.\n2. MCP server (new): `argus mcp` exposes\
      \ typed tools (argus_scan, argus_detect,\n   argus_validate, argus_list_scanners, argus_init) returning\
      \ structured JSON,\n   plus resources (argus://config, argus://results/latest).\n3. Skill (refactor):\
      \ slim the existing 300-line skill to a routing/strategy\n   layer. Move scanner selection logic\
      \ and CLI syntax details into MCP tool\n   descriptions. Publish to skills.sh for discovery.\n\n\
      The skill tells the agent when to invoke Argus and what it's good for.\nThe MCP server handles structured\
      \ execution. The CLI is the universal fallback.\n"
    alternatives_considered:
    - name: MCP only, deprecate skill
      rejected_because: 'MCP tool definitions eagerly load into context, consuming tokens in every

        conversation. Without a skill as a routing layer, the agent has no

        lightweight signal for when to reach for Argus. The skill provides

        deferred loading — tool schemas enter context only when needed.

        '
    - name: Skill only, no MCP
      rejected_because: 'The AI shells out to the CLI and parses unstructured terminal output,

        losing structured information. The skill must duplicate implementation

        details (CLI flags, output formats, scanner selection rules) that go

        stale independently of the engine.

        '
    - name: CLI only, no AI integration
      rejected_because: 'Leaves AI assistants to discover Argus capabilities through help text

        and trial-and-error. No structured data exchange. Misses the growing

        segment of developers who work primarily through AI assistants.

        '
    - name: Generate tool-specific files for each AI tool
      rejected_because: 'As OSS, Argus should not favor one tool vendor over another.

        Maintaining N tool-specific formats is unsustainable. MCP and skills

        are tool-agnostic standards.

        '
    consequences:
      positive:
      - Complete agentic coverage — routing (skill), execution (MCP), fallback (CLI)
      - Deferred loading — MCP tools only enter context when the skill triggers them
      - Structured data — AI receives typed JSON via MCP, not parsed terminal output
      - Auto-updating — MCP tools ship with pip install --upgrade
      - Stable skill — routing layer rarely changes, minimal staleness risk
      - Tool-agnostic — MCP and skills work across Claude Code, Cursor, Windsurf, VS Code
      - Discoverable — skills.sh for routing layer, MCP auto-discovery for tools
      negative:
      - Three integration surfaces to maintain (though skill is minimal, CLI exists)
      - Adds MCP Python SDK as optional dependency
      - Skill distribution still maturing (skills.sh is early)
      - Scanner dependency story unchanged — tools still need local bins or Docker
    implementation: "Phase 5 in SDK-ROADMAP.md covers both MCP and skill refactor:\n\nMCP server:\n  argus/mcp.py\
      \ — MCP server module (stdio transport)\n  argus mcp — CLI subcommand to start the server\n  Optional\
      \ dependency: pip install argus-security[mcp]\n\nSkill refactor:\n  Slim .agents/skills/argus-scanner-selection/SKILL.md\
      \ to routing/strategy\n  Move implementation details into MCP tool descriptions\n  Publish to skills.sh\n\
      \nDepends on Phase 3 (portability) for maximum scanner coverage without Docker.\n"
  ADR-016:
    title: Wrappers must surface scanner failures, not silently report 0 findings
    date: '2026-04-19'
    status: accepted
    context: "Pre-0.7.2 the `reusable-security-hardening` workflow's summary job and\nthe `security-summary`\
      \ composite both derived an \"Overall Security Score\"\nby counting SARIF findings across downloaded\
      \ artifacts. This rollup\ncould not distinguish between:\n  (a) Scanner ran cleanly and found zero\
      \ issues.\n  (b) Scanner failed to execute, crashed, or produced no artifact.\n\nThe medsecops-golden-path\
      \ demo surfaced both cases in rapid succession\nduring the initial SDK integration — see the post-mortem\
      \ conversation\nin the golden-path repo. Each bug ended the same way: the aggregator\nreported \"\
      ✅ Excellent! No security issues detected\" while a scanner\njob had actually crashed or been skipped\
      \ by configuration. A pipeline\nthat cannot distinguish success from failure cannot be trusted to\
      \ gate\nmerges, which contradicts CLAUDE.md's core principle 4: \"Trust is\neverything.\"\n\nSecondary\
      \ issues the refactor addresses:\n- 17 per-pattern `actions/download-artifact` steps in the reusable\n\
      \  workflow, one per scanner artifact naming convention, with\n  `continue-on-error: true` — any\
      \ one silently fails without signal.\n- `allow_failure: true` as the default: the reusable workflow\
      \ ships\n  in \"informational-only\" mode, so a passing CI gate says nothing\n  about actual scan\
      \ outcomes.\n- `<details>` wrapping: container-scan summaries ship pre-wrapped in\n  a disclosure;\
      \ the rollup wrapped them again, forcing reviewers to\n  click twice to see findings.\n- Composites\
      \ installed only `pip install pyyaml`, assuming argus-security\n  was on PYTHONPATH via side effects.\
      \ A consumer pulling the composite\n  via `uses: huntridge-labs/argus/.github/actions/scanner-*@1.8.1
      \ had no\n  reliable way to get the SDK installed.\n"
    decision: "The security-summary composite is now the single aggregation surface.\nIts contract:\n\
      \  1. Accepts an optional `scan_statuses` JSON input mapping scanner\n     name -> job result (success|failure|cancelled|skipped).\n\
      \  2. Renders a per-scanner pass/fail/skipped table at the top of the\n     report when `scan_statuses`\
      \ is provided.\n  3. Exits non-zero by default when any scanner in `scan_statuses`\n     did not\
      \ succeed, regardless of whether that scanner produced\n     a summary artifact. This is the defense\
      \ against silent failure.\n  4. Normalizes summaries pre-wrapped in a single outer `<details>`\n\
      \     block by replacing the wrapper with a heading, eliminating the\n     two-click UX.\n\nThe\
      \ reusable-security-hardening workflow:\n  1. Replaces its inline summary job with a single delegation\
      \ to the\n     security-summary composite, passing `needs.*.result` for every\n     scanner as `scan_statuses`.\n\
      \  2. Drops all 17 per-pattern raw-artifact downloads; the composite's\n     single `scanner-summary-*`\
      \ download is authoritative.\n  3. Flips the default `allow_failure` from `true` to `false`. Users\n\
      \     who want informational runs opt in explicitly.\n\nComposite-action changes:\n  1. `scanner-container`\
      \ and `scanner-zap` pin an explicit\n     `pip install 'argus-security>=0.7.2'` — the floor version\
      \ that\n     contains the SDK fixes for socket mount, ZAP pre-pull, and\n     loud RuntimeError\
      \ on scanner infra failures.\n  2. `scanner-container` uploads with `if-no-files-found: warn`\n\
      \     instead of `ignore`.\n"
    alternatives_considered:
    - name: Continue counting SARIF findings, just add a warning when downloads fail
      rejected_because: 'Doesn''t solve the core issue: a crashed scanner with a valid-but-empty

        SARIF looks identical to a clean scan. The verdict has to come from

        job results, not finding counts.

        '
    - name: Have each scanner composite emit its own block of PR comment
      rejected_because: 'PR comment spam — exactly the anti-pattern ADR-008 (post_pr_comment

        pattern) was written to avoid. A single consolidated comment is

        the established convention.

        '
    - name: 'Keep `allow_failure: true` as default, add `strict: true` opt-in'
      rejected_because: 'Asymmetric defaults bias consumers toward silent success. Given the

        silent-failure bugs this refactor fixes, the safe default must be

        the loud one; informational mode is the opt-in.

        '
    consequences:
      positive:
      - Scanner crashes and configuration errors are visible in a single glance
      - Pre-refactor false-green runs cannot silently pass post-refactor
      - Reusable workflow is ~30% smaller (1162 -> 811 lines) and easier to audit
      - Composites explicitly install argus-security, ending reliance on PYTHONPATH side effects
      - New integration tests (24 cases) cover the silent-failure paths that previously shipped untested
      negative:
      - 'BREAKING: consumers of reusable-security-hardening who relied on the default informational-only
        behavior must pass `allow_failure: true` explicitly'
      - 'BREAKING: consumers of security-summary who want the composite to exit 0 regardless of scanner
        status must pass `fail_on_scanner_failure: ''false''`'
      - Composite action download requires one extra HTTP request per consumer run (checkout of argus
        repo for the aggregator step); amortized across parallel scanner jobs it is negligible
    implementation: "Composite action:\n  .github/actions/security-summary/action.yml\n  .github/actions/security-summary/scripts/generate_summary.py\n\
      Reusable workflow:\n  .github/workflows/reusable-security-hardening.yml\nPinned composites:\n  .github/actions/scanner-container/action.yml\n\
      \  .github/actions/scanner-zap/action.yml\nTests:\n  tests/integration/test_security_summary.py\
      \  (24 test cases)\n"
    usage_examples:
      silent_failure_guard: "# In a reusable pipeline, every scanner's needs.*.result becomes a\n# row\
        \ in the aggregator's status table. A crashed scanner with no\n# summary shows up as ❌ and the\
        \ job exits non-zero.\nsecurity-summary:\n  needs: [scanner-codeql, scanner-opengrep, scanner-container,\
        \ scanner-zap]\n  if: always()\n  steps:\n    - uses: huntridge-labs/argus/.github/actions/security-summary@1.8.1
        \      with:\n        scan_statuses: |\n          {\n            \"codeql\":    \"${{ needs.scanner-codeql.result\
        \ }}\",\n            \"opengrep\":  \"${{ needs.scanner-opengrep.result }}\",\n            \"\
        container\": \"${{ needs.scanner-container.result }}\",\n            \"zap\":       \"${{ needs.scanner-zap.result\
        \ }}\"\n          }\n"
      informational_mode: "# Opt-out of blocking on scanner failures (e.g., for a canary report):\nsecurity-summary:\n\
        \  steps:\n    - uses: huntridge-labs/argus/.github/actions/security-summary@1.8.1      with:\n\
        \        fail_on_scanner_failure: 'false'\n        scan_statuses: '{\"...\": \"...\"}'\n"
  ADR-017:
    title: argus view browser — localhost-only SDK-bundled web UI, separate from argus-portal
    status: accepted
    date: '2026-04-24'
    context: 'Owners, managers, and executives want at-a-glance insight into their

      product''s security posture without digging through CI logs, PR

      comments, or learning a terminal UI. argus-portal (separate repo)

      sketches a FedRAMP-oriented enterprise dashboard, but productionizing

      it requires significant work: SARIF ingest endpoints, GitHub OAuth +

      RBAC, MFA, audit trails, Postgres operational burden, Kubernetes

      deployment. That is months of scope for the "I just want to look at

      one argus-results.json" need.

      '
    decision: "Ship argus view browser as a lightweight read-only web UI bundled with the\nargus SDK as\
      \ the ``[serve]`` optional extra. Bound to 127.0.0.1\nonly, single-user, single-scan scope. Deliberately\
      \ NOT a replacement\nfor argus-portal — the portal stays on its own track aimed at\nenterprise multi-team\
      \ compliance orgs.\n\nTechnical stakes:\n  - FastAPI + Jinja2 + vanilla JS (no React or Next.js\
      \ toolchain,\n    no bundler, no CDN dependencies).\n  - Reuses argus.core.findings_view (ViewState,\
      \ compute_summary,\n    etc.) — same filter, sort, and summary logic as the TUI. One\n    source\
      \ of truth for \"high severity\" and \"this CVE matches.\"\n  - Four routes: ``/`` executive dashboard,\
      \ ``/findings``\n    filterable table, ``/picker`` one-level file browser,\n    ``/healthz`` liveness.\n\
      \  - CSP + clickjacking headers on every response; Jinja2 autoescape;\n    no cookies, no sessions,\
      \ no mutations, so no CSRF handling.\n  - Picker is explicitly one-level-at-a-time — no recursive\
      \ walks.\n\nNon-goals (tracked as future roadmap items):\n  - Live reload on results-file changes.\n\
      \  - Scan-over-scan diff.\n  - JSON API endpoints (external tools can read argus-results.json\n\
      \    directly today).\n  - ``--bind`` or ``--basic-auth`` — multi-user network exposure is\n   \
      \ argus-portal's territory.\n"
    rationale:
    - 'Reuses all the groundwork already shipped for argus view terminal — the

      findings_view module was explicitly built to serve both front-ends.

      Going localhost-only dodges the biggest sources of complexity

      (auth, sessions, CSRF, multi-user state) while still delivering the

      actual user need: non-engineer stakeholders can open a browser and

      see their findings. If argus-portal matures separately, it can

      consume the same findings_view module to keep per-finding display

      consistent across CLI, local web, and enterprise web — no rewrite

      needed.

      '
    consequences:
      positive:
      - Executive-level stakeholders get a first-class surface without the argus-portal operational burden
      - TUI and web view cannot drift — filter and summary logic is centralized in argus.core.findings_view
      - Localhost-only default removes an entire class of auth, session, and transport-security footguns
      - No CDN dependencies means argus view browser works offline, on airgapped networks, and in restricted
        corporate environments
      negative:
      - Users who want a team-visible deployment must set up their own reverse proxy or run argus-portal
        — documented as an explicit scope choice, not a bug
      - Secret redaction is not serve-specific; if a finding description contains credentials from a stack
        trace, they appear in the CLI, TUI, JSON export, and the web UI. Will be tackled globally when
        the need arises
    related:
    - ADR-013
    - ADR-016
  ADR-018:
    title: Canonical argus-results.json + container/<name> ScanResult naming + raw output preservation
    status: accepted
    date: '2026-05-05'
    context: "Source-scan and container-scan flows had drifted apart. Source scans\nalways wrote a canonical\
      \ argus-results.json (the JsonReporter\ncontract that argus view, argus report, and the MCP server\
      \ depend\non). Container scans wrote a domain-shaped container-scan.json with\nper-image counts,\
      \ container_count, and scanner_errors — a different\nshape that the viewers had no rendering path\
      \ for. Reported as a\nbug: \"argus view doesn't display container vulns.\"\n\nTwo related gaps:\n\
      \  1. The argus-results/ directory did not preserve per-scanner raw\n     output files (trivy-results.json,\
      \ grype-results.json,\n     syft-sbom.json for containers; results.json / *.sarif /\n     stdout.txt\
      \ for source scans). They lived in a tempdir that was\n     wiped at scan end. Users who wanted\
      \ forensics, audit trails,\n     or manual triage had nowhere to look.\n  2. Without a normalized\
      \ scanner-name convention, container\n     findings rendered with a generic \"container\" or per-tool\
      \ name,\n     breaking the viewers' per-scanner filtering and per-image\n     grouping.\n\nAll three\
      \ rooted in the same architectural drift: the container\nflow had grown its own output contract\
      \ independent of the SDK's\ncore ScanSummary model.\n"
    decision: "Three coupled changes, shipped in PR #116:\n\n1. Canonical artifact contract is universal.\n\
      \   The container flow now builds a canonical ScanSummary alongside\n   the existing ContainerScanSummary,\
      \ and the JsonReporter writes\n   argus-results.json unconditionally for both source and container\n\
      \   scans. The domain-shaped container-scan.json is preserved for\n   backward compat with downstream\
      \ tooling, but argus-results.json\n   is the single source of truth that viewers/MCP/external tools\n\
      \   consume. (PR #111 originally established this for source scans;\n   PR #116 extended it to containers.)\n\
      \n2. Container findings surface as ScanResult rows with scanner names\n   of the form `container/<image-name>`.\
      \ The viewers (terminal +\n   browser) and reporters render them through their normal\n   per-scanner\
      \ code path — no container-specific rendering.\n\n3. Raw scanner output is preserved alongside the\
      \ canonical artifact\n   under <output_dir>/raw/<scanner_or_image>/, configurable via the\n   unified\
      \ reporting.keep_raw key (default true) or --no-keep-raw.\n   The container flow uses scan_image(raw_output_dir=...)\
      \ and the\n   source flow uses ArgusEngine.run(raw_output_dir=...). 0-byte\n   files are explicitly\
      \ skipped (they're failure-signal stubs and\n   persisting them would mislead readers).\n"
    alternatives_considered:
    - name: Add container-specific rendering to argus view
      rejected_because: 'Doubles the rendering surface and forces viewers to know the

        difference between source and container findings. Re-aligning

        on the canonical model is cheaper and keeps the viewers

        oblivious to scan-flow origin.

        '
    - name: Drop container-scan.json entirely
      rejected_because: 'Existing downstream consumers (security-summary aggregator,

        some user dashboards) parse the per-image stats. Keeping it

        alongside the canonical artifact preserves their integrations

        while letting new consumers depend only on argus-results.json.

        '
    - name: Persist raw output in scanner tempdirs and require manual copy
      rejected_because: 'Tempdirs are wiped at scan end, so this just shifts the burden

        onto users to know about and intercept transient files. The

        opt-in --no-keep-raw flag is the correct posture for tight CI

        environments while keeping the default helpful.

        '
    consequences:
      positive:
      - argus view, argus report, and the MCP server work uniformly across source and container scans
        without scan-flow-specific code
      - Per-scanner filtering and triage works for container findings via the container/<image> naming
        convention
      - 'Forensics and manual triage have a stable surface area: <output_dir>/raw/<name>/ regardless of
        scan flow'
      - reporting.keep_raw is a single config knob covering both flows; --no-keep-raw is a single CLI
        flag
      negative:
      - Two artifact files for container scans (argus-results.json + container-scan.json) until consumers
        migrate; documented as transitional
      - Disk usage grows by a few MB per scan when raw output is preserved (default on); --no-keep-raw
        is the documented opt-out for tight CI
    implementation: "Source-scan flow:\n  argus/core/engine.py: ArgusEngine.run(raw_output_dir) and _run_in_container()\
      \ copy result_files to <raw>/<scanner>/\nContainer-scan flow:\n  argus/container/scanner.py: scan_image(raw_output_dir)\
      \ copies trivy/grype/syft outputs\n  argus/container/engine.py: threads _raw_output_root from config\
      \ dict to scan_image\nCLI:\n  argus/cli.py: --no-keep-raw is a top-level scan flag; both _cmd_source_scan\
      \ and _cmd_container_scan honor it\nConfig:\n  argus/core/config.py: ReportingConfig.keep_raw (bool,\
      \ default True) replaces the container-scoped containers.keep_raw\nCanonical container ScanSummary:\n\
      \  argus/cli.py::_cmd_container_scan builds ScanResult(scanner=f\"container/{name}\", findings=combined,\
      \ metadata={image_ref, build_success, scanner_errors, scan_error}); JSON + SARIF reporters consume\
      \ it.\nTests:\n  argus/tests/test_engine.py::TestRunInContainer (source raw-output persistence)\n\
      \  argus/tests/test_container_scanner_runners.py::TestScanImageRawOutputPersistence + TestContainerCanonicalScanSummary\n"
    related:
    - ADR-013
    - ADR-014
    - ADR-016
    pr_references:
    - '#111 (canonical argus-results.json contract for source scans)'
    - '#116 (canonical contract for container scans + raw output preservation)'
  ADR-019:
    title: Composite wrappers install Argus SDK from their own checkout, not from PyPI
    status: accepted
    date: '2026-05-06'
    context: "Composite action wrappers under .github/actions/scanner-* and\n.github/actions/linter-*\
      \ call ``argus scan`` internally and need\nthe SDK installed in their Python env. Two ways to do\
      \ that:\n\n1. ``pip install argus-security==<X>`` — pulls from PyPI, version\n   pinned by the action.\n\
      2. ``pip install \"${{ github.action_path }}/../../..\"`` — installs\n   from the composite's own\
      \ checkout (the runner clones the\n   entire repo at the action's ref into ``_actions/<owner>/<repo>/<ref>/``\n\
      \   when ``uses: org/repo/path@ref`` resolves; ``github.action_path``\n   points inside that clone,\
      \ and ``../../..`` walks back to the\n   repo root, which contains ``pyproject.toml`` and the\n\
      \   ``argus/`` package).\n\nThe choice has knock-on effects across release coordination,\nversion\
      \ pinning, and air-gapped GHES deployments.\n"
    decision: "Every SDK-using wrapper installs the Argus SDK from its own\ncomposite checkout via:\n\n\
      \    pip install \"${{ github.action_path }}/../../..\"\n\nThe legacy ``pip install pyyaml`` pattern\
      \ (which relied on a\n``bin/argus`` shim that added the repo root to ``sys.path``)\nis removed;\
      \ the shim itself is deleted in PR #126.\n\nWrappers that don't use the SDK (e.g. scanner-dependency-review,\n\
      scanner-codeql, scanner-syft, *-summary aggregators) are exempt —\nthey wrap GitHub-native or non-SDK\
      \ tooling and don't need the\nSDK in their step env.\n\nA CI guard (``validate-install-from-source``\
      \ in\n.github/workflows/test-actions.yml) rejects any drift back to\n``pip install pyyaml`` or ``pip\
      \ install argus-security`` so the\npattern is non-regressable.\n"
    alternatives_considered:
    - name: 'Install from PyPI: pip install argus-security==<X>'
      rejected_because: 'Couples action releases to PyPI publish: every release

        tag has to wait for the PyPI workflow before the action''s

        install line can be bumped. Air-gapped GHES instances

        would need a private PyPI mirror with argus-security and

        all its deps in addition to mirroring the argus repo —

        two distribution channels for the same artifact.

        Consumers pinning ``@main`` would get whatever''s latest

        on PyPI (often stale) rather than the matching commit.

        '
    - name: Bundle the SDK into a single-file PyInstaller binary in the repo
      rejected_because: 'Architecture-specific binaries break GHES heterogeneity

        (Linux x86_64 vs ARM64 vs self-hosted Windows runners).

        Updating dependencies requires a new binary rebuild.

        ``pip install <path>`` reuses the runner''s existing

        Python and pip — already installed by the wrapper''s

        ``setup-python`` step.

        '
    - name: Make the action a Docker action with the SDK preinstalled in the image
      rejected_because: 'Docker actions don''t run on Windows or macOS hosted

        runners, and on GHES the registry-pull adds latency and

        another dependency on registry access. Composite

        actions stay portable across all runner OSes.

        '
    consequences:
      positive:
      - Action ref @<ref> implicitly pins the SDK to the same ref. No second pin to maintain.
      - Action releases never block on PyPI publish. Tag the repo, the action consumes it.
      - Air-gapped GHES setups mirror only the repo. No private PyPI mirror needed (transitive deps still
        need a Python package source, but that's a runner-level decision the admin already makes).
      - Each runner job clones the argus repo once per action ref it uses (deduped if multiple actions
        share a ref). Cheap — same as any other composite action.
      - Removes the ``bin/argus`` shim entirely. Pip's ``[project.scripts]`` entry (``argus = "argus.cli:main"``)
        is the canonical CLI launcher for every consumer (composite wrappers, ``pip install argus-security``,
        ``uvx argus``, dev installs).
    related:
    - ADR-001
    - ADR-013
    pr_references:
    - '#91 (initial pattern in scanner-container and scanner-zap)'
    - '#126 (migration of remaining 14 SDK-using wrappers + bin/argus removal)'
  ADR-020:
    title: FileDiscoveryScanner template + shared linter helpers
    status: accepted
    date: '2026-05-07'
    context: "Linters (lint-yaml, lint-json, lint-python, lint-javascript,\nlint-dockerfile, lint-terraform)\
      \ duplicated three concerns\nacross their adapters:\n\n* File discovery — each linter that walks\
      \ files in Python\n  (HadolintLinter._find_dockerfiles, JsonlintLinter inline\n  rglob) re-implemented\
      \ the walk.\n* Container fallback — HadolintLinter._build_docker_command,\n  EslintLinter._build_docker_command,\
      \ and\n  TerraformLinter._docker_command each built nearly identical\n  ``docker run -v <ws>:/workspace[:ro]\
      \ <image> <args>`` shapes,\n  differing only in mount mode and workdir.\n* UTF-8 subprocess — most\
      \ linters needed\n  ``encoding='utf-8', errors='replace'`` to avoid the cp1252\n  UnicodeDecodeError\
      \ on Windows runners. Each one carried it\n  inline.\n\nThe original SDK-ROADMAP.md \"FileDiscoveryScanner\
      \ Template\"\nsection called for a unified subclass-based abstraction.\nReading the actual linters\
      \ showed two execution shapes:\n\"tool-walks-itself\" (yamllint, python_lint, eslint) and\n\"discover-then-batch\"\
      \ (hadolint, jsonlint). A single forced\nhierarchy didn't fit both.\n"
    decision: "Ship a hybrid: helper functions for the deduplication that's\nalways useful, and a base\
      \ class for the cases that genuinely\nshare a flow.\n\nargus/core/linter_template.py exports:\n\n\
      * ``discover_files(target, patterns, exclusions=None)`` — walk\n  helper used by FileDiscoveryScanner\
      \ internally and available\n  to any custom flow (e.g. jsonlint).\n* ``build_docker_command(image,\
      \ workspace, container_args,\n  mount_rw=False, ws_mount='/workspace', workdir=None)`` — the\n \
      \ single source of truth for the docker-run command shape.\n  EslintLinter and TerraformLinter migrate\
      \ to it.\n* ``run_utf8(cmd, *, cwd=None, timeout=None)`` — explicit\n  UTF-8 subprocess wrapper.\
      \ Replaces inline encoding+errors\n  keyword args.\n* ``FileDiscoveryScanner`` — base class for\
      \ the discover-then-\n  batch flow. Subclasses declare ``name``, ``file_glob``,\n  ``binary``, optionally\
      \ ``container_image``, and override\n  ``_build_local_args`` / ``_build_container_args`` /\n  ``_parse_results``.\
      \ The base does discovery, dispatch\n  (local-or-container), error handling (execution_failed for\n\
      \  bad exit + empty stdout, parse_failed for parser exceptions\n  — same metadata shape the engine's\
      \ container path emits),\n  and the engine-compatible ScanResult shape.\n\nMigrations in this PR:\n\
      * HadolintLinter — full migration to FileDiscoveryScanner\n  (~30 lines saved). Custom _find_dockerfiles\
      \ and\n  _build_docker_command gone.\n* EslintLinter — switches its custom docker-fallback builder\n\
      \  to build_docker_command (~10 lines saved); keeps its\n  config-detection flow.\n* TerraformLinter\
      \ — same. Multi-step fmt/validate/tflint flow\n  stays bespoke (it doesn't fit FileDiscoveryScanner's\n\
      \  single-batched-call shape).\n* yamllint, python_lint, jsonlint — keep their existing flow.\n\
      \  yamllint and python_lint use the \"tool walks the workspace\n  itself\" shape that doesn't benefit\
      \ from discovery in Python.\n  jsonlint has a Python-stdlib fallback that the\n  FileDiscoveryScanner\
      \ abstraction doesn't model. The new\n  helpers are available to them if a future change makes the\n\
      \  migration valuable.\n"
    alternatives_considered:
    - name: Single FileDiscoveryScanner base, force-fit every linter
      rejected_because: 'The "tool-walks-itself" linters (yamllint, python_lint,

        eslint) never discover files in Python — the binary takes

        a directory. Forcing them through a discovery layer would

        add overhead without value, and break their config-aware

        flows (eslint''s no-eslint-config detection,

        yamllint''s Windows AppLocker fallback). Multi-step linters

        like terraform fundamentally don''t match a single-batch

        shape.

        '
    - name: Helpers only — skip the base class
      rejected_because: 'HadolintLinter and a future jsonlint migration genuinely

        share a 5-step flow (discover → dispatch → run → check

        for execution failure → parse). Open-coding it in each

        subclass duplicates the metadata-shape contract that the

        engine, reporters, and --fail-on-scanner-error all key

        off of. The base class makes that contract enforceable.

        '
    - name: Co-locate the helpers in scanner_template.py
      rejected_because: 'scanner_template.py targets security scanners that write

        findings to an output file (run_subprocess_scan reads

        back results.json from a tempdir). Linters typically

        write findings to stdout and don''t need a tempdir. The

        two surfaces diverged enough that a separate module is

        clearer.

        '
    consequences:
      positive:
      - 'New linter contributors have a clear pattern: subclass FileDiscoveryScanner for discover-then-batch,
        or use the helpers in a custom scan() flow.'
      - Adding container fallback to a new linter is one helper call (build_docker_command) instead of
        ~25 lines of duplicated ``docker run`` boilerplate.
      - UTF-8 + errors='replace' is the implicit default via run_utf8 — no more per-linter forgetting
        to add encoding='utf-8'.
      - 'Migrations are independent and additive: yamllint / python_lint / jsonlint can adopt the helpers
        later if a future change makes it useful, without coupling release cycles to this refactor.'
      - The FileDiscoveryScanner base imposes its execution_failed / parse_failed metadata shape — keeps
        reporters' surface uniform across linters and security scanners.
    related:
    - ADR-013
    - ADR-016
    - ADR-018
    pr_references:
    - '#117 (build_args contract for security scanners — the parallel pattern this complements)'
    - '#120 (HadolintLinter pre-batching — the optimization this PR''s base captures generically)'
  ADR-021:
    title: 'SDK-vs-composite-action boundary: when a scanner stays composite-only'
    status: accepted
    date: '2026-05-08'
    context: "Argus's primary contribution shape is the SDK module (an\nargus.scanners.<name> class implementing\
      \ the Scanner protocol).\nComposite actions exist as wrappers that delegate to the SDK\nso GitHub\
      \ Actions consumers get a paved path. The default\nassumption — captured in CONTRIBUTING.md and\
      \ the SDK-first\nframing throughout — is that every new scanner gets an SDK\nmodule first, and the\
      \ composite wrapper is a thin convenience\nlayer.\n\nTwo existing scanners deliberately break that\
      \ pattern:\nscanner-codeql and scanner-dependency-review have composite\nactions but no argus.scanners.codeql\
      \ / argus.scanners.dependency_review\nmodules, and the SDK-ROADMAP.md previously listed both as\
      \ open\nitems waiting to get SDK ports.\n\nAuditing those two more carefully showed neither scanner\
      \ can\never justify the SDK port:\n\n* **CodeQL.** The CodeQL CLI is licence-restricted (free use\n\
      \  only for OSS or GHAS-entitled private repos), the bundle\n  is ~500MB to redistribute across\
      \ architectures, and the\n  primary value of running it (SARIF upload to the GitHub\n  Security\
      \ tab) only exists on github.com / GHES. An SDK\n  consumer scanning proprietary code without GHAS\
      \ is on\n  questionable licence ground, and the maintenance cost of\n  tracking the bundle's release\
      \ cadence is substantial.\n\n* **Dependency-review.** The action is a thin client over\n  GitHub's\
      \ GET /repos/{owner}/{repo}/dependency-graph/compare/\n  {basehead} endpoint. The intelligence is\
      \ server-side; the\n  compare data only exists for repos with the Dependency\n  Graph enabled (free\
      \ for public repos, GHAS for private);\n  and the comparison is meaningless outside a pull_request\n\
      \  event context. Wrapping it in the SDK would be a\n  GitHub-API client masquerading as a Scanner\
      \ protocol.\n\nBoth motivated a deliberate \"wontfix on SDK, ship as\ncomposite-only\" decision.\
      \ We need that recorded so a future\ncontributor doesn't reopen #206 or a sibling issue without\n\
      seeing the rationale.\n"
    decision: "A scanner stays composite-action-only (no SDK module) when\nEITHER condition holds:\n\n\
      1. **GitHub-API-bound primary signal.** The scanner's main\n   output comes from a GitHub API endpoint\
      \ (not from running\n   a binary against local files). It needs GITHUB_TOKEN, a\n   specific event\
      \ payload, or server-side data that doesn't\n   exist off-platform. Examples: dependency-graph diff,\n\
      \   secret-scanning-alerts API, code-scanning-alerts API.\n\n2. **Licence-restricted CLI distribution.**\
      \ The scanner's CLI\n   can't be redistributed to all consumers under terms argus\n   is willing\
      \ to accept on their behalf. Either the licence\n   restricts use cases (CodeQL: OSS or GHAS only),\
      \ or the\n   distribution itself is encumbered (sealed bundle requiring\n   GitHub auth to download).\n\
      \nEither condition makes the SDK port a net negative —\nbigger maintenance surface for a feature\
      \ only some consumers\ncan legally use, with no off-platform value.\n\nBoth existing instances stay\
      \ composite-only:\n\n* .github/actions/scanner-codeql/ — keeps its current shape;\n  consumers wanting\
      \ CodeQL via argus go through the action.\n* .github/actions/scanner-dependency-review/ — same.\n\
      \nNeither will gain argus.scanners.codeql.py or\nargus.scanners.dependency_review.py modules. The\
      \ two\ncomposite actions' README.md files carry the rationale\ninline so a contributor browsing\
      \ the action sees it before\nfiling an SDK-port issue.\n\nCLAUDE.md's \"Adding a New Scanner\" section\
      \ was updated with\na one-paragraph carve-out pointing at this ADR, so the\ndefault (\"SDK-first\"\
      ) guidance has the carve-out attached\nto it instead of having to be discovered separately.\n"
    alternatives_considered:
    - name: Port both scanners to the SDK anyway, with disclaimers
      rejected_because: 'For CodeQL, the licence restrictions don''t go away just

        because we add a docstring. Consumers running it under

        argus''s uniform interface against proprietary code without

        GHAS are still on the wrong side of GitHub''s terms; we''d

        be making it easier for them to get into trouble. For

        dependency-review, the SDK port would be a single API

        endpoint wrapper that requires GITHUB_TOKEN + base_ref +

        head_ref to do anything — which is the composite-action

        shape, just dressed up differently. No off-platform value

        gained, real maintenance cost added.

        '
    - name: Drop the composite actions too — let consumers use the upstream actions directly
      rejected_because: 'The composite wrappers add real value: uniform input

        surface (fail_on_severity, post_pr_comment, etc.),

        security-summary integration, the standard SARIF upload

        + PR-comment + artifact-upload flow. Consumers using

        actions/dependency-review-action or

        github/codeql-action directly miss all of that. The

        wrappers stay; the SDK ports don''t happen.

        '
    - name: Add an 'SDK-eligible' marker on every action.yml
      rejected_because: 'Over-engineering. Two scanners are composite-only today,

        and the rule for adding more is a single sentence. A

        paragraph in CLAUDE.md + this ADR + a callout in each

        composite action''s README is enough scaffolding. If we

        ever have 5+ composite-only scanners we can revisit.

        '
    consequences:
      positive:
      - 'Roadmap item ``#206 (codeql.py + dependency_review.py)`` closed: composite-only by design, never
        an SDK port.'
      - Future contributors filing 'add SDK module for <X>' issues hit the boundary rule in CLAUDE.md
        and the per-action README before opening the issue. Reduces the chance of a partially-implemented
        SDK port that later gets ripped out.
      - Two existing composite actions are explicitly paved cowpaths, not omissions waiting to be filled
        in.
      - 'The rule is testable from the contributor''s side: ''Does my scanner need GITHUB_TOKEN + a specific
        event for its primary output?'' OR ''Is the CLI licence-restricted?'' If yes to either, ship as
        composite-only.'
    related:
    - ADR-001
    - ADR-013
    pr_references:
    - '(roadmap closure for #206 — see SDK-ROADMAP.md line 207)'
  ADR-022:
    title: Pattern-based secret redaction as Finding-construction backstop
    status: accepted
    date: '2026-05-08'
    context: "Argus's secret-leakage commitment (documented in\ndocs/mcp.md → Secrets handling) is that\
      \ no raw secret value\never leaves a scanner's parser. Every consumer downstream —\nterminal reporter,\
      \ JSON / Markdown / SARIF exports, MCP tool\nresponses, the AI assistant's context window — sees\
      \ only\n``<redacted>`` placeholders. The primary mechanism is the\nper-scanner first-pass: each\
      \ scanner that detects credential-\nshaped content (gitleaks, bandit B105/B106/B107) audits its\n\
      own output and replaces secret-bearing fields before\nconstructing the Finding.\n\nThe risk is that\
      \ a future scanner gets added without that\naudit. The CONTRIBUTING.md \"Adding a New Scanner\"\
      \ checklist\nstep 4 says to do it, the docstrings on existing parsers\ndocument it, but a contributor\
      \ working from a non-canonical\nexample or skipping the checklist could quietly leak secrets.\n\n\
      Roadmap-wise, the \"Pattern-based second-pass scanner\" was an\nopen Secret Redaction Hardening\
      \ item with three deferral\nreasons:\n  1. Per-scanner approach is sufficient when followed.\n \
      \ 2. Pattern-based duplicates gitleaks's domain.\n  3. False-positive risk on legitimate non-secret\
      \ strings.\n\nSurface analysis showed reasons 2 and 3 only apply to a\n*generic high-entropy* approach.\
      \ A *known-vendor-prefix-only*\napproach has a near-zero false-positive rate (vendor formats\nare\
      \ documented and stable) and doesn't try to compete with\ngitleaks's broader pattern surface. That\
      \ refined scope made\nthe safety net cheap enough to ship by default rather than\ngated behind a\
      \ flag.\n"
    decision: "Implement a pattern-based second pass that runs in\n``Finding.__post_init__``, with the\
      \ explicit scope:\n\n* Patterns are limited to known-vendor-prefix tokens with\n  documented format\
      \ specs. Each pattern's regex cites the\n  issuer's documentation in a source comment.\n* Generic\
      \ high-entropy heuristics are excluded. Adding one\n  requires a separate ADR with concrete false-positive\
      \ data.\n* Always-on; no opt-in flag, no env-var override. Findings\n  without a matching pattern\
      \ incur zero cost (the regex\n  pass is O(text length × pattern count) and pattern count\n  is small).\n\
      * Applies to ``title``, ``description``, and every string\n  value in ``metadata`` (recursively\
      \ through nested dicts /\n  lists / tuples). Other Finding fields (``id``, ``severity``,\n  ``location``,\
      \ ``cwe``, ``cve``, ``scanner``) are\n  structural and don't carry free-form text.\n* The placeholder\
      \ is the same ``REDACTED_PLACEHOLDER``\n  constant the per-scanner first pass uses — exporters /\n\
      \  log scrapers can grep for the same token regardless of\n  which pass redacted.\n\nInitial pattern\
      \ set:\n  github_token   gh[opusr]_<36+>\n  aws_access_key (AKIA|ASIA|AIDA|AGPA|...|ACCA)<16>\n\
      \  slack_token    xox[abprs]-<10+>\n  gitlab_pat     glpat-<20+>\n  npm_token      npm_<36>\n  google_api_key\
      \ AIza<35>\n  stripe_live    (sk|rk)_live_<24+>     (test keys NOT matched)\n  jwt            eyJ.<8+>.eyJ.<8+>.<8+>\n\
      \  pem_private    -----BEGIN [A-Z ]+PRIVATE KEY-----\n\nLives in ``argus/core/redact.py``. Adding\
      \ a new pattern\nrequires (a) the issuer's documented format spec cited in\na source comment and\
      \ (b) a positive + a negative test in\n``argus/tests/core/test_redact.py::TestHighRiskPatterns``.\n\
      \nPer-scanner first-pass remains the primary defense. The\nbackstop is for scanners that get added\
      \ without the audit\nand for vendor formats whose values reach Finding text via\npaths the scanner\
      \ author didn't enumerate (e.g., a\n``raw_match`` field copied into metadata for forensics).\n"
    alternatives_considered:
    - name: Generic high-entropy heuristic in addition to vendor-prefix
      rejected_because: 'False-positive rate is real. Finding bodies routinely

        contain rule IDs, file paths, package versions, hex

        digests, base64-encoded fingerprints, and

        configuration snippets — many of which are 32-64 char

        high-entropy strings with no actual secret value.

        Tuning a Shannon-entropy threshold to suppress those

        while catching real raw-bearing tokens is a different

        quality of work than the prefix-based safety net, and

        gitleaks already does it well in its primary domain.

        We can revisit if a real leak shows the prefix-based

        set isn''t enough.

        '
    - name: Off by default, gated by --strict-redaction or MCP-only
      rejected_because: 'The whole point of a backstop is that contributors who

        DIDN''T audit their parser still get the safety net. An

        opt-in defaults that group to "off" leaves the people

        most likely to need it without it. The cost is a

        handful of regex matches per Finding — trivial vs. the

        cost-of-leak.

        '
    - name: Run the pass at reporter / MCP boundary instead of Finding construction
      rejected_because: 'Multiple reporter paths and the MCP server consume

        findings via different code paths. Putting the pass at

        ``Finding.__post_init__`` means redaction happens once

        at the source-of-truth boundary; downstream paths

        can''t accidentally observe pre-redacted state. Also

        simpler to test (one assertion at the model level

        rather than per-reporter).

        '
    - name: Lift the per-scanner audit responsibility entirely to the backstop
      rejected_because: 'Per-scanner audits catch values that don''t have

        recognizable prefixes — raw passwords, custom auth

        schemes, bandit''s B105 ``"mypass"`` literal, gitleaks''s

        ``Match`` field with arbitrary content. The backstop

        has nothing to grep for in those cases. Both layers

        do necessary work.

        '
    consequences:
      positive:
      - New scanner contributors get backstop redaction for free; the per-scanner audit checklist is now
        defence-in-depth, not the only defence.
      - Adding a new vendor pattern requires a documented format spec citation. Keeps the false-positive
        risk pinned at near-zero by raising the bar for new entries.
      - Findings without a matching pattern are unchanged at the byte level — no behavior drift in 99%+
        of findings.
      - The placeholder is shared with the first pass, so consumers can't tell which pass redacted a particular
        value (and shouldn't need to).
      - Frozen-dataclass ``Finding`` had no ``__post_init__`` before; now it does. Subclasses (none today)
        would need to call ``super().__post_init__()`` if they ever override.
    related:
    - ADR-016
    - ADR-013
    pr_references:
    - (closes Secret Redaction Hardening 'open' item — see SDK-ROADMAP.md → Secret Redaction Hardening)
  ADR-023:
    title: Reporter plugin registration via Python entry-points
    status: accepted
    date: '2026-05-08'
    context: 'Through 0.7.x, ``argus/reporters/__init__.py`` held a hardcoded

      ``REPORTER_REGISTRY`` dict literal — every supported output

      format had to live under ``argus/reporters/`` and be added to

      that dict. A third party who wanted to ship

      ``argus-reporter-slack`` or ``argus-reporter-pagerduty`` had to

      fork and patch the registry, then keep the fork in sync with

      every Argus release. That''s a high enough barrier that nobody

      did it.


      The seven built-in reporters (``terminal``, ``markdown``,

      ``container_markdown``, ``sarif``, ``json``, ``github``,

      ``gitlab``, ``junit``) cover the formats Argus itself uses, but

      the long tail (Slack, PagerDuty, Opsgenie, custom ticket

      systems, internal dashboards) is precisely the work users want

      to extend with — and precisely the work that doesn''t belong

      upstream. We needed a plugin extension point, and we needed it

      cheap enough that built-ins didn''t get a special-cased

      "internal" path.

      '
    decision: "Use Python's standard ``importlib.metadata`` entry-point\nmechanism, with the group name\
      \ ``argus.reporters``.\n\nBuilt-ins are registered via the same mechanism third-party\nplugins use\
      \ — ``pyproject.toml`` declares an entry-point per\nbuilt-in. There is no parallel \"internal\"\
      \ registry: one source\nof truth, one code path, one set of failure semantics.\n\nThe loader (``argus/reporters/__init__.py``):\n\
      \n* Walks ``importlib.metadata.entry_points().select(group=\"argus.reporters\")``\n  once per process\
      \ and caches the result. Tests force a rebuild\n  via ``_reset_registry_cache_for_tests()``.\n*\
      \ Validates each entry-point by ``ep.load()`` then\n  ``cls()`` then ``isinstance(instance, Reporter)``.\
      \ Any\n  failure logs a WARNING and skips that plugin — argus continues\n  with whatever else loaded\
      \ successfully.\n* Resolves name collisions:\n    - **Built-in vs plugin: built-in wins.** The plugin\
      \ claim is\n      logged as shadowed and discarded.\n    - **Plugin vs plugin: first-wins.** ``importlib.metadata``\n\
      \      iteration order is deterministic across runs of the same\n      install set, so this is a\
      \ stable resolution. The losing\n      plugin is logged.\n\n``REPORTER_REGISTRY`` is preserved as\
      \ a thin read-only proxy\nbacked by the cached registry, so legacy\n``from argus.reporters import\
      \ REPORTER_REGISTRY`` keeps working.\n\n``argus scan --format <name>`` (and the parallel ``argus\
      \ report``\nargument) is populated from ``available_reporters()`` at\nparser-construction time,\
      \ so newly-installed plugins light up\nafter a fresh ``pip install`` without an Argus release.\n"
    alternatives_considered:
    - name: Config-file scan (~/.argus/reporters.d/*.py)
      rejected_because: 'Reinvents the wheel — Python entry-points exist for exactly

        this use case, integrate with pip / wheels / dependency

        resolution, and don''t require us to define a config schema,

        a directory layout, a discovery order, or rules for what

        counts as "installed." Plugin authors get versioning and

        dependency declarations for free with pyproject.toml; a

        config-file approach would have us re-implement all of that.

        '
    - name: Environment-variable-driven loading (ARGUS_REPORTERS=mod1,mod2)
      rejected_because: 'Forces every consumer (CI scripts, MCP server, the

        ``argus`` CLI) to set the variable, doesn''t survive shells

        that don''t propagate the env, and gives no signal at install

        time whether a plugin is registered. Entry-points are

        discoverable via ``pip show`` / ``importlib.metadata`` and

        require no runtime configuration.

        '
    - name: Last-wins on plugin collision
      rejected_because: 'Implicit override semantics are a known footgun. If a user

        has two plugins both registering ``slack`` and one wins

        because it sorts later in site-packages, the user can''t

        predict which one''s behavior they get without reading the

        loader source. First-wins matches Python import precedence

        (the first ``import`` of a name wins) and surfaces the

        conflict via a WARNING — the user can then uninstall

        whichever one they don''t want.

        '
    - name: Explicit override via config (reporting.reporter_overrides)
      rejected_because: 'Adds ceremony for a problem that''s vanishingly rare in

        practice (two plugins fighting over the same name) and

        forces every user-facing config to grow a new section.

        The first-wins + warning combination is loud enough that

        a user encountering the conflict immediately knows what to

        do (uninstall one) without learning a new config knob.

        '
    - name: Hard-fail (raise) on plugin import error
      rejected_because: 'A single broken third-party reporter would break ``argus

        list`` and ``argus scan`` for users who installed it

        alongside other plugins. The principle here matches ADR-016

        (silent-failure gating) inverted: argus''s own defaults

        must not become unusable because a plugin author shipped a

        broken release. Logging at WARNING preserves the diagnostic

        signal without taking the rest of the toolchain down.

        '
    consequences:
      positive:
      - Third parties can ship ``pip install argus-reporter-<name>`` packages that auto-register at install
        time — no fork, no PR, no Argus release coupling.
      - Built-ins go through the same code path as plugins, so the loader is exercised on every CLI invocation.
        A regression in entry-point discovery would surface as failing reporter tests, not as a silent
        loss of `argus scan --format slack`.
      - Adding a new built-in reporter now means writing the module *and* declaring its entry-point in
        pyproject.toml. The latter is a one-liner, but contributors can't forget it — there's no longer
        a hardcoded dict to add to.
      - '``REPORTER_REGISTRY`` remains importable for backwards compat, but it''s a read-only proxy now;
        in-process mutation no longer works. No known consumer mutates it.'
      - '``argus scan --format`` choices are computed at parser-construction time, not import time. Plugin
        install → restart shell → new format works. No compile-time coupling.'
      - A buggy plugin can't break the rest of the registry — but it *can* show up in WARNING logs, which
        is the diagnostic surface we want.
    related:
    - ADR-013
    - ADR-016
    - ADR-020
    pr_references:
    - (closes Phase 4 — Distribution + Multi-Platform → Reporter plugin registration system; see docs/developer/SDK-ROADMAP.md)
  ADR-024:
    title: DAST scanner tuning moves to argus.yml; composite action stays minimal
    status: accepted
    date: '2026-05-11'
    context: "The SDK refactor between 0.6.8 and the 1.0.0 line shrank the\n``scanner-zap`` composite-action\
      \ input surface from ~19\ninputs to 5. The simpler contract makes the common case\neasier and cleaner,\
      \ but it dropped 14 patterns that 0.6.8\nconsumers depended on — API-spec scans, ZAP ignore-rules\n\
      customization, additional ZAP CLI flags, max-duration caps,\nregistry-auth for private app images,\
      \ healthcheck polling,\nbuild-image-as-part-of-scan flows, and a few others. The\nregression was\
      \ surfaced during the medsecops-argus-workflows\nGHES migration audit, where every removed input\
      \ had to be\nstripped from real consumer workflows. Tracked in\n``docs/developer/SDK-ROADMAP.md``\
      \ under \"DAST + Container\nScanner Parity (Post-1.0 Regressions)\".\n\nTwo paths to restoration\
      \ were viable:\n\n1. Re-add the 14 inputs to ``action.yml``, returning to a\n   ~19-input pre-refactor\
      \ action surface. Easy to implement,\n   keeps the action-only mental model — but creates a\n  \
      \ contract bloat that biases users toward \"configure\n   everything through GitHub Actions inputs\"\
      \ and forces\n   SDK-direct users on GitLab / Jenkins / local dev to lose\n   access to the same\
      \ tuning knobs.\n\n2. Move scanner-specific tuning into ``scanners.zap.*`` in\n   ``argus.yml``\
      \ and keep the composite-action surface\n   minimal — matching the config-passthrough pattern already\n\
      \   in use for ``container``, ``osv``, ``checkov``, and\n   ``supply-chain``. Single source of truth\
      \ (the config\n   file) works for both SDK-direct and composite-action\n   users identically.\n\n\
      Credentials added a third complication. Registry auth (for\npulling a private SUT image) and web-app\
      \ authentication (for\nlogging into the running target app) are different problems:\n\n- Registry\
      \ auth — ``docker pull`` credentials, used before\n  ZAP starts.\n- Web-app auth — ZAP's own auth\
      \ machinery: login URL, form\n  selectors (XPath/CSS), logged-in detection regex, session\n  management.\
      \ The DOM specification is per-app and not\n  something argus can abstract cleanly without becoming\
      \ a\n  leaky wrapper around ZAP's context-file format.\n\nNeither belongs as YAML literals — ``argus.yml``\
      \ is\ntypically VCS-tracked.\n"
    decision: "Adopt path (2): scanner-specific tuning moves to\n``scanners.zap.*`` in ``argus.yml``.\
      \ The composite-action\nsurface stays minimal — target identification (``target_url``\nor ``app_image_ref``\
      \ + ``app_ports``) plus the common\ncross-scanner inputs (``fail_on_severity``,\n``post_pr_comment``,\
      \ ``enable_code_security``).\n\n**Disposition of each removed input:**\n\n*Restore via config passthrough*\
      \ (``scanners.zap.<key>``):\n  api_spec              — explicit URL/path for OpenAPI scans\n  rules_file\
      \            — renamed from rules_file_name; .tsv ignore-rules path\n  cmd_options           — list[str]\
      \ appended to ZAP CLI verbatim\n  max_duration_minutes  — int hard cap on scan duration\n  scan_type\
      \             — already exists: baseline | full; api implicit when api_spec is set\n  healthcheck_url\
      \       — argus polls 2xx before invoking ZAP (default timeout 60s)\n\n*Restore via env-var-referenced\
      \ config* (registry auth for\nprivate ``app_image_ref``):\n  scanners.zap.registry_username: \"\
      ${REGISTRY_USER}\"\n  scanners.zap.registry_password: \"${REGISTRY_TOKEN}\"\nReuses the existing\
      \ ``container`` scanner interpolation\npattern. Validator warns on literal values that don't match\n\
      ``${...}`` at config-load time. CLI override\n``--registry-password-stdin`` reads the password from\
      \ stdin\n(mirrors ``docker login --password-stdin``) for ad-hoc local\nruns where setting an env\
      \ var is friction.\n\n*Web-app authentication (V1)* — ZAP context-file passthrough:\n  scanners.zap.auth.context_file\
      \ = \".zap/context.xml\"\n  scanners.zap.auth.username_env = \"ZAP_APP_USER\"\n  scanners.zap.auth.password_env\
      \ = \"ZAP_APP_PASSWORD\"\nArgus mounts the context file into the container at a known\npath and\
      \ exports the named env vars; ZAP's standard\n``{%username%}`` / ``{%password%}`` placeholders in\
      \ the\ncontext file pick them up. The user owns the DOM\nspecification (login URL, form selectors\
      \ via XPath/CSS,\nlogged-in regex, session management). Argus stays out of\nthat surface.\n\n*Web-app\
      \ authentication (V2, deferred)* — an argus-native\n``scanners.zap.auth.form`` block we'd translate\
      \ into a ZAP\ncontext. Defer until we have real consumer apps to validate\nagainst. Abstracting\
      \ the DOM is inherently leaky per-app.\n\n*NOT restoring — intentional simplification* (these belong\n\
      in the consumer's pipeline, not in argus's surface):\n  app_build_context, app_dockerfile, app_image_tag\
      \ — image\n    builds belong in a prior workflow step; argus accepts\n    ``app_image_ref`` (pre-built\
      \ image as sidecar) or a\n    started ``target_url``.\n  compose_file, compose_build — multi-service\
      \ orchestration\n    belongs in the consumer's pipeline.\n  allow_issue_writing — conflicts with\
      \ the silent-failure-\n    loud principle (ADR-016); scan findings already ride\n    PR-comments,\
      \ summary aggregation, and SARIF upload.\n\n**Composite action surface after the change**\n(``.github/actions/scanner-zap/action.yml``):\n\
      \  target_url, app_image_ref, app_ports, fail_on_severity,\n  post_pr_comment, enable_code_security.\n\
      Everything else lives in ``argus.yml``.\n\nThe same ``argus.yml`` shape works for SDK-direct users\
      \ on\nany CI platform (GitLab, Jenkins, Azure DevOps, local dev) —\nparity with composite-action\
      \ users, no per-platform input\ndrift.\n"
    alternatives_considered:
    - name: Re-add all 14 inputs to action.yml (path 1)
      rejected_because: 'Bloats the composite-action surface back to pre-refactor

        levels, creates two sources of truth (action inputs vs.

        argus.yml), and forces SDK-direct users on GitLab /

        Jenkins / local-dev to lose access to the same tuning

        knobs. The simpler-contract win of the original refactor

        goes away. Also biases users toward "configure

        everything through GitHub Actions" — argus''s design

        principle is that the SDK is the primary interface

        (ADR-013) and composite actions are thin wrappers

        (ADR-019).

        '
    - name: 'Split: some removed inputs to action.yml, others to config'
      rejected_because: 'Picking which subset goes which way is bikeshedding

        without a principle. The principle "scanner-specific

        tuning lives in argus.yml, common cross-scanner inputs

        live in the composite" is clean and matches existing

        patterns (container, osv, checkov, supply-chain).

        '
    - name: Native argus auth block for web-app authentication (V1)
      rejected_because: 'DOM specification (form selectors, logged-in detection

        regex, session management) is per-app and not something

        argus can abstract cleanly. We''d either invent a narrow

        DSL that misses real apps (custom JS auth flows, SAML

        redirects, MFA screens, refresh-token rotation) or

        expose so many knobs that we''re re-implementing ZAP''s

        context-file format with worse tooling. Context-file

        passthrough lets users author auth in ZAP''s native

        language with ZAP''s existing tooling (the ZAP GUI can

        record auth flows and emit context files). A V2 native

        block remains on the table if real demand surfaces.

        '
    - name: Plaintext credentials in argus.yml
      rejected_because: '``argus.yml`` is typically VCS-tracked. Plaintext

        credentials there would be a baseline security violation

        and would force every team to add it to .gitignore (or

        accept the leak). Env-var interpolation

        (``${REGISTRY_PASSWORD}``) plus the

        ``--registry-password-stdin`` CLI flag covers both CI

        (env var set by the runner) and ad-hoc local scans

        (stdin pipe). Validator-side rejection of literals turns

        the rule into a config-load-time error, not a runtime

        regret.

        '
    - name: Restore allow_issue_writing
      rejected_because: 'GitHub Issues from scan findings creates noise that

        competes with the existing surfaces (PR comments,

        summary aggregation, SARIF in the Security tab) and

        conflicts with the silent-failure-loud principle

        (ADR-016). The signal users need ("did this scan fail or

        pass") rides those existing channels. Adding issue

        writing reopens a question (which findings warrant an

        issue, who owns the issue, how does it get closed) that

        we''re better off staying out of.

        '
    - name: Restore the build-image-as-part-of-scan flows
      rejected_because: '``app_build_context`` + ``app_dockerfile`` +

        ``app_image_tag`` (and ``compose_file`` +

        ``compose_build``) embed image-build orchestration into

        the scanner''s responsibility. That''s a CI-pipeline

        concern with well-established patterns in every CI

        platform (``docker build``, ``docker compose up``,

        ``buildx``). Consumers retain full control by running

        those steps before invoking argus and passing the

        resulting ``app_image_ref`` or ``target_url``. Argus

        stays focused on scanning, not on image lifecycle.

        '
    consequences:
      positive:
      - SDK-direct users on GitLab, Jenkins, Azure DevOps, or local dev get parity with composite-action
        users — same scanner tuning, same config file, same behavior.
      - 'Composite-action surface stays small: scanner-zap action.yml keeps target identification and
        common cross-scanner inputs, nothing else. Easier for new users to read.'
      - Migrating from 0.6.8 inputs to 1.x config is a one-time YAML rewrite — move scanner-specific tuning
        from `with:` blocks into `argus.yml`. A side-by-side migration guide ships with the implementation
        PR.
      - Web-app authentication remains a ZAP-native concern in V1. Users with HTTP basic-auth or static-header
        setups can already configure those via ``cmd_options`` + env vars; users with form-based auth
        use a ZAP context file (the path the ZAP team itself recommends).
      - Adding scanner-zap configuration knobs in the future means editing ``scanners.zap.*`` in the config
        schema, not adding action.yml inputs. The composite-action surface stays stable across releases.
      - 'Validator-enforced env-var interpolation for credentials prevents accidental literal-password
        commits at config-load time. Users who try to commit ``registry_password: hunter2`` get a warning
        before the scan starts, not after the secret hits VCS.'
      - 'Three credential surfaces are now distinct and documented: registry creds (env-var-referenced
        YAML), web-app creds (ZAP context-file + env-var-named-references), and CLI-stdin (ad-hoc override).
        Each has a clear use case and none overlap.'
    related:
    - ADR-001
    - ADR-013
    - ADR-016
    - ADR-019
    pr_references:
    - (addresses DAST + Container Scanner Parity → scanner-zap target setup parity; see docs/developer/SDK-ROADMAP.md)
  ADR-025:
    title: 'OS-image inspection: in-container scope only; offline VM-image scanning is out of scope'
    status: accepted
    date: '2026-05-13'
    context: "Two adjacent but materially different problem shapes get\nconflated in user requests for\
      \ \"OS image scanning\":\n\n1) **OS as a container artifact.** A team ships their OS as\n   a container\
      \ image — sometimes a stock base image\n   (``ubuntu:24.04``, ``alpine:3.19``, ``redhat/ubi9``),\n\
      \   sometimes a multi-service / systemd-in-container bundle\n   that runs as a workload. The container\
      \ artifact itself\n   is what the scanner has access to: an OCI manifest, a\n   layered filesystem,\
      \ plus the ``docker inspect`` view of\n   declared config.\n\n2) **Offline VM images.** AWS AMIs,\
      \ Azure VHDs, GCP disk\n   images, on-prem VMware OVA/VMDK, ISO files, raw disk\n   dumps, rootfs\
      \ tarballs. The artifact is a bootable disk;\n   \"scanning\" requires mounting the filesystem (libguestfs\n\
      \   /``virt-customize`` / ``virt-inspect``), booting the\n   image in a sandbox VM, or hitting a\
      \ cloud-provider API\n   (AWS Inspector v2, Azure Defender for Cloud, GCP Security\n   Command Center).\n\
      \nThese two map to very different operational models:\n\n- argus's container path: 5–60s scan latency,\
      \ no extra host\n  deps beyond Docker / Podman / nerdctl, works the same on\n  Linux / macOS / WSL.\n\
      - Offline VM inspection via libguestfs: minutes-to-tens-of-\n  minutes per image, hundreds of MB\
      \ of host install\n  (libguestfs ships its own guest kernel), Linux-only host,\n  requires root\
      \ or libvirt group membership.\n\nThe user-research insight that prompted this ADR: when teams\n\
      say \"we want argus to scan our OS,\" they almost always mean\nflavor (1) — they've already containerized\
      \ the OS image\nbecause that's what their deploy pipeline produces and that's\nwhat they can hand\
      \ the scanner. The libguestfs / AMI /\nVMDK case is a different audience (golden-AMI Packer\npipelines,\
      \ FedRAMP infrastructure teams) with a different\noperational shape.\n"
    decision: "Split the OS-image problem into two roadmap entries with\nexplicit, opposite scope decisions:\n\
      \n**(A) In scope: extend the container scanner with a\n``services`` sub-scanner.** Walks systemd\
      \ unit files\n(``/etc/systemd/system/*.service``,\n``/lib/systemd/system/*.service``), SysV init\
      \ scripts\n(``/etc/init.d/*``), and common service configs\n(``sshd_config``, ``postgresql.conf``,\
      \ ``pg_hba.conf``,\n``nginx.conf``, etc.) **inside the container image's\nfilesystem**. Emits one\
      \ ``Finding`` per service the image\nwould launch on boot, with severity INFO by default and\nMEDIUM\
      \ for services on a risky-default watchlist (sshd,\npostgresql with ``trust`` auth, redis without\
      \ password,\netc.). Same operational shape as the existing ``exposure``\nsub-scanner (one ``docker\
      \ run`` + filesystem walk + parse);\nno new host dependencies; sits alongside trivy / grype /\n\
      syft / exposure in the existing\n``argus/scanners/container.py`` sub-scanner loop. Scoping\ndetails,\
      \ watchlist sources, and config knobs land as their\nown actionable roadmap entry; this ADR commits\
      \ to the\ndirection.\n\n**(B) Out of scope: offline VM-image inspection.** Argus\nwill not ship\
      \ libguestfs-based scanning, KVM/QEMU\nboot-and-inspect, or per-cloud-provider AMI integrations.\n\
      Users with these needs are pointed at purpose-built tools:\n\n  - **OpenSCAP + ``oscap-vm`` / ``oscap-docker``**\
      \ — offline\n    mount + scan, STIG/CIS profiles, mature SCAP/OVAL\n    tooling.\n  - **AWS Inspector\
      \ v2** — first-class AMI scanning,\n    server-side, no install.\n  - **Azure Defender for Cloud\
      \ / GCP Security Command\n    Center** — cloud-native equivalents.\n  - **CIS-CAT** — CIS benchmark\
      \ scanner (commercial tier\n    for production use).\n  - **Lynis** — lighter offline audit, runs\
      \ against a\n    mounted root filesystem.\n\nThe documentation pointer lives in ``docs/security.md``\n\
      (or a new ``docs/scanners.md`` \"what argus doesn't cover\"\nsection) so users land on a clear redirect\
      \ instead of\nfiling issues asking why argus doesn't scan their AMI.\n\nWhy this split: argus's\
      \ identity stays \"source-code +\ncontainer artifacts,\" but expands naturally to cover the\nOS-as-container\
      \ case that most modern deploy pipelines\nactually produce. The offline VM case is genuinely a\n\
      different product shape (operational profile, host\nrequirements, audience) — declaring it out of\
      \ scope is\nmore honest than half-implementing it.\n"
    alternatives_considered:
    - name: Wrap OpenSCAP via libguestfs as an argus-native OS-image scanner
      rejected_because: 'Adds a hundreds-of-MB libguestfs install to argus''s

        host requirements, restricts argus to Linux-only on

        the host (currently Linux / macOS / WSL), and pushes

        scan latency from seconds into tens of minutes. The

        operational profile fundamentally doesn''t match

        argus''s PR-CI / dev-loop posture. OpenSCAP is also

        already well-documented and widely used for this exact

        purpose; argus wrapping it would not differentiate.

        '
    - name: Add per-cloud-provider integrations (AWS Inspector v2, Azure Defender, GCP SCC)
      rejected_because: 'Each integration is its own API surface, auth model,

        and rate-limit story. Argus''s strength is "same

        config, same output, anywhere"; bolting on per-cloud

        integrations would split that promise. The cloud-native

        scanners are also positioned closer to the asset they

        inspect (running server-side) than argus could ever be.

        '
    - name: Defer the OS-image research item indefinitely
      rejected_because: 'Leaves a "decision pending" rotting in the roadmap and

        gives users no documentation pointer when they ask why

        argus doesn''t scan their AMI. The out-of-scope answer

        + documentation pointer accomplishes the same

        "don''t build it" outcome with a useful redirect; ADRs

        aren''t terminal — if real demand surfaces from the

        golden-AMI cohort later, we can revisit with concrete

        data.

        '
    - name: Argus-native ``services`` sub-scanner that ALSO handles offline VM images
      rejected_because: 'Tempting because it would be a "single answer" — but

        the two cases share almost no code. Container

        filesystems are layered, accessible via standard tools

        we already use. VM disk images need libguestfs to mount

        or KVM to boot; nothing about that code reuses with the

        container path. Combining them creates a heavier

        dependency footprint for users who only need (A).

        '
    consequences:
      positive:
      - Container scanner gets a natural follow-up extension (the ``services`` sub-scanner) that addresses
        the common OS-as-container case without operational profile changes. Same Docker requirement,
        same scan latency, same cross-platform host story.
      - Users with offline AMI / VMDK / ISO needs get a clear, documented redirect to the right tool for
        their case. No more issues asking ``why doesn't argus scan my Packer-built AMI?``
      - Argus's identity stays focused. We don't accidentally drift into infrastructure-scanning territory
        where cloud-native and purpose-built tools are far better positioned.
      - 'Future revisitability is preserved: if a cohort of golden-AMI / Packer-pipeline customers emerges
        with concrete use cases that genuinely don''t fit OpenSCAP / AWS Inspector, we can revisit (B).
        ADRs aren''t terminal.'
      - The roadmap research item resolves cleanly into one actionable scope (``services`` sub-scanner)
        and one explicit non-goal (offline VM-image scanning), instead of a vague open question.
    related:
    - ADR-013
    - ADR-024
    pr_references:
    - (splits the OS image port enumeration research item in docs/developer/SDK-ROADMAP.md → Attack Surface
      Visibility)
  ADR-026:
    title: Architecture map derived from .ai/architecture.yaml; no parallel JSON source
    date: '2026-05-15'
    status: accepted
    context: 'The SDK ships an interactive architecture-map page (column

      layout × flow-rail × per-node side panel) that needs to be

      consumed by two surfaces: the docsite build (writes

      ``docs/architecture.md`` inlined inside MkDocs Material) and

      the MCP server (``argus://architecture`` resource). Each

      surface needs the same diagram data in JSON shape. The naive

      answer is a hand-edited ``architecture.json`` next to

      ``.ai/architecture.yaml`` that all consumers read. That

      answer is wrong.


      (Historical note: an earlier revision of this work shipped

      the page through a third surface — a ``/architecture`` route

      on the FastAPI viewer. That route was retired and the page

      consolidated into the docs site so the scan-results viewer

      stays narrowly scoped to scan results. The decision below is

      unchanged by that consolidation: it covers the shape of the

      derived view model, not the count of consumers.)


      AICaC already declares a schema (``aicac.dev/schema/v1``) for

      ``.ai/architecture.yaml`` covering the components, scanners,

      data_flow, and dependency surfaces the diagram renders.

      Inventing a parallel argus-local JSON contract for the same

      facts doubles the drift surface: every YAML edit needs a JSON

      mirror edit, and a single missed mirror produces a silent

      discrepancy.

      '
    decision: '``.ai/architecture.yaml`` is the only source of truth. The

      JSON the MCP server returns and the JSON the HTML page

      hydrates from are **derived view models** computed at build

      time — pure functions of the YAML plus runtime SDK

      introspection (``argus.scanners.SCANNER_REGISTRY``,

      ``argus.linters.LINTER_REGISTRY``, the ``argus.reporters``

      entry-point group, the argparse subcommand list). No file

      shaped like ``architecture.json`` is checked into the repo.


      The transformer is ``scripts/docsite/architecture.py::

      build_view_model(...)``. It exports one pure function. All

      three consumers call it; none fork the projection logic.

      '
    alternatives_considered:
    - name: Hand-edited architecture.json next to architecture.yaml
      rejected_because: 'Doubles the drift surface. Every YAML edit needs a

        mirroring JSON edit; a missed mirror produces a silent

        divergence between what the YAML says and what the

        diagram shows. AICaC already has its own schema —

        inventing a second one is non-orthogonal.

        '
    - name: Fork the projection per consumer (docsite-specific, MCP-specific)
      rejected_because: 'Near-identical transformers diverge over time. The MCP

        resource and the docsite-build HTML hydration can''t drift

        in their JSON shape — the MCP contract test is

        "byte-identical to what the docsite inlined."

        '
    - name: Ship a python-generated YAML mirror
      rejected_because: 'Same drift surface as a JSON mirror, with a worse story

        for IDE / schema validation. AICaC YAML stays canonical.

        '
    consequences:
      positive:
      - Adding a scanner under .ai/architecture.yaml + argus/scanners/ makes it appear on both surfaces
        (docsite page + MCP resource) with no further edits.
      - The CI source-of-truth check (scripts/ci/check_architecture_sync.py) enforces the registry → YAML
        half of the contract by introspecting the running SDK.
      - AI agents picking up Argus work read the same JSON the docsite renders, so their mental model
        can't drift from what humans see.
      - Reviewers can reject any PR that adds an ``architecture.json``-shaped file.
      negative:
      - Adding a fundamentally new entity to the diagram (a brand-new column, a new node-kind) means a
        transformer code edit, not just a YAML edit. The transformer is the only place node-shape evolves.
      - Docsite build computes the view model once at build time (~70 nodes, ~70 edges, <50ms locally);
        the MCP resource lazy-builds on first read and caches in the running server process.
    implementation: "- Transformer: scripts/docsite/architecture.py (canonical\n  location); argus/architecture_map.py\
      \ shim re-exports for\n  runtime consumers in the installed package (MCP).\n- Two consumers:\n \
      \   docsite build → scripts/docsite/builder.py calls\n        render_inline_markdown(view_model,\
      \ docs_out)\n        (writes docs/architecture.md inlined inside MkDocs\n        Material; copies\
      \ architecture.{css,js} to docs/assets/)\n    MCP server → argus/mcp.py @mcp.resource(\"argus://architecture\"\
      )\n- CI gate: scripts/ci/check_architecture_sync.py runs in\n  .github/workflows/test-unit.yml on\
      \ every push / PR.\n- Tests: scripts/docsite/tests/test_architecture.py covers\n  determinism, registry\
      \ coverage, flow node-ID resolution,\n  ADR cross-reference, scanner-snippet roundtrip.\n"
    related:
    - ADR-018
    - ADR-023
    pr_references:
    - (introduces scripts/docsite/architecture.py, argus/architecture_map.py, the argus://architecture
      MCP resource, and the CI check; the docs-site integration of the page lives in scripts/docsite/architecture.py::render_inline_markdown)
  ADR-027:
    title: Build-once-promote-everywhere release pipeline in a single release.yml job
    date: '2026-05-16'
    status: accepted
    context: "Pre-1.0.0 the release pipeline was split across two workflows:\n``release.yml`` ran release-it\
      \ (bump + tag + push), then a\ntag-triggered ``publish-release.yml`` built container images and\n\
      published the wheel to PyPI. Three problems with that shape:\n\n1. The wheel referenced container\
      \ tags that didn't exist yet —\n   a brief window where ``pip install argus-security==X.Y.Z``\n\
      \   succeeded but ``docker pull ghcr.io/.../scanner-bandit:X.Y.Z``\n   returned 404.\n2. ``argus/containers.py``\
      \ could not SHA-pin Argus-owned images\n   because the regex-bumper stripped any ``@sha256:`` tail\
      \ when\n   the version segment changed. The cosign-verify path covered\n   it for runtime, but the\
      \ image content was not bound to a\n   specific digest in the wheel — Renovate-style content\n \
      \  addressing was off for the things WE ship.\n3. Two workflows chained via ``workflow_run`` / ``on:\
      \ push tags``\n   meant cross-workflow state was implicit (the tag); failure\n   recovery required\
      \ understanding both pipelines and a tag\n   glob mismatch (``v*`` vs the bare-semver tags release-it\n\
      \   produces) silently broke the chain.\n"
    decision: "Collapse the entire lifecycle into a single ``release`` job in\n``.github/workflows/release.yml``:\n\
      \n  tests → build 4 multi-arch images → push :build-<sha>-<run>\n      → capture sha256: digests\
      \ in $GITHUB_ENV\n      → release-it bump + after:bump hook pins <version>@sha256:<digest>\n   \
      \   → release-it commit + tag + push\n      → buildx imagetools re-tag :<VERSION> + :latest\n  \
      \    → cosign sign by digest\n      → build wheel, smoke test, publish to PyPI (OIDC)\n\nA parallel\
      \ ``dry-run`` job continues to render release-it\npreviews on every push to main and on ``workflow_dispatch\n\
      dryRun=true``.\n\nTwo supporting pieces:\n\n- ``scripts/release_it/inject_image_digests.py`` — release-it\n\
      \  ``after:bump`` hook that reads ``ARGUS_DIGEST_<NAME>`` env vars\n  set by the build step and\
      \ rewrites each Argus-owned line in\n  ``argus/containers.py`` with ``<version>@sha256:<digest>``.\n\
      \  The regex-bumper rule for ``containers.py`` was tightened\n  from ``[^\"]+`` to ``[^\"@]+`` so\
      \ it bumps only the version\n  segment and leaves the ``@sha256:`` tail to the hook.\n\n- ``.github/workflows/ghcr-prune.yml``\
      \ (+ ``scripts/ci/prune_ghcr_tags.py``) —\n  nightly cleanup keeps anything matching semver\n  (``\\\
      d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.-]+)?``) and ``latest`` forever;\n  anything else (build-id tags, future\
      \ PR previews) ages out\n  after 14 days. The release pipeline can push throwaway\n  ``:build-<sha>``\
      \ tags freely without registry-bloat anxiety.\n"
    alternatives:
    - name: Keep two workflows, fix tag-prefix glob (v* vs bare semver) and add SHA injection
      rejected_because: 'Fixes the chain-break symptom but keeps the implicit

        state (tag-as-baton). Workflow_run-style chaining means

        failure mid-publish leaves the system in an in-between

        state that''s awkward to recover from: tag exists, wheel

        doesn''t, images half-published. Cross-workflow

        observability is poor.

        '
    - name: Three jobs in release.yml (build-containers → release → publish/promote)
      rejected_because: 'Closer to the right shape but pays for cross-job state

        passing (job outputs for digests, fresh checkouts in

        each job, an extra environment-gate per protected job).

        Most of that orchestration overhead vanishes when the

        steps live in one job. Drives the design intent — the

        release IS one logical operation — into the workflow

        file.

        '
    - name: Build containers in a separate continuous-integration workflow on every push, release.yml
        just promotes by digest
      rejected_because: 'Decouples image age from release timing in a way that

        quietly drifts the "what shipped" story: the version

        tag points at a digest that was built minutes-to-days

        earlier, with no enforcement that the build came from

        the same commit release-it just tagged. Easier to wire,

        harder to audit. Single-job ordering makes the

        source-commit-to-published-digest chain explicit.

        '
    consequences:
      positive:
      - PyPI wheel never references unsigned or non-existent images — order of operations puts every image
        at its final tag and signed before the wheel publishes.
      - argus/containers.py is digest-pinned end-to-end. Renovate/Docker enforce content-address match
        for third-party images; the after:bump hook does the same for Argus-owned images.
      - 'Failure semantics: build fails → nothing public. release-it skips (no commits warrant a release)
        → no PyPI publish, no tag promotion; the :build-<sha> tags become orphans cleaned by prune.'
      - Cosign signing has no continue-on-error escape hatch — sign failure fails the release loudly.
      - Tag-prefix mismatch class of bug is gone — no second workflow needs to glob the tag release-it
        produced.
      negative:
      - Adding a new Argus-owned image touches three places in release.yml (build matrix, sign step) plus
        the prune package list and the regex-bumper rule. The after:bump hook adapts automatically via
        the ARGUS_DIGEST_<NAME> convention — no code change there. Trade-off accepted as the cost of explicit
        step ordering.
      - 'Single job means the ``prod`` environment gate covers the whole pipeline, not just the tag-push
        step. Approving the gate approves the whole chain through PyPI publish — there''s no second confirmation
        between sign and publish. Mitigation: the dry-run job runs in parallel as a preview on every push.'
      - Every push to main with non-chore-release commits runs the multi-arch container build (~10 min)
        even when no commits warrant a release. The orphan :build-<sha> tags get pruned, but the CI minutes
        are spent. Acceptable for the typical Argus push cadence; revisit if push volume explodes.
    implementation: '- .github/workflows/release.yml — single ``release`` job + parallel ``dry-run`` job

      - .github/workflows/ghcr-prune.yml — nightly cron, manual workflow_dispatch with dryRun toggle

      - .release-it.json — after:bump hook registration + tightened containers.py regex-bumper rule

      - scripts/release_it/inject_image_digests.py — the hook

      - scripts/ci/prune_ghcr_tags.py — semver-aware GHCR cleanup

      - argus/core/image_verify.py — ARGUS_CERT_IDENTITY_REGEXP now matches release.yml (previously publish-release.yml)

      - docs/developer/release-management.md — updated overview + pipeline flow + security integration
      sections

      - docs/developer/container-lifecycle.md — updated Release Process + Adding a New Custom Image sections

      '
    related:
    - ADR-014
    - ADR-019
    pr_references:
    - (introduces the build-once-promote pipeline; replaces .github/workflows/publish-release.yml; adds
      the after:bump digest-injection hook and the nightly ghcr-prune workflow)
  ADR-028:
    title: Per-registry credentials for container scans via registry_auth map
    date: '2026-05-19'
    status: accepted
    context: 'The initial container-scan auth shape was a single

      ``containers.registry_username`` / ``registry_password`` pair

      applied to every image. Real-world setups commonly pull from

      multiple registries in one scan (Iron Bank + GHCR + ECR is

      typical for federal-adjacent customers), and within one

      registry, different repo paths often require different

      credentials (subscription tiers, IAM-per-repo, Artifactory

      per-project tokens). A single pair forces operators to either

      run multiple separate scans (loses unified reporting) or pick

      the most-privileged credential and live with the

      least-privilege violation.


      Two competing UX shapes were on the table: per-image

      credential blocks (kubectl pod-level pattern) or a host-keyed

      map (Docker config.json / Maven mirrors / Renovate hostRules

      pattern). Per-image is maximally explicit but duplicates

      credentials across same-registry images and gets tedious for

      fleets of 20+ images. Host-keyed is DRY and matches existing

      operator mental models for ``imagePullSecrets``-style auth.

      '
    decision: "Add an optional ``containers.registry_auth`` map. Keys are\nregistry-host (broad) or host/path-prefix\
      \ (narrow). Image\nresolution uses longest-path-component-prefix matching — the\nmost specific entry\
      \ wins. Top-level\n``containers.registry_username`` / ``registry_password`` stays\nas the implicit\
      \ ``*``-wildcard default when no map entry\nmatches, so single-registry configs stay one-liners.\n\
      \nTwo correctness rules govern the matching algorithm:\n\n1. **Path-component boundary.** The match\
      \ terminates at ``/``\n   or end-of-string. ``registry.example.com/internal/restricted``\n   matches\
      \ ``.../restricted`` and ``.../restricted/repo`` but\n   NOT ``.../restrictedX/repo``. Without this\
      \ guard, a typo\n   in the more-specific key would silently match a sibling\n   repo with a similar\
      \ name and broaden the auth surface.\n\n2. **No silent fallback to a broader entry.** When the\n\
      \   best-match entry's referenced env var is unset (or the\n   literal value is empty), Argus logs\
      \ a WARNING naming the\n   missing variable and returns no credentials — the scan\n   attempts the\
      \ registry anonymously rather than falling back\n   to a less-specific entry. Same rule k8s\n  \
      \ ``imagePullSecrets`` follows: if the configured secret\n   doesn't resolve, the pull fails, it\
      \ doesn't try other\n   secrets. Silently broadening auth against a repo the\n   operator explicitly\
      \ marked as needing different access is\n   a privilege-misuse risk.\n\nThe top-level fallback path\
      \ remains the implicit-default,\nnot a \"try this if the map fails to resolve\" — the no-silent-\n\
      fallback rule applies even when the map IS configured but the\nmatched entry doesn't resolve.\n"
    alternatives_considered:
    - name: Per-image credentials (kubectl-style imagePullSecrets per image entry)
      rejected_because: 'Maximum explicitness, but duplicates credentials across

        same-registry images and creates churn whenever a registry

        rotates a token (N image entries to update vs one map

        entry). The host-keyed shape covers the same use case with

        less ceremony for the common case (handful of registries,

        dozens of images each) and degrades gracefully to per-repo

        granularity via the path-prefix keys.

        '
    - name: Rely entirely on ~/.docker/config.json + docker login
      rejected_because: 'Zero new config but moves state out of argus.yml and

        requires CI steps to script ``docker login`` calls for

        each registry. The map shape keeps declarative config self-

        contained while still allowing ``~/.docker/config.json``

        as a fallback path in a future enhancement.

        '
    - name: Glob-pattern match list with order-dependent rules
      rejected_because: 'More flexible (wildcards mid-path, character classes) but

        pays for it with order-dependence and a separate match-

        syntax users must learn. The keyed map''s "longest match

        wins" rule is easier to document and reason about. Globs

        can be added as a second-class fallback later if a real

        case prefix matching can''t express it surfaces.

        '
    - name: Silent fallback to broader entry on cred resolution failure
      rejected_because: 'Convenient but defeats the point of declaring a more-

        specific entry. If the operator wrote

        ``registry.example.com/internal/restricted`` with its own

        creds, silently using the bare-host default for that path

        when the restricted env var is unset is exactly the

        privilege-misuse the per-prefix granularity is meant to

        prevent.

        '
    consequences:
      positive:
      - Operators can scan images from N registries in one config without per-image credential ceremony.
      - Per-repo credential granularity for registries where it matters (subscription tiers, IAM-per-repo)
        without forcing it on the simple case.
      - Single-registry configs stay one-liners — the bare-default top-level fields still work without
        ever touching the map.
      - No silent privilege broadening when an env var is unset — Argus refuses to fall back to a less-specific
        entry and surfaces a WARNING naming the missing variable.
      negative:
      - 'Two field-name schemas to remember: ``registry_username`` / ``registry_password`` at the top
        level vs ``username`` / ``password`` inside ``registry_auth`` entries. Documented as ''the prefix
        is implied by context inside an entry'' but it is a small extra cognitive step.'
      - Longest-prefix matching is a routing decision that can hide a misconfiguration (e.g. a typo in
        the specific entry causes a silent fall-through to the broader entry). The no-silent-fallback-on-unresolved-creds
        rule mitigates this for the common cred-misconfig case but cannot catch a key-typo that still
        happens to match a different valid entry.
    implementation: "- argus/container/scanner.py — new ``_normalize_image_ref``\n  (strips tag/digest,\
      \ preserves host:port for ``localhost:5000``-\n  style refs), ``_is_path_component_prefix`` (boundary\
      \ check),\n  and ``_resolve_registry_auth`` (longest-prefix selection with\n  the no-silent-fallback\
      \ rule). ``_registry_auth_env`` gains an\n  ``image_ref`` parameter so callers can drive the matching;\n\
      \  ``_run_trivy`` / ``_run_grype`` / ``_run_syft`` thread the\n  image ref through.\n- argus/cli.py\
      \ — ``_load_container_config`` already promotes\n  legacy ``scanners.container.*`` credential fields\
      \ to the\n  ``containers:`` block (ADR-028 doesn't change that\n  promotion).\n- argus/tests/test_container_scanner_runners.py\
      \ — 9 new test\n  classes covering ref normalization (host:port edge case),\n  path-component boundary\
      \ (no false match on restrictedX),\n  longest-prefix selection, fallback-to-top-level when no\n\
      \  entry matches, no-fallback-when-env-unset with WARNING\n  surfaced, back-compat for image_ref=None\
      \ callers.\n- docs/config-reference.md — new \"Per-registry credentials\"\n  section under the ``containers``\
      \ block.\n- argus.example.yml — commented multi-registry example.\n- docs/troubleshooting/docker.md\
      \ — new \"target image fails\n  to authenticate inside the sub-scanner container\" entry.\n"
    related:
    - ADR-024
    pr_references:
    - '(introduces containers.registry_auth + longest-prefix matching; closes #180 acceptance gap for
      multi-registry deployments)'
  ADR-029:
    title: GitHub Actions dependency updates handled by Renovate, not Dependabot
    date: '2026-06-01'
    status: accepted
    context: 'Dependabot''s github-actions ecosystem silently stopped opening

      PRs (#196) despite real updates being available across our

      workflows and composite actions. Root cause was confirmed from

      the updater job log (run 26753720008): the ecosystem was

      configured with ``directories: ["/", "/.github/actions/*"]``,

      which fans out to ~30 composite-action directories. Dependabot

      runs one updater job per (ecosystem, directory) pair and the

      whole github-actions ecosystem shares a single GitHub-hosted

      job that is hard-capped at ``max-updater-run-time`` (2700s /

      45 min, NOT user-configurable on GitHub-hosted Dependabot).

      The fan-out exhausted that budget on git-fetch churn before any

      PR was produced — the job ended with

      ``##[error]The operation was canceled`` (dependabot-core

      #11645). Independently, the ``cooldown`` we set interacts badly

      with frequently-released actions: Dependabot only checks the

      age of the latest release and, if that is inside the cooldown

      window, skips the dependency entirely rather than offering the

      newest eligible older version (dependabot-core #13691).


      An earlier attempt (#218) added ``ignore: huntridge-labs/argus*``

      on the theory that self-referential composite-action pins were

      the stall. That was merged but did NOT fix the timeout — it was

      the wrong root cause. dependabot-core #6704 (composite

      ``action.yml`` ``uses:`` not bumped) is a separate open

      limitation that also affects us.

      '
    decision: "Move GitHub Actions updates off Dependabot and onto Renovate,\nwhich already runs in this\
      \ repo for custom managers. Renovate's\ngithub-actions manager scans every workflow and composite\n\
      ``action.yml`` repo-wide in a single pass (no per-directory job\nmodel, so no 45-min fan-out timeout)\
      \ and its ``minimumReleaseAge``\ncooldown offers the newest version older than the window instead\n\
      of skipping the dependency.\n\n- ``.github/renovate.json``: add ``github-actions`` to\n  ``enabledManagers``\
      \ and three packageRules — minor/patch/digest\n  grouped (``github-actions-minor-patch``), major\
      \ separated\n  (``github-actions-major``), both with ``pinDigests: true`` to\n  keep the ``@sha\
      \ # vX`` pin style; and a rule disabling updates\n  to our own ``huntridge-labs/argus`` composite\
      \ actions\n  (release-it version-bumps those on tag, not Renovate). The\n  global ``minimumReleaseAge:\
      \ 7 days`` supply-chain delay,\n  weekly schedule, and ``chore(deps):`` prefix auto-apply.\n- ``.github/dependabot.yml``:\
      \ remove the entire github-actions\n  ecosystem block. Dependabot keeps pip, docker, and npm — those\n\
      \  are single-directory ecosystems unaffected by the fan-out\n  timeout and have no Renovate manager\
      \ configured.\n"
    alternatives_considered:
    - name: Increase the Dependabot updater timeout
      rejected_because: '``max-updater-run-time`` is fixed at 2700s on GitHub-hosted

        Dependabot and is not exposed in dependabot.yml. The only way

        to raise it is self-hosting the Dependabot updater, which is

        far more operational surface than the problem warrants.

        '
    - name: Split github-actions into ~30 per-directory Dependabot blocks
      rejected_because: 'Each (ecosystem, directory) pair gets its own job and budget,

        which would sidestep the shared-timeout, but it means

        hand-maintaining 30+ near-identical blocks that must track

        every new/removed composite action — brittle and noisy. It

        also does nothing for the cooldown-skip bug (#13691), which

        is independent of directory count.

        '
    - name: Keep Dependabot + ignore self-referential action pins (#218)
      rejected_because: 'Already tried and merged; the timeout persisted. The

        self-refs were never the cause — the directory fan-out was.

        '
    - name: Run both Dependabot and Renovate on github-actions
      rejected_because: 'Duplicate, conflicting PRs for the same ``uses:`` bump. One

        tool must own each ecosystem; Renovate owns github-actions,

        Dependabot owns pip/docker/npm.

        '
    consequences:
      positive:
      - github-actions updates resume — Renovate's repo-wide single pass has no per-directory timeout.
      - 'Frequently-released actions are no longer skipped: minimumReleaseAge offers the newest version
        older than the 7-day window instead of skipping the dependency (fixes the #13691 interaction).'
      - 'SHA pins preserved and maintained: pinDigests keeps the @sha # vX shape and bumps the digest
        in place.'
      - 'Composite action.yml uses: refs are now covered (Renovate scans them; Dependabot''s #6704 left
        them stale).'
      negative:
      - Two update tools to reason about — contributors must know github-actions PRs come from Renovate
        and pip/docker/npm from Dependabot. Documented in both config files' headers.
      - Renovate groups and labels differ slightly from Dependabot's (groupName vs Dependabot groups);
        existing PR-filtering automation keyed on Dependabot labels won't match the github-actions PRs.
    implementation: "- .github/renovate.json — enabledManagers gains \"github-actions\";\n  three github-actions\
      \ packageRules appended (minor-patch group +\n  pinDigests, major group + pinDigests, disable\n\
      \  huntridge-labs/argus self-refs); description rewritten to state\n  the Dependabot→Renovate split\
      \ and cite #196 / dependabot-core\n  #11645 / #13691.\n- .github/dependabot.yml — github-actions\
      \ ecosystem block removed,\n  replaced by a pointer comment to renovate.json; pip/docker/npm\n \
      \ unchanged.\n"
    related:
    - ADR-014
    pr_references:
    - '(moves github-actions updates from Dependabot to Renovate; closes #196; supersedes the #218 ignore-self-refs
      attempt)'
  ADR-030:
    title: Deprecate scanner-container-summary in favor of security-summary
    date: '2026-06-12'
    status: accepted
    context: 'The Phase 3 thin-wrapper migration rewrote scanner-container to call

      the Argus SDK (``argus scan container``) directly and emit a

      per-container markdown summary artifact (``scanner-summary-container-*``).

      The bespoke parse/summary scripts (parse_trivy_results.py,

      parse_grype_results.py, generate_container_summary.py) were removed as

      dead code in that cleanup. But scanner-container-summary — the action

      that combines parallel/matrix container results — still shelled out to

      those deleted scripts, and still downloaded the obsolete

      ``container-scan-results-*`` artifact name. It therefore crashed with

      "No such file or directory" at 1.4.0 and 1.4.1 (issue #251). Meanwhile

      security-summary already does exactly this job the SDK way: it

      downloads ``scanner-summary-*`` artifacts (which include

      ``scanner-summary-container-*``), stitches them via its own

      generate_summary.py, renders a status table, and posts a PR comment.

      Two aggregators, one broken and redundant.

      '
    decision: 'Deprecate scanner-container-summary and converge on security-summary as

      the single combined-summary aggregator. scanner-container-summary

      becomes a thin compatibility shim that emits a deprecation warning and

      forwards to security-summary scoped to ``scanner-summary-container-*``

      (preserving the container-specific title and PR comment marker), so

      existing ``@<version>`` pins keep working. Internal consumers

      (container-scan.yml, container-scan-from-config.yml) and the published

      example migrate directly to security-summary. The shim is slated for

      removal in a future major release.

      '
    consequences:
      positive:
      - The combined container summary works again (forwards to the maintained security-summary path).
      - One aggregator to maintain; no duplicated stitching logic.
      - External consumers pinned to scanner-container-summary keep working via the shim (no hard break).
      negative:
      - scanner-container-summary's declared outputs (total_vulnerabilities, etc.) are dropped — they never functioned (the action crashed) and security-summary does not expose per-severity counts.
      - A future major release must remove the shim; consumers must migrate to security-summary before then.
    implementation: "- .github/actions/scanner-container-summary/action.yml — replaced the\n  deleted-script invocation with a deprecation warning + a forward to\n  security-summary (summary_pattern: scanner-summary-container-*).\n- .github/workflows/container-scan.yml,\n  .github/workflows/container-scan-from-config.yml,\n  examples/workflows/actions-container-scan-matrix.yml — migrated the\n  summary step to security-summary.\n- The two workflows that invoke ``argus scan`` inline\n  (container-scan.yml, container-scan-from-config.yml) now write to a\n  fixed --output-dir --no-timestamp and publish the per-container\n  markdown as a ``scanner-summary-container-<name>`` artifact before\n  the summary job, so security-summary has something to stitch instead\n  of silently producing an empty report. (Consumers that use the\n  scanner-container composite action already upload these.)\n- READMEs (.github/actions/README.md catalog +\n  scanner-container-summary/README.md) marked deprecated.\n"
    related:
    - ADR-027
    pr_references:
    - '(deprecates scanner-container-summary; fixes the dangling deleted-script refs; closes #251)'
    alternatives_considered:
    - name: Resurrect the deleted parse/summary scripts
      rejected_because: 'They parsed raw trivy/grype JSON in the pre-SDK format; the SDK now

        emits canonical results + markdown, so the old scripts no longer

        match the artifact contract. Re-adding them would reintroduce a

        parallel, drift-prone implementation of what the SDK already does.

        '
    - name: Repair scanner-container-summary as a standalone aggregator
      rejected_because: 'Keeps two near-identical aggregators to maintain. security-summary

        already covers the container case via its scanner-summary-* pattern.

        '
  ADR-031:
    title: Container sandbox for untrusted third-party plugins
    date: '2026-06-17'
    status: accepted
    context: 'Argus should let third parties build plugins, but Argus is a security
      tool that runs in sensitive environments with repo/credential access nearby.
      Plugin code cannot be trusted by default — an in-process Python plugin runs
      with full host trust and could exfiltrate or tamper. We need an isolation
      model that also enables language-agnostic plugins, and an audit trail so
      consumers know which (and how trusted) plugins produced a result.'
    decision: 'Run third-party plugins as isolated containers implementing the
      ``argus.plugin.v1`` contract (scan target read-only at /scan; findings JSON
      on stdout). The host builds a hardened ``docker run`` invocation (no network
      by default, read-only rootfs, --cap-drop ALL, no-new-privileges, non-root,
      resource/pid limits, no host env/secrets, no docker socket, never
      --privileged, digest-pinned image) and treats plugin output as untrusted:
      schema-validated, severity-coerced, length-bounded, control-char-stripped,
      and location-sanitized (absolute/.. rejected). Plugins carry a trust tier
      (first-party / verified / unverified); unverified requires explicit opt-in,
      gets no network, and is flagged in the attestation. Every plugin run is
      recorded (name, version, image digest, trust tier, signature_verified) into
      the scan results + the cosign attestation. Prototype: argus.core.plugin_runtime.'
    alternatives_considered:
    - name: In-process Python plugins only (entry points, full trust)
      rejected_because: 'Python-only, and untrusted code runs in-process with full
        host access — unacceptable default for a security tool. Kept as the trusted
        first-party path; the sandbox is for third-party code.'
    - name: Obfuscation / signing without isolation
      rejected_because: 'Signing proves origin, not safety; a signed-but-malicious
        or compromised plugin still needs containment. Isolation is the control.'
    consequences:
      positive:
      - Untrusted, language-agnostic plugins with strong default isolation
      - Reuses the existing Docker execution backend
      - Auditable — plugins are called out by digest + trust tier in the attestation
      - Graceful degradation — a hostile/broken plugin can't crash a scan
      negative:
      - Container escape via kernel 0-day is still possible (microVM is a future option)
      - Per-plugin container overhead; network-allowed plugins can exfiltrate by design
      - The stable entry-point contract + cosign image verification are still to come
    implementation: 'argus/core/plugin_runtime.py (build_sandbox_argv,
      validate_findings, plugin_provenance, run_plugin); threat model in
      docs/plugin-sandbox.md; reference plugin in examples/plugins/hello-plugin/.'
    related_adrs:
    - ADR-018
    - ADR-023
  ADR-032:
    title: Versioned plugin contract (argus.plugins.v1) enforced by conformance tests
    date: '2026-06-17'
    status: accepted
    context: 'Third parties and Argus Enterprise build on a surface of the core
      (Finding/ScanResult/Severity data shapes, the Scanner protocol, the
      argus.reporters seam). These are separately-released, runtime-coupled
      packages, so a breaking change in core can silently break a downstream
      plugin when a user upgrades core — unacceptable for a security tool whose
      paid plugins must keep working. We chose a RANGES compatibility model (not
      lockstep), which only works if "compatible" is defined and breaks are caught.'
    decision: 'Declare a stable, semver-governed public contract — argus.plugins.v1,
      documented in docs/plugin-contract.md — and ENFORCE it with conformance
      tests (argus/tests/test_plugin_contract.py) that run in core CI on every PR.
      A change that removes/renames a contract field, Severity member, protocol
      method, or the reporters entry-point group fails CI before merge. Policy:
      additive changes are compatible; a break requires argus.plugins.v2 + a core
      major bump. Downstreams pin a compatible range and add a load-time version
      guard that degrades gracefully on mismatch (Argus Enterprise does this).'
    alternatives_considered:
    - name: Lockstep versioning (enterprise version == core version)
      rejected_because: 'Simplest "always compatible" story but rigid — every core
        patch forces a downstream release. Ranges + contract + guard is the
        standard open-core approach and scales to external plugin authors.'
    - name: Documentation only, no executable contract
      rejected_because: 'Docs drift; nothing stops a core PR from breaking the
        surface. Conformance tests make the contract executable + enforced.'
    consequences:
      positive:
      - A core PR cannot merge a contract break (conformance tests fail CI)
      - Defines precisely what "compatible" means for the ranges model
      - External plugin authors get a documented, stable target
      negative:
      - The console/browser seams aren't on main yet, so their conformance tests
        join later (only the data + reporter + scanner surface is guaranteed now)
      - Adds a discipline cost — contract changes must be deliberate
    implementation: 'docs/plugin-contract.md (the surface + stability policy);
      argus/tests/test_plugin_contract.py (conformance suite). Complements ADR-031
      (the container plugin sandbox) and the reporters seam (ADR-023).'
    related_adrs:
    - ADR-023
    - ADR-031
  ADR-033:
    title: Formal vulnerability report — UI-free model, HTML-first, server-side PDF behind [report]
    date: '2026-06-13'
    status: accepted
    context: |-
      Browser roadmap Phase B4. Stakeholders and auditors need a single,
      authoritative artifact — "here is what we scanned, what we found, and
      proof of which tooling/commit produced it" — that can be archived and
      handed to a government body. The interactive dashboard is the wrong
      shape for that: it's collapsible, filterable, and dynamically scaled.
      A formal report must be linear, complete, and provenance-bearing.
      Argus already records the raw provenance facts (argus version,
      scan_context commit_sha + repo_root, the toolchain image-digest +
      cosign-verification block from #240/#243, and the signed attestation
      from #241/#244) — they were just never assembled into one document.
    decision: |-
      Build the report in three layers, mirroring the established UI-free-core
      pattern: (1) argus/core/report.py — a pure, dependency-free ReportModel +
      build_report() that assembles provenance, the executive summary (reusing
      findings_view.compute_summary so counts can't diverge from the dashboard),
      and severity-grouped findings; (2) a standalone report.html.j2 + report.css
      (does NOT extend the app chrome — it's a print document) rendered by a
      /report route, always available; (3) a server-side /report.pdf route that
      renders the same HTML to PDF via WeasyPrint, behind an opt-in [report]
      extra. The PDF is generated server-side (not via the browser print dialog)
      so it is deterministic and one click away. WeasyPrint's edge lives in
      argus/viewers/browser/report_pdf.py, lazily imported and raising
      ViewerUnavailable with an install hint when absent — the same guarded-extra
      pattern the Console epic used. Attestation status is detected from the
      cosign bundle / in-toto statement written alongside argus-results.json.
    consequences:
      positive:
      - One authoritative, archivable artifact with cryptographic-grade provenance (commit, image digests + verification, attestation status) — not just a screenshot.
      - Report counts/severities reuse the shared findings_view logic, so the report can never disagree with the dashboard or TUI.
      - The core model is pure and fully unit-tested without WeasyPrint installed; only the thin PDF edge needs the native stack.
      - Graceful degradation — /report HTML is always served; without the [report] extra the browser's own Print → Save-as-PDF produces the same document, so nothing hard-breaks.
      - WeasyPrint (heavy native Pango/cairo stack) stays isolated behind an opt-in extra, preserving the viewer's otherwise zero-new-runtime-dep posture.
      negative:
      - WeasyPrint can't be exercised in the default test env (not installed); the PDF success path is tested via an injected fake renderer, and live PDF rendering is only smoke-verified where the extra is present.
      - The report's provenance is only as complete as the scan recorded — an in-memory or non-git scan shows "not recorded" fields (surfaced honestly rather than fabricated).
    implementation: |-
      - argus/core/report.py — ReportModel, ReportProvenance, SeverityGroup,
        build_report(); attestation detection from sibling bundle/statement files;
        provenance from ScanSummary.scan_context + .toolchain + argus.__version__
        (version + timestamp injectable for deterministic tests).
      - argus/viewers/browser/report_pdf.py — guarded WeasyPrint edge
        (is_available(), render_pdf(html, stylesheet=, base_url=)).
      - argus/viewers/browser/templates/report.html.j2 — standalone print doc;
        links /static/report.css when pdf=False (strict CSP), omits the link when
        pdf=True so WeasyPrint receives the CSS explicitly (no HTTP fetch).
      - argus/viewers/browser/static/report.css — print-optimized, @page rules +
        page numbers, fixed severity hues, defines --fg/--surface-alt/--fg-muted
        so the shared inline-SVG charts render on a light document.
      - argus/viewers/browser/app.py — /report (HTML) + /report.pdf routes; a
        "Report" nav link in base.html.j2.
      - pyproject.toml — [report] = ["weasyprint>=62"]; folded into [all].
      - Tests: argus/tests/core/test_report.py (model, provenance, attestation,
        grouping) + argus/tests/viewers/browser/test_report_route.py (HTML render,
        PDF guard-degradation + injected success path).
      - Docs: docs/view-browser.md (Formal report section + screenshot),
        scripts/docsite/capture_view_browser.py (/report capture).
    related:
    - ADR-021
    - ADR-034
    pr_references:
    - '(browser Phase B4 — formal vulnerability report; merges into feat/tui-explorer-and-scan-runner)'
    alternatives_considered:
    - name: Client-side PDF (browser print / JS PDF library)
      rejected_because: |-
        Browser print is per-browser non-deterministic and pushes layout control
        to the user's print dialog; a JS PDF lib (jsPDF/pdfmake) would add a heavy
        front-end dependency and can't see the server-side provenance facts. A
        server-side render is deterministic (same scan → same bytes) and is the
        "one click" the requirement called for. Browser print is kept only as the
        no-extra fallback.
    - name: Bundle WeasyPrint into the [browser] extra
      rejected_because: |-
        WeasyPrint pulls a heavy native stack (Pango, cairo, …). Making it a hard
        dependency of the browser viewer would punish every user who just wants
        the dashboard. Isolating it behind [report] keeps the common install light
        and matches the supply-chain-tool principle of minimizing its own surface.
    - name: A new reporter plugin (argus.reporters entry-point) instead of a viewer route
      rejected_because: |-
        The report's value is the interactive HTML preview + one-click server-side
        PDF in the same surface the findings are viewed in. A batch reporter would
        not give the on-screen preview, and the provenance assembly is naturally a
        view concern over a loaded ScanSummary, not a scan-time emit.
  ADR-034:
    title: Console and report generation are delivered through plugin seams, not shipped built-in
    date: '2026-06-17'
    status: accepted
    context: |-
      Two surfaces built on the integration branch are add-on capabilities
      rather than core scanning: the bare-``argus`` Console home (the full
      Textual home-hub) and *report generation* — the authoritative,
      provenance-bearing security report (ADR-033), in both HTML and PDF form.
      The report is the paid, archivable artifact. Shipping even its HTML view
      in OSS would defeat that: a browser's own Print -> Save-as-PDF reproduces
      essentially the same document for free. So the whole report (not just the
      server-side PDF) must be out of the core. The core already exposes two
      neutral entry-point seams — argus.console_providers and
      argus.viewers.browser_plugins — so external packages can supply these.
    decision: |-
      The OSS core ships the seams (and, for the Console, the always-available
      --help fallback), but not the two surfaces themselves:
        - Console: keep the supporting UI-free modules (run_discovery,
          console_config, system_status, terminal_caps) and the findings viewer.
          bare ``argus`` defers to an installed argus.console_providers provider;
          with none it prints a one-line pointer + --help. No built-in home-hub.
        - Report generation: the OSS core ships NO report — no model, no
          template, no /report or /report.pdf route. The browser app exposes
          ``app.state.load_scan`` (resolve the active scan -> ScanSummary) and the
          argus.viewers.browser_plugins seam; an installed plugin owns the entire
          report — its own model + template + stylesheet, building from public
          core helpers (findings_view, svg_charts, trends, run_discovery, the
          loader) — and registers BOTH ``/report`` (HTML) and ``/report.pdf``.
          Because the core registers neither route, the plugin owns them cleanly
          (no first-registered shadowing). The free dashboard / findings views
          stay in OSS.
      This SUPERSEDES ADR-033's OSS-shipping decision: the report model, routes,
      template, stylesheet, and the [report] extra all leave the core for the
      add-on. The provenance/UI-free-core design from ADR-033 is preserved,
      relocated into the add-on.
    consequences:
      positive:
      - Core stays lean — no report model/template, no WeasyPrint, no Textual-home weight in the default install.
      - The paid artifact is protected, because with no OSS report there is no HTML page a browser can print to PDF for free.
      - Both seams are exercised by OSS tests (a dummy console provider; a test browser plugin that builds from load_scan), so the contract can't silently break.
      - Clean plugin ownership of both /report and /report.pdf (no route shadowing).
      negative:
      - Report generation (HTML + PDF) requires the installed add-on; OSS users get the dashboard/findings views and the raw argus-results.json, not the formal report.
      - The report + Console now live outside this repo; the seams (load_scan, browser_plugins, console_providers) must stay stable (covered by the seam tests).
    related:
    - ADR-023
    - ADR-031
    - ADR-033
    implementation: |-
      - Removed from OSS: argus/core/report.py, argus/viewers/browser/templates/report.html.j2,
        argus/viewers/browser/static/report.css, the /report + /report.pdf routes + the render
        helper + app.state.render_report_html, the "Report" nav link, the [report] extra,
        the Console home-hub (terminal/{console,console_model,config_editor,init_wizard}.py)
        and argus.viewers.terminal.launch_console.
      - Kept in OSS: both entry-point seams (cli._discover_console_provider / _run_bare_argus;
        create_app browser_plugins discovery + app.state.load_scan), the dashboard/findings
        views + their charts, and the supporting UI-free core modules.
      - Relocated into the add-on: the report model + template + stylesheet, served by a
        browser plugin that registers /report (HTML, gated), /report.css, and /report.pdf
        (gated) — all behind the `report` license entitlement.
      - Tests: test_cli_console.py (provider/help dispatch); test_plugin_seam.py (a plugin
        builds from app.state.load_scan; OSS exposes no report helpers).
