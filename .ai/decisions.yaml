# .ai/decisions.yaml
# Architectural Decision Records (ADRs) in queryable format
# AICaC Specification v1.0

version: "1.0"

decisions:

  - id: ADR-001
    title: "Composite actions as primary architecture"
    date: "2024-11-15"
    status: accepted

    context: |
      GitHub Enterprise Server doesn't support cross-repository workflow_call
      for reusable workflows. Composite actions are self-contained and work
      on any GHES with github.com access.

    decision: "Use composite actions as the primary architecture. Maintain reusable workflows as thin backwards-compatible wrappers."

    alternatives_considered:
      - name: "Reusable workflows only"
        rejected_because: "Excludes GHES users without github.com access"

      - name: "External CI tool (Jenkins, Dagger)"
        rejected_because: "Adds external dependency, less GitHub-native"

    consequences:
      positive:
        - "Supports both github.com and GHES"
        - "Self-contained actions with bundled scripts"
        - "Easier to compose and test"
        - "No cross-repo workflow call overhead"
      negative:
        - "Reusable workflow wrappers add maintenance burden"
        - "More boilerplate for github.com users vs single workflow call"

    implementation: |
      Primary: .github/actions/
      Backwards compat: .github/workflows/

  - id: ADR-002
    title: "SARIF as universal output format"
    date: "2024-11-20"
    status: accepted

    context: |
      Each security scanner has its own output format (JSON, text, XML).
      GitHub Security tab requires SARIF format for integration.

    decision: "Convert all scanner outputs to SARIF format"

    alternatives_considered:
      - name: "Keep native formats"
        rejected_because: "No unified severity thresholds, no GitHub Security integration"

      - name: "Custom unified format"
        rejected_because: "Not GitHub-native, requires custom tooling"

    consequences:
      positive:
        - "Unified severity thresholds across scanners"
        - "GitHub Security tab integration"
        - "PR annotations for findings"
        - "Industry standard, tooling ecosystem exists"
      negative:
        - "Some scanner-specific nuances lost in translation"
        - "Requires parse scripts for each scanner"

    implementation: "Each scanner has scripts/parse-results.py that outputs SARIF-compatible JSON"

  - id: ADR-003
    title: "Bash scripts for parsing over Node.js/Python"
    date: "2024-12-01"
    status: superseded

    context: |
      Parse scripts run inside GitHub Actions. Need to convert scanner
      output to structured JSON quickly and reliably.

    decision: "Use bash + jq/yq for parsing scripts"

    alternatives_considered:
      - name: "Node.js scripts"
        rejected_because: "Requires npm install step, slower action startup"

      - name: "Python scripts"
        rejected_because: "Requires Python setup, heavier runtime"

      - name: "Go binaries"
        rejected_because: "Compilation step, harder to debug"

    consequences:
      positive:
        - "No runtime dependencies to install"
        - "Fast action execution"
        - "jq/yq commonly available in GitHub runners"
        - "Easy to debug (view script inline)"
      negative:
        - "Less maintainable than typed languages"
        - "Limited testing frameworks for bash"
        - "Complex string manipulation harder"

    implementation: ".github/actions/*/scripts/parse-results.py"

  - id: ADR-004
    title: "Co-located tests with actions"
    date: "2024-12-05"
    status: accepted

    context: |
      Each composite action needs tests. Question: where should tests live?

    decision: "Tests live in .github/actions/*/tests/ alongside the action"

    alternatives_considered:
      - name: "Centralized tests/ directory"
        rejected_because: "Tests divorced from code they test, harder to maintain"

      - name: "Separate test repository"
        rejected_because: "Even more divorced, harder to keep in sync"

    consequences:
      positive:
        - "Tests next to code they test"
        - "Easy to see test coverage at a glance"
        - "Natural to update tests when changing action"
        - "Self-contained actions (action + tests together)"
      negative:
        - "Larger action directories"
        - "Must traverse multiple directories to run all tests"

    implementation: ".github/actions/scanner-*/tests/"

  - id: ADR-005
    title: "Single version.yaml as source of truth"
    date: "2024-12-10"
    status: accepted

    context: |
      Version number appears in 20+ files: README, examples, action references,
      CONTRIBUTING docs, etc. Keeping them in sync is error-prone.

    decision: "Use version.yaml as single source, release-it updates all references"

    alternatives_considered:
      - name: "Manual version updates"
        rejected_because: "Error-prone, easy to miss files"

      - name: "Git tags only"
        rejected_because: "Docs still need hardcoded versions for examples"

    consequences:
      positive:
        - "Single place to check/update version"
        - "Automated consistency across all files"
        - "release-it handles version bumping"
      negative:
        - "Requires release-it configuration maintenance"
        - "Must remember to use release-it (not manual git tag)"

    implementation: |
      version.yaml - source of truth
      .release-it.json - configuration for version replacement patterns

  - id: ADR-006
    title: "Matrix strategy for parallel scanner execution"
    date: "2024-11-25"
    status: accepted

    context: |
      Running 10+ scanners sequentially is slow. GitHub Actions supports
      matrix strategy for parallel job execution.

    decision: "Use matrix strategy to run scanners in parallel"

    alternatives_considered:
      - name: "Sequential execution"
        rejected_because: "Too slow (30+ minutes vs 5-10 minutes)"

      - name: "Single job with all scanners"
        rejected_because: "No parallelism, harder to isolate failures"

    consequences:
      positive:
        - "Much faster execution (parallel)"
        - "Each scanner isolated (failures don't cascade)"
        - "Easy to add/remove scanners from matrix"
      negative:
        - "More complex workflow syntax"
        - "Matrix job limit (256) could be hit with many containers"

    implementation: |
      strategy:
        matrix:
          scanner: [codeql, bandit, gitleaks, ...]
        fail-fast: false

  - id: ADR-007
    title: "Severity-based failure thresholds"
    date: "2024-12-15"
    status: accepted

    context: |
      Different branches need different failure criteria. Main branch should
      fail on critical findings, dev branches might allow medium severity.

    decision: "Implement fail_on_severity input with levels: critical/high/medium/low/none"

    alternatives_considered:
      - name: "Always fail on any finding"
        rejected_because: "Too strict for development branches"

      - name: "Never fail (report only)"
        rejected_because: "Defeats purpose of security scanning"

      - name: "Branch-specific defaults"
        rejected_because: "User should control, not us"

    consequences:
      positive:
        - "User controls failure behavior"
        - "Supports different policies for different branches"
        - "Can run report-only scans (fail_on_severity: none)"
      negative:
        - "Users might set too lenient thresholds"

    implementation: |
      inputs:
        fail_on_severity:
          description: 'Minimum severity to fail workflow'
          default: 'high'
          type: choice
          options: [critical, high, medium, low, none]

  - id: ADR-008
    title: "Flexible PR commenting: standalone vs aggregated"
    date: "2026-02-05"
    status: accepted

    context: |
      Scanner actions can be used individually or via reusable workflows.
      Individual usage benefits from scanner-specific PR comments.
      Multiple scanners benefit from single aggregated PR comment.
      Need to support both patterns without PR comment spam.

    decision: |
      All scanner composite actions include comment-pr step with post_pr_comment
      input defaulting to false. Reusable workflows set post_pr_comment: false
      for all scanners, only security-summary job posts comprehensive comment.

    alternatives_considered:
      - name: "Always post individual comments"
        rejected_because: "Spams PRs with 10+ comments when using reusable workflow"

      - name: "Never post individual comments"
        rejected_because: "Poor UX when using scanners individually"

      - name: "Remove comment logic from actions entirely"
        rejected_because: "Forces users to implement their own PR commenting"

    consequences:
      positive:
        - "Standalone scanners can post focused PR comments"
        - "Reusable workflows produce single comprehensive comment"
        - "Users control behavior via post_pr_comment input"
        - "No PR comment spam from multiple scanners"
      negative:
        - "Requires post_pr_comment input on all scanner actions"
        - "Must document when to use true vs false"

    implementation: |
      Scanner actions (.github/actions/scanner-*/action.yml):
        inputs:
          post_pr_comment:
            default: 'false'
        steps:
          - name: Comment PR
            if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
            uses: ./.github/actions/comment-pr

      Reusable workflow (.github/workflows/reusable-security-hardening.yml):
        scanner-codeql:
          with:
            post_pr_comment: false  # All scanners set to false
        scanner-opengrep:
          with:
            post_pr_comment: false
        # ... all other scanners with post_pr_comment: false

        security-summary:
          steps:
            - name: Comment PR with security summary
              uses: actions/github-script@v8  # Only job that posts PR comment

    usage_examples:
      standalone: |
        # Individual scanner posts its own PR comment
        - uses: huntridge-labs/argus/.github/actions/scanner-bandit@0.7.2
          with:
            post_pr_comment: true

      reusable: |
        # Only security-summary posts comprehensive comment
        uses: huntridge-labs/argus/.github/workflows/reusable-security-hardening.yml@0.7.2
        with:
          scanners: all
          post_pr_comment: true  # Controls security-summary, not individual scanners

  - id: ADR-009
    title: "Consolidate scripts and tests to Python"
    date: "2026-02-08"
    status: accepted

    context: |
      Project maintained three languages for action scripts (Bash, JavaScript, Python)
      plus Ruby for Bash coverage via bashcov/SimpleCov. This fragmentation created:
      - Three test frameworks with different patterns
      - Three coverage tools with incompatible reporting
      - Higher contributor barrier (must learn multiple languages)
      - Harder to maintain and refactor code
      - CI complexity (multiple setup/teardown steps)

    decision: "Migrate all action scripts and tests to Python with pytest"

    alternatives_considered:
      - name: "Keep multi-language approach"
        rejected_because: "Undermines trust in coverage metrics and raises contributor barrier"

      - name: "Migrate only to Bash"
        rejected_because: "Bash lacks type safety, harder to test complex logic"

      - name: "Migrate only to JavaScript"
        rejected_because: "Adds Node.js dependency; Python already used for some actions"

    consequences:
      positive:
        - "Single test framework (pytest) with consistent patterns"
        - "One coverage tool (pytest-cov) producing unified metrics"
        - "Lower contributor barrier (Python widely known, standard on CI runners)"
        - "Better readability (200-line Bash becomes ~80 lines Python)"
        - "Simplified CI/CD (no Ruby, no Node.js for tests)"
        - "Eliminated duplicate script pairs (container/container-summary, zap/zap-summary)"
        - "Shared utility modules (sarif.py, summary.py, severity.py)"
      negative:
        - "Initial migration effort across 18 scripts + 15 test files"
        - "Python 3.11+ runtime requirement (but pre-installed on ubuntu-latest)"

    implementation: |
      All action scripts and tests are Python with pytest.
      Coverage enforced at 80% via pytest-cov.
      Node.js remains only for release tooling (release-it, commitlint, husky).

    supersedes: "ADR-003 (Bash for scripts with no runtime dependencies)"

    note: |
      Python is now the lingua franca for action scripts and tests.
      Node.js remains for release tooling (release-it, commitlint, husky) which is
      appropriate as those are developer workflow tools, not pipeline logic.

  - id: ADR-010
    title: "Hybrid rule-based + AI classification for FedRAMP SCN detection"
    date: "2026-02-21"
    status: accepted

    context: |
      FedRAMP 20X requires classifying IaC changes into SCN categories (Routine,
      Adaptive, Transformative, Impact). Some changes map cleanly to rules (e.g.,
      tag changes are always Routine), but many are ambiguous and require judgment.
      The project also has an air-gap constraint — some environments cannot make
      external API calls.

    decision: |
      Use a hybrid classification approach:
      1. Rule-based pattern matching first (deterministic, fast, air-gap safe)
      2. AI fallback via Claude Haiku for ambiguous cases (optional, requires API key)
      3. MANUAL_REVIEW category when neither method can classify with confidence

    alternatives_considered:
      - name: "Rules only"
        rejected_because: "Cannot handle novel resource types or complex attribute interactions"

      - name: "AI only"
        rejected_because: "Violates air-gap constraint, adds latency and cost to every classification"

      - name: "ML model trained on FedRAMP data"
        rejected_because: "Insufficient training data, high maintenance burden, still needs API"

    consequences:
      positive:
        - "Works fully offline with rule-based classification"
        - "AI improves accuracy for ambiguous cases when available"
        - "Graceful degradation — MANUAL_REVIEW instead of wrong classification"
        - "Configurable confidence threshold prevents low-confidence AI results"
        - "Audit trail records which method was used per classification"
      negative:
        - "AI fallback requires Anthropic API key and network access"
        - "Rule maintenance burden grows with supported IaC providers"
        - "Two code paths to test and maintain"

    implementation: |
      .github/actions/scn-detector/scripts/classify_changes.py:
        - ChangeClassifier.classify_with_rules() — pattern matching
        - ChangeClassifier.classify_with_ai() — multi-provider AI fallback
        - classify_change() orchestrates: rules first, AI if unmatched
      Provider abstraction in ai_providers.py (see ADR-011)
      Each provider SDK is optional (try/except ImportError)
      requests library used as HTTP fallback when SDK unavailable

  - id: ADR-011
    title: "Multi-provider AI abstraction for SCN classifier"
    date: "2026-02-21"
    status: accepted

    context: |
      ADR-010 established hybrid rule-based + AI classification but hardcoded
      the AI provider to Anthropic Claude Haiku. Users need to:
      1. Choose their preferred AI model (e.g., claude-3-5-sonnet, gpt-4o-mini)
      2. Choose their preferred provider (Anthropic or OpenAI)
      3. Use OpenAI-compatible APIs (Azure OpenAI, Ollama, vLLM) via custom base URLs
      The classifier was tightly coupled to Anthropic's API format, SDK, and env vars.

    decision: |
      Add a lightweight provider abstraction layer in ai_providers.py with:
      1. Registry pattern (PROVIDERS dict) mapping provider names to classes
      2. Factory function (create_provider) for instantiation
      3. Each provider implements call(prompt) → str with SDK-first + HTTP fallback
      4. Provider-aware API key resolution (resolve_api_key)
      5. Config-driven via ai_fallback.provider field in scn-config.yml

    alternatives_considered:
      - name: "Abstract base class hierarchy"
        rejected_because: "Over-engineered for two providers; registry pattern is simpler"

      - name: "LiteLLM or similar library"
        rejected_because: "Adds external dependency; violates air-gap constraint for offline use"

      - name: "OpenAI-compatible only (both providers use OpenAI format)"
        rejected_because: "Anthropic API format differs significantly; would require Anthropic proxy"

    consequences:
      positive:
        - "Users can choose Anthropic or OpenAI models via config"
        - "Custom base URL enables Azure OpenAI, Ollama, vLLM support"
        - "Backward compatible — missing provider field defaults to anthropic"
        - "ai_classifier.py simplified (183 → 130 lines) by extracting API plumbing"
        - "Easy to add new providers (implement call/ENV_VAR/DEFAULT_BASE_URL)"
      negative:
        - "One additional Python file (ai_providers.py, ~175 lines)"
        - "Two SDKs to conditionally install (anthropic, openai)"

    implementation: |
      New file: .github/actions/scn-detector/scripts/ai_providers.py
        - AnthropicProvider: SDK + HTTP, x-api-key header, /v1/messages endpoint
        - OpenAIProvider: SDK + HTTP, Bearer token, /v1/chat/completions endpoint
        - PROVIDERS registry, create_provider factory, resolve_api_key helper

      Modified: ai_classifier.py
        - Uses create_provider() instead of direct Anthropic calls
        - Provider-agnostic: self.provider.call(prompt)

      Modified: classify_changes.py
        - Dynamic API key resolution per provider
        - Provider-specific env var in warning messages

      Modified: action.yml
        - Installs openai SDK when OPENAI_API_KEY is set
        - Passes both API keys to classify step

      Config: scn-config.yml ai_fallback section
        provider: "anthropic" | "openai"
        model: "<provider-specific model name>"
        api_base_url: "<optional custom endpoint>"

    supersedes: "Refines ADR-010 (which assumed Anthropic-only)"

  - id: ADR-012
    title: "Dual dependency scanning: OSV-Scanner + dependency-review-action"
    date: "2026-03-11"
    status: accepted

    context: |
      Argus lacked source-code dependency vulnerability scanning. Container-level
      scanning (Trivy/Grype/Syft) catches OS package vulnerabilities but misses
      application dependency vulnerabilities in lockfiles (npm, pip, cargo, etc.).
      Supply chain attacks increasingly target application dependencies.

    decision: |
      Add two complementary dependency scanners mirroring the Trivy/Grype dual-scanner
      pattern for containers:
      1. scanner-osv: Google OSV-Scanner binary — any trigger, GHES-compatible,
         scans lockfiles against the OSV database
      2. scanner-dependency-review: GitHub's dependency-review-action — PR-only,
         compares dependency diffs, supports license compliance checking

    alternatives_considered:
      - name: "OSV-Scanner only"
        rejected_because: "Misses PR diff context and license compliance checking"

      - name: "dependency-review-action only"
        rejected_because: "PR-only limitation; no scheduled or push-triggered scanning"

      - name: "Snyk or commercial tool"
        rejected_because: "Adds external dependency; violates air-gap constraint"

      - name: "npm audit / pip-audit per-ecosystem"
        rejected_because: "Fragmented; would need separate actions per ecosystem"

    consequences:
      positive:
        - "Complete dependency vulnerability coverage (any trigger + PR diff)"
        - "License compliance checking via dependency-review-action"
        - "GHES-compatible via OSV binary install (no marketplace dependency)"
        - "Zero changes to security-summary (artifact-driven aggregation)"
        - "Mirrors proven Trivy/Grype dual-scanner pattern"
      negative:
        - "Two scanners to maintain for dependency category"
        - "dependency-review-action limited to PR events only"

    implementation: |
      New actions:
        .github/actions/scanner-osv/
        .github/actions/scanner-dependency-review/

      Both follow established patterns (ADR-009 Python scripts, ADR-007 severity
      thresholds, ADR-008 flexible PR commenting). scanner-dependency-review
      emits a warning annotation and zero-count summary on non-PR events for
      graceful degradation.

  - id: ADR-013
    title: "Python SDK + CLI + thin CI adapters for cross-platform portability"
    date: "2026-04-11"
    status: accepted
    accepted_date: "2026-04-15"
    note: "Phases 1-2 shipped as the argus SDK; Phase 3 thin-composite migration is the active integration target. See docs/developer/SDK-ROADMAP.md."

    context: |
      Argus is tightly coupled to GitHub Actions. All 31 composite actions use
      GitHub-specific features: $GITHUB_OUTPUT, $GITHUB_STEP_SUMMARY,
      actions/upload-artifact, actions/github-script (PR comments),
      github/codeql-action/upload-sarif, and github.* context variables.
      This limits Argus to GitHub Actions only. Users want to run the same
      security scanning pipeline in GitLab CI, Jenkins, Azure DevOps, and
      locally on developer machines.

      Analysis reveals that ~90% of scanner logic (tool installation, execution,
      result parsing, severity counting) is already portable. Only the reporting
      phase (Phase 4: artifacts, PR comments, step summaries, SARIF upload) is
      GitHub-coupled. The existing Python parsers have zero GitHub dependencies.

    decision: |
      Adopt a layered architecture with four components:
      1. Argus Core SDK (argus/core/) — Scanner protocol, result models, engine,
         config loading. Pure Python, zero CI dependencies.
      2. Scanner Modules (argus/scanners/) — One Python file per scanner
         implementing the Scanner protocol. Reuses existing parse_*.py logic.
      3. Reporters (argus/reporters/) — Output plugins per platform: terminal,
         markdown, SARIF, JSON, GitHub, GitLab, JUnit.
      4. CI Adapters — Thin wrappers: GitHub composite actions call
         `argus scan` + `argus report github`; GitLab CI templates call
         `argus scan` + `argus report gitlab`; CLI for local/Jenkins.

      Migration is incremental over 4 phases:
        Phase 1: Core SDK + CLI + 2-3 proof-of-concept scanners (no existing changes)
        Phase 2: Port remaining scanners, build GitHub reporter
        Phase 3: Simplify composite actions to thin wrappers (backward compatible)
        Phase 4: Add GitLab/Jenkins reporters, publish to PyPI

    alternatives_considered:
      - name: "Dagger.io portable pipelines"
        rejected_because: "Heavy external dependency; ADR-001 rejected external CI tools"

      - name: "Docker-per-scanner containerization"
        rejected_because: "Docker not available in air-gapped GHES; massive images; slow"

      - name: "Monolithic CLI bundling everything"
        rejected_because: "Violates scalability requirement; tribal knowledge to modify"

      - name: "Rewrite in Go/Rust"
        rejected_because: "Abandons Python investment (ADR-009); less accessible to contributors"

    consequences:
      positive:
        - "Runs anywhere Python runs (GitHub, GitLab, Jenkins, local, Azure DevOps)"
        - "Adding a scanner = one Python file implementing Scanner protocol"
        - "Removing a scanner = delete file or set enabled: false in config"
        - "Existing GitHub Actions users unaffected until Phase 3"
        - "Phase 3 composite actions shrink from ~300 lines to ~15 lines"
        - "Consistent with ADR-009 (Python standardization)"
        - "argus.yml provides single configuration file for all environments"
      negative:
        - "Significant initial investment to build core SDK and CLI"
        - "Two systems coexist during migration (legacy actions + SDK)"
        - "Package distribution adds complexity (pip install, PyPI)"
        - "Some scanners are inherently GitHub-only (dependency-review)"

    implementation: |
      See docs/developer/portability-research.md for full architecture details,
      package structure, migration phases, and risk mitigations.

  - id: ADR-014
    title: "Docker execution backend for portable scanner execution"
    date: "2026-04-11"
    status: accepted

    context: |
      The argus SDK (ADR-013) decouples scanning logic from GitHub Actions,
      but users still need 10+ scanner tools installed to run all scanners.
      Installing trivy, grype, gitleaks, clamav, checkov, etc. on a developer
      laptop is impractical. The SDK needs a way to run scanners without
      requiring local tool installation.

    decision: |
      Add a Docker execution backend to ArgusEngine:
      1. Each scanner declares its official container image (author-published)
      2. Engine checks is_available() first (local tool), falls back to
         docker run with volume mounts if tool not installed
      3. Parsing always runs on host (SDK parses JSON/SARIF output from container)
      4. Prefer official tool author images (aquasec/trivy, anchore/grype, etc.)
      5. Only build custom images when no official image exists (bandit, opengrep,
         supply-chain combined)
      6. Publish all-in-one image for CI convenience
      7. Container image versions managed via Dependabot docker ecosystem

    alternatives_considered:
      - name: "Single fat Docker image only"
        rejected_because: "2GB+ image, slow to pull, hard to update individual tools"

      - name: "Build custom images for every scanner"
        rejected_because: "Unnecessary maintenance when official images exist"

      - name: "Nix flakes for reproducible environments"
        rejected_because: "Nix adoption barrier too high for most users"

      - name: "Install tools on demand (auto pip/curl)"
        rejected_because: "Modifies host machine, permission issues, not reproducible"

    consequences:
      positive:
        - "Users run argus scan with zero tool installation (just Docker)"
        - "Official images get security updates from tool authors"
        - "Local tools preferred when available (fastest path)"
        - "Air-gapped support via private registry + pull_policy: never"
        - "Dependabot maintains container image versions automatically"
      negative:
        - "Requires Docker/Podman for container backend"
        - "Container execution adds startup overhead vs local tools"
        - "3 custom Dockerfiles to maintain (bandit, opengrep, supply-chain)"

    implementation: |
      argus/core/engine.py: _run_in_container() method with docker run
      argus/core/config.py: ExecutionConfig (backend, registry, pull_policy)
      argus/scanners/*.py: container_image property on each scanner
      argus/containers.py: Central image manifest for version tracking
      docker/: Dockerfiles for custom images (bandit, opengrep, supply-chain, cli)
      .github/dependabot.yml: docker ecosystem for Dockerfile base images

  - id: ADR-015
    title: "Agentic substrate: CLI + MCP server + skill as complementary layers"
    date: "2026-04-12"
    status: accepted
    accepted_date: "2026-04-20"
    note: "argus mcp ships in 0.7.x; the slim skill at .agents/skills/argus-scanner-selection/ is published. PR #102 added the unified security_review MCP tool and cache-freshness signals."

    context: |
      AI coding assistants (Claude Code, Cursor, Windsurf, VS Code Copilot) are
      increasingly used to drive developer workflows. Argus has a CLI and a
      curated skill file at .agents/skills/argus-scanner-selection/. The industry
      is converging on a three-layer pattern for AI-ready products:

      1. CLI — universal fallback for humans, CI, and environments without AI
      2. MCP server — structured execution layer with typed tools and JSON responses
      3. Skill — lightweight routing layer that tells the agent when and how to
         use the product, without eagerly loading tool schemas into context

      Our initial analysis (April 2026) framed MCP as a replacement for skills,
      based on valid concerns: skill files copied into projects go stale, there
      was no universal format, and the skill duplicated logic from the engine.

      External feedback and industry observation corrected this framing. The three
      layers serve different purposes and have different context costs:
      - MCP tool definitions are eagerly loaded into every conversation, consuming
        token budget even when the user isn't doing security scanning.
      - A skill acts as a deferred-loading gatekeeper: it tells the agent "reach
        for the Argus MCP when security scanning is relevant" without loading the
        full tool schema upfront.
      - The staleness concern dissolves when the skill is a strategy/routing layer
        rather than an implementation reference. A skill that says "use Argus for
        security scanning, prefer MCP tools when available" rarely changes because
        it describes purpose, not API surface.

      Companies across the developer tooling space are shipping all three layers.
      Skill registries like skills.sh are emerging as distribution channels.

    decision: |
      Ship all three layers as the Argus "agentic substrate":

      1. CLI (existing): `argus scan`, `argus validate`, `argus init` — already done.
      2. MCP server (new): `argus mcp` exposes typed tools (argus_scan, argus_detect,
         argus_validate, argus_list_scanners, argus_init) returning structured JSON,
         plus resources (argus://config, argus://results/latest).
      3. Skill (refactor): slim the existing 300-line skill to a routing/strategy
         layer. Move scanner selection logic and CLI syntax details into MCP tool
         descriptions. Publish to skills.sh for discovery.

      The skill tells the agent when to invoke Argus and what it's good for.
      The MCP server handles structured execution. The CLI is the universal fallback.

    alternatives_considered:
      - name: "MCP only, deprecate skill"
        rejected_because: |
          MCP tool definitions eagerly load into context, consuming tokens in every
          conversation. Without a skill as a routing layer, the agent has no
          lightweight signal for when to reach for Argus. The skill provides
          deferred loading — tool schemas enter context only when needed.

      - name: "Skill only, no MCP"
        rejected_because: |
          The AI shells out to the CLI and parses unstructured terminal output,
          losing structured information. The skill must duplicate implementation
          details (CLI flags, output formats, scanner selection rules) that go
          stale independently of the engine.

      - name: "CLI only, no AI integration"
        rejected_because: |
          Leaves AI assistants to discover Argus capabilities through help text
          and trial-and-error. No structured data exchange. Misses the growing
          segment of developers who work primarily through AI assistants.

      - name: "Generate tool-specific files for each AI tool"
        rejected_because: |
          As OSS, Argus should not favor one tool vendor over another.
          Maintaining N tool-specific formats is unsustainable. MCP and skills
          are tool-agnostic standards.

    consequences:
      positive:
        - "Complete agentic coverage — routing (skill), execution (MCP), fallback (CLI)"
        - "Deferred loading — MCP tools only enter context when the skill triggers them"
        - "Structured data — AI receives typed JSON via MCP, not parsed terminal output"
        - "Auto-updating — MCP tools ship with pip install --upgrade"
        - "Stable skill — routing layer rarely changes, minimal staleness risk"
        - "Tool-agnostic — MCP and skills work across Claude Code, Cursor, Windsurf, VS Code"
        - "Discoverable — skills.sh for routing layer, MCP auto-discovery for tools"
      negative:
        - "Three integration surfaces to maintain (though skill is minimal, CLI exists)"
        - "Adds MCP Python SDK as optional dependency"
        - "Skill distribution still maturing (skills.sh is early)"
        - "Scanner dependency story unchanged — tools still need local bins or Docker"

    implementation: |
      Phase 5 in SDK-ROADMAP.md covers both MCP and skill refactor:

      MCP server:
        argus/mcp.py — MCP server module (stdio transport)
        argus mcp — CLI subcommand to start the server
        Optional dependency: pip install argus-security[mcp]

      Skill refactor:
        Slim .agents/skills/argus-scanner-selection/SKILL.md to routing/strategy
        Move implementation details into MCP tool descriptions
        Publish to skills.sh

      Depends on Phase 3 (portability) for maximum scanner coverage without Docker.

  - id: ADR-016
    title: "Wrappers must surface scanner failures, not silently report 0 findings"
    date: "2026-04-19"
    status: accepted

    context: |
      Pre-0.7.2 the `reusable-security-hardening` workflow's summary job and
      the `security-summary` composite both derived an "Overall Security Score"
      by counting SARIF findings across downloaded artifacts. This rollup
      could not distinguish between:
        (a) Scanner ran cleanly and found zero issues.
        (b) Scanner failed to execute, crashed, or produced no artifact.

      The medsecops-golden-path demo surfaced both cases in rapid succession
      during the initial SDK integration — see the post-mortem conversation
      in the golden-path repo. Each bug ended the same way: the aggregator
      reported "✅ Excellent! No security issues detected" while a scanner
      job had actually crashed or been skipped by configuration. A pipeline
      that cannot distinguish success from failure cannot be trusted to gate
      merges, which contradicts CLAUDE.md's core principle 4: "Trust is
      everything."

      Secondary issues the refactor addresses:
      - 17 per-pattern `actions/download-artifact` steps in the reusable
        workflow, one per scanner artifact naming convention, with
        `continue-on-error: true` — any one silently fails without signal.
      - `allow_failure: true` as the default: the reusable workflow ships
        in "informational-only" mode, so a passing CI gate says nothing
        about actual scan outcomes.
      - `<details>` wrapping: container-scan summaries ship pre-wrapped in
        a disclosure; the rollup wrapped them again, forcing reviewers to
        click twice to see findings.
      - Composites installed only `pip install pyyaml`, assuming argus-security
        was on PYTHONPATH via side effects. A consumer pulling the composite
        via `uses: huntridge-labs/argus/.github/actions/scanner-*@X` had no
        reliable way to get the SDK installed.

    decision: |
      The security-summary composite is now the single aggregation surface.
      Its contract:
        1. Accepts an optional `scan_statuses` JSON input mapping scanner
           name -> job result (success|failure|cancelled|skipped).
        2. Renders a per-scanner pass/fail/skipped table at the top of the
           report when `scan_statuses` is provided.
        3. Exits non-zero by default when any scanner in `scan_statuses`
           did not succeed, regardless of whether that scanner produced
           a summary artifact. This is the defense against silent failure.
        4. Normalizes summaries pre-wrapped in a single outer `<details>`
           block by replacing the wrapper with a heading, eliminating the
           two-click UX.

      The reusable-security-hardening workflow:
        1. Replaces its inline summary job with a single delegation to the
           security-summary composite, passing `needs.*.result` for every
           scanner as `scan_statuses`.
        2. Drops all 17 per-pattern raw-artifact downloads; the composite's
           single `scanner-summary-*` download is authoritative.
        3. Flips the default `allow_failure` from `true` to `false`. Users
           who want informational runs opt in explicitly.

      Composite-action changes:
        1. `scanner-container` and `scanner-zap` pin an explicit
           `pip install 'argus-security>=0.7.2'` — the floor version that
           contains the SDK fixes for socket mount, ZAP pre-pull, and
           loud RuntimeError on scanner infra failures.
        2. `scanner-container` uploads with `if-no-files-found: warn`
           instead of `ignore`.

    alternatives_considered:
      - name: "Continue counting SARIF findings, just add a warning when downloads fail"
        rejected_because: |
          Doesn't solve the core issue: a crashed scanner with a valid-but-empty
          SARIF looks identical to a clean scan. The verdict has to come from
          job results, not finding counts.

      - name: "Have each scanner composite emit its own block of PR comment"
        rejected_because: |
          PR comment spam — exactly the anti-pattern ADR-008 (post_pr_comment
          pattern) was written to avoid. A single consolidated comment is
          the established convention.

      - name: "Keep `allow_failure: true` as default, add `strict: true` opt-in"
        rejected_because: |
          Asymmetric defaults bias consumers toward silent success. Given the
          silent-failure bugs this refactor fixes, the safe default must be
          the loud one; informational mode is the opt-in.

    consequences:
      positive:
        - "Scanner crashes and configuration errors are visible in a single glance"
        - "Pre-refactor false-green runs cannot silently pass post-refactor"
        - "Reusable workflow is ~30% smaller (1162 -> 811 lines) and easier to audit"
        - "Composites explicitly install argus-security, ending reliance on PYTHONPATH side effects"
        - "New integration tests (24 cases) cover the silent-failure paths that previously shipped untested"
      negative:
        - "BREAKING: consumers of reusable-security-hardening who relied on the default informational-only behavior must pass `allow_failure: true` explicitly"
        - "BREAKING: consumers of security-summary who want the composite to exit 0 regardless of scanner status must pass `fail_on_scanner_failure: 'false'`"
        - "Composite action download requires one extra HTTP request per consumer run (checkout of argus repo for the aggregator step); amortized across parallel scanner jobs it is negligible"

    implementation: |
      Composite action:
        .github/actions/security-summary/action.yml
        .github/actions/security-summary/scripts/generate_summary.py
      Reusable workflow:
        .github/workflows/reusable-security-hardening.yml
      Pinned composites:
        .github/actions/scanner-container/action.yml
        .github/actions/scanner-zap/action.yml
      Tests:
        tests/integration/test_security_summary.py  (24 test cases)

    usage_examples:
      silent_failure_guard: |
        # In a reusable pipeline, every scanner's needs.*.result becomes a
        # row in the aggregator's status table. A crashed scanner with no
        # summary shows up as ❌ and the job exits non-zero.
        security-summary:
          needs: [scanner-codeql, scanner-opengrep, scanner-container, scanner-zap]
          if: always()
          steps:
            - uses: huntridge-labs/argus/.github/actions/security-summary@0.7.2
              with:
                scan_statuses: |
                  {
                    "codeql":    "${{ needs.scanner-codeql.result }}",
                    "opengrep":  "${{ needs.scanner-opengrep.result }}",
                    "container": "${{ needs.scanner-container.result }}",
                    "zap":       "${{ needs.scanner-zap.result }}"
                  }

      informational_mode: |
        # Opt-out of blocking on scanner failures (e.g., for a canary report):
        security-summary:
          steps:
            - uses: huntridge-labs/argus/.github/actions/security-summary@0.7.2
              with:
                fail_on_scanner_failure: 'false'
                scan_statuses: '{"...": "..."}'

  - id: ADR-017
    title: "argus view browser — localhost-only SDK-bundled web UI, separate from argus-portal"
    status: accepted
    date: 2026-04-24
    context: |
      Owners, managers, and executives want at-a-glance insight into their
      product's security posture without digging through CI logs, PR
      comments, or learning a terminal UI. argus-portal (separate repo)
      sketches a FedRAMP-oriented enterprise dashboard, but productionizing
      it requires significant work: SARIF ingest endpoints, GitHub OAuth +
      RBAC, MFA, audit trails, Postgres operational burden, Kubernetes
      deployment. That is months of scope for the "I just want to look at
      one argus-results.json" need.
    decision: |
      Ship argus view browser as a lightweight read-only web UI bundled with the
      argus SDK as the ``[serve]`` optional extra. Bound to 127.0.0.1
      only, single-user, single-scan scope. Deliberately NOT a replacement
      for argus-portal — the portal stays on its own track aimed at
      enterprise multi-team compliance orgs.

      Technical stakes:
        - FastAPI + Jinja2 + vanilla JS (no React or Next.js toolchain,
          no bundler, no CDN dependencies).
        - Reuses argus.core.findings_view (ViewState, compute_summary,
          etc.) — same filter, sort, and summary logic as the TUI. One
          source of truth for "high severity" and "this CVE matches."
        - Four routes: ``/`` executive dashboard, ``/findings``
          filterable table, ``/picker`` one-level file browser,
          ``/healthz`` liveness.
        - CSP + clickjacking headers on every response; Jinja2 autoescape;
          no cookies, no sessions, no mutations, so no CSRF handling.
        - Picker is explicitly one-level-at-a-time — no recursive walks.

      Non-goals (tracked as future roadmap items):
        - Live reload on results-file changes.
        - Scan-over-scan diff.
        - JSON API endpoints (external tools can read argus-results.json
          directly today).
        - ``--bind`` or ``--basic-auth`` — multi-user network exposure is
          argus-portal's territory.
    rationale: |
      Reuses all the groundwork already shipped for argus view terminal — the
      findings_view module was explicitly built to serve both front-ends.
      Going localhost-only dodges the biggest sources of complexity
      (auth, sessions, CSRF, multi-user state) while still delivering the
      actual user need: non-engineer stakeholders can open a browser and
      see their findings. If argus-portal matures separately, it can
      consume the same findings_view module to keep per-finding display
      consistent across CLI, local web, and enterprise web — no rewrite
      needed.
    consequences:
      positive:
        - "Executive-level stakeholders get a first-class surface without the argus-portal operational burden"
        - "TUI and web view cannot drift — filter and summary logic is centralized in argus.core.findings_view"
        - "Localhost-only default removes an entire class of auth, session, and transport-security footguns"
        - "No CDN dependencies means argus view browser works offline, on airgapped networks, and in restricted corporate environments"
      negative:
        - "Users who want a team-visible deployment must set up their own reverse proxy or run argus-portal — documented as an explicit scope choice, not a bug"
        - "Secret redaction is not serve-specific; if a finding description contains credentials from a stack trace, they appear in the CLI, TUI, JSON export, and the web UI. Will be tackled globally when the need arises"
    related:
      - ADR-013  # Python SDK as primary interface
      - ADR-016  # silent-failure gating (serve inherits the same resilience posture)

  - id: ADR-018
    title: "Canonical argus-results.json + container/<name> ScanResult naming + raw output preservation"
    status: accepted
    date: 2026-05-05
    context: |
      Source-scan and container-scan flows had drifted apart. Source scans
      always wrote a canonical argus-results.json (the JsonReporter
      contract that argus view, argus report, and the MCP server depend
      on). Container scans wrote a domain-shaped container-scan.json with
      per-image counts, container_count, and scanner_errors — a different
      shape that the viewers had no rendering path for. Reported as a
      bug: "argus view doesn't display container vulns."

      Two related gaps:
        1. The argus-results/ directory did not preserve per-scanner raw
           output files (trivy-results.json, grype-results.json,
           syft-sbom.json for containers; results.json / *.sarif /
           stdout.txt for source scans). They lived in a tempdir that was
           wiped at scan end. Users who wanted forensics, audit trails,
           or manual triage had nowhere to look.
        2. Without a normalized scanner-name convention, container
           findings rendered with a generic "container" or per-tool name,
           breaking the viewers' per-scanner filtering and per-image
           grouping.

      All three rooted in the same architectural drift: the container
      flow had grown its own output contract independent of the SDK's
      core ScanSummary model.
    decision: |
      Three coupled changes, shipped in PR #116:

      1. Canonical artifact contract is universal.
         The container flow now builds a canonical ScanSummary alongside
         the existing ContainerScanSummary, and the JsonReporter writes
         argus-results.json unconditionally for both source and container
         scans. The domain-shaped container-scan.json is preserved for
         backward compat with downstream tooling, but argus-results.json
         is the single source of truth that viewers/MCP/external tools
         consume. (PR #111 originally established this for source scans;
         PR #116 extended it to containers.)

      2. Container findings surface as ScanResult rows with scanner names
         of the form `container/<image-name>`. The viewers (terminal +
         browser) and reporters render them through their normal
         per-scanner code path — no container-specific rendering.

      3. Raw scanner output is preserved alongside the canonical artifact
         under <output_dir>/raw/<scanner_or_image>/, configurable via the
         unified reporting.keep_raw key (default true) or --no-keep-raw.
         The container flow uses scan_image(raw_output_dir=...) and the
         source flow uses ArgusEngine.run(raw_output_dir=...). 0-byte
         files are explicitly skipped (they're failure-signal stubs and
         persisting them would mislead readers).
    alternatives_considered:
      - name: "Add container-specific rendering to argus view"
        rejected_because: |
          Doubles the rendering surface and forces viewers to know the
          difference between source and container findings. Re-aligning
          on the canonical model is cheaper and keeps the viewers
          oblivious to scan-flow origin.

      - name: "Drop container-scan.json entirely"
        rejected_because: |
          Existing downstream consumers (security-summary aggregator,
          some user dashboards) parse the per-image stats. Keeping it
          alongside the canonical artifact preserves their integrations
          while letting new consumers depend only on argus-results.json.

      - name: "Persist raw output in scanner tempdirs and require manual copy"
        rejected_because: |
          Tempdirs are wiped at scan end, so this just shifts the burden
          onto users to know about and intercept transient files. The
          opt-in --no-keep-raw flag is the correct posture for tight CI
          environments while keeping the default helpful.
    consequences:
      positive:
        - "argus view, argus report, and the MCP server work uniformly across source and container scans without scan-flow-specific code"
        - "Per-scanner filtering and triage works for container findings via the container/<image> naming convention"
        - "Forensics and manual triage have a stable surface area: <output_dir>/raw/<name>/ regardless of scan flow"
        - "reporting.keep_raw is a single config knob covering both flows; --no-keep-raw is a single CLI flag"
      negative:
        - "Two artifact files for container scans (argus-results.json + container-scan.json) until consumers migrate; documented as transitional"
        - "Disk usage grows by a few MB per scan when raw output is preserved (default on); --no-keep-raw is the documented opt-out for tight CI"
    implementation: |
      Source-scan flow:
        argus/core/engine.py: ArgusEngine.run(raw_output_dir) and _run_in_container() copy result_files to <raw>/<scanner>/
      Container-scan flow:
        argus/container/scanner.py: scan_image(raw_output_dir) copies trivy/grype/syft outputs
        argus/container/engine.py: threads _raw_output_root from config dict to scan_image
      CLI:
        argus/cli.py: --no-keep-raw is a top-level scan flag; both _cmd_source_scan and _cmd_container_scan honor it
      Config:
        argus/core/config.py: ReportingConfig.keep_raw (bool, default True) replaces the container-scoped containers.keep_raw
      Canonical container ScanSummary:
        argus/cli.py::_cmd_container_scan builds ScanResult(scanner=f"container/{name}", findings=combined, metadata={image_ref, build_success, scanner_errors, scan_error}); JSON + SARIF reporters consume it.
      Tests:
        argus/tests/test_engine.py::TestRunInContainer (source raw-output persistence)
        argus/tests/test_container_scanner_runners.py::TestScanImageRawOutputPersistence + TestContainerCanonicalScanSummary
    related:
      - ADR-013  # Python SDK as primary interface
      - ADR-014  # Docker execution backend (the source of the tempdir lifecycle)
      - ADR-016  # Silent-failure gating (this preserves the same loud-on-failure posture in the artifact)
    pr_references:
      - "#111 (canonical argus-results.json contract for source scans)"
      - "#116 (canonical contract for container scans + raw output preservation)"

  - id: ADR-019
    title: "Composite wrappers install Argus SDK from their own checkout, not from PyPI"
    status: accepted
    date: 2026-05-06
    context: |
      Composite action wrappers under .github/actions/scanner-* and
      .github/actions/linter-* call ``argus scan`` internally and need
      the SDK installed in their Python env. Two ways to do that:

      1. ``pip install argus-security==<X>`` — pulls from PyPI, version
         pinned by the action.
      2. ``pip install "${{ github.action_path }}/../../.."`` — installs
         from the composite's own checkout (the runner clones the
         entire repo at the action's ref into ``_actions/<owner>/<repo>/<ref>/``
         when ``uses: org/repo/path@ref`` resolves; ``github.action_path``
         points inside that clone, and ``../../..`` walks back to the
         repo root, which contains ``pyproject.toml`` and the
         ``argus/`` package).

      The choice has knock-on effects across release coordination,
      version pinning, and air-gapped GHES deployments.
    decision: |
      Every SDK-using wrapper installs the Argus SDK from its own
      composite checkout via:

          pip install "${{ github.action_path }}/../../.."

      The legacy ``pip install pyyaml`` pattern (which relied on a
      ``bin/argus`` shim that added the repo root to ``sys.path``)
      is removed; the shim itself is deleted in PR #126.

      Wrappers that don't use the SDK (e.g. scanner-dependency-review,
      scanner-codeql, scanner-syft, *-summary aggregators) are exempt —
      they wrap GitHub-native or non-SDK tooling and don't need the
      SDK in their step env.

      A CI guard (``validate-install-from-source`` in
      .github/workflows/test-actions.yml) rejects any drift back to
      ``pip install pyyaml`` or ``pip install argus-security`` so the
      pattern is non-regressable.
    alternatives_considered:
      - name: "Install from PyPI: pip install argus-security==<X>"
        rejected_because: |
          Couples action releases to PyPI publish: every release
          tag has to wait for the PyPI workflow before the action's
          install line can be bumped. Air-gapped GHES instances
          would need a private PyPI mirror with argus-security and
          all its deps in addition to mirroring the argus repo —
          two distribution channels for the same artifact.
          Consumers pinning ``@main`` would get whatever's latest
          on PyPI (often stale) rather than the matching commit.

      - name: "Bundle the SDK into a single-file PyInstaller binary in the repo"
        rejected_because: |
          Architecture-specific binaries break GHES heterogeneity
          (Linux x86_64 vs ARM64 vs self-hosted Windows runners).
          Updating dependencies requires a new binary rebuild.
          ``pip install <path>`` reuses the runner's existing
          Python and pip — already installed by the wrapper's
          ``setup-python`` step.

      - name: "Make the action a Docker action with the SDK preinstalled in the image"
        rejected_because: |
          Docker actions don't run on Windows or macOS hosted
          runners, and on GHES the registry-pull adds latency and
          another dependency on registry access. Composite
          actions stay portable across all runner OSes.
    consequences:
      - "Action ref @<ref> implicitly pins the SDK to the same ref. No second pin to maintain."
      - "Action releases never block on PyPI publish. Tag the repo, the action consumes it."
      - "Air-gapped GHES setups mirror only the repo. No private PyPI mirror needed (transitive deps still need a Python package source, but that's a runner-level decision the admin already makes)."
      - "Each runner job clones the argus repo once per action ref it uses (deduped if multiple actions share a ref). Cheap — same as any other composite action."
      - "Removes the ``bin/argus`` shim entirely. Pip's ``[project.scripts]`` entry (``argus = \"argus.cli:main\"``) is the canonical CLI launcher for every consumer (composite wrappers, ``pip install argus-security``, ``uvx argus``, dev installs)."
    related:
      - ADR-001  # Composite actions as primary architecture (defends GHES portability)
      - ADR-013  # Python SDK as primary interface
    pr_references:
      - "#91 (initial pattern in scanner-container and scanner-zap)"
      - "#126 (migration of remaining 14 SDK-using wrappers + bin/argus removal)"

  - id: ADR-020
    title: "FileDiscoveryScanner template + shared linter helpers"
    status: accepted
    date: 2026-05-07
    context: |
      Linters (lint-yaml, lint-json, lint-python, lint-javascript,
      lint-dockerfile, lint-terraform) duplicated three concerns
      across their adapters:

      * File discovery — each linter that walks files in Python
        (HadolintLinter._find_dockerfiles, JsonlintLinter inline
        rglob) re-implemented the walk.
      * Container fallback — HadolintLinter._build_docker_command,
        EslintLinter._build_docker_command, and
        TerraformLinter._docker_command each built nearly identical
        ``docker run -v <ws>:/workspace[:ro] <image> <args>`` shapes,
        differing only in mount mode and workdir.
      * UTF-8 subprocess — most linters needed
        ``encoding='utf-8', errors='replace'`` to avoid the cp1252
        UnicodeDecodeError on Windows runners. Each one carried it
        inline.

      The original SDK-ROADMAP.md "FileDiscoveryScanner Template"
      section called for a unified subclass-based abstraction.
      Reading the actual linters showed two execution shapes:
      "tool-walks-itself" (yamllint, python_lint, eslint) and
      "discover-then-batch" (hadolint, jsonlint). A single forced
      hierarchy didn't fit both.
    decision: |
      Ship a hybrid: helper functions for the deduplication that's
      always useful, and a base class for the cases that genuinely
      share a flow.

      argus/core/linter_template.py exports:

      * ``discover_files(target, patterns, exclusions=None)`` — walk
        helper used by FileDiscoveryScanner internally and available
        to any custom flow (e.g. jsonlint).
      * ``build_docker_command(image, workspace, container_args,
        mount_rw=False, ws_mount='/workspace', workdir=None)`` — the
        single source of truth for the docker-run command shape.
        EslintLinter and TerraformLinter migrate to it.
      * ``run_utf8(cmd, *, cwd=None, timeout=None)`` — explicit
        UTF-8 subprocess wrapper. Replaces inline encoding+errors
        keyword args.
      * ``FileDiscoveryScanner`` — base class for the discover-then-
        batch flow. Subclasses declare ``name``, ``file_glob``,
        ``binary``, optionally ``container_image``, and override
        ``_build_local_args`` / ``_build_container_args`` /
        ``_parse_results``. The base does discovery, dispatch
        (local-or-container), error handling (execution_failed for
        bad exit + empty stdout, parse_failed for parser exceptions
        — same metadata shape the engine's container path emits),
        and the engine-compatible ScanResult shape.

      Migrations in this PR:
      * HadolintLinter — full migration to FileDiscoveryScanner
        (~30 lines saved). Custom _find_dockerfiles and
        _build_docker_command gone.
      * EslintLinter — switches its custom docker-fallback builder
        to build_docker_command (~10 lines saved); keeps its
        config-detection flow.
      * TerraformLinter — same. Multi-step fmt/validate/tflint flow
        stays bespoke (it doesn't fit FileDiscoveryScanner's
        single-batched-call shape).
      * yamllint, python_lint, jsonlint — keep their existing flow.
        yamllint and python_lint use the "tool walks the workspace
        itself" shape that doesn't benefit from discovery in Python.
        jsonlint has a Python-stdlib fallback that the
        FileDiscoveryScanner abstraction doesn't model. The new
        helpers are available to them if a future change makes the
        migration valuable.
    alternatives_considered:
      - name: "Single FileDiscoveryScanner base, force-fit every linter"
        rejected_because: |
          The "tool-walks-itself" linters (yamllint, python_lint,
          eslint) never discover files in Python — the binary takes
          a directory. Forcing them through a discovery layer would
          add overhead without value, and break their config-aware
          flows (eslint's no-eslint-config detection,
          yamllint's Windows AppLocker fallback). Multi-step linters
          like terraform fundamentally don't match a single-batch
          shape.

      - name: "Helpers only — skip the base class"
        rejected_because: |
          HadolintLinter and a future jsonlint migration genuinely
          share a 5-step flow (discover → dispatch → run → check
          for execution failure → parse). Open-coding it in each
          subclass duplicates the metadata-shape contract that the
          engine, reporters, and --fail-on-scanner-error all key
          off of. The base class makes that contract enforceable.

      - name: "Co-locate the helpers in scanner_template.py"
        rejected_because: |
          scanner_template.py targets security scanners that write
          findings to an output file (run_subprocess_scan reads
          back results.json from a tempdir). Linters typically
          write findings to stdout and don't need a tempdir. The
          two surfaces diverged enough that a separate module is
          clearer.
    consequences:
      - "New linter contributors have a clear pattern: subclass FileDiscoveryScanner for discover-then-batch, or use the helpers in a custom scan() flow."
      - "Adding container fallback to a new linter is one helper call (build_docker_command) instead of ~25 lines of duplicated ``docker run`` boilerplate."
      - "UTF-8 + errors='replace' is the implicit default via run_utf8 — no more per-linter forgetting to add encoding='utf-8'."
      - "Migrations are independent and additive: yamllint / python_lint / jsonlint can adopt the helpers later if a future change makes it useful, without coupling release cycles to this refactor."
      - "The FileDiscoveryScanner base imposes its execution_failed / parse_failed metadata shape — keeps reporters' surface uniform across linters and security scanners."
    related:
      - ADR-013  # Python SDK as primary interface
      - ADR-016  # Silent-failure gating (the metadata shape this preserves)
      - ADR-018  # Canonical scanner output contract (parallel design choice)
    pr_references:
      - "#117 (build_args contract for security scanners — the parallel pattern this complements)"
      - "#120 (HadolintLinter pre-batching — the optimization this PR's base captures generically)"

  - id: ADR-021
    title: "SDK-vs-composite-action boundary: when a scanner stays composite-only"
    status: accepted
    date: 2026-05-08
    context: |
      Argus's primary contribution shape is the SDK module (an
      argus.scanners.<name> class implementing the Scanner protocol).
      Composite actions exist as wrappers that delegate to the SDK
      so GitHub Actions consumers get a paved path. The default
      assumption — captured in CONTRIBUTING.md and the SDK-first
      framing throughout — is that every new scanner gets an SDK
      module first, and the composite wrapper is a thin convenience
      layer.

      Two existing scanners deliberately break that pattern:
      scanner-codeql and scanner-dependency-review have composite
      actions but no argus.scanners.codeql / argus.scanners.dependency_review
      modules, and the SDK-ROADMAP.md previously listed both as open
      items waiting to get SDK ports.

      Auditing those two more carefully showed neither scanner can
      ever justify the SDK port:

      * **CodeQL.** The CodeQL CLI is licence-restricted (free use
        only for OSS or GHAS-entitled private repos), the bundle
        is ~500MB to redistribute across architectures, and the
        primary value of running it (SARIF upload to the GitHub
        Security tab) only exists on github.com / GHES. An SDK
        consumer scanning proprietary code without GHAS is on
        questionable licence ground, and the maintenance cost of
        tracking the bundle's release cadence is substantial.

      * **Dependency-review.** The action is a thin client over
        GitHub's GET /repos/{owner}/{repo}/dependency-graph/compare/
        {basehead} endpoint. The intelligence is server-side; the
        compare data only exists for repos with the Dependency
        Graph enabled (free for public repos, GHAS for private);
        and the comparison is meaningless outside a pull_request
        event context. Wrapping it in the SDK would be a
        GitHub-API client masquerading as a Scanner protocol.

      Both motivated a deliberate "wontfix on SDK, ship as
      composite-only" decision. We need that recorded so a future
      contributor doesn't reopen #206 or a sibling issue without
      seeing the rationale.
    decision: |
      A scanner stays composite-action-only (no SDK module) when
      EITHER condition holds:

      1. **GitHub-API-bound primary signal.** The scanner's main
         output comes from a GitHub API endpoint (not from running
         a binary against local files). It needs GITHUB_TOKEN, a
         specific event payload, or server-side data that doesn't
         exist off-platform. Examples: dependency-graph diff,
         secret-scanning-alerts API, code-scanning-alerts API.

      2. **Licence-restricted CLI distribution.** The scanner's CLI
         can't be redistributed to all consumers under terms argus
         is willing to accept on their behalf. Either the licence
         restricts use cases (CodeQL: OSS or GHAS only), or the
         distribution itself is encumbered (sealed bundle requiring
         GitHub auth to download).

      Either condition makes the SDK port a net negative —
      bigger maintenance surface for a feature only some consumers
      can legally use, with no off-platform value.

      Both existing instances stay composite-only:

      * .github/actions/scanner-codeql/ — keeps its current shape;
        consumers wanting CodeQL via argus go through the action.
      * .github/actions/scanner-dependency-review/ — same.

      Neither will gain argus.scanners.codeql.py or
      argus.scanners.dependency_review.py modules. The two
      composite actions' README.md files carry the rationale
      inline so a contributor browsing the action sees it before
      filing an SDK-port issue.

      CLAUDE.md's "Adding a New Scanner" section was updated with
      a one-paragraph carve-out pointing at this ADR, so the
      default ("SDK-first") guidance has the carve-out attached
      to it instead of having to be discovered separately.
    alternatives_considered:
      - name: "Port both scanners to the SDK anyway, with disclaimers"
        rejected_because: |
          For CodeQL, the licence restrictions don't go away just
          because we add a docstring. Consumers running it under
          argus's uniform interface against proprietary code without
          GHAS are still on the wrong side of GitHub's terms; we'd
          be making it easier for them to get into trouble. For
          dependency-review, the SDK port would be a single API
          endpoint wrapper that requires GITHUB_TOKEN + base_ref +
          head_ref to do anything — which is the composite-action
          shape, just dressed up differently. No off-platform value
          gained, real maintenance cost added.

      - name: "Drop the composite actions too — let consumers use the upstream actions directly"
        rejected_because: |
          The composite wrappers add real value: uniform input
          surface (fail_on_severity, post_pr_comment, etc.),
          security-summary integration, the standard SARIF upload
          + PR-comment + artifact-upload flow. Consumers using
          actions/dependency-review-action or
          github/codeql-action directly miss all of that. The
          wrappers stay; the SDK ports don't happen.

      - name: "Add an 'SDK-eligible' marker on every action.yml"
        rejected_because: |
          Over-engineering. Two scanners are composite-only today,
          and the rule for adding more is a single sentence. A
          paragraph in CLAUDE.md + this ADR + a callout in each
          composite action's README is enough scaffolding. If we
          ever have 5+ composite-only scanners we can revisit.
    consequences:
      - "Roadmap item ``#206 (codeql.py + dependency_review.py)`` closed: composite-only by design, never an SDK port."
      - "Future contributors filing 'add SDK module for <X>' issues hit the boundary rule in CLAUDE.md and the per-action README before opening the issue. Reduces the chance of a partially-implemented SDK port that later gets ripped out."
      - "Two existing composite actions are explicitly paved cowpaths, not omissions waiting to be filled in."
      - "The rule is testable from the contributor's side: 'Does my scanner need GITHUB_TOKEN + a specific event for its primary output?' OR 'Is the CLI licence-restricted?' If yes to either, ship as composite-only."
    related:
      - ADR-001  # Composite actions as primary architecture (the dual-track shape this disambiguates)
      - ADR-013  # Python SDK as primary interface (the default this carves out from)
    pr_references:
      - "(roadmap closure for #206 — see SDK-ROADMAP.md line 207)"
