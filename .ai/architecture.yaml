# .ai/architecture.yaml
# Component relationships, dependencies, and system structure
# AICaC Specification v1.0

version: "1.0"

architecture:
  description: "The argus Python SDK is the primary interface. Composite actions provide GitHub Actions integration."
  primary:
    location: "argus/"
    pattern: "Python SDK + CLI"
    version: "0.7.2"
    status: production
    advantage: "Platform-independent, works locally and in any CI; canonical argus-results.json shared across source-scan, container-scan, and MCP flows"
    cli: "argus scan --config argus.yml  (or: python -m argus scan --config argus.yml)"

  actions:
    location: ".github/actions/"
    pattern: "Composite actions"
    status: production
    advantage: "GHES compatible, self-contained GitHub Actions integration"

components:
  - name: argus-sdk
    location: "argus/"
    purpose: "Primary interface for running Argus scanners locally or in CI"
    type: sdk
    cli: "python -m argus scan --config argus.yml"
    structure:
      "cli.py": "argparse CLI with scan, cache, and report subcommands"
      "init.py": "argus init project bootstrap and banner rendering from img/argus_logo.txt"
      "containers.py": "Container image manifest, version enforcement, and DB cache volume mounts (CACHE_MOUNTS)"
      "core/models.py": "Severity enum, Finding/ScanResult/ScanSummary dataclasses"
      "core/scanner.py": "Scanner Protocol definition"
      "core/config.py": "ArgusConfig loading from argus.yml"
      "core/engine.py": "ArgusEngine orchestrating scanners and aggregating results (delegates to core/prewarm.py for background image pre-warm + lazy pulls in parallel mode). Container path honors three optional Scanner hooks: container_args/build_args (CLI argv), container_env(config)->dict (resolved values land in a subprocess.run env=... dict and docker_cmd carries only ``-e NAME`` flags — values never appear on the docker run command line, closing the ps/docker-inspect leak; None values are filtered so unset env-var-name refs don't materialize at all), and container_mounts(config)->[(host,container)] (extra read-only bind mounts; non-existent host paths are skipped with a WARNING rather than aborting the scan)."
      "core/prewarm.py": "ImagePrewarmer — best-effort background container image pulls. Dedup'd by image ref, capped concurrency (execution.prewarm_workers, default 4), opt-out via execution.prewarm_images: false. Skipped when pull_policy=never. Pre-warm failure falls back to inline pull in _run_in_container."
      "core/exclusions.py": "Path exclusion set (builtins + .gitignore + config + CLI), ``**``-glob matcher"
      "core/schema.py": "argus.yml schema validator. Validates structure, types, allowed values, credential-field shapes, and ZAP's nested ``auth`` sub-block; emits ConfigError objects (ERROR / WARNING) that ``argus validate`` reports. Catches typos, malformed PORT/PROTO entries, and vendor-shaped literal credentials at config-load time. Stdlib-only."
      "core/version.py": "argus version resolution + display helpers. Single source-of-truth read from ``__version__`` (which is itself loaded from ``version.yaml`` at install time via the pyproject.toml dynamic version mechanism)."
      "core/scanner_template.py": "Shared subprocess-scan template + ScanPaths dataclass. Standardized ``build_args(ScanPaths, config)`` shape (PR #117 unification) — scanners declare argv via this template and the engine drives both local and container execution from the same shape. Reused by 9 scanner modules."
      "core/linter_template.py": "FileDiscoveryScanner template + shared docker-fallback helpers (ADR-020). Linters that follow the discover-files → batch-subprocess shape subclass it instead of rolling their own walk. Used by lint-dockerfile and partially by lint-javascript / lint-terraform; the remaining three linters (yaml, json, python) keep custom flows that don't fit the template's shape but can borrow ``build_docker_command`` / ``run_utf8`` helpers."
      "core/redact.py": "Pattern-based secret redaction at Finding construction (ADR-022). REDACTED_PLACEHOLDER constant + redact_secret + redact_high_risk_patterns. Runs in Finding.__post_init__ as a defense-in-depth backstop for scanners that get added without the per-scanner audit; conservative vendor-prefix-only pattern set (gh*, AKIA, AIza, glpat-, sk_live_, npm_, xox*-, JWT, PEM) — no high-entropy heuristics."
      "core/tool_config.py": "Auto-discovery of per-scanner canonical config files (.bandit, .checkov.yaml, trivy.yaml, osv-scanner.toml, semgrep.yml)"
      "core/sbom.py": "SBOM format detection (CycloneDX JSON/XML, SPDX JSON/tag-value, Syft JSON) for ``argus scan --sbom``"
      "core/secrets.py": "Credential resolution for any scanner config field. resolve_secret(config, field, *, stdin_override=None) accepts three forms in precedence order: stdin_override (highest, populated by CLI --*-password-stdin flags via a module-level slot registry — set_stdin_override / get_stdin_override / clear_stdin_overrides), <field>_env (env-var name reference; reads os.environ at scan time), or <field> literal (back-compat, warned at config-load if vendor-shaped via looks_like_literal_secret). The stdin path never reaches the per-scanner config dict so it can't leak into argus-audit.json / argus.log. validate_env_var_name enforces POSIX shell identifier rules. Stdlib-only. Used by scanners.container and scanners.zap; future scanners with credential needs use the same helper. See ADR-024."
      "core/image_verify.py": "Supply-chain verification for container images at pull time. verify_image(ref) classifies the ref into: argus-owned (ghcr.io/huntridge-labs/argus/* — cosign keyless verify against the publish workflow's identity + GitHub Actions OIDC issuer; failure is fatal), third-party with @sha256: digest pin (Docker enforces content-hash match at pull, no cosign call needed), or third-party tag-only (logged once per scan via report_tag_pinned_summary). Engine calls this after _pull_image succeeds; fatal results raise RuntimeError before the scanner runs. Config knob: execution.verify_image_signatures (default True; opt-out for air-gapped). Stdlib + cosign binary on PATH; no Python sigstore dep. See docs/security.md."
      "core/findings_view.py": "Shared UI-free logic for findings display — ViewState, SEVERITY_ORDER, finding_detail_rows, compute_summary, diff_scans (scan-over-scan bucketing keyed off (scanner, id, location)). Consumed by argus view terminal (TUI ``D`` keybind, DiffScreen) and argus view browser (web UI ``/diff`` route)."
      "core/scopes.py": "Finding scope taxonomy. scope_for_finding maps a finding to security / lint / supply-chain from each scanner's category (linter->lint; sca/container/supply-chain->supply-chain; else security) via the live registry with a name-prefix fallback. Drives the scope-organized report output (reporters/scope_views.py)."
      "viewers/": "`argus view` interfaces (optional extras)"
      "viewers/__init__.py": "ViewerUnavailable shared exception"
      "viewers/terminal/": "`argus view --interface=terminal` — Textual TUI ([terminal] extra). Includes DiffPickerScreen + DiffScreen for scan-over-scan diff (``D`` keybind), reusing argus.core.findings_view.diff_scans."
      "viewers/browser/": "`argus view --interface=browser` — FastAPI + Jinja2 web UI, 127.0.0.1 only ([browser] extra). Routes include ``/diff?a=<path>&b=<path>`` powered by argus.core.findings_view.diff_scans, sharing the bucketing logic with the TUI's ``D`` keybind."
      "scanners/": "Scanner modules implementing Scanner protocol (SCANNER_REGISTRY includes linters via auto-merge). The container scanner orchestrates five sub-scanners on every run: trivy (CVE scan), grype (CVE scan, deduplicated against trivy), syft (SBOM), exposure (declared-port surface from docker inspect Config.ExposedPorts), and services (declared-service surface from systemd unit files + SysV init scripts in the image filesystem). The exposure sub-scanner emits one Finding per declared port; INFO severity for ordinary application ports and MEDIUM for ports on the built-in RISKY_PORTS list (SSH 22/tcp, MySQL 3306/tcp, Redis 6379/tcp, PostgreSQL 5432/tcp, MongoDB 27017/tcp, etc.). The services sub-scanner emits one Finding per declared service; INFO severity for ordinary services and MEDIUM for the built-in RISKY_SERVICES watchlist (sshd, postgresql, redis-server, mongod, elasticsearch, etc.). File extraction uses docker create + docker cp tar streams so distroless / scratch images are supported. Config knobs scanners.container.{expose_warn_ports, expose_ignore_ports, services_warn, services_ignore} override or suppress. Private-registry auth flows through the standard secrets resolver: top-level containers.registry_username / registry_password (single-default shortcut) and containers.registry_auth (per-registry map keyed by host or host/path-prefix, longest-prefix matching, no silent fallback when a matched entry's env var is unset — see ADR-028). Resolved credentials are forwarded to Trivy / Grype / Syft via their native env-var names on both the local-binary and container-fallback paths; Grype remote refs are auto-prefixed with registry: so the registry source provider is used inside the anchore/grype container."
      "linters/": "Linter modules implementing Scanner protocol (LINTER_REGISTRY auto-merges into SCANNER_REGISTRY)"
      "reporters/": "Output reporters (terminal, markdown, container_markdown, sarif, json, github, gitlab, junit, openvex). openvex emits a consolidated OpenVEX v0.2.0 document from CVE-mapped component findings (container/SCA only) — see docs/developer/vex-output-spike.md. Discovered via the ``argus.reporters`` Python entry-point group (built-ins declared in pyproject.toml; third-party packages register additional formats without forking — see docs/contributing-reporters.md and ADR-023). scope_views.py writes per-scope filtered views (security/ lint/ supply-chain/ subdirs, each with argus-results.json + argus-summary.md; security adds the SARIF view, supply-chain the OpenVEX doc) alongside the canonical root aggregate, which is unchanged for backward compatibility."
      "preflight/": "CI preflight: provider detection, living issue reporting (GitHub/GitLab), network deps, scanner tool-readiness checks (tool_check.py)"
      "audit/": "Structured audit trail for every scan run. logger.py emits JSONL log records (one per line) into ``argus-results/.../argus.log``; manifest.py writes the per-run AuditManifest summary into ``argus-audit.json``. secrets.py provides mask_secrets (regex masking for token=, password=, Bearer, URL-creds, GitHub PATs, AWS access keys, sk-keys) and the mask_secrets_in_obj recursive walker. Both write paths run mask_secrets_in_obj at serialization time as defense-in-depth — if a future contributor accidentally captures a docker_cmd / env dict / credential-shaped argv into a manifest field or log entry, the redaction pass catches it before the file lands. Both logger formatters mask the rendered ``record.getMessage()`` rather than ``record.msg`` to avoid corrupting %s format strings whose placeholders match secret-shaped patterns."

  - name: argus-linters
    location: "argus/linters/"
    purpose: "Linter modules implementing Scanner protocol for code style and syntax checks"
    type: sdk-subpackage
    registry: "LINTER_REGISTRY (auto-merges into SCANNER_REGISTRY at import time)"
    naming_convention: "lint-<tool> prefix (e.g., lint-yaml, lint-python)"
    severity: "Severity.INFO for all findings"
    structure:
      "__init__.py": "LINTER_REGISTRY + get_linter() + auto-merge into SCANNER_REGISTRY"
      "yamllint.py": "YAML linting via yamllint"
      "jsonlint.py": "JSON linting"
      "python_lint.py": "Python linting"
      "eslint.py": "JavaScript / TypeScript linting via ESLint"
      "hadolint.py": "Dockerfile linting via hadolint"
      "terraform.py": "Terraform linting"

  - name: composite-actions
    location: ".github/actions/scanner-*/"
    purpose: "Self-contained scanner actions"
    type: action
    structure:
      action.yml: "Inputs, outputs, steps"
      .docsite.yml: "Category declaration for auto-generated documentation site"
      scripts/parse-results.py: "Scanner output → JSON"
      scripts/generate-summary.py: "JSON → Markdown"
      tests/: "Co-located pytest tests"
    pr_commenting:
      has_step: true
      default: false
      condition: "github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'"
      uses: ".github/actions/comment-pr/action.yml"
      purpose: "Allows standalone scanner usage with individual PR comments"

  - name: config-parsers
    location: ".github/actions/parse-*/"
    purpose: "Convert YAML/JSON configs to GitHub Actions matrix"
    type: utility
    outputs: "JSON array for matrix strategy"
    instances:
      - parse-container-config
      - parse-zap-config

  - name: summary-generators
    location: ".github/actions/*-summary/"
    purpose: "Aggregate results into unified summaries"
    type: utility
    instances:
      - security-summary
      - linting-summary
    security-summary_inputs:
      # scan_statuses is the primary defense against silent-failure greens.
      # Callers pass `needs.<job>.result` for every scanner so the aggregator
      # can render a per-scanner pass/fail table and exit non-zero when any
      # scanner failed — even if that scanner uploaded no summary artifact.
      scan_statuses: |
        Optional JSON object mapping scanner name -> job result
        (success|failure|cancelled|skipped). When provided, a status table
        is rendered at the top of the report and the composite exits non-zero
        on any failure unless `fail_on_scanner_failure` is set to "false".
      fail_on_scanner_failure: |
        Default "true". When combined with `scan_statuses`, drives the
        composite's own exit code so consumer workflows fail on any scanner
        that did not succeed.
    security-summary_script: ".github/actions/security-summary/scripts/generate_summary.py"
    security-summary_tests: "tests/integration/test_security_summary.py"
    linting-summary_inputs:
      # linting-summary mirrors the security-summary contract — the same
      # silent-failure class (no artifact = "no findings") existed for
      # linters and is closed by the same scan_statuses table.
      scan_statuses: |
        Optional JSON object mapping linter name -> job result
        (success|failure|cancelled|skipped). When provided, a status table
        is rendered at the top of the report and the composite exits non-zero
        on any failure unless `fail_on_scanner_failure` is set to "false".
      fail_on_scanner_failure: |
        Default "true". When combined with `scan_statuses`, drives the
        composite's own exit code so consumer workflows fail on any linter
        that did not succeed.
    linting-summary_script: ".github/actions/linting-summary/scripts/generate_summary.py"
    linting-summary_tests: "tests/integration/test_linting_summary.py"

  - name: agent-skills
    location: ".agents/skills/"
    purpose: "Portable Agent Skills bundles that help skills-compatible agents bring Argus into local development workflows and align those checks with CI coverage."
    type: agent-skill
    structure:
      SKILL.md: "Agent Skills metadata and instructions"
      references/REFERENCE.md: "Scanner matrix, platform routing guidance, local act recipes, trigger caveats, and workflow recipes"
    instances:
      - argus-scanner-selection

  - name: argus-mcp
    location: "argus/mcp.py"
    purpose: "MCP server for AI assistant integration"
    type: mcp-server
    tools: [argus_scan, argus_list_scanners, argus_validate, argus_detect, argus_init, argus_classify, argus_explain_finding, argus_scan_summary]
    resources: ["argus://config", "argus://results/latest", "argus://config/schema", "argus://architecture"]
    prompts: [security_review, fix_findings, setup_scanning]
    transport: stdio
    install: "pip install argus-security[mcp]"
    configuration:
      mcpServers:
        argus:
          command: argus
          args: ["mcp"]

  - name: architecture-map
    location: "scripts/docsite/architecture.py"
    purpose: "Interactive SDK architecture diagram — columns × flows × per-node side panel."
    type: documentation-page
    note: |
      Derives its JSON view model from this file (.ai/architecture.yaml) at
      build time. The transformer is a pure function from canonical YAML
      plus runtime SDK introspection (SCANNER_REGISTRY, LINTER_REGISTRY,
      argus.reporters entry-point group, argparse subcommands). No
      hand-edited JSON mirror is committed; see ADR-026.
    consumers:
      - "Docsite build (scripts/docsite/builder.py → docs/architecture.md inside MkDocs Material)"
      - "argus mcp → argus://architecture resource"
    structure:
      "scripts/docsite/architecture.py": "Canonical view-model transformer + inline-markdown renderer (writes docs/architecture.md + copies CSS/JS to docs/assets/)"
      "argus/architecture_map.py": "Runtime shim that re-exports the transformer for installed-package consumers (MCP)"
      "argus/viewers/browser/static/architecture.css": "Column / flow / panel styling — sourced by the docsite build, copied into docs/assets/"
      "argus/viewers/browser/static/architecture.js": "Vanilla JS — column rendering, flow highlight, picker mode, URL state, copy buttons, tour"
      "scripts/ci/check_architecture_sync.py": "CI gate: registries / entry-points / CLI must match the YAML"
    related_adrs:
      - ADR-026  # YAML is canonical, JSON is derived

  - name: scn-detector
    location: ".github/actions/scn-detector/"
    purpose: "FedRAMP Significant Change Notification detection and classification"
    type: compliance-action
    description: "Analyzes IaC changes and classifies them per FedRAMP 20X SCN guidelines"
    classification_method: "Hybrid (rule-based + multi-provider AI fallback)"
    supported_formats: [terraform, kubernetes, cloudformation]
    ai_providers:
      supported: [anthropic, openai]
      default: anthropic
      configurable_via: "ai_fallback section in scn-config.yml"
      env_vars:
        anthropic: "ANTHROPIC_API_KEY"
        openai: "OPENAI_API_KEY"
      features:
        - "SDK-first with raw HTTP fallback"
        - "Custom base URL for OpenAI-compatible APIs (Azure, Ollama)"
        - "Configurable model, confidence threshold, max tokens"
    structure:
      action.yml: "Composite action with 12 steps (includes config validation)"
      schemas/scn-config.schema.json: "JSON Schema draft-07 for SCN config validation"
      scripts/analyze_iac_changes.py: "Git diff → IaC change extraction"
      scripts/classify_changes.py: "Rule-based + AI classification engine (validates config on load)"
      scripts/validate_scn_config.py: "Config validator (dict-based, no jsonschema dependency)"
      scripts/ai_classifier.py: "AI classification orchestrator (provider-agnostic)"
      scripts/ai_providers.py: "Provider abstraction (Anthropic, OpenAI)"
      scripts/generate_scn_report.py: "Markdown + JSON report generation"
      scripts/create_scn_issue.py: "GitHub Issue creator with timelines"
      tests/: "pytest test suite with 80%+ coverage"
    outputs:
      - "PR comments with collapsible SCN analysis"
      - "GitHub Issues with compliance timelines"
      - "JSON audit trail (90-day retention)"
    categories:
      routine: "No notification required"
      adaptive: "Within 10 business days after"
      transformative: "30 days initial + 10 days final + after"
      impact: "New assessment required"

scanners:
  sast:
    - name: codeql
      purpose: "Multi-language semantic code analysis"
      languages: [python, javascript, typescript, go, java, cpp, ruby, csharp, swift, kotlin]
    - name: bandit
      purpose: "Python-specific security linter"
      languages: [python]
    - name: gosec
      purpose: "Go-native security linter (G101 hardcoded creds, G201 SQL injection, G304 path traversal, etc.)"
      languages: [go]
    - name: opengrep
      purpose: "Pattern-based multi-language scanning"
      languages: [multi]
    - name: mumps
      purpose: "MUMPS / M language SAST. Phase 1+ rule set, 28 rules; streaming scan loop (parse, extract lightweight call-graph facts, drop tree; re-parse per file for the rule pass) bounds peak memory to one tree regardless of corpus size. Cross-file call graph (argus.scanners.mumps.callgraph) carries per-call actuals + per-routine entry formals; argus.scanners.mumps.interproc does opt-in one-hop taint propagation (scanners.mumps.interprocedural.enabled, recursion-safe worklist, max_depth-capped). M001 also annotates findings with inter_procedural_callers metadata. M001 XECUTE injection (CWE-95, taint-gated, literal/misparse-guarded), M002 indirection injection (CWE-94, taint-gated; generic stream off by default via flag_generic_indirection), M003 OPEN/USE injection with PIPE-device CRITICAL precision (CWE-78), M004 hard-coded credentials in globals (CWE-798), M005 tainted dynamic dispatch (CWE-95), M006 tainted external $& / $ZF call (CWE-78; per-helper severity map, exec helpers / $ZF(-1) = CRITICAL, pure helpers suppressed), M007 tainted source loaded/compiled as code via ZLINK/ZINSERT/ZCOMPILE (CWE-95), M101 duplicate label, M102 unreachable code after unconditional QUIT/HALT, M201 DO/GOTO to undeclared label, M202 first label does not match filename, M203 local variable read before defined (off by default — noisiest rule on real code; misparse-driven FP tail), M204 local variable declared (NEW/READ) but never read (SET-then-unused intentionally excluded as inter-routine FP), M205 label body falls through into the next label, M206 KILL of entire global tree (no subscript), M207 bare KILL deletes all locals, M208 bare NEW stacks all locals, M209 call passes more args than entry declares, M210 duplicate variable in a NEW list, M211 scratch global ^TMP/^UTILITY written without $J (CWE-362), M212 argumentless FOR with no loop exit (CWE-835), M213 QUIT with argument inside a FOR, M214 naked global reference (off by default), M215 non-portable Z-command, M216 non-portable $Z intrinsic function (off by default), M217 non-portable $Z special variable (off by default), M218 executable code on the routine label line, M219 source line over the SAC 245-char limit (M1xx/M2xx diagnostics, INFO/LOW/MEDIUM/HIGH; M211 CWE-362 and M212 CWE-835 at HIGH). Security rules cover all five MUMPS code-injection sinks (XECUTE / indirection / OPEN/USE / dynamic dispatch / external $& call) plus the data-at-rest credential leak, exceeding the public mHawk taint-sink surface for intra-procedural detection. Recognized taint sources (shared across M001/M002/M003/M005/M006 via argus.scanners.mumps.taint): READ, $ZARGV, ^%CGI / ^%REQUEST / ^%session. Config knobs under scanners.mumps in argus.yml: taint_sources.patterns (extend the source set), taint_sources.formals_untrusted (audit mode, default off: seed entry-label formal params as untrusted to surface caller-origin/multi-hop sinks the precise intra-file default does not chase), sanitizers (functions that remove taint), known_external_vars (extend the VistA/FileMan allowlist for M203/M204), scratch_globals (scratch globals M211 requires $J-subscripted), max_line_length (M219 limit, default 245), flag_generic_indirection (M002 generic-indirection INFO advisory, default off), rules.<id>.severity (per-rule severity override; per-finding precision like M003's PIPE bump survives), rules.<id>.enabled (toggle a rule; M203/M205/M214/M216/M217 ship off by default (M002/M201/M204 re-enabled after precision work — M002 position-aware @(expr) gating, M201 text-scanned label index + callgraph cross-routine resolution, M204 external-call implicit-NEW inheritance gate). Profiles: scanners.mumps.profile security-only|lint-only|strict|default. Inline ;argus:ignore[M0xx] suppression (counted in metadata.suppressed). M003 device taxonomy PIPE=CRITICAL/socket=HIGH/file=MEDIUM. Sanitizers SOUND: numeric coercion flow-insensitive, charset pattern-match guards flow-SENSITIVE via filter_charset_guarded (same label body only) — M002/M201/M203/M204 measured FP-dominant at scale, the rest legacy-idiom/portability-inventory). Default profile validated AT SCALE on six real MUMPS projects (1,162 routines: utility lib, MUMPS web server, two YottaDB projects, VistA Kernel + Programmer Environment), every distinct finding class adjudicated against source: 220 findings total (down from 1,628 pre-tuning); real security preserved — M003 shell-pipe OPEN/USE (lsof/kill/ps with tainted command in the Kernel), M006 $ZF, M001 READ->XECUTE. Off-by-default FP drivers: M002 flags non-executable name/glvn indirection (S @X=, @X@(sub), L +@X) not just executable X/D @v (still covered by M001/M005); M201 label extractor misses quote-heavy/final-block labels so legal forward refs read undeclared; M203 dynamic scoping + misparse; M204 intra-routine def-use misses implicit-NEW callee reads. Fixed this pass: M102 no longer treats argument-bearing Q X (QUIT-with-value) / H .05 (HANG, not HALT) as unconditional breaks; taint untaints $TEXT/$T self-source (VistA menu-driver S X=$T(MENU+OPT) D @$P(X) no longer flagged); M202 suppresses %-routine platform-variant families; DEFAULT_EXTERNAL_VARS gained the %-FileMan scratch family. Tracked on-by-default refinements: M003 socket/|TCP|/plain-file vs PIPE device taxonomy, M005 menu-dispatch-table beyond the $TEXT form, M202 residual, M211 $J-vs-JOB subscript; cross-file request-dispatch sinks (do @r via URL map, X %WCALL via $$RPC^XWBPRS) need multi-hop interprocedural array-flow, Phase 2), rules.M202.ignore_patterns, interprocedural.enabled / max_depth (opt-in one-hop cross-routine taint). Parser foundation: janus-llm/tree-sitter-mumps pinned to 345f3fb29a6a281a9e28d244e901732bc68c51fc (MITRE Public Release 23-4084, Apache-2.0). Local execution via scripts/build-mumps-grammar.sh; container execution via docker/Dockerfile.mumps (grammar pre-compiled at image build time), published to ghcr.io/huntridge-labs/argus/scanner-mumps; the engine auto-routes to it (backend auto/docker) and harvests the nested argus-results.json via MumpsScanner.parse_results. Phase 2 remaining items (multi-hop / return-value interprocedural taint, attested release image to replace the mumps-preview build, additional diagnostics toward mHawk's 32) and Phase 3 (ObjectScript / Cache, .o analysis, LSP) captured in docs/developer/SDK-ROADMAP.md."
      languages: [mumps]

  secrets:
    - name: gitleaks
      purpose: "Git history and file secrets detection"
      output: SARIF

  container:
    - name: trivy
      purpose: "Container vulnerability scanning"
      output: SARIF
    - name: grype
      purpose: "Container vulnerability scanning (alternative)"
      output: SARIF
    - name: syft
      purpose: "SBOM generation"
      output: SPDX/CycloneDX

  infrastructure:
    - name: trivy-iac
      purpose: "Terraform, Kubernetes, CloudFormation scanning"
      output: SARIF
    - name: checkov
      purpose: "IaC policy-as-code scanning"
      output: SARIF
    - name: kics
      purpose: "Multi-format IaC scanning — Ansible, Bicep, Helm, Terraform, Kubernetes, Dockerfile, CloudFormation, OpenAPI"
      output: JSON
      note: "Checkmarx KICS (Apache-2.0). Runs concurrently with trivy-iac/checkov — they catch different things on the same target (issue #188)"

  dependencies:
    - name: osv
      purpose: "Dependency vulnerability scanning via OSV database"
      output: JSON/SARIF
      note: "Any trigger, uses official google/osv-scanner-action Docker image"
    - name: dependency-review
      purpose: "PR dependency diff analysis and license compliance"
      output: JSON
      note: "PR-only, graceful skip on non-PR events"

  malware:
    - name: clamav
      purpose: "File-based malware detection"
      output: text

  dast:
    - name: zap
      purpose: "Dynamic web application testing"
      output: SARIF

  llm_security:
    - name: promptfoo
      purpose: "LLM red-team / eval — prompt injection, jailbreaks, PII leakage (OWASP LLM Top 10)"
      output: JSON
      note: "Opt-in (not in 'all'); container-first; requires provider API keys (OpenAI/Anthropic/etc.) + network at scan time. Keys resolved via argus.core.secrets env-var indirection; adversarial prompts and model responses are never echoed into findings. See ADR-024 credential pattern."

  supply_chain:
    - name: supply-chain
      purpose: "GitHub Actions workflow security scanning via zizmor + actionlint"
      output: JSON/SARIF
      note: "Uses zizmorcore/zizmor-action and actionlint for comprehensive workflow security"

  compliance:
    - name: scn-detector
      purpose: "FedRAMP Significant Change Notification detection and classification"
      output: "JSON, Markdown, GitHub Issues"
      categories: [routine, adaptive, transformative, impact]

  linting:
    - name: lint-yaml
      purpose: "YAML syntax and style linting via yamllint"
      output: "Finding (Severity.INFO)"
    - name: lint-json
      purpose: "JSON syntax linting"
      output: "Finding (Severity.INFO)"
    - name: lint-python
      purpose: "Python code style and syntax linting"
      output: "Finding (Severity.INFO)"
    - name: lint-javascript
      purpose: "JavaScript / TypeScript linting via ESLint (with container fallback)"
      output: "Finding (Severity.INFO)"
    - name: lint-dockerfile
      purpose: "Dockerfile linting via hadolint"
      output: "Finding (Severity.INFO)"
    - name: lint-terraform
      purpose: "Terraform configuration linting"
      output: "Finding (Severity.INFO)"
    - name: lint-shell
      purpose: "Shell script linting via shellcheck (extension + shebang discovery)"
      output: "Finding (Severity.INFO)"

dependencies:
  external:
    trivy:
      purpose: "CVE scanning for OS packages and containers"
      why_chosen: "Better GHES integration, SBOM support, active maintenance"
      alternatives_considered: [grype, clair]
      critical: true

    gitleaks:
      purpose: "Secrets detection in git history"
      why_chosen: "Fast, accurate, configurable rules"
      alternatives_considered: [trufflehog, detect-secrets]
      critical: true

    codeql:
      purpose: "Semantic code analysis"
      why_chosen: "GitHub native, deep analysis, free for public repos"
      limitation: "Requires GitHub Advanced Security for private repos"

    osv-scanner:
      purpose: "Dependency vulnerability scanning via OSV database"
      why_chosen: "Official Docker action from ghcr.io, comprehensive OSV database, any-trigger support"
      alternatives_considered: [snyk, npm-audit, pip-audit]
      critical: true

    dependency-review-action:
      purpose: "PR-based dependency diff analysis and license compliance"
      why_chosen: "GitHub-native, license checking, PR diff comparison"
      limitation: "PR-only (requires pull_request event context)"

  internal:
    pyyaml:
      purpose: "YAML parsing in Python scripts"
      required_by: [config parsers]

    jsonschema:
      purpose: "JSON schema validation in Python scripts"
      required_by: [config validators]

    pytest:
      purpose: "Testing framework"
      required_by: [all test suites]

    pytest-cov:
      purpose: "Code coverage measurement"
      required_by: [coverage reporting]

data_flow:
  diagram: |
    SDK source-scan pipeline (argus scan):
      argus scan [--config argus.yml | scanner ...]
        → ArgusEngine loads config + computes exclusions
        → For each enabled scanner (parallel by default):
          → is_available()? → run locally; else fall back to docker run (ADR-014)
          → Parse tool output → list[Finding]
          → Aggregate into ScanResult(scanner=<name>, findings=..., metadata=...)
          → If reporting.keep_raw: copy raw scanner files to <output_dir>/raw/<scanner>/
        → Build ScanSummary
        → Reporters consume ScanSummary:
            JsonReporter writes canonical argus-results.json (always)
            terminal/markdown/sarif emit alongside per reporting.formats

    SDK container-scan pipeline (argus scan container):
      argus scan container [--image REF | --discover PATH]
        → ContainerEngine resolves image targets (CLI flags > containers: config)
        → For each target: scan_image(trivy + grype + syft + exposure + services)
          → If reporting.keep_raw: copy trivy/grype/syft raw outputs and write
            exposure-findings.json / services-findings.json to <output_dir>/raw/<image>/
            (the exposure / services helpers have no upstream JSON output, so the
            lifecycle path synthesizes one when they produce findings)
        → Map ContainerScanResult → ScanResult(scanner="container/<name>", findings=combined)
        → Same JsonReporter / SARIF reporter pipeline as source scans —
          argus view consumes the canonical argus-results.json without
          container-specific code (PR #116, ADR-018).

    Composite action pipeline (GitHub Actions — thin SDK wrappers per ADR-013):
      User workflow step
        → scanner-{name} composite action
          → pip install argus-security
          → argus scan {scanner}  (SDK handles scanning + reporting)
          → Parse JSON output for severity counts → GITHUB_OUTPUT
          → Upload artifacts, SARIF, summary
          → [Optional] Post individual PR comment

    MCP pipeline (argus mcp):
      AI assistant connects via stdio
        → MCP tools dispatch to the same SDK entry points (argus_scan, argus_validate, etc.)
        → Returns structured JSON; resources expose argus://config and argus://results/latest

  canonical_artifact:
    file: "argus-results.json"
    written_by: "argus.reporters.json_report.JsonReporter"
    contract: |
      Always emitted by both source-scan and container-scan flows.
      Single ScanSummary.to_dict() shape consumed by argus view (terminal + browser),
      argus report, the MCP server (argus://results/latest), and external integrations.
      Container scanners surface as ScanResult rows with scanner names of the form
      `container/<image-name>` — viewers render them like any other scanner without
      special-casing.

  pr_commenting_strategy:
    description: "PR commenting via composite actions in GitHub Actions workflows"

    standalone_scanner:
      when: "Individual scanner action used in a workflow"
      behavior: "Each scanner can post its own PR comment"
      control: "Set post_pr_comment: true in action inputs"
      use_case: "Single scanner workflows, focused scanning"
      example: |
        - uses: huntridge-labs/argus/.github/actions/scanner-bandit@1.3.1
          with:
            post_pr_comment: true  # Posts individual Bandit PR comment

    implementation:
      comment_action: ".github/actions/comment-pr/action.yml"
      deduplication: "Uses HTML comment markers (e.g., opengrep-comment-marker)"
      update_behavior: "Updates existing comment if marker found, creates new otherwise"
      default: "post_pr_comment defaults to 'false' in all scanner actions"

  stages:
    - name: configure
      from: user
      to: argus-sdk-or-action
      data: "argus.yml config or action inputs"

    - name: scan
      from: argus-engine
      to: scanner-modules
      data: "scanner config, scan path"

    - name: parse
      from: scanner-binary
      to: parse-script
      data: "raw scanner output"

    - name: report
      from: scan-results
      to: reporter
      data: "structured findings"

    - name: upload
      from: composite-action
      to: github-security-tab
      data: "SARIF file (GitHub Actions only)"

docsite:
  name: docsite
  location: "scripts/docsite/"
  purpose: "Auto-generated MkDocs Material documentation site"
  type: tooling
  url: "https://huntridge-labs.github.io/argus/"
  deployment: ".github/workflows/docs.yml → GitHub Pages"
  structure:
    __main__.py: "CLI entry point (--validate flag for CI)"
    config.py: "Loads docsite.yml — no hardcoded defaults"
    categories.py: "Reads per-action .docsite.yml for category assignment"
    builder.py: "Main orchestrator — builds all pages and nav tree"
    pages.py: "Individual action/workflow page generators"
    indexes.py: "Index pages (actions, workflows, home)"
    mkdocs_config.py: "MkDocs Material theme configuration"
    diagrams.py: "Mermaid workflow diagrams with pan/zoom"
    parsers.py: "action.yml and workflow YAML parsers"
    helpers.py: "File I/O and link rewriting utilities"
    validator.py: "Config completeness validator for CI"
  config_files:
    "docsite.yml": "Repo-root site config (categories, labels, icons, exclusions)"
    ".github/actions/*/.docsite.yml": "Per-action category declaration"
  commands:
    validate: "cd scripts && python -m docsite --validate"
    build: "cd scripts && python -m docsite --output-dir /tmp/argus-docs"
    preview: "cd /tmp/argus-docs && mkdocs serve"

  argus_sdk:
    name: argus-sdk
    location: "argus/"
    purpose: "Standalone Python SDK for running Argus scanners outside GitHub Actions"
    type: sdk
    status: phase-1-complete
    adr: ADR-013
    description: "Cross-platform Python package with CLI, scanner modules, and reporters"
    structure:
      "__init__.py": "Package root (version)"
      "__main__.py": "CLI entry point (python -m argus)"
      "cli.py": "argparse CLI with scan and report subcommands"
      "core/models.py": "Severity enum, Finding/ScanResult/ScanSummary dataclasses"
      "core/scanner.py": "Scanner Protocol definition"
      "core/config.py": "ArgusConfig loading from argus.yml"
      "core/engine.py": "ArgusEngine orchestrating scanners and aggregating results (delegates to core/prewarm.py for background image pre-warm + lazy pulls in parallel mode). Container path honors three optional Scanner hooks: container_args/build_args (CLI argv), container_env(config)->dict (resolved values land in a subprocess.run env=... dict and docker_cmd carries only ``-e NAME`` flags — values never appear on the docker run command line, closing the ps/docker-inspect leak; None values are filtered so unset env-var-name refs don't materialize at all), and container_mounts(config)->[(host,container)] (extra read-only bind mounts; non-existent host paths are skipped with a WARNING rather than aborting the scan)."
      "core/prewarm.py": "ImagePrewarmer — best-effort background container image pulls. Dedup'd by image ref, capped concurrency (execution.prewarm_workers, default 4), opt-out via execution.prewarm_images: false. Skipped when pull_policy=never. Pre-warm failure falls back to inline pull in _run_in_container."
      "core/exclusions.py": "Path exclusion set (builtins + .gitignore + config + CLI), ``**``-glob matcher"
      "core/schema.py": "argus.yml schema validator. Validates structure, types, allowed values, credential-field shapes, and ZAP's nested ``auth`` sub-block; emits ConfigError objects (ERROR / WARNING) that ``argus validate`` reports. Catches typos, malformed PORT/PROTO entries, and vendor-shaped literal credentials at config-load time. Stdlib-only."
      "core/version.py": "argus version resolution + display helpers. Single source-of-truth read from ``__version__`` (which is itself loaded from ``version.yaml`` at install time via the pyproject.toml dynamic version mechanism)."
      "core/scanner_template.py": "Shared subprocess-scan template + ScanPaths dataclass. Standardized ``build_args(ScanPaths, config)`` shape (PR #117 unification) — scanners declare argv via this template and the engine drives both local and container execution from the same shape. Reused by 9 scanner modules."
      "core/linter_template.py": "FileDiscoveryScanner template + shared docker-fallback helpers (ADR-020). Linters that follow the discover-files → batch-subprocess shape subclass it instead of rolling their own walk. Used by lint-dockerfile and partially by lint-javascript / lint-terraform; the remaining three linters (yaml, json, python) keep custom flows that don't fit the template's shape but can borrow ``build_docker_command`` / ``run_utf8`` helpers."
      "core/redact.py": "Pattern-based secret redaction at Finding construction (ADR-022). REDACTED_PLACEHOLDER constant + redact_secret + redact_high_risk_patterns. Runs in Finding.__post_init__ as a defense-in-depth backstop for scanners that get added without the per-scanner audit; conservative vendor-prefix-only pattern set (gh*, AKIA, AIza, glpat-, sk_live_, npm_, xox*-, JWT, PEM) — no high-entropy heuristics."
      "core/tool_config.py": "Auto-discovery of per-scanner canonical config files (.bandit, .checkov.yaml, trivy.yaml, osv-scanner.toml, semgrep.yml)"
      "core/sbom.py": "SBOM format detection (CycloneDX JSON/XML, SPDX JSON/tag-value, Syft JSON) for ``argus scan --sbom``"
      "core/secrets.py": "Credential resolution for any scanner config field. resolve_secret(config, field, *, stdin_override=None) accepts three forms in precedence order: stdin_override (highest, populated by CLI --*-password-stdin flags via a module-level slot registry — set_stdin_override / get_stdin_override / clear_stdin_overrides), <field>_env (env-var name reference; reads os.environ at scan time), or <field> literal (back-compat, warned at config-load if vendor-shaped via looks_like_literal_secret). The stdin path never reaches the per-scanner config dict so it can't leak into argus-audit.json / argus.log. validate_env_var_name enforces POSIX shell identifier rules. Stdlib-only. Used by scanners.container and scanners.zap; future scanners with credential needs use the same helper. See ADR-024."
      "core/image_verify.py": "Supply-chain verification for container images at pull time. verify_image(ref) classifies the ref into: argus-owned (ghcr.io/huntridge-labs/argus/* — cosign keyless verify against the publish workflow's identity + GitHub Actions OIDC issuer; failure is fatal), third-party with @sha256: digest pin (Docker enforces content-hash match at pull, no cosign call needed), or third-party tag-only (logged once per scan via report_tag_pinned_summary). Engine calls this after _pull_image succeeds; fatal results raise RuntimeError before the scanner runs. Config knob: execution.verify_image_signatures (default True; opt-out for air-gapped). Stdlib + cosign binary on PATH; no Python sigstore dep. See docs/security.md."
      "core/findings_view.py": "Shared UI-free logic for findings display — ViewState, SEVERITY_ORDER, finding_detail_rows, compute_summary, diff_scans (scan-over-scan bucketing keyed off (scanner, id, location)). Consumed by argus view terminal (TUI ``D`` keybind, DiffScreen) and argus view browser (web UI ``/diff`` route)."
      "core/scopes.py": "Finding scope taxonomy. scope_for_finding maps a finding to security / lint / supply-chain from each scanner's category (linter->lint; sca/container/supply-chain->supply-chain; else security) via the live registry with a name-prefix fallback. Drives the scope-organized report output (reporters/scope_views.py)."
      "viewers/": "`argus view` interfaces (optional extras)"
      "viewers/__init__.py": "ViewerUnavailable shared exception"
      "viewers/terminal/": "`argus view --interface=terminal` — Textual TUI ([terminal] extra). Includes DiffPickerScreen + DiffScreen for scan-over-scan diff (``D`` keybind), reusing argus.core.findings_view.diff_scans."
      "viewers/browser/": "`argus view --interface=browser` — FastAPI + Jinja2 web UI, 127.0.0.1 only ([browser] extra). Routes include ``/diff?a=<path>&b=<path>`` powered by argus.core.findings_view.diff_scans, sharing the bucketing logic with the TUI's ``D`` keybind."
      "scanners/": "Scanner modules implementing Scanner protocol (SCANNER_REGISTRY includes linters via auto-merge). The container scanner orchestrates five sub-scanners on every run: trivy (CVE scan), grype (CVE scan, deduplicated against trivy), syft (SBOM), exposure (declared-port surface from docker inspect Config.ExposedPorts), and services (declared-service surface from systemd unit files + SysV init scripts in the image filesystem). The exposure sub-scanner emits one Finding per declared port; INFO severity for ordinary application ports and MEDIUM for ports on the built-in RISKY_PORTS list (SSH 22/tcp, MySQL 3306/tcp, Redis 6379/tcp, PostgreSQL 5432/tcp, MongoDB 27017/tcp, etc.). The services sub-scanner emits one Finding per declared service; INFO severity for ordinary services and MEDIUM for the built-in RISKY_SERVICES watchlist (sshd, postgresql, redis-server, mongod, elasticsearch, etc.). File extraction uses docker create + docker cp tar streams so distroless / scratch images are supported. Config knobs scanners.container.{expose_warn_ports, expose_ignore_ports, services_warn, services_ignore} override or suppress. Private-registry auth flows through the standard secrets resolver: top-level containers.registry_username / registry_password (single-default shortcut) and containers.registry_auth (per-registry map keyed by host or host/path-prefix, longest-prefix matching, no silent fallback when a matched entry's env var is unset — see ADR-028). Resolved credentials are forwarded to Trivy / Grype / Syft via their native env-var names on both the local-binary and container-fallback paths; Grype remote refs are auto-prefixed with registry: so the registry source provider is used inside the anchore/grype container."
      "linters/": "Linter modules implementing Scanner protocol (LINTER_REGISTRY auto-merges into SCANNER_REGISTRY)"
      "reporters/": "Output reporters (terminal, markdown, container_markdown, sarif, json, github, gitlab, junit, openvex). openvex emits a consolidated OpenVEX v0.2.0 document from CVE-mapped component findings (container/SCA only) — see docs/developer/vex-output-spike.md. Discovered via the ``argus.reporters`` Python entry-point group (built-ins declared in pyproject.toml; third-party packages register additional formats without forking — see docs/contributing-reporters.md and ADR-023)."
      "tests/": "Co-located pytest tests (180 tests, 83%+ coverage)"
    scanners:
      - bandit
      - gosec
      - clamav
      - trivy-iac
      - gitleaks
      - osv
      - checkov
      - kics
      - opengrep
      - supply-chain
      - zap
      - container
      - promptfoo
    linters:
      # Implementation patterns:
      #   * lint-dockerfile (HadolintLinter) — subclass of
      #     argus.core.linter_template.FileDiscoveryScanner
      #     (workspace walk → batched subprocess → local-or-container
      #     dispatch → parse). See ADR-020.
      #   * lint-javascript (EslintLinter), lint-terraform — custom
      #     scan() flows that consume the shared
      #     argus.core.linter_template.build_docker_command helper.
      #   * lint-yaml, lint-python — "tool walks workspace itself"
      #     shape; tool takes the path and discovers files internally.
      #   * lint-json — Python json.loads fallback when the jsonlint
      #     binary is absent.
      #   * lint-shell (ShellcheckLinter) — subclass of
      #     FileDiscoveryScanner that overrides scan() to add shebang
      #     sniffing on top of extension globbing (*.sh/.bash/.zsh/.ksh
      #     plus #!/bin/sh-style scripts). Docker fallback via the
      #     koalaman/shellcheck-alpine image.
      - lint-yaml
      - lint-json
      - lint-python
      - lint-javascript
      - lint-dockerfile
      - lint-terraform
      - lint-shell
    reporters:
      - terminal
      - markdown
      - sarif
      - json
      - github
      - gitlab
      - junit
      - openvex
    dependencies:
      core: "pyyaml, click, jsonschema, rich (terminal output), packaging"
      optional_extras:
        terminal: "textual (TUI viewer)"
        browser: "fastapi, uvicorn, jinja2 (web viewer, 127.0.0.1 only)"
        mcp: "mcp Python SDK (stdio transport)"
    config_file: "argus.yml"
    cli_commands:
      - "argus scan [scanner] --path --config --severity-threshold --format [--interface=terminal|browser]"
      - "argus scan container [--config argus.yml | --image REF | --discover [PATH]] [--scanners trivy,grype,exposure,services] [--no-keep-raw]"
      - "argus init [--force] — generate tailored argus.yml from auto-detection"
      - "argus validate — JSON Schema validation of the auto-detected argus.yml"
      - "argus report <format> --results-dir --output-dir — re-emit canonical results"
      - "argus view [terminal|browser] [PATH] [--port N] [--no-open]"
      - "argus mcp — start MCP server over stdio"
      - "argus completion {bash,zsh,fish} — shell completion (dynamic from registry)"
      - "argus cache info|clean — manage scanner DB cache volumes"
      - "argus --version — top-level flag (no `argus version` subcommand exists)"

directory_structure:
  "argus/": "Standalone Python SDK (primary interface, ADR-013)"
  "argus/core/": "Core models, protocols, config, and engine"
  "argus/scanners/": "Scanner modules (one per scanner, SCANNER_REGISTRY includes linters)"
  "argus/linters/": "Linter modules (one per linter, LINTER_REGISTRY auto-merges into SCANNER_REGISTRY)"
  "argus/reporters/": "Output reporters (terminal, markdown, sarif, json, github, gitlab, junit, openvex)"
  "argus/tests/": "SDK test suite"
  ".github/actions/": "Composite actions (GitHub Actions interface)"
  ".github/workflows/": "CI/CD and test workflows"
  ".github/actions/*/schemas/": "JSON schemas co-located with each action"
  ".github/actions/*/.docsite.yml": "Per-action docsite category declaration"
  "scripts/docsite/": "Auto-generated documentation site package"
  "docsite.yml": "Documentation site configuration (categories, icons, exclusions)"
  "examples/workflows/": "User-facing workflow examples"
  "examples/configs/": "Configuration file examples"
  "tests/": "Test infrastructure"
  "tests/fixtures/": "Shared test data"
  "docs/": "Detailed documentation"
  "docs/config-reference.md": "Full argus.yml configuration specification"
  "argus-config.schema.json": "JSON Schema for argus.yml validation and IDE support"
  "hardening-dagger/": "Python reporting utility (separate module)"

constraints:
  technical:
    - "SARIF files must be < 10MB for GitHub upload"
    - "Matrix jobs limited to 256 per workflow"
    - "Composite actions can't use services: or container:"
    - "GHES versions vary - can't assume latest features"

  organizational:
    - "Must support air-gapped environments (no external API calls)"
    - "License: AGPL-3.0 (copyleft implications)"
