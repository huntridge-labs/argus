version: '2.0'
architecture:
  description: The argus Python SDK is the primary interface. Composite actions provide GitHub Actions
    integration.
  primary:
    location: argus/
    pattern: Python SDK + CLI
    version: 0.7.2
    status: production
    advantage: Platform-independent, works locally and in any CI; canonical argus-results.json shared
      across source-scan, container-scan, and MCP flows
    cli: 'argus scan --config argus.yml  (or: python -m argus scan --config argus.yml)'
  actions:
    location: .github/actions/
    pattern: Composite actions
    status: production
    advantage: GHES compatible, self-contained GitHub Actions integration
components:
  argus-sdk:
    location: argus/
    purpose: Primary interface for running Argus scanners locally or in CI
    type: sdk
    cli: python -m argus scan --config argus.yml
    structure:
      cli.py: argparse CLI with scan, cache, and report subcommands
      init.py: argus init project bootstrap and banner rendering from img/argus_logo.txt
      containers.py: Container image manifest, version enforcement, and DB cache volume mounts (CACHE_MOUNTS)
      core/models.py: Severity enum, Finding/ScanResult/ScanSummary dataclasses
      core/scanner.py: Scanner Protocol definition
      core/config.py: ArgusConfig loading from argus.yml
      core/config_options.py: 'Machine-readable config surface (versioned in the wheel). ConfigOption/NativeIgnore + BASE_OPTIONS + curated per-scanner knobs; config_surface() returns argus version + JSON schema + registry + every scanner''s options and how to ignore findings (skip_check / expose_ignore_ports / rules_file / native .trivyignore etc.). Scanners may also declare config_options/native_ignore on the class. Consumed by config UIs (Console, Argus Cloud) so they render the exact installed version''s knobs with no separate schema to sync.'
      core/engine.py: 'ArgusEngine orchestrating scanners and aggregating results (delegates to core/prewarm.py
        for background image pre-warm + lazy pulls in parallel mode). Container path honors three optional
        Scanner hooks: container_args/build_args (CLI argv), container_env(config)->dict (resolved values
        land in a subprocess.run env=... dict and docker_cmd carries only ``-e NAME`` flags — values never
        appear on the docker run command line, closing the ps/docker-inspect leak; None values are filtered
        so unset env-var-name refs don''t materialize at all), and container_mounts(config)->[(host,container)]
        (extra read-only bind mounts; non-existent host paths are skipped with a WARNING rather than aborting
        the scan).'
      core/prewarm.py: 'ImagePrewarmer — best-effort background container image pulls. Dedup''d by image
        ref, capped concurrency (execution.prewarm_workers, default 4), opt-out via execution.prewarm_images:
        false. Skipped when pull_policy=never. Pre-warm failure falls back to inline pull in _run_in_container.'
      core/exclusions.py: Path exclusion set (builtins + .gitignore + config + CLI), ``**``-glob matcher
      core/schema.py: argus.yml schema validator. Validates structure, types, allowed values, credential-field
        shapes, and ZAP's nested ``auth`` sub-block; emits ConfigError objects (ERROR / WARNING) that
        ``argus validate`` reports. Catches typos, malformed PORT/PROTO entries, and vendor-shaped literal
        credentials at config-load time. Stdlib-only.
      core/version.py: argus version resolution + display helpers. Single source-of-truth read from ``__version__``
        (which is itself loaded from ``version.yaml`` at install time via the pyproject.toml dynamic version
        mechanism).
      core/scanner_template.py: 'Shared subprocess-scan template + ScanPaths dataclass. Standardized ``build_args(ScanPaths,
        config)`` shape (PR #117 unification) — scanners declare argv via this template and the engine
        drives both local and container execution from the same shape. Reused by 9 scanner modules.'
      core/linter_template.py: FileDiscoveryScanner template + shared docker-fallback helpers (ADR-020).
        Linters that follow the discover-files → batch-subprocess shape subclass it instead of rolling
        their own walk. Used by lint-dockerfile and partially by lint-javascript / lint-terraform; the
        remaining three linters (yaml, json, python) keep custom flows that don't fit the template's shape
        but can borrow ``build_docker_command`` / ``run_utf8`` helpers.
      core/redact.py: Pattern-based secret redaction at Finding construction (ADR-022). REDACTED_PLACEHOLDER
        constant + redact_secret + redact_high_risk_patterns. Runs in Finding.__post_init__ as a defense-in-depth
        backstop for scanners that get added without the per-scanner audit; conservative vendor-prefix-only
        pattern set (gh*, AKIA, AIza, glpat-, sk_live_, npm_, xox*-, JWT, PEM) — no high-entropy heuristics.
      core/tool_config.py: Auto-discovery of per-scanner canonical config files (.bandit, .checkov.yaml,
        trivy.yaml, osv-scanner.toml, semgrep.yml)
      core/sbom.py: SBOM format detection (CycloneDX JSON/XML, SPDX JSON/tag-value, Syft JSON) for ``argus
        scan --sbom``
      core/secrets.py: 'Credential resolution for any scanner config field. resolve_secret(config, field,
        *, stdin_override=None) accepts three forms in precedence order: stdin_override (highest, populated
        by CLI --*-password-stdin flags via a module-level slot registry — set_stdin_override / get_stdin_override
        / clear_stdin_overrides), <field>_env (env-var name reference; reads os.environ at scan time),
        or <field> literal (back-compat, warned at config-load if vendor-shaped via looks_like_literal_secret).
        The stdin path never reaches the per-scanner config dict so it can''t leak into argus-audit.json
        / argus.log. validate_env_var_name enforces POSIX shell identifier rules. Stdlib-only. Used by
        scanners.container and scanners.zap; future scanners with credential needs use the same helper.
        See ADR-024.'
      core/image_verify.py: 'Supply-chain verification for container images at pull time. verify_image(ref)
        classifies the ref into: argus-owned (ghcr.io/huntridge-labs/argus/* — cosign keyless verify against
        the publish workflow''s identity + GitHub Actions OIDC issuer; failure is fatal), third-party
        with @sha256: digest pin (Docker enforces content-hash match at pull, no cosign call needed),
        or third-party tag-only (logged once per scan via report_tag_pinned_summary). Engine calls this
        after _pull_image succeeds; fatal results raise RuntimeError before the scanner runs. Config knob:
        execution.verify_image_signatures (default True; opt-out for air-gapped). Stdlib + cosign binary
        on PATH; no Python sigstore dep. The verification outcome is also recorded (not just enforced) in argus-results.json as a top-level ``toolchain`` block built by core/toolchain.py — per scanner image: digest, verification status, argus_owned, and whether an argus-owned image''s digest matches a published CUSTOM_IMAGES pin; plus argus_images_all_verified + warnings (#240). argus-results.json also carries a top-level ``addons`` block — the installed Argus add-on packages (name/version/groups) discovered generically from the plugin entry-point groups (core/addons.py, populated by the engine onto ScanSummary.addons); ``argus --version`` lists them too. When reporting.attest is set, core/attest.py signs the scan attestation with keyless cosign — an in-toto Statement (OpenVEX predicate; subject = scanned image digests + repo commit) written as an unsigned statement + a sign-blob bundle (standalone), plus a registry-attached cosign attest for pushed images (#241). See docs/security.md.'
      core/findings_view.py: Shared UI-free logic for findings display — ViewState, SEVERITY_ORDER, finding_detail_rows,
        compute_summary, diff_scans (scan-over-scan bucketing keyed off (scanner, id, location)). Consumed
        by argus view terminal (TUI ``D`` keybind, DiffScreen) and argus view browser (web UI ``/diff``
        route).
      core/scopes.py: 'Finding scope taxonomy. scope_for_finding maps a finding to security / lint / supply-chain from each scanner''s category (linter->lint; sca/container/supply-chain->supply-chain; else security) via the live registry with a name-prefix fallback. Drives the scope-organized report output (reporters/scope_views.py).'
      core/plugin_runtime.py: 'Container sandbox for untrusted third-party plugins (ADR-031, prototype). build_sandbox_argv emits a hardened docker run (no network, read-only rootfs, cap-drop ALL, no-new-privileges, non-root, resource limits, target ro at /scan, digest-pinned image, no host env/socket); validate_findings sanitizes untrusted argus.plugin.v1 output (schema / severity / length / control-chars / location-traversal); plugin_provenance + trust tiers (first-party / verified / unverified) record each plugin in the attestation. See docs/plugin-sandbox.md.'
      core/run_discovery.py: Shared UI-free scan-run discovery — discover_runs (sibling runs newest-first with
        finding count + worst severity), list_directory (one-level picker listing), peek_run_stats, is_within,
        and the canonical RESULTS_FILENAME. Consumed by the terminal runs sidebar (run switching) and the
        browser picker + recent-runs dropdown, so both viewers agree on what counts as a run.
      core/console_config.py: UI-free user preferences for the Argus Console (theme, accent, animations,
        reduced_motion, notifications). load/save to $XDG_CONFIG_HOME/argus/console.yml (pyyaml only),
        defaults-on-garbage, plus advance()/display_rows() driving the Settings screen. Distinct from
        argus.yml (project scan config).
      core/remediation.py: UI-free Tier-1 fix engine (deterministic, OSS, no AI). propose(finding,
        repo_root)/apply()/is_fixable() turn a dependency finding (package + fixed_version + purl) into a
        unified-diff bump of requirements*.txt (pip) or package.json (npm), preserving the version-spec style,
        with an ecosystem-command fallback. Drives the terminal viewer's ``F`` Fix overlay; AI tier (scn/ai.py)
        and action SHA-pinning / opengrep autofix are later phases (docs/developer/CONSOLE-ROADMAP.md).
      core/enrichment.py: UI-free live vulnerability intelligence (Phase 6). EnrichmentService.enrich(cve_ids)
        fetches EPSS (FIRST.org, exploit probability) + CISA KEV (actively-exploited) with an on-disk TTL cache
        and injectable HTTP/clock; risk_score(severity, enrichment) blends severity x EPSS x KEV (KEV floors at
        0.9) for re-ranking; risk_badge / enrichment_detail_rows render it. Opt-in, offline-degrading, sends only
        public CVE ids. Drives the terminal viewer's ``i`` Intel action (EPSS/KEV/Risk in the detail pane) and
        the browser viewer's opt-in (ARGUS_VIEW_ENRICH) Risk column. Reachability stays terminal-only (source
        scan = trusted shell, not the read-only browser).
      core/suppressions.py: UI-free bulk-triage → OpenVEX + scanner ignore files (Phase 7). decision_for(action,
        ...) maps a triage action (false_positive/not_exploitable/accept_risk/investigating) to a TriageDecision;
        build_vex_document / merge_vex_documents emit + merge an OpenVEX v0.2.0 doc (audit trail = status,
        justification, reason, author, timestamp; keyed by CVE+product, idempotent @id); trivyignore_entries /
        gitleaksignore_entries + write_suppressions append to .trivyignore/.gitleaksignore (never clobber). Reuses
        the OpenVEX vocabulary of the reporters/attest layer; drives the terminal viewer's ``S`` Suppress action.
      core/trends.py: UI-free dependency-free visual analytics (Phase 8). sparkline (Unicode ▁-█) +
        bar_chart (Unicode █ bars), severity_breakdown / scanner_breakdown over findings, run_count_series /
        trend_summary over discover_runs history (findings-over-time + are-we-improving delta). No chart
        library — renders in any terminal, keeping the dependency surface minimal. Drives the terminal
        dashboard's (``d``) charts.
      core/terminal_caps.py: UI-free terminal capability detection (Phase 9 graphics foundation). detect_graphics
        (kitty/iterm/sixel/none from env), supports_graphics / supports_hyperlinks / supports_truecolor,
        capability_summary. Env-only (no escape probing), dependency-free; the foundation richer inline-image
        rendering (textual-image, capability-gated, ASCII fallback) would build on. Surfaced in the Console help.
      core/ai_triage.py: UI-free AI-assisted triage (Phase 10 foundation). Reuses scn/ai.py providers
        (create_provider / resolve_api_key, provider.call(prompt)). explain_prompt / fix_prompt + triage_explain /
        triage_fix run against an injected provider (mocked in tests). provider_from_env is local-first —
        ARGUS_AI_LOCAL/OLLAMA_HOST gives a keyless local Ollama endpoint, ARGUS_AI_PROVIDER + key gives cloud,
        else off. Drives the terminal viewer's ``x`` Explain overlay; model output is advisory (fixes still gate
        through the Phase-1 diff preview, never auto-applied).
      core/reachability.py: UI-free reachability heuristic (Phase 12 first cut). is_imported(package, ecosystem,
        root) + reachability_of(finding) answer "is the vulnerable dependency even imported in source?" via a
        bounded, dependency-free pip/npm import scan (build/vendor dirs skipped, early-exit, cached). Returns
        imported / not-imported / unknown; labelled "imported in source" (NOT "reachable" — true call-graph
        reachability stays roadmap research). Shows a Reachability row in the terminal viewer's detail pane.
      core/svg_charts.py: UI-free dependency-free inline-SVG charts (Phase B1). donut / severity_donut (center
        override), trend_line (pathLength=1 for CSS draw-on), bar_chart — labels XML-escaped. Lives in core so
        the browser dashboard and the formal report (Phase B4) share one renderer. Drives the browser dashboard's
        severity donut + findings-over-time trend + by-scanner bars, with count-up.js + a prefers-reduced-motion
        gated motion layer (View Transitions API, staggered reveal, draw-on) and a Cmd/Ctrl-K command palette
        (command-palette.js — vanilla, CSP-safe, indexes page nav links) in viewers/browser/static.
      core/system_status.py: UI-free Console-home readiness checks. compute_status(scanner_names, backend, *probes)
        → SystemStatus (verdict ok/warn/down + glyph + summary) over StatusCheck rows — Docker daemon state
        (probe_docker), local-tool availability per scanner (probe_local_tools over is_available), and cached
        Argus image-digest match vs toolchain._published_argus_digests (probe_cached_image_digests; skipped when
        Docker is off). Docker is only *blocking* when the effective execution.backend needs it with no local
        fallback. All probes injectable for tests; effective_backend() reads execution.backend best-effort. Drives
        the home chip (computed in a background worker) + SystemStatusScreen.
      viewers/: '`argus view` interfaces (optional extras)'
      viewers/__init__.py: ViewerUnavailable shared exception
      viewers/terminal/: '`argus view --interface=terminal` — Textual TUI ([terminal] extra). Includes
        DiffPickerScreen + DiffScreen for scan-over-scan diff (``D`` keybind), reusing argus.core.findings_view.diff_scans.
        A runs sidebar (``b``) lists discovered runs via argus.core.run_discovery and switches between them in place;
        ``O`` opens a filesystem ResultsPickerScreen (results_picker.py formats rows over run_discovery.list_directory)
        to load a scan from another directory — also shown automatically when no scan resolves in the launch dir
        (so bare ``argus`` → View findings navigates to a scan instead of exiting), via a shared BrowseApp._try_load;
        ``R`` runs argus scan in-app (runs_sidebar.py formats rows, scan_runner.py builds the argv,
        RunScanPromptScreen + RunScanScreen stream it) and reloads results when it finishes. Right-click context
        menus anchor at the cursor via mouse_actions.clamp_menu_offset. the UI-free modules this builds on stay in
        core: argus.core.run_discovery (run listing), argus.core.console_config (Console preferences),
        argus.core.system_status (Docker daemon / local-tool / cached-image-digest readiness checks), and
        argus.core.terminal_caps (graphics-capability detection). bare ``argus`` defers to an installed Console
        provider (the ``argus.console_providers`` entry-point group) in an interactive TTY via
        cli._run_bare_argus / cli._discover_console_provider; with no provider it prints a one-line pointer and
        falls back to --help (non-interactive contexts always get --help). ``argus view`` deep-links to the
        findings viewer. The core ships no built-in Console home — the home experience is delivered by a provider
        through the seam (mirrors reporters / browser plugins; OSS ships none). An installed package can also add
        explicit subcommands via the ``argus.cli_commands`` seam (cli._discover_cli_command_registrars, dispatched
        through args.func); enterprise registers ``argus console`` there. Known-but-uninstalled enterprise command
        names (cli.ENTERPRISE_COMMANDS, e.g. ``console``) are NOT added to --help and, when typed, print an
        add-on pointer to huntridgelabs.com (cli._enterprise_command_upsell) instead of an argparse error. See ADR-034.'
      viewers/browser/: '`argus view --interface=browser` — FastAPI + Jinja2 web UI, 127.0.0.1 only ([browser]
        extra). Routes include ``/diff?a=<path>&b=<path>`` powered by argus.core.findings_view.diff_scans,
        sharing the bucketing logic with the TUI''s ``D`` keybind. Report generation (the formal vulnerability
        report — HTML *and* one-click server-side PDF) is NOT in OSS: an installed browser plugin provides both
        the ``/report`` and ``/report.pdf`` routes via the ``argus.viewers.browser_plugins`` seam (OSS ships
        none). Serving the report as HTML in OSS would let a browser print it to PDF and give away the paid
        artifact, so the whole report is an add-on. When no plugin claims them, create_app registers a 402 upsell
        on /report + /report.pdf (app._mount_report_upsell, after plugin mount so an installed plugin is never
        shadowed) — a friendly "Enterprise feature" pointer rather than a bare 404. The opt-in Risk column (ARGUS_VIEW_ENRICH=1 / enrich=True) adds EPSS + CISA KEV
        scoring to /findings via argus.core.enrichment; reachability stays terminal-only by design (read-only/no
        source scan). A persistent sticky scan-context bar (project / commit / scan time / finding count, built by
        _context_bar + threaded through _base_context) sits under the header on the dashboard / findings / log
        views; omitted on the picker / diff where no single scan is in scope (B0 IA — top-nav + context bar chosen
        over a left sidebar). Plugin seam: create_app discovers the
        ``argus.viewers.browser_plugins`` entry-point group and lets each registered ``register(app)`` callable add
        routes/capabilities (mirrors argus.reporters; OSS ships none, a bad plugin is logged + skipped); it exposes
        app.state.load_scan as the helper surface plugins build on (a report add-on resolves the active scan
        with it, then builds + renders its own report). See ADR-033, ADR-034.'
      scanners/: 'Scanner modules implementing Scanner protocol (SCANNER_REGISTRY includes linters via
        auto-merge). The container scanner orchestrates five sub-scanners on every run: trivy (CVE scan),
        grype (CVE scan, deduplicated against trivy), syft (SBOM), exposure (declared-port surface from
        docker inspect Config.ExposedPorts), and services (declared-service surface from systemd unit
        files + SysV init scripts in the image filesystem). The exposure sub-scanner emits one Finding
        per declared port; INFO severity for ordinary application ports and MEDIUM for ports on the built-in
        RISKY_PORTS list (SSH 22/tcp, MySQL 3306/tcp, Redis 6379/tcp, PostgreSQL 5432/tcp, MongoDB 27017/tcp,
        etc.). The services sub-scanner emits one Finding per declared service; INFO severity for ordinary
        services and MEDIUM for the built-in RISKY_SERVICES watchlist (sshd, postgresql, redis-server,
        mongod, elasticsearch, etc.). File extraction uses docker create + docker cp tar streams so distroless
        / scratch images are supported. Config knobs scanners.container.{expose_warn_ports, expose_ignore_ports,
        services_warn, services_ignore} override or suppress. Private-registry auth flows through the
        standard secrets resolver: top-level containers.registry_username / registry_password (single-default
        shortcut) and containers.registry_auth (per-registry map keyed by host or host/path-prefix, longest-prefix
        matching, no silent fallback when a matched entry''s env var is unset — see ADR-028). Resolved
        credentials are forwarded to Trivy / Grype / Syft via their native env-var names on both the local-binary
        and container-fallback paths; Grype remote refs are auto-prefixed with registry: so the registry
        source provider is used inside the anchore/grype container.'
      linters/: Linter modules implementing Scanner protocol (LINTER_REGISTRY auto-merges into SCANNER_REGISTRY)
      reporters/: Output reporters (terminal, markdown, container_markdown, sarif, json, github, gitlab,
        junit, openvex). openvex emits a consolidated OpenVEX v0.2.0 document from CVE-mapped component findings (container/SCA only). Discovered via the ``argus.reporters`` Python entry-point group (built-ins declared in
        pyproject.toml; third-party packages register additional formats without forking — see docs/contributing-reporters.md
        and ADR-023).
      preflight/: 'CI preflight: provider detection, living issue reporting (GitHub/GitLab), network deps,
        scanner tool-readiness checks (tool_check.py)'
      audit/: Structured audit trail for every scan run. logger.py emits JSONL log records (one per line)
        into ``argus-results/.../argus.log``; manifest.py writes the per-run AuditManifest summary into
        ``argus-audit.json``. secrets.py provides mask_secrets (regex masking for token=, password=, Bearer,
        URL-creds, GitHub PATs, AWS access keys, sk-keys) and the mask_secrets_in_obj recursive walker.
        Both write paths run mask_secrets_in_obj at serialization time as defense-in-depth — if a future
        contributor accidentally captures a docker_cmd / env dict / credential-shaped argv into a manifest
        field or log entry, the redaction pass catches it before the file lands. Both logger formatters
        mask the rendered ``record.getMessage()`` rather than ``record.msg`` to avoid corrupting %s format
        strings whose placeholders match secret-shaped patterns.
  argus-linters:
    location: argus/linters/
    purpose: Linter modules implementing Scanner protocol for code style and syntax checks
    type: sdk-subpackage
    registry: LINTER_REGISTRY (auto-merges into SCANNER_REGISTRY at import time)
    naming_convention: lint-<tool> prefix (e.g., lint-yaml, lint-python)
    severity: Severity.INFO for all findings
    structure:
      __init__.py: LINTER_REGISTRY + get_linter() + auto-merge into SCANNER_REGISTRY
      yamllint.py: YAML linting via yamllint
      jsonlint.py: JSON linting
      python_lint.py: Python linting
      eslint.py: JavaScript / TypeScript linting via ESLint
      hadolint.py: Dockerfile linting via hadolint
      terraform.py: Terraform linting
  composite-actions:
    location: .github/actions/scanner-*/
    purpose: Self-contained scanner actions
    type: action
    structure:
      action.yml: Inputs, outputs, steps
      .docsite.yml: Category declaration for auto-generated documentation site
      scripts/parse-results.py: Scanner output → JSON
      scripts/generate-summary.py: JSON → Markdown
      tests/: Co-located pytest tests
    pr_commenting:
      has_step: true
      default: false
      condition: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: .github/actions/comment-pr/action.yml
      purpose: Allows standalone scanner usage with individual PR comments
  config-parsers:
    location: .github/actions/parse-*/
    purpose: Convert YAML/JSON configs to GitHub Actions matrix
    type: utility
    outputs: JSON array for matrix strategy
    instances:
    - parse-container-config
    - parse-zap-config
  summary-generators:
    location: .github/actions/*-summary/
    purpose: Aggregate results into unified summaries
    type: utility
    instances:
    - security-summary
    - linting-summary
    security-summary_inputs:
      scan_statuses: 'Optional JSON object mapping scanner name -> job result

        (success|failure|cancelled|skipped). When provided, a status table

        is rendered at the top of the report and the composite exits non-zero

        on any failure unless `fail_on_scanner_failure` is set to "false".

        '
      fail_on_scanner_failure: 'Default "true". When combined with `scan_statuses`, drives the

        composite''s own exit code so consumer workflows fail on any scanner

        that did not succeed.

        '
    security-summary_script: .github/actions/security-summary/scripts/generate_summary.py
    security-summary_tests: tests/integration/test_security_summary.py
    linting-summary_inputs:
      scan_statuses: 'Optional JSON object mapping linter name -> job result

        (success|failure|cancelled|skipped). When provided, a status table

        is rendered at the top of the report and the composite exits non-zero

        on any failure unless `fail_on_scanner_failure` is set to "false".

        '
      fail_on_scanner_failure: 'Default "true". When combined with `scan_statuses`, drives the

        composite''s own exit code so consumer workflows fail on any linter

        that did not succeed.

        '
    linting-summary_script: .github/actions/linting-summary/scripts/generate_summary.py
    linting-summary_tests: tests/integration/test_linting_summary.py
  agent-skills:
    location: .agents/skills/
    purpose: Portable Agent Skills bundles that help skills-compatible agents bring Argus into local development
      workflows and align those checks with CI coverage.
    type: agent-skill
    structure:
      SKILL.md: Agent Skills metadata and instructions
      references/REFERENCE.md: Scanner matrix, platform routing guidance, local act recipes, trigger caveats,
        and workflow recipes
    instances:
    - argus-scanner-selection
  argus-mcp:
    location: argus/mcp.py
    purpose: MCP server for AI assistant integration
    type: mcp-server
    tools:
    - argus_scan
    - argus_list_scanners
    - argus_validate
    - argus_detect
    - argus_init
    - argus_classify
    - argus_explain_finding
    - argus_scan_summary
    resources:
    - argus://config
    - argus://results/latest
    - argus://config/schema
    - argus://architecture
    prompts:
    - security_review
    - fix_findings
    - setup_scanning
    transport: stdio
    install: pip install argus-security[mcp]
    configuration:
      mcpServers:
        argus:
          command: argus
          args:
          - mcp
  architecture-map:
    location: scripts/docsite/architecture.py
    purpose: Interactive SDK architecture diagram — columns × flows × per-node side panel.
    type: documentation-page
    note: 'Derives its JSON view model from this file (.ai/architecture.yaml) at

      build time. The transformer is a pure function from canonical YAML

      plus runtime SDK introspection (SCANNER_REGISTRY, LINTER_REGISTRY,

      argus.reporters entry-point group, argparse subcommands). No

      hand-edited JSON mirror is committed; see ADR-026.

      '
    consumers:
    - Docsite build (scripts/docsite/builder.py → docs/architecture.md inside MkDocs Material)
    - argus mcp → argus://architecture resource
    structure:
      scripts/docsite/architecture.py: Canonical view-model transformer + inline-markdown renderer (writes
        docs/architecture.md + copies CSS/JS to docs/assets/)
      argus/architecture_map.py: Runtime shim that re-exports the transformer for installed-package consumers
        (MCP)
      argus/viewers/browser/static/architecture.css: Column / flow / panel styling — sourced by the docsite
        build, copied into docs/assets/
      argus/viewers/browser/static/architecture.js: Vanilla JS — column rendering, flow highlight, picker
        mode, URL state, copy buttons, tour
      scripts/ci/check_architecture_sync.py: 'CI gate: registries / entry-points / CLI must match the
        YAML'
    related_adrs:
    - ADR-026
  scn-detector:
    location: .github/actions/scn-detector/
    purpose: FedRAMP Significant Change Notification detection and classification
    type: compliance-action
    description: Analyzes IaC changes and classifies them per FedRAMP 20X SCN guidelines
    classification_method: Hybrid (rule-based + multi-provider AI fallback)
    supported_formats:
    - terraform
    - kubernetes
    - cloudformation
    ai_providers:
      supported:
      - anthropic
      - openai
      default: anthropic
      configurable_via: ai_fallback section in scn-config.yml
      env_vars:
        anthropic: ANTHROPIC_API_KEY
        openai: OPENAI_API_KEY
      features:
      - SDK-first with raw HTTP fallback
      - Custom base URL for OpenAI-compatible APIs (Azure, Ollama)
      - Configurable model, confidence threshold, max tokens
    structure:
      action.yml: Composite action with 12 steps (includes config validation)
      schemas/scn-config.schema.json: JSON Schema draft-07 for SCN config validation
      scripts/analyze_iac_changes.py: Git diff → IaC change extraction
      scripts/classify_changes.py: Rule-based + AI classification engine (validates config on load)
      scripts/validate_scn_config.py: Config validator (dict-based, no jsonschema dependency)
      scripts/ai_classifier.py: AI classification orchestrator (provider-agnostic)
      scripts/ai_providers.py: Provider abstraction (Anthropic, OpenAI)
      scripts/generate_scn_report.py: Markdown + JSON report generation
      scripts/create_scn_issue.py: GitHub Issue creator with timelines
      tests/: pytest test suite with 80%+ coverage
    outputs:
    - PR comments with collapsible SCN analysis
    - GitHub Issues with compliance timelines
    - JSON audit trail (90-day retention)
    categories:
      routine: No notification required
      adaptive: Within 10 business days after
      transformative: 30 days initial + 10 days final + after
      impact: New assessment required
scanners:
  sast:
  - name: codeql
    purpose: Multi-language semantic code analysis
    languages:
    - python
    - javascript
    - typescript
    - go
    - java
    - cpp
    - ruby
    - csharp
    - swift
    - kotlin
  - name: bandit
    purpose: Python-specific security linter
    languages:
    - python
  - name: gosec
    purpose: Go-native security linter (G101 hardcoded creds, G201 SQL injection, G304 path traversal,
      etc.)
    languages:
    - go
  - name: opengrep
    purpose: Pattern-based multi-language scanning
    languages:
    - multi
  - name: mumps
    purpose: 'MUMPS / M language SAST — taint-tracked code-injection sinks (XECUTE, indirection, OPEN/USE, dynamic dispatch, external $& calls), hardcoded credentials, and portability/correctness diagnostics. 28 rules across security + lint profiles; full rule list + config in docs/scanners.md.'
    languages:
    - mumps
  secrets:
  - name: gitleaks
    purpose: Git history and file secrets detection
    output: SARIF
  container:
  - name: trivy
    purpose: Container vulnerability scanning
    output: SARIF
  - name: grype
    purpose: Container vulnerability scanning (alternative)
    output: SARIF
  - name: syft
    purpose: SBOM generation
    output: SPDX/CycloneDX
  infrastructure:
  - name: trivy-iac
    purpose: Terraform, Kubernetes, CloudFormation scanning
    output: SARIF
  - name: checkov
    purpose: IaC policy-as-code scanning
    output: SARIF
  - name: kics
    purpose: Multi-format IaC scanning — Ansible, Bicep, Helm, Terraform, Kubernetes, Dockerfile, CloudFormation,
      OpenAPI
    output: JSON
    note: 'Checkmarx KICS (Apache-2.0). Runs concurrently with trivy-iac/checkov — they catch different
      things on the same target (issue #188)'
  dependencies:
  - name: osv
    purpose: Dependency vulnerability scanning via OSV database
    output: JSON/SARIF
    note: Any trigger, uses official google/osv-scanner-action Docker image
  - name: dependency-review
    purpose: PR dependency diff analysis and license compliance
    output: JSON
    note: PR-only, graceful skip on non-PR events
  malware:
  - name: clamav
    purpose: File-based malware detection
    output: text
  dast:
  - name: zap
    purpose: Dynamic web application testing
    output: SARIF
  llm_security:
  - name: promptfoo
    purpose: LLM red-team / eval — prompt injection, jailbreaks, PII leakage (OWASP LLM Top 10)
    output: JSON
    note: Opt-in (not in 'all'); container-first; requires provider API keys (OpenAI/Anthropic/etc.) +
      network at scan time. Keys resolved via argus.core.secrets env-var indirection; adversarial prompts
      and model responses are never echoed into findings. See ADR-024 credential pattern.
  supply_chain:
  - name: supply-chain
    purpose: GitHub Actions workflow security scanning via zizmor + actionlint
    output: JSON/SARIF
    note: Uses zizmorcore/zizmor-action and actionlint for comprehensive workflow security
  compliance:
  - name: scn-detector
