# .ai/workflows.yaml
# Common tasks with exact commands and step-by-step instructions
# AICaC Specification v1.0

version: "1.0"

# ==============================================================================
# USER WORKFLOWS - For consumers of this project
# ==============================================================================

user_workflows:

  basic_security_scan:
    description: "Run all security scanners on a repository"
    category: scanning
    sdk_command: "python -m argus scan --config argus.yml"
    code: |
      # argus.yml
      scanners:
        - gitleaks
        - bandit
        - opengrep
        - osv
        - trivy-iac
        - checkov

      scan_path: "."
      severity_threshold: high
    requirements:
      - "Python 3.11+"
      - "pyyaml package"

  fast_sast_only:
    description: "Quick SAST scan for rapid feedback"
    category: scanning
    when_to_use: "Local development, rapid iteration"
    sdk_command: "python -m argus scan gitleaks opengrep bandit --severity-threshold high"

  container_scanning:
    description: "Scan container images"
    category: scanning
    sdk_command: "python -m argus scan container --severity-threshold high"

  individual_scanner:
    description: "Use a single scanner via SDK or composite action"
    category: scanning
    sdk_command: "python -m argus scan bandit --severity-threshold high"
    action_code: |
      - uses: huntridge-labs/argus/.github/actions/scanner-bandit@0.7.0
        with:
          path: src/
          fail_on_severity: high
          enable_sarif_upload: true

  dependency_scanning:
    description: "Scan dependencies for known vulnerabilities"
    category: scanning
    when_to_use: "Any environment"
    sdk_command: "python -m argus scan osv --severity-threshold high"

  infrastructure_scanning:
    description: "Scan Terraform, Kubernetes, CloudFormation"
    category: scanning
    sdk_command: "python -m argus scan trivy-iac checkov --severity-threshold high"

  sbom_scanning:
    description: "Scan a pre-built SBOM (CycloneDX / SPDX / Syft JSON) instead of a filesystem"
    category: scanning
    when_to_use: "Vendor-supplied SBOMs, scan results from another build system"
    sdk_command: "python -m argus scan --sbom path/to/sbom.json"
    notes: |
      When --sbom is a directory, argus walks it recursively and scans every
      recognized SBOM. Auto-enables osv, grype, and trivy (the three
      SBOM-capable scanners) regardless of argus.yml; filesystem-only
      scanners are skipped since they have nothing to scan.

  interactive_triage:
    description: "Post-scan interactive findings browser (TUI)"
    category: triage
    when_to_use: "Local triage after a scan; reviewing per-product findings; executive summary for owners/managers"
    sdk_command: "argus browse ./argus-results"
    one_liner: "argus scan --interactive"
    requirements:
      - "Python 3.11+"
      - "argus-security[browse] extra (installs Textual)"
    notes: |
      `argus scan --interactive` scans and then launches the browser against
      the just-written results directory. Inside the TUI: / to search,
      1/2/3/4 for severity filters, p for product, c for scanner, s to sort,
      e to export CSV, d for executive dashboard, ? for help, Ctrl+P for
      command palette. Full reference in docs/browse.md.

  fedramp_scn_detection:
    description: "FedRAMP Significant Change Notification detection and tracking"
    category: compliance
    when_to_use: "FedRAMP-authorized systems, compliance-required IaC changes"
    code: |
      name: FedRAMP SCN Detection
      on:
        pull_request:
          paths:
            - 'terraform/**'
            - 'kubernetes/**'
            - 'cloudformation/**'

      permissions:
        contents: read
        pull-requests: write
        issues: write

      jobs:
        scn-detection:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6
              with:
                fetch-depth: 0  # Required for git diff

            - uses: huntridge-labs/argus/.github/actions/scn-detector@0.7.0
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              with:
                config_file: '.github/scn-config.yml'
                create_issues: true
                post_pr_comment: true
                enable_ai_fallback: true
    requirements:
      - ".github/scn-config.yml configuration file"
      - "ANTHROPIC_API_KEY secret (optional, for AI fallback)"
    outputs:
      - "PR comment with SCN analysis"
      - "GitHub Issues for Adaptive/Transformative/Impact changes"
      - "JSON audit trail (90-day retention)"
    config_example: |
      # .github/scn-config.yml
      version: "1.0"
      rules:
        routine:
          - pattern: "tags.*"
        adaptive:
          - resource: "aws_ami.*"
            operation: "modify"
        transformative:
          - resource: "aws_rds_.*\\.engine"
            operation: "modify"
        impact:
          - attribute: ".*encryption.*"
            operation: "delete|modify"

  setup_mcp_server:
    description: "Set up Argus MCP server for AI assistant integration"
    category: integration
    when_to_use: "Connecting AI tools (Claude, Copilot, Cursor) to Argus for automated scanning"
    steps:
      - action: "Install Argus with MCP support"
        command: "pip install argus-security[mcp]"

      - action: "Add MCP server to AI tool configuration"
        config: |
          {
            "mcpServers": {
              "argus": {"command": "argus", "args": ["mcp"]}
            }
          }
        note: "Add this to your AI tool's MCP configuration file (e.g., claude_desktop_config.json)"

      - action: "Verify MCP server starts"
        command: "argus mcp"
        note: "The server communicates via stdio transport. Press Ctrl+C to stop."
    available_tools:
      - "argus_scan: Run security scans"
      - "argus_list_scanners: List available scanners"
      - "argus_validate: Validate argus.yml configuration"
      - "argus_detect: Detect project characteristics and recommend scanners"
      - "argus_init: Initialize a new argus.yml config"
    available_resources:
      - "argus://config: Current argus.yml configuration"
      - "argus://results/latest: Most recent scan results"

  scheduled_full_scan:
    description: "Nightly comprehensive security scan"
    category: scanning
    sdk_command: "python -m argus scan --config argus.yml --severity-threshold none"
    note: "Schedule via cron, CI scheduler, or GitHub Actions workflow_dispatch"

  argus_scanner_selection_skill:
    description: "Use the bundled Agent Skills bundle to analyze a target repository or local change set and choose the right Argus scanners for pre-push checks and CI alignment"
    category: planning
    location: ".agents/skills/argus-scanner-selection/SKILL.md"
    outputs:
      - "Recommended scanners and rationale"
      - "Local development scan plan"
      - "Platform-specific routing for github.com CI versus GHES"
      - "Exact workflow or action snippet"
      - "Concrete local act command when local execution is requested"
      - "Required inputs, secrets, and permissions"
    steps:
      - "Inspect the target repository or current change set for languages, manifests, Dockerfiles, IaC, web targets, compliance signals, and hosting environment"
      - "Map findings to scanners using .agents/skills/argus-scanner-selection/references/REFERENCE.md"
      - "Route users toward the argus SDK as primary interface, with composite actions for GitHub Actions integration"
      - "Prefer the smallest effective pre-push scanner set locally, then keep CI workflow recommendations aligned"
      - "Prefer an explicit scanners list over 'all' when generating onboarding workflows"

# ==============================================================================
# CONTRIBUTOR WORKFLOWS - For developers of this project
# ==============================================================================

contributor_workflows:

  run_tests:
    description: "Execute the full test suite"
    command: "pytest"
    breakdown:
      all: "pytest"
      fast: "pytest --no-cov -q"
      coverage: "pytest --cov"
    coverage_targets:
      overall: "80%"

  local_development:
    description: "Set up local development environment"
    steps:
      - action: "Clone repository"
        command: "git clone <repo-url> && cd argus"

      - action: "Create virtual environment"
        command: "python3 -m venv .venv"

      - action: "Activate virtual environment"
        command: "source .venv/bin/activate"

      - action: "Install Python dependencies"
        command: "pip install -r requirements.txt"

      - action: "Install Argus CLI in editable mode"
        command: "pip install -e ."

      - action: "Build local scanner images (when branch images are not published yet)"
        command: |
          docker build -f docker/Dockerfile.bandit -t ghcr.io/huntridge-labs/argus/scanner-bandit:1.0.0 .
          docker build -f docker/Dockerfile.opengrep -t ghcr.io/huntridge-labs/argus/scanner-opengrep:1.0.0 .
          docker build -f docker/Dockerfile.supply-chain -t ghcr.io/huntridge-labs/argus/scanner-supply-chain:1.0.0 .
          docker build -f docker/Dockerfile.cli -t ghcr.io/huntridge-labs/argus/cli:1.0.0 .
        note: "Only required if `argus scan` cannot pull custom ghcr.io/huntridge-labs/argus images."

      - action: "Run tests to verify setup"
        command: "pytest"
    alternative: "Use Dev Container (recommended)"
    devcontainer_steps:
      - "Open in VS Code"
      - "Command Palette → 'Reopen in Container'"
      - "Wait for container build"
      - "Run: pytest"

  add_new_scanner:
    description: "Add support for a new security scanner"
    steps:
      - action: "Create action directory"
        command: "mkdir -p .github/actions/scanner-{name}"

      - action: "Create action.yml"
        location: ".github/actions/scanner-{name}/action.yml"
        template: ".github/actions/scanner-bandit/action.yml"

      - action: "Create parse script"
        location: ".github/actions/scanner-{name}/scripts/parse-results.py"
        purpose: "Convert scanner output → JSON"

      - action: "Create summary script"
        location: ".github/actions/scanner-{name}/scripts/generate-summary.py"
        purpose: "Convert JSON → Markdown summary"

      - action: "Add tests"
        location: ".github/actions/scanner-{name}/tests/"
        required_files:
          - "test_parse_results.py"
          - "test_generate_summary.py"

      - action: "Add SDK scanner module"
        location: "argus/scanners/{name}.py"
        purpose: "Implement Scanner protocol for the new scanner"

      - action: "Register with docsite"
        location: ".github/actions/scanner-{name}/.docsite.yml"
        content: "category: <valid-category>"
        validate: "cd scripts && python -m docsite --validate"

      - action: "Document"
        file: "docs/scanners.md"
        pattern: "Add scanner reference"

    reference_implementation: ".github/actions/scanner-bandit/"
    contributing_guide: "CONTRIBUTING.md"

  add_new_linter:
    description: "Add a new linter module to the SDK"
    steps:
      - action: "Create linter module"
        location: "argus/linters/{name}.py"
        purpose: "Implement Scanner protocol with Severity.INFO findings"
        template: "argus/linters/yamllint.py"

      - action: "Register in LINTER_REGISTRY"
        location: "argus/linters/__init__.py"
        purpose: "Add to LINTER_REGISTRY (auto-merges into SCANNER_REGISTRY)"

      - action: "Add tests"
        location: "argus/tests/linters/test_{name}.py"
        required_tests:
          - "test_name (verify lint-<tool> prefix)"
          - "test_is_available_when_installed"
          - "test_is_available_when_missing"
          - "test_findings_use_info_severity"
          - "test_install_command"

      - action: "Verify registration"
        command: "argus scan lint-{name} --path . --severity-threshold none"
        note: "Works immediately after LINTER_REGISTRY registration — no additional wiring needed"

    reference_implementation: "argus/linters/yamllint.py"
    contributing_guide: "CONTRIBUTING.md"
    key_points:
      - "Linters implement the same Scanner protocol as security scanners"
      - "Findings use Severity.INFO (not security severity levels)"
      - "LINTER_REGISTRY auto-merges into SCANNER_REGISTRY at import time"
      - "Shell completions update automatically (dynamic from registry)"
      - "Tab completion via `argus completion zsh` is always current"

  create_release:
    description: "Release a new version"
    command: "npm run release"
    options:
      patch: "npm run release:patch"
      minor: "npm run release:minor"
      major: "npm run release:major"
    prerequisites:
      - "All tests passing"
      - "On main branch"
      - "Clean working directory"
    what_happens:
      - "Bumps version in version.yaml"
      - "Updates version in all docs and examples"
      - "Generates CHANGELOG entry"
      - "Creates git tag"
      - "Pushes to remote"
      - "Creates GitHub release"

  run_single_action_test:
    description: "Test a specific action locally"
    command: "pytest .github/actions/scanner-{name}/tests/"

  validate_schemas:
    description: "Validate config files against JSON schemas"
    command: "npm run test:unit"

# ==============================================================================
# TESTING - Test execution patterns
# ==============================================================================

testing:

  unit_tests:
    command: "pytest"
    coverage_requirement: "80%"
    what_it_tests: "Parser and summary script behavior, JSON schema validation"

  integration_tests:
    location: ".github/workflows/test-actions.yml"
    trigger: "Push to PR branch"
    what_it_tests: "Full action execution in GitHub Actions environment"

  local_scanner_test:
    description: "Test scanner locally before pushing"
    steps:
      - "Install scanner binary (e.g., trivy, bandit)"
      - "Run scanner on test fixtures"
      - "Pipe output through parse script"
      - "Verify JSON structure"
    example: |
      bandit -r tests/fixtures/test-apps/python-app -f json | python .github/actions/scanner-bandit/scripts/parse-results.py counts -

# ==============================================================================
# QUICK REFERENCE - Most common commands
# ==============================================================================

quick_reference:
  test_all: "pytest"
  test_fast: "pytest --no-cov -q"
  test_with_coverage: "pytest --cov"
  scan_verbose: "argus scan --verbose --severity-threshold none"
  scan_no_spinner: "argus scan --no-spinner --severity-threshold none"
  scan_no_cache: "argus scan --no-cache --severity-threshold none"
  cache_info: "argus cache info"
  cache_clean: "argus cache clean"
  lint: "npm run lint"
  release: "npm run release"
  format: "npm run format"
  build_custom_images: "docker build -f docker/Dockerfile.bandit -t ghcr.io/huntridge-labs/argus/scanner-bandit:1.0.0 . && docker build -f docker/Dockerfile.opengrep -t ghcr.io/huntridge-labs/argus/scanner-opengrep:1.0.0 . && docker build -f docker/Dockerfile.supply-chain -t ghcr.io/huntridge-labs/argus/scanner-supply-chain:1.0.0 . && docker build -f docker/Dockerfile.cli -t ghcr.io/huntridge-labs/argus/cli:1.0.0 ."
  docsite_validate: "cd scripts && python -m docsite --validate"
  docsite_build: "cd scripts && python -m docsite --output-dir /tmp/argus-docs"
  docsite_preview: "cd scripts && python -m docsite --output-dir /tmp/argus-docs && cd /tmp/argus-docs && mkdocs serve"
