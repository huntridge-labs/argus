# Renovate configuration for dependencies Dependabot can't track.
# Dependabot handles: GitHub Actions SHAs, npm, pip, Dockerfile FROM.
# Renovate handles: image tags in Python source, tool versions in shell scripts/Dockerfiles.
#
# SUPPLY CHAIN POLICY: All updates are delayed 7 days after release.
# This provides a stabilization window to catch compromised releases
# (ref: Trivy supply chain attack GHSA-69fq-xp46-6x23, March 2026).

extends:
  - config:recommended

enabledManagers:
  - custom.regex

dependencyDashboard: true

labels:
  - dependencies
  - automated

commitMessagePrefix: "chore(deps):"

schedule:
  - before 9am on Monday

timezone: America/New_York

# 7-day stabilization window — do not propose updates until a release
# has been published for at least 7 days. Reduces exposure to supply
# chain attacks that are caught and reverted within the first week.
minimumReleaseAge: 7 days

# ──────────────────────────────────────────────────
# Custom managers — match version strings in non-standard files
# ──────────────────────────────────────────────────

customManagers:

  # Container image references pinned in argus/containers.py.
  # e.g. "aquasec/trivy:0.70.0@sha256:be1190..." → tag + digest both
  # tracked, both updated atomically on every Renovate run.
  # The optional ``@sha256:...`` capture group is what enables digest
  # tracking — without ``currentDigest``, Renovate would treat the
  # whole tail as ``currentValue`` and the supply-chain digest pin
  # would drift out of sync with the tag.
  - customType: regex
    description: Container image refs (tag + digest) in argus/containers.py
    fileMatch:
      - argus/containers\.py
    matchStrings:
      - '"(?<depName>[a-z0-9./-]+):(?<currentValue>[^"@]+)(?:@(?<currentDigest>sha256:[a-f0-9]+))?"'
    datasourceTemplate: docker

  # Tool versions pinned as ARG in Dockerfiles (GitHub-released binaries)
  # e.g. ARG TRIVY_VERSION=0.70.0
  - customType: regex
    description: Tool versions in Dockerfiles (ARG pattern, github-releases)
    fileMatch:
      - docker/Dockerfile\..+
    matchStrings:
      - ARG (?<depName>TRIVY)_VERSION=(?<currentValue>[\d.]+)
      - ARG (?<depName>GRYPE)_VERSION=(?<currentValue>[\d.]+)
      - ARG (?<depName>SYFT)_VERSION=(?<currentValue>[\d.]+)
      - ARG (?<depName>GITLEAKS)_VERSION=(?<currentValue>[\d.]+)
      - ARG (?<depName>ACTIONLINT)_VERSION=(?<currentValue>[\d.]+)
      - ARG (?<depName>OPENGREP)_VERSION=(?<currentValue>[\d.]+)
      - ARG (?<depName>ZIZMOR)_VERSION=(?<currentValue>[\d.]+)
    datasourceTemplate: github-releases
    packageNameTemplate: >-
      {{#if (equals depName 'TRIVY')}}aquasecurity/trivy{{/if}}
      {{#if (equals depName 'GRYPE')}}anchore/grype{{/if}}
      {{#if (equals depName 'SYFT')}}anchore/syft{{/if}}
      {{#if (equals depName 'GITLEAKS')}}gitleaks/gitleaks{{/if}}
      {{#if (equals depName 'ACTIONLINT')}}rhysd/actionlint{{/if}}
      {{#if (equals depName 'OPENGREP')}}opengrep/opengrep{{/if}}
      {{#if (equals depName 'ZIZMOR')}}woodruffw/zizmor{{/if}}

  # Python tool versions pinned as ARG in Dockerfiles (PyPI packages)
  # e.g. ARG BANDIT_VERSION=1.9.4 — referenced by `pip install "bandit==${BANDIT_VERSION}"`.
  # Closes the gap where inline pip pins inside Dockerfiles were untracked.
  - customType: regex
    description: Python tool versions in Dockerfiles (ARG pattern, pypi)
    fileMatch:
      - docker/Dockerfile\..+
    matchStrings:
      - ARG (?<depName>BANDIT)_VERSION=(?<currentValue>[\d.]+)
      - ARG (?<depName>PYYAML)_VERSION=(?<currentValue>[\d.]+)
    datasourceTemplate: pypi
    packageNameTemplate: >-
      {{#if (equals depName 'BANDIT')}}bandit{{/if}}
      {{#if (equals depName 'PYYAML')}}pyyaml{{/if}}

  # Tool versions pinned as shell variables in composite actions
  # e.g. OPENGREP_VERSION=1.18.0
  - customType: regex
    description: Tool versions pinned in GitHub Actions (TOOL_VERSION= pattern)
    fileMatch:
      - \.github/actions/.+/action\.yml
    matchStrings:
      - (?<depName>OPENGREP)_VERSION[=:]\s*['"]?(?<currentValue>[\d.]+)['"]?
      - (?<depName>ACTIONLINT)_VERSION[=:]\s*['"]?(?<currentValue>[\d.]+)['"]?
      - (?<depName>ZIZMOR)_VERSION[=:]\s*['"]?(?<currentValue>[\d.]+)['"]?
    datasourceTemplate: github-releases
    packageNameTemplate: >-
      {{#if (equals depName 'OPENGREP')}}opengrep/opengrep{{/if}}
      {{#if (equals depName 'ACTIONLINT')}}rhysd/actionlint{{/if}}
      {{#if (equals depName 'ZIZMOR')}}woodruffw/zizmor{{/if}}

# ──────────────────────────────────────────────────
# Grouping and policies
# ──────────────────────────────────────────────────

packageRules:

  # All container image bumps in a single PR
  # pinDigests appends @sha256:... for immutable references
  - description: Group all container image updates
    matchManagers:
      - custom.regex
    matchDatasources:
      - docker
    groupName: container-images
    pinDigests: true
    automerge: false

  # All tool version bumps in a single PR
  - description: Group all tool version updates
    matchManagers:
      - custom.regex
    matchDatasources:
      - github-releases
    groupName: tool-versions
    automerge: false
