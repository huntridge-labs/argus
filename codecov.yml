coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 3%

    patch:
      default:
        target: 80%

  ignore:
    - "tests/**/*"
    # The SDK's own test suite lives under argus/tests/ — exclude it too
    # (coverage measures the code under test, not the tests). The
    # top-level tests/**/* line above misses this location, which let
    # Docker-gated test files like test_container_smoke.py (whose
    # slow/skip branches don't execute in the fast coverage run) drag
    # down the patch metric.
    - "argus/tests/**"
    - "examples/**/*"
    - "docs/**/*"
    - "*.md"
    # Textual TUI view layer + FastAPI web view layer — widget
    # wiring, key bindings, screen transitions, route dispatch.
    # Meaningfully testable only via Textual's snapshot framework
    # against a live runtime (TUI) or full ASGI client + browser
    # automation (web), both of which double the CI time and
    # duplicate what a human exercise trivially spots. The
    # underlying business logic lives in argus/core/findings_view.py
    # and argus/viewers/terminal/{loader,export}.py /
    # argus/viewers/browser/log_view.py and IS unit-tested
    # (98-100% covered) — that's the boundary worth guarding, not
    # the widget tree.
    - "argus/viewers/terminal/app.py"
    - "argus/viewers/browser/app.py"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
