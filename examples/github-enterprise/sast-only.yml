# Argus's own actions below pin a release tag, not a SHA. Releases in this repo
# are immutable (a published tag can't be moved), and the release commit that
# bumps these refs can't know its own SHA, so each line carries a nosemgrep
# for the mutable-tag rule. Third-party actions stay SHA-pinned.
# SAST-Only Security Scanning for GitHub Enterprise Server
#
# This workflow runs static analysis scanners only.
# Best for: Code repositories without containers or infrastructure.
#
# Scanners included:
# - Bandit (Python security linter)
# - OpenGrep (Pattern-based static analysis)
# - Gitleaks (Secrets detection)

name: SAST Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

jobs:
  sast-scanning:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # Full history for Gitleaks

      # ----------------------------------------
      # Bandit - Python Security Linter
      # ----------------------------------------
      - name: Run Bandit (Python)
        uses: huntridge-labs/argus/.github/actions/scanner-bandit@1.12.6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          post_pr_comment: 'true'
          enable_code_security: 'true'
          fail_on_severity: 'high'
          # python_version: '3.12' # Optional: specify Python version

      # ----------------------------------------
      # OpenGrep - Multi-language Static Analysis
      # ----------------------------------------
      - name: Run OpenGrep
        uses: huntridge-labs/argus/.github/actions/scanner-opengrep@1.12.6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          enable_code_security: 'true'
          fail_on_severity: 'high'
          # paths: 'src/' # Optional: limit scan to specific paths
          # config: '.opengrep.yml' # Optional: custom config file

      # ----------------------------------------
      # Gitleaks - Secrets Detection
      # ----------------------------------------
      - name: Run Gitleaks
        uses: huntridge-labs/argus/.github/actions/scanner-gitleaks@1.12.6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for organizations
        with:
          post_pr_comment: 'true'
          enable_code_security: 'true'
          fail_on_severity: 'critical' # Secrets are critical!
