# CWE → NIST SP 800-53 Rev 5 control mapping.
#
# Used by argus.core.control_mapping as the fallback tier — consulted only
# when a finding's scanner has no rule-level mapping for its specific id.
# Keyed by canonical CWE form (``CWE-<digits>``); the lookup normalizes
# scanner-reported variants ("78", "cwe-78", "CWE-78") to that form.
#
# Coverage scope: high-volume CWEs the scanners in this project actually
# emit. Curated, not exhaustive — the goal is to anchor common findings to
# defensible controls without claiming to be a substitute for an
# assessor's own crosswalk. Compliance reviewers: please audit and extend
# in PRs that touch only this file.

# Improper Neutralization of Special Elements ("Injection")
CWE-20: [si-10]                  # Improper Input Validation
CWE-22: [ac-3, si-10]            # Path Traversal
CWE-77: [si-10, si-3]            # Command Injection
CWE-78: [si-10, si-3]            # OS Command Injection
CWE-79: [si-10]                  # XSS
CWE-89: [si-10]                  # SQL Injection
CWE-90: [si-10]                  # LDAP Injection
CWE-91: [si-10]                  # XML Injection
CWE-94: [si-10, si-3]            # Code Injection
CWE-95: [si-10, si-3]            # Eval Injection
CWE-98: [si-10]                  # PHP Remote File Inclusion
CWE-113: [si-10]                 # HTTP Response Splitting
CWE-117: [au-9, si-10]           # Log Injection
CWE-352: [si-10, ac-4]           # CSRF
CWE-601: [si-10]                 # Open Redirect
CWE-611: [si-10]                 # XXE
CWE-643: [si-10]                 # XPath Injection
CWE-915: [si-10]                 # Dynamically-determined Object Attributes

