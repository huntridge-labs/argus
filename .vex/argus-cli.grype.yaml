# grype config for the CLI image (passed as -c). Only ignore rules.
#
# Each rule is scoped to the gitleaks binary we bundle, so the same
# vulnerability in any other binary in the image stays visible. grype
# locations have a leading slash. Evidence and sign-off rules:
# .vex/README.md.
#
# grype reports Go findings by GO- ID (the CVE is only a related
# vulnerability), and a rule on the CVE ID does not match. As of
# 2026-10-22 grype does not report golang.org/x/crypto v0.35.0 in
# gitleaks at all, so there is no x/crypto rule here. Every rule must match
# a finding in the CLI scan; CI fails on a rule that matched nothing
# (scripts/ci/render_container_summary.py).
ignore:
  - vulnerability: GO-2026-4337  # CVE-2025-68121
    reason: >-
      Go stdlib 1.24.11 crypto/tls in gitleaks v8.30.1. govulncheck finds a
      call path only through gitleaks' --diagnostics=http profiling server;
      Argus runs `gitleaks detect --source <workspace>` without --diagnostics,
      so no TLS connection is made. Fixed in Go 1.24.13+; awaiting an upstream
      gitleaks rebuild.
    package:
      name: stdlib
      location: "/usr/local/bin/gitleaks"
