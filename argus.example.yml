# yaml-language-server: $schema=https://raw.githubusercontent.com/huntridge-labs/argus/main/argus-config.schema.json
# Argus Security Scanner Configuration
# Copy to argus.yml and customize for your project
version: "1.0"

scanners:
  bandit:
    enabled: true
    path: "."
    # config_file: "pyproject.toml"  # Optional Bandit config

  trivy-iac:
    enabled: true
    path: "infrastructure"
    severity_threshold: medium

  clamav:
    enabled: true
    path: "."

  gitleaks:
    enabled: true

  osv:
    enabled: true

  checkov:
    enabled: true
    path: "infrastructure"

  opengrep:
    enabled: true
    path: "src"

  supply-chain:
    enabled: true

  # m:
  #   # MUMPS / M language SAST. Opt-in: most repos don't have .m files.
  #   # Detects XECUTE / indirection / OPEN/USE injection, hard-coded
  #   # credentials in globals, dynamic dispatch with tainted input,
  #   # external $& call injection, plus duplicate-label, unreachable-
  #   # code, undeclared-label, routine-name-mismatch, and label-
  #   # fallthrough diagnostics.
  #   # Requires either ``pip install argus-security[mumps]`` +
  #   # ``scripts/build-mumps-grammar.sh`` (local) or the scanner-mumps
  #   # container image (no local toolchain needed).
  #   enabled: true
  #   path: "routines"
  #   # extensions: [".m"]  # default
  #   #
  #   # Extend the built-in taint source set (READ, $ZARGV,
  #   # ^%CGI / ^%REQUEST / ^%session) with custom patterns. Any
  #   # variable assigned from an RHS matching these regexes joins
  #   # the tainted set seen by M001 / M003 / M005 / M006.
  #   # taint_sources:
  #   #   patterns:
  #   #     - "\\$ZIO\\b"             # YottaDB pending input
  #   #     - "\\^MyApp\\.input\\b"   # site-specific HTTP global
  #   #
  #   # Functions / intrinsics that REMOVE taint when applied. A variable
  #   # assigned from a sanitizer call is treated as clean by every
  #   # taint-aware rule (M001 / M003 / M005 / M006).
  #   # sanitizers:
  #   #   - "$$ESCAPE^HTML"           # output encoder
  #   #   - "$$VALIDATE^INPUT"        # input validator
  #   #
  #   # Per-rule severity overrides. The default severity is replaced
  #   # for every finding the rule emits at its baseline. Per-finding
  #   # precision (e.g. M003's PIPE-device CRITICAL bump) is preserved.
  #   # rules:
  #   #   M203:
  #   #     severity: low             # demote noisy diagnostic
  #   #   M001:
  #   #     severity: critical        # promote XECUTE for this codebase

  # container:
  #   enabled: false
  #   image_ref: "myapp:latest"
  #   # Default set: trivy + grype CVEs, syft SBOM, exposure declared-ports.
  #   scanners: "trivy,grype,syft,exposure"
  #   # Attack-surface knobs for the exposure sub-scanner:
  #   #   expose_warn_ports:  override the built-in WARN list
  #   #                       (defaults: 22 SSH, 3306 MySQL, 6379 Redis,
  #   #                       5432 PostgreSQL, 27017 MongoDB, etc.)
  #   #   expose_ignore_ports: suppress findings entirely
  #   # expose_warn_ports: ["22/tcp", "3306/tcp"]
  #   # expose_ignore_ports: ["443/tcp", "8080/tcp"]
  #   # Private-registry auth: name an env var, never paste a literal.
  #   # The runner / shell exports the value; argus reads it at scan time.
  #   registry_username_env: REGISTRY_USER
  #   registry_password_env: REGISTRY_TOKEN

  # zap:
  #   enabled: false
  #   target_url: "http://localhost:3000"
  #   #
  #   # Optional tuning (decided in ADR-024; container backend only):
  #   #
  #   # scan_type: baseline           # baseline | full | api
  #   # api_spec: "http://localhost:3000/openapi.json"   # auto-switches to api scan
  #   # rules_file: ".zap/rules.tsv"  # ZAP ignore rules; mounted into container
  #   # max_duration_minutes: 30      # hard cap on scan time
  #   # cmd_options:                  # appended verbatim after built-in flags
  #   #   - "-z"
  #   #   - "-config view.locale=en_GB"
  #   #
  #   # Authenticated scan via ZAP context file (user-authored):
  #   # auth:
  #   #   context_file: ".zap/context.xml"
  #   #   username_env: ZAP_APP_USER       # env-var *name*
  #   #   password_env: ZAP_APP_PASSWORD

reporting:
  # ``argus-results.json`` is the canonical scan artifact and is
  # always written regardless of this list — the viewers, the audit
  # manifest, and the ``argus report`` subcommand all consume it.
  # This list selects which *additional* human-readable reports to
  # emit alongside the JSON. Available: terminal, markdown, sarif.
  formats:
    - terminal
    - sarif
  severity_threshold: high
  output_dir: "./argus-results"

  # Persist each scanner's raw output (results.json, *.sarif,
  # stdout.txt) under ``<output_dir>/raw/<scanner>/`` alongside the
  # canonical argus-results.json. Default true — useful for
  # forensics, audit trails, and manual triage. Set false (or pass
  # --no-keep-raw on the CLI) to skip; saves a few MB per scan in
  # tight CI environments. Applies to both source scans (``argus
  # scan``) and container scans (``argus scan container``).
  keep_raw: true

# Container lifecycle targets (consumed by ``argus scan container``).
# Defining anything under this top-level ``containers:`` key activates
# config-driven container scans — no need to pass --image / --discover
# on the CLI. CLI flags, when supplied, override the matching keys
# below: explicit > implicit.
#
# Private-registry auth (Iron Bank, ECR, GHCR-private, etc.) — two
# shapes:
#
# Single-default shortcut — one credential pair applied to every
# image. Good when all your images come from the same registry.
#
# containers:
#   registry_username_env: REGISTRY_USER       # env-var NAME
#   registry_password_env: REGISTRY_TOKEN      # env-var NAME
#   images:
#     - image: registry.example.com/myorg/app@sha256:...
#
# Per-registry map (``registry_auth``) — keyed by registry host,
# optionally narrowed with a path prefix. Longest matching prefix
# wins, so a more specific entry (e.g. for a restricted repo path)
# overrides a broader one at the same registry.
#
# Entry fields use the prefix-less names ``username`` /
# ``username_env`` / ``password`` / ``password_env``.
#
# containers:
#   registry_auth:
#     registry.example.com:                          # broad default for this registry
#       username_env: REGISTRY_DEFAULT_USER
#       password_env: REGISTRY_DEFAULT_TOKEN
#     registry.example.com/internal/restricted:     # more specific — wins for restricted/
#       username_env: REGISTRY_RESTRICTED_USER
#       password_env: REGISTRY_RESTRICTED_TOKEN
#     ghcr.io/myorg:
#       username_env: GHCR_USER
#       password_env: GHCR_TOKEN
#   images:
#     - image: registry.example.com/public/app@sha256:...
#     - image: registry.example.com/internal/restricted/app@sha256:...
#     - image: ghcr.io/myorg/worker@sha256:...
#
# Resolved creds are forwarded to Trivy, Grype, and Syft as their
# native env vars (``TRIVY_USERNAME``/``TRIVY_PASSWORD``,
# ``GRYPE_REGISTRY_AUTH_USERNAME``/``GRYPE_REGISTRY_AUTH_PASSWORD``,
# ``SYFT_REGISTRY_AUTH_USERNAME``/``SYFT_REGISTRY_AUTH_PASSWORD``).
# When a ``registry_auth`` entry matches but its env var is unset,
# argus warns and refuses to fall back to the broader default — no
# silent privilege broadening.
#
# Legacy: argus also reads top-level credential fields from
# ``scanners.container.*`` for back-compat with the source-scan
# dispatch path. ``containers.*`` wins when both are set.
#
# Each ``images:`` entry uses ONE of two shapes — never both:
#
#   image:        Remote-pull entry. argus pulls and scans this exact
#                 reference. Pin to an immutable ``@sha256:...`` digest
#                 when possible — :tag references are mutable, so CVE
#                 attribution drifts as upstream republishes. Renovate
#                 and Dependabot can update digest pins automatically.
#
#   dockerfile:   Build-then-scan entry. argus runs ``docker build``
#                 against the Dockerfile, tags the result as
#                 ``<name>:argus-scan``, then scans that image. Argus
#                 doesn't push the build to a registry — the resulting
#                 image only exists locally for the duration of the
#                 scan (cleanup: true by default).
#
# ``image:`` and ``dockerfile:`` are mutually exclusive — argus does
# not push images, so the docker-compose pattern of "build, then tag
# as ``image:`` for publishing" doesn't apply here.
#
# containers:
#   images:
#     # PREFERRED remote pull: tag + digest (human-readable + immutable)
#     - image: ghcr.io/myorg/app:1.4.0@sha256:f1e2d3c4b5a6f7e8d9c0b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
#
#     # ALSO PREFERRED remote pull: digest-only (immutable, no tag noise)
#     - image: ghcr.io/myorg/worker@sha256:0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b
#
#     # ACCEPTABLE FALLBACK remote pull: tag-only. Mutable; use only
#     # for ad-hoc scans or environments where digest discovery isn't
#     # yet wired up. Migrate to a pinned form before relying on the
#     # scan output for an audit trail.
#     # - image: myorg/legacy:1.0.0
#
#     # Build-then-scan: ``dockerfile:`` + optional ``context:`` and
#     # ``name:``. ``name:`` becomes the build tag (``<name>:argus-scan``)
#     # and the row identifier in argus-results.json; if omitted, argus
#     # derives a name from the Dockerfile path the same way
#     # ``argus scan container --discover`` does.
#     - dockerfile: docker/Dockerfile
#       context: .
#       name: inhouse-app
#
#     # Per-target override of the engine-level ``cleanup:`` default.
#     # Useful when one base image should stay cached across runs while
#     # the rest of the dev images get torn down. ``true`` removes the
#     # built image after the scan; ``false`` leaves it; omit to defer
#     # to the engine default (``cleanup: true`` unless the engine is
#     # configured otherwise).
#     - dockerfile: docker/Dockerfile.base
#       name: my-base
#       cleanup: false
#
#   # OR auto-discovery. Walks ``search_paths`` for Dockerfile,
#   # Dockerfile.<name>, <name>.Dockerfile, then builds + scans each
#   # image locally. Builds inherit your local docker daemon, so
#   # reproducibility is bounded by your build cache.
#   discover: true
#   search_paths:
#     - .
#     - docker/
#
#   # Override which sub-scanners run; default is trivy + grype.
#   scanners: [trivy, grype, syft]
#
# Note: raw scanner-output preservation is configured via the
# unified ``reporting.keep_raw`` knob above — the same flag covers
# trivy/grype/syft container outputs and source-scan scanner
# outputs. No separate container-only setting is needed.

# Execution backend configuration
execution:
  # auto (default): containers for immutable, reproducible scans
  # local: use locally installed tools (faster, user accepts version risk)
  # docker: containers only, fail if unavailable
  backend: auto

  # Override container registry for private/air-gapped environments
  # registry: "registry.internal.corp/argus"

  # Container pull policy
  # always: pull latest on every run
  # if-not-present: pull only if image not cached locally
  # never: fail if image not cached (for air-gapped)
  pull_policy: if-not-present
