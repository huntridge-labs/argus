# Argus Security Scanner Configuration
# Copy to argus.yml and customize for your project
version: "1.0"

scanners:
  bandit:
    enabled: true
    path: "."
    # config_file: "pyproject.toml"  # Optional Bandit config

  trivy-iac:
    enabled: true
    path: "infrastructure"
    severity_threshold: medium

  clamav:
    enabled: true
    path: "."

  gitleaks:
    enabled: true

  osv:
    enabled: true

  checkov:
    enabled: true
    path: "infrastructure"

  opengrep:
    enabled: true
    path: "src"

  supply-chain:
    enabled: true

  # container:
  #   enabled: false
  #   image_ref: "myapp:latest"
  #   scanners: "trivy,grype,syft"

  # zap:
  #   enabled: false
  #   target_url: "http://localhost:3000"

reporting:
  # ``argus-results.json`` is the canonical scan artifact and is
  # always written regardless of this list — the viewers, the audit
  # manifest, and the ``argus report`` subcommand all consume it.
  # This list selects which *additional* human-readable reports to
  # emit alongside the JSON. Available: terminal, markdown, sarif.
  formats:
    - terminal
    - sarif
  severity_threshold: high
  output_dir: "./argus-results"

# Container lifecycle targets (consumed by ``argus scan container``).
# Defining anything under this top-level ``containers:`` key activates
# config-driven container scans — no need to pass --image / --discover
# on the CLI. CLI flags, when supplied, override the matching keys
# below: explicit > implicit.
#
# RECOMMENDED: pin every image to an immutable digest. ``:tag``
# references are mutable — the same ``myorg/app:1.4.0`` can publish
# different bytes over time, which means CVE attribution drifts and
# scan results aren't reproducible. ``@sha256:...`` references are
# byte-level immutable: the scanner reads exactly what you pinned,
# every run, forever. Renovate and Dependabot can both update
# digest-pinned references automatically.
#
# containers:
#   images:
#     # PREFERRED: tag + digest (human-readable + immutable)
#     - image: ghcr.io/myorg/app:1.4.0@sha256:f1e2d3c4b5a6f7e8d9c0b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
#
#     # ALSO PREFERRED: digest-only (immutable, no tag noise)
#     - image: ghcr.io/myorg/worker@sha256:0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b
#
#     # Build-then-scan: digest only meaningful after first publish.
#     # The dockerfile is built and tagged locally, so it's reproducible
#     # within one CI run even without a pinned digest.
#     - image: myorg/inhouse:dev
#       dockerfile: docker/Dockerfile
#       context: .
#
#     # ACCEPTABLE FALLBACK: tag-only. Easier to read, but mutable —
#     # use only for ad-hoc scans or in environments where digest
#     # discovery isn't yet wired up. Plan to migrate to a pinned
#     # form before relying on the scan output for an audit trail.
#     # - image: myorg/legacy:1.0.0
#
#   # OR auto-discovery. Walks ``search_paths`` for Dockerfile,
#   # Dockerfile.<name>, <name>.Dockerfile, then builds + scans each
#   # image locally. Builds inherit your local docker daemon, so
#   # reproducibility is bounded by your build cache.
#   discover: true
#   search_paths:
#     - .
#     - docker/
#
#   # Override which sub-scanners run; default is trivy + grype.
#   scanners: [trivy, grype, syft]
#
#   # Persist raw per-scanner artifacts (trivy-results.json,
#   # grype-results.json, syft-sbom.json) under
#   # ``<output_dir>/raw/<image>/`` alongside the canonical
#   # argus-results.json. Default is true so the artifacts are
#   # available for forensics, audit, or manual triage. Set false
#   # (or pass --no-keep-raw on the CLI) to skip — saves a few MB
#   # per image when running in tight CI environments.
#   keep_raw: true

# Execution backend configuration
execution:
  # auto (default): containers for immutable, reproducible scans
  # local: use locally installed tools (faster, user accepts version risk)
  # docker: containers only, fail if unavailable
  backend: auto

  # Override container registry for private/air-gapped environments
  # registry: "registry.internal.corp/argus"

  # Container pull policy
  # always: pull latest on every run
  # if-not-present: pull only if image not cached locally
  # never: fail if image not cached (for air-gapped)
  pull_policy: if-not-present
