name: 'JSON Linter'
description: |
  Run JSON validation and syntax checking via Argus SDK.

  This action validates JSON files for syntax errors using jsonlint (with
  Python fallback). Results are uploaded as artifacts and can be aggregated
  by the linting-summary action.

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  - uses: huntridge-labs/argus/.github/actions/linter-json@0.7.0
    with:
      fail_on_issues: false
  ```

inputs:
  fail_on_issues:
    description: 'Fail the job if validation issues are found'
    required: false
    default: 'false'
  paths:
    description: 'Paths to search for JSON files (space-separated). Defaults to entire repository.'
    required: false
    default: '.'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'

outputs:
  issues_count:
    description: 'Number of validation issues found'
    value: ${{ steps.scan.outputs.issue_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/linter-json

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      run: pip install pyyaml

    - name: Run JSON Linter via Argus SDK
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.paths }}
        FAIL_ON_ISSUES: ${{ inputs.fail_on_issues }}
      run: |
        mkdir -p json-lint-reports scanner-summaries

        # Map fail_on_issues boolean to severity threshold
        SEVERITY="none"
        if [ "$FAIL_ON_ISSUES" = "true" ]; then
          SEVERITY="info"
        fi

        SCAN_EXIT=0
        python -m argus scan lint-json \
          --path "${SCAN_PATH}" \
          --severity-threshold "${SEVERITY}" \
          --format sarif --format json --format markdown \
          --output-dir ./json-lint-reports \
          --output-vars ./json-lint-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f json-lint-reports/counts.env ] && cat json-lint-reports/counts.env >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment and step summary
        if [ -f "json-lint-reports/argus-summary.md" ]; then
          cp json-lint-reports/argus-summary.md scanner-summaries/json-lint.md
          cat json-lint-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload JSON lint artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: json-lint-reports
        path: json-lint-reports/
        retention-days: 30
      if: always()

    - name: Upload JSON lint summary section
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: linter-summary-json
        path: scanner-summaries/json-lint.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with JSON lint results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@0.7.0
      with:
        summary_file: scanner-summaries/json-lint.md
        comment_marker: json-linter-comment-marker
        title: '📋 JSON Linting Results'
        fallback_message: 'No JSON linting results available'

branding:
  icon: 'file-text'
  color: 'green'
