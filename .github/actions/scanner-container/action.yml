name: 'Container Security Scanner'
description: |
  Scan container images for vulnerabilities using Trivy, Grype, and Syft
  via the Argus SDK. The SDK handles tool execution, CVE deduplication,
  and report generation.

  ### Migrating from 0.6.x?

  The `scan_mode: discover` input was removed — the auto-find-and-build
  semantic moved into the `containers:` block in `argus.yml`, matching
  the rest of the SDK's config-driven posture. The composite action's
  `with:` surface now takes one image per invocation; multi-image
  workflows drive a matrix from `containers.images` (config-driven) or
  let argus auto-discover Dockerfiles via `containers.discover: true`.

  | Removed `with:` key (0.6.x) | New home (1.x) |
  |---|---|
  | `scan_mode: discover` | `containers.discover: true` + `containers.search_paths: [...]` in argus.yml |
  | `scan_mode: manifest` | `containers.images: [...]` list in argus.yml (`parse-container-config` action emits the matrix) |
  | `allow_failure` | `fail_on_severity: none` (the canonical "informational scan" knob) |
  | `skip_summary` | Use `security-summary` composite's `scan_statuses` input (silent-failure aware) |

  Worked examples in [`docs/container-scanning.md`](https://github.com/huntridge-labs/argus/blob/main/docs/container-scanning.md)
  and side-by-side migration in [`docs/migration/0.6.x-to-1.x.md`](https://github.com/huntridge-labs/argus/blob/main/docs/migration/0.6.x-to-1.x.md).

branding:
  icon: 'package'
  color: 'blue'

inputs:
  image_ref:
    description: 'Container image reference to scan (e.g., nginx:latest, ghcr.io/owner/image:tag)'
    required: true
  container_name:
    description: 'Name identifier for the container (used in artifacts and reports)'
    required: true
  scanners:
    description: 'Comma-separated list of scanners to run: trivy,grype,syft'
    required: false
    default: 'trivy,grype,syft'
  fail_on_severity:
    description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical'
    required: false
    default: 'none'
  enable_code_security:
    description: 'Upload SARIF results to GitHub Security tab'
    required: false
    default: 'false'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'
  registry_username:
    description: 'Username for authenticating to private container registry'
    required: false
    default: ''
  registry_password:
    description: 'Password or token for authenticating to private container registry'
    required: false
    default: ''

outputs:
  vulnerabilities_found:
    description: 'Total number of vulnerabilities found'
    value: ${{ steps.scan.outputs.total_vulns }}
  critical_count:
    description: 'Number of critical vulnerabilities'
    value: ${{ steps.scan.outputs.critical }}
  high_count:
    description: 'Number of high vulnerabilities'
    value: ${{ steps.scan.outputs.high }}
  scan_status:
    description: 'Overall scan status (pass, fail, or error)'
    value: ${{ steps.scan.outputs.scan_status }}
  scan_error:
    description: 'Whether a scanner error occurred (true/false)'
    value: ${{ steps.scan.outputs.scan_error }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (`uses: .../scanner-container@tag`
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break `pip install argus-security>=X`
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under $GITHUB_ACTION_PATH is the SDK source).
      run: pip install "${{ github.action_path }}/../../.."

    - name: Authenticate to container registry
      if: inputs.registry_username != '' && inputs.registry_password != ''
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
      run: |
        REGISTRY=$(echo "$IMAGE_REF" | cut -d'/' -f1)
        if [[ "$REGISTRY" != *"."* ]] && [[ "$REGISTRY" != *":"* ]]; then
          REGISTRY="docker.io"
        fi
        echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

    - name: Run container scan via Argus SDK
      id: scan
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
        CONTAINER_NAME: ${{ inputs.container_name }}
        SCANNERS: ${{ inputs.scanners }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
      run: |
        REPORT_DIR="container-reports"
        mkdir -p "$REPORT_DIR" scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan container \
          --image "$IMAGE_REF" \
          --scanners "$SCANNERS" \
          --format json --format markdown --format sarif \
          --output-dir "./$REPORT_DIR" \
          --no-timestamp \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          || SCAN_EXIT=$?

        # Parse severity counts from JSON output
        CRITICAL=0; HIGH=0; MEDIUM=0; LOW=0; TOTAL=0
        SCAN_ERROR=false; SCAN_STATUS="pass"

        JSON_FILE="$REPORT_DIR/container-scan.json"
        if [ -f "$JSON_FILE" ]; then
          CRITICAL=$(jq '[.results[].critical] | add // 0' "$JSON_FILE")
          HIGH=$(jq '[.results[].high] | add // 0' "$JSON_FILE")
          MEDIUM=$(jq '[.results[].medium] | add // 0' "$JSON_FILE")
          LOW=$(jq '[.results[].low] | add // 0' "$JSON_FILE")
          TOTAL=$(jq '[.results[].total] | add // 0' "$JSON_FILE")

          # Check for build failures (indicates scanner error)
          BUILD_FAILURES=$(jq '.build_failures // 0' "$JSON_FILE")
          if [ "$BUILD_FAILURES" -gt 0 ]; then
            SCAN_ERROR=true
          fi
        fi

        # Determine scan status from exit code
        if [ $SCAN_EXIT -eq 2 ]; then
          SCAN_STATUS="error"
          SCAN_ERROR=true
        elif [ $SCAN_EXIT -eq 1 ]; then
          SCAN_STATUS="fail"
        fi

        echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
        echo "high=$HIGH" >> "$GITHUB_OUTPUT"
        echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
        echo "low=$LOW" >> "$GITHUB_OUTPUT"
        echo "total_vulns=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "scan_status=$SCAN_STATUS" >> "$GITHUB_OUTPUT"
        echo "scan_error=$SCAN_ERROR" >> "$GITHUB_OUTPUT"

        echo "Found: CRITICAL=$CRITICAL, HIGH=$HIGH, MEDIUM=$MEDIUM, LOW=$LOW, TOTAL=$TOTAL"

        # Copy markdown summary for PR comment artifact
        MD_FILE="$REPORT_DIR/container-scan.md"
        if [ -f "$MD_FILE" ]; then
          cp "$MD_FILE" "scanner-summaries/container-${CONTAINER_NAME}.md"
          cat "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload scan artifacts
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: container-reports-${{ inputs.container_name }}
        path: |
          container-reports/
          scanner-summaries/
        retention-days: 30
        # Surface missing artifacts loudly instead of silently accepting an
        # empty upload — matches the "no silent failures" theme of the
        # SDK-side fixes in 0.7.2.
        if-no-files-found: warn

    - name: Upload SARIF to GitHub Security
      if: inputs.enable_code_security == 'true' && always() && hashFiles('container-reports/argus-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        sarif_file: container-reports/argus-results.sarif
        category: container-${{ inputs.container_name }}
      continue-on-error: true

    - name: Upload summary section
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: scanner-summary-container-${{ inputs.container_name }}
        path: scanner-summaries/container-${{ inputs.container_name }}.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with container scan results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.1.0
      with:
        summary_file: scanner-summaries/container-${{ inputs.container_name }}.md
        comment_marker: container-${{ inputs.container_name }}-comment-marker
        title: 'Container Security Scan: ${{ inputs.container_name }}'
        fallback_message: 'No container scan results available'
