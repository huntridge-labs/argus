name: 'ClamAV Malware Scanner'
description: |
  Run ClamAV malware scanning and generate reports.
  Delegates to the Argus SDK (`python -m argus scan clamav`) for scanning,
  parsing, and report generation. The SDK automatically handles tool sourcing
  via Docker container when ClamAV is not installed locally (`execution.backend: auto`).

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Usage Example:**
  ```yaml
  - uses: ./.github/actions/scanner-clamav
    env:
      GITHUB_TOKEN: (github.token)
    with:
      scan_path: '.'
      fail_on_severity: 'none'
  ```

inputs:
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'true'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository'
    required: false
    default: 'false'
  scan_path:
    description: 'Path to scan (file, directory, or archive). Defaults to repository root.'
    required: false
    default: '.'
  fail_on_severity:
    description: 'Fail the job if malware is found. ClamAV does not support severity-based filtering - any value other than "none" will fail if malware is detected.'
    required: false
    default: 'none'
  job_id:
    description: 'Job ID for artifact naming'
    required: false
    default: ${{ github.job }}

outputs:
  infected_count:
    description: 'Number of infected files detected'
    value: ${{ steps.scan.outputs.infected_count }}
  scanned_count:
    description: 'Number of files scanned'
    value: ${{ steps.scan.outputs.scanned_count }}
  scan_status:
    description: 'Overall scan status (clean or infected)'
    value: ${{ steps.scan.outputs.scan_status }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-clamav

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: pip install pyyaml

    - name: Run ClamAV via Argus SDK
      id: scan
      shell: bash
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        SCAN_PATH: ${{ inputs.scan_path }}
      run: |
        mkdir -p clamav-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan clamav \
          --path "${SCAN_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./clamav-reports \
          --output-vars ./clamav-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f clamav-reports/counts.env ] && cat clamav-reports/counts.env >> "$GITHUB_OUTPUT"

        # Remap SDK names to ClamAV-specific output names
        INFECTED=0
        SCANNED=0
        SCAN_STATUS="clean"

        if [ -f clamav-reports/counts.env ]; then
          INFECTED=$(grep total_count clamav-reports/counts.env | cut -d= -f2)
          INFECTED=${INFECTED:-0}
        fi

        # scanned_files lives in the scanner metadata (not in counts.env)
        JSON_FILE="clamav-reports/argus-results.json"
        if [ -f "$JSON_FILE" ]; then
          SCANNED=$(jq -r '.results[0].metadata.scanned_files // "0"' "$JSON_FILE")
        fi

        echo "infected_count=$INFECTED" >> "$GITHUB_OUTPUT"
        echo "scanned_count=$SCANNED" >> "$GITHUB_OUTPUT"

        if [ "$INFECTED" -gt 0 ]; then
          SCAN_STATUS="infected"
          echo "::warning title=Malware Detected::ClamAV found $INFECTED infected file(s)"
        fi

        echo "scan_status=$SCAN_STATUS" >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment artifact and step summary
        if [ -f "clamav-reports/argus-summary.md" ]; then
          cp clamav-reports/argus-summary.md scanner-summaries/clamav.md
          cat clamav-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload ClamAV artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: clamav-reports-${{ inputs.job_id }}
        path: clamav-reports/
        retention-days: 30
      if: always()

    - name: Upload ClamAV SARIF
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        sarif_file: clamav-reports/argus-results.sarif
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('clamav-reports/argus-results.sarif') != ''
      continue-on-error: true

    - name: Upload ClamAV summary section
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: scanner-summary-clamav-${{ inputs.job_id }}
        path: scanner-summaries/clamav.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with ClamAV results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@0.7.0
      with:
        summary_file: scanner-summaries/clamav.md
        comment_marker: clamav-scanner-comment-marker
        title: '🛡️ ClamAV Malware Scan Results'
        fallback_message: 'No ClamAV results available'

branding:
  icon: 'shield'
  color: 'blue'
