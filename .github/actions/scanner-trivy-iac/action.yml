name: 'Trivy IaC Scanner'
description: |
  Run Trivy infrastructure-as-code scanning and generate reports.

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Usage Example:**
  ```yaml
  - uses: ./.github/actions/scanner-trivy-iac
    env:
      GITHUB_TOKEN: (secrets.GITHUB_TOKEN)
    with:
      iac_path: 'infrastructure'
      fail_on_severity: 'high'
  ```

author: 'Argus'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  iac_path:
    description: 'Relative path to the infrastructure-as-code directory to scan'
    required: false
    default: 'infrastructure'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository'
    required: false
    default: 'false'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'true'
  fail_on_severity:
    description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical. Set to "none" to never fail.'
    required: false
    default: 'none'

outputs:
  critical_count:
    description: 'Number of critical severity misconfigurations found'
    value: ${{ steps.results.outputs.critical_count }}
  high_count:
    description: 'Number of high severity misconfigurations found'
    value: ${{ steps.results.outputs.high_count }}
  medium_count:
    description: 'Number of medium severity misconfigurations found'
    value: ${{ steps.results.outputs.medium_count }}
  low_count:
    description: 'Number of low severity misconfigurations found'
    value: ${{ steps.results.outputs.low_count }}
  total_count:
    description: 'Total number of misconfigurations found'
    value: ${{ steps.results.outputs.total_count }}
  has_iac:
    description: 'Whether IaC directory was found and scanned'
    value: ${{ steps.validate.outputs.has_iac }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-trivy-iac

    - name: Validate scan directory
      id: validate
      shell: bash
      env:
        IAC_PATH_INPUT: ${{ inputs.iac_path }}
      run: |
        IAC_PATH="$IAC_PATH_INPUT"
        if [ -z "$IAC_PATH" ]; then
          IAC_PATH='infrastructure'
        fi

        if [ ! -d "$IAC_PATH" ]; then
          echo "Directory '$IAC_PATH' not found. Skipping Trivy IaC scan."
          echo "has_iac=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "has_iac=true" >> "$GITHUB_OUTPUT"
        echo "iac_path=$IAC_PATH" >> "$GITHUB_OUTPUT"
        echo "Found IaC directory: $IAC_PATH"

    - name: Set up Python
      if: steps.validate.outputs.has_iac == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'

    - name: Install Argus SDK
      if: steps.validate.outputs.has_iac == 'true'
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run Trivy IaC via Argus SDK
      id: scan
      if: steps.validate.outputs.has_iac == 'true'
      shell: bash
      env:
        IAC_PATH: ${{ steps.validate.outputs.iac_path }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
      run: |
        mkdir -p trivy-iac-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan trivy-iac \
          --path "${IAC_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./trivy-iac-reports \
          --output-vars ./trivy-iac-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f trivy-iac-reports/counts.env ] && cat trivy-iac-reports/counts.env >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment artifact
        if [ -f "trivy-iac-reports/argus-summary.md" ]; then
          cp trivy-iac-reports/argus-summary.md scanner-summaries/trivy-iac.md
          cat trivy-iac-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Collect results
      id: results
      if: always()
      shell: bash
      env:
        HAS_IAC: ${{ steps.validate.outputs.has_iac }}
        SCAN_CRITICAL: ${{ steps.scan.outputs.critical_count }}
        SCAN_HIGH: ${{ steps.scan.outputs.high_count }}
        SCAN_MEDIUM: ${{ steps.scan.outputs.medium_count }}
        SCAN_LOW: ${{ steps.scan.outputs.low_count }}
        SCAN_TOTAL: ${{ steps.scan.outputs.total_count }}
      run: |
        if [ "$HAS_IAC" = "true" ]; then
          echo "critical_count=${SCAN_CRITICAL:-0}" >> "$GITHUB_OUTPUT"
          echo "high_count=${SCAN_HIGH:-0}" >> "$GITHUB_OUTPUT"
          echo "medium_count=${SCAN_MEDIUM:-0}" >> "$GITHUB_OUTPUT"
          echo "low_count=${SCAN_LOW:-0}" >> "$GITHUB_OUTPUT"
          echo "total_count=${SCAN_TOTAL:-0}" >> "$GITHUB_OUTPUT"
        else
          echo "critical_count=0" >> "$GITHUB_OUTPUT"
          echo "high_count=0" >> "$GITHUB_OUTPUT"
          echo "medium_count=0" >> "$GITHUB_OUTPUT"
          echo "low_count=0" >> "$GITHUB_OUTPUT"
          echo "total_count=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Trivy IaC artifacts
      if: steps.validate.outputs.has_iac == 'true' && always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: trivy-iac-scan-results
        path: trivy-iac-reports/
        retention-days: 30

    - name: Upload Trivy SARIF results to GitHub Security
      if: inputs.enable_code_security == 'true' && steps.validate.outputs.has_iac == 'true' && always() && github.actor != 'nektos/act' && hashFiles('trivy-iac-reports/argus-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
      with:
        sarif_file: trivy-iac-reports/argus-results.sarif
        category: trivy-iac
      continue-on-error: true

    - name: Upload scanner summary section
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scanner-summary-trivy-iac
        path: scanner-summaries/trivy-iac.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Trivy IaC results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.11.0
      with:
        summary_file: scanner-summaries/trivy-iac.md
        comment_marker: trivy-iac-scanner-comment-marker
        title: '🔍 Trivy IaC Security Results'
        fallback_message: 'No Trivy IaC results available'
