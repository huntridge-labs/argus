name: 'SCN Detector'
description: 'Classify IaC changes for compliance reporting (FedRAMP SCN) via Argus SDK'
author: 'Argus'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  base_ref:
    description: 'Base branch/ref for comparison (default: PR base or main)'
    required: false
    default: ${{ github.base_ref || 'main' }}
  head_ref:
    description: 'Head commit/ref for comparison (default: current SHA)'
    required: false
    default: ${{ github.sha }}
  config_file:
    description: |
      Path to your SCN configuration file. Defines classification rules and thresholds.
      If not provided, a default FedRAMP Low profile will be used.
    required: false
    default: ''
  enable_ai_fallback:
    description: 'Use AI for ambiguous change classification (provider/model configured in scn-config.yml)'
    required: true
    default: 'false'
  ai_config_file:
    description: |
      Path to AI configuration file (optional). Reserved for future SDK support.
      Currently has no effect — AI settings come from the SCN profile.
    required: false
    default: ''
  create_issues:
    description: 'Create GitHub Issues for Adaptive/Transformative/Impact changes'
    required: false
    default: 'true'
  post_pr_comment:
    description: 'Post PR comment with SCN analysis summary'
    required: false
    default: 'true'
  fail_on_category:
    description: 'Fail workflow on specific category (none, adaptive, transformative, impact)'
    required: false
    default: 'none'
  job_id:
    description: 'Job ID for artifact naming (default: github.job)'
    required: false
    default: ${{ github.job }}
  dry_run:
    description: 'Dry-run mode: generate reports and issue payloads without posting PR comments or creating issues'
    required: false
    default: 'false'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'

outputs:
  change_category:
    description: 'Highest severity change category detected (ROUTINE, ADAPTIVE, TRANSFORMATIVE, IMPACT, MANUAL_REVIEW)'
    value: ${{ steps.classify.outputs.change_category }}
  routine_count:
    description: 'Number of routine changes detected'
    value: ${{ steps.classify.outputs.routine_count }}
  adaptive_count:
    description: 'Number of adaptive changes detected'
    value: ${{ steps.classify.outputs.adaptive_count }}
  transformative_count:
    description: 'Number of transformative changes detected'
    value: ${{ steps.classify.outputs.transformative_count }}
  impact_count:
    description: 'Number of impact categorization changes detected'
    value: ${{ steps.classify.outputs.impact_count }}
  manual_review_count:
    description: 'Number of changes requiring manual review (unmatched by rules)'
    value: ${{ steps.classify.outputs.manual_review_count }}
  has_changes:
    description: 'Whether any IaC changes were detected (true/false)'
    value: ${{ steps.classify.outputs.has_changes }}
  issue_numbers:
    description: 'Comma-separated list of GitHub issue numbers created'
    value: ${{ steps.create-issues.outputs.issue_numbers }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #     with:
    #       fetch-depth: 0
    #   - uses: ./.github/actions/scn-detector

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      run: pip install pyyaml

    - name: Run SCN classification via Argus SDK
      id: classify
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
        HEAD_REF: ${{ inputs.head_ref }}
        CONFIG_FILE: ${{ inputs.config_file }}
        ENABLE_AI: ${{ inputs.enable_ai_fallback }}
        FAIL_ON_CATEGORY: ${{ inputs.fail_on_category }}
      run: |
        mkdir -p scn-reports scn-summaries

        # Build CLI flags
        CONFIG_FLAG=""
        if [ -n "$CONFIG_FILE" ]; then
          CONFIG_FLAG="--config $CONFIG_FILE"
        fi

        AI_FLAG=""
        if [ "$ENABLE_AI" = "true" ]; then
          AI_FLAG="--enable-ai"
        fi

        # Run classify — JSON report + output-vars for counts
        CLASSIFY_EXIT=0
        python -m argus classify \
          --base "${BASE_REF}" \
          --head "${HEAD_REF}" \
          --format json \
          --output-dir ./scn-reports \
          --output-vars ./scn-reports/counts.env \
          $CONFIG_FLAG \
          $AI_FLAG \
          || CLASSIFY_EXIT=$?

        # Run classify — Markdown report for PR comment / step summary
        python -m argus classify \
          --base "${BASE_REF}" \
          --head "${HEAD_REF}" \
          --format markdown \
          --output-dir ./scn-reports \
          $CONFIG_FLAG \
          $AI_FLAG \
          || true

        # Forward counts to GitHub Actions outputs
        if [ -f scn-reports/counts.env ]; then
          cat scn-reports/counts.env >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # Derive highest change category
          ROUTINE=$(grep routine_count scn-reports/counts.env | cut -d= -f2 || echo 0)
          ADAPTIVE=$(grep adaptive_count scn-reports/counts.env | cut -d= -f2 || echo 0)
          TRANSFORMATIVE=$(grep transformative_count scn-reports/counts.env | cut -d= -f2 || echo 0)
          IMPACT=$(grep impact_count scn-reports/counts.env | cut -d= -f2 || echo 0)
          MANUAL_REVIEW=$(grep manual_review_count scn-reports/counts.env | cut -d= -f2 || echo 0)

          # Default missing counts to 0
          ROUTINE=${ROUTINE:-0}
          ADAPTIVE=${ADAPTIVE:-0}
          TRANSFORMATIVE=${TRANSFORMATIVE:-0}
          IMPACT=${IMPACT:-0}
          MANUAL_REVIEW=${MANUAL_REVIEW:-0}

          if [ "$IMPACT" -gt 0 ]; then
            CATEGORY="IMPACT"
          elif [ "$TRANSFORMATIVE" -gt 0 ]; then
            CATEGORY="TRANSFORMATIVE"
          elif [ "$ADAPTIVE" -gt 0 ]; then
            CATEGORY="ADAPTIVE"
          elif [ "$MANUAL_REVIEW" -gt 0 ]; then
            CATEGORY="MANUAL_REVIEW"
          else
            CATEGORY="ROUTINE"
          fi
          echo "change_category=$CATEGORY" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo "change_category=NONE" >> "$GITHUB_OUTPUT"
          echo "routine_count=0" >> "$GITHUB_OUTPUT"
          echo "adaptive_count=0" >> "$GITHUB_OUTPUT"
          echo "transformative_count=0" >> "$GITHUB_OUTPUT"
          echo "impact_count=0" >> "$GITHUB_OUTPUT"
          echo "manual_review_count=0" >> "$GITHUB_OUTPUT"
        fi

        # Render the raw report to the job step summary, then build a wrapped
        # copy for the security-summary aggregator. The aggregator collects
        # `scanner-summary-*` artifacts and unwraps a single outer <details>
        # into a `#### heading`, so wrapping here makes SCN render with a
        # scanner heading alongside the other scanners' collapsible sections.
        if [ -f "scn-reports/scn-report.md" ]; then
          cat scn-reports/scn-report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo "<details><summary>🔐 FedRAMP SCN Analysis (Compliance)</summary>"
            echo ""
            cat scn-reports/scn-report.md
            echo ""
            echo "</details>"
          } > scn-summaries/scn-report.md
        fi

        # Handle fail_on_category
        if [ "$FAIL_ON_CATEGORY" != "none" ] && [ -f scn-reports/counts.env ]; then
          case "$FAIL_ON_CATEGORY" in
            "impact")
              [ "${IMPACT:-0}" -gt 0 ] && exit 1 ;;
            "transformative")
              ([ "${TRANSFORMATIVE:-0}" -gt 0 ] || [ "${IMPACT:-0}" -gt 0 ]) && exit 1 ;;
            "adaptive")
              ([ "${ADAPTIVE:-0}" -gt 0 ] || [ "${TRANSFORMATIVE:-0}" -gt 0 ] || [ "${IMPACT:-0}" -gt 0 ]) && exit 1 ;;
          esac
        fi

        exit $CLASSIFY_EXIT

    - name: Upload SCN artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scn-reports-${{ inputs.job_id }}
        path: scn-reports/
        retention-days: 90
      if: always()
      continue-on-error: true

    - name: Upload SCN summary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scanner-summary-scn-${{ inputs.job_id }}
        path: scn-summaries/
        retention-days: 7
      if: always()
      continue-on-error: true

    - name: Comment PR with SCN analysis
      if: |
        inputs.dry_run != 'true' &&
        github.event_name == 'pull_request' &&
        inputs.post_pr_comment == 'true' &&
        steps.classify.outputs.has_changes == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.8.1
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      with:
        summary_file: scn-reports/scn-report.md
        comment_marker: scn-detector-comment-marker
        title: '🔐 FedRAMP SCN Analysis'
        fallback_message: 'No SCN analysis available'
      continue-on-error: true

    - name: Create SCN tracking issues
      id: create-issues
      if: |
        inputs.create_issues == 'true' &&
        steps.classify.outputs.has_changes == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        DRY_RUN: ${{ inputs.dry_run }}
        ISSUE_SCRIPT: ${{ github.action_path }}/scripts/create_scn_issue.py
        GITHUB_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        RUN_ID: ${{ github.run_id }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        DRY_RUN_ARG=""
        if [ "$DRY_RUN" = "true" ]; then
          DRY_RUN_ARG="--dry-run --dry-run-output scn-reports/dry-run-issues.json"
        fi

        python3 "$ISSUE_SCRIPT" \
          --input scn-reports/scn-report.json \
          --repo "$GITHUB_REPO" \
          --pr-number "$PR_NUMBER" \
          --run-id "$RUN_ID" \
          --server-url "$SERVER_URL" \
          --output scn-reports/issue-numbers.txt \
          $DRY_RUN_ARG

        if [ "$DRY_RUN" = "true" ]; then
          if [ -f scn-reports/dry-run-issues.json ]; then
            TOTAL=$(python3 -c "import json; print(json.load(open('scn-reports/dry-run-issues.json'))['total'])")
            echo "Dry-run: would have created $TOTAL issue(s)"
          fi
          echo "issue_numbers=" >> $GITHUB_OUTPUT
        elif [ -f scn-reports/issue-numbers.txt ]; then
          ISSUE_NUMBERS=$(cat scn-reports/issue-numbers.txt)
          echo "issue_numbers=$ISSUE_NUMBERS" >> $GITHUB_OUTPUT
        else
          echo "issue_numbers=" >> $GITHUB_OUTPUT
        fi
      continue-on-error: true
