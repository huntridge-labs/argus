name: 'Gitleaks Secrets Scanner'
description: 'Run Gitleaks secrets detection via Argus SDK and generate reports'
author: 'Argus'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'true'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Severity threshold — fail if findings meet or exceed this level (critical, high, medium, low, none).'
    required: false
    default: 'none'
  gitleaks_config:
    description: 'Path to a gitleaks configuration file (e.g., "path/to/gitleaks.toml")'
    required: false
    default: ''
  scan_path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'

outputs:
  secrets_count:
    description: 'Number of secrets detected'
    value: ${{ steps.scan.outputs.secrets_count }}
  high_count:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high_count }}
  total_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action.
    # Gitleaks requires fetch-depth: 0 for full git history scanning.
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #     with:
    #       persist-credentials: false
    #       fetch-depth: 0
    #   - uses: ./.github/actions/scanner-gitleaks

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      run: pip install pyyaml

    - name: Run Gitleaks via Argus SDK
      id: scan
      shell: bash
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        SCAN_PATH: ${{ inputs.scan_path }}
      run: |
        mkdir -p gitleaks-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan gitleaks \
          --path "${SCAN_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif json markdown \
          --output-dir ./gitleaks-reports \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Parse severity counts from JSON output
        HIGH=0; TOTAL=0
        JSON_FILE="gitleaks-reports/argus-results.json"
        if [ -f "$JSON_FILE" ]; then
          HIGH=$(jq '.results[0].high_count // 0' "$JSON_FILE")
          TOTAL=$(jq '.results[0].total_count // 0' "$JSON_FILE")
        fi

        echo "secrets_count=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "high_count=$HIGH" >> "$GITHUB_OUTPUT"
        echo "total_count=$TOTAL" >> "$GITHUB_OUTPUT"

        echo "Found: HIGH=$HIGH, TOTAL=$TOTAL"

        # Copy markdown summary for PR comment artifact
        if [ -f "gitleaks-reports/argus-summary.md" ]; then
          cp gitleaks-reports/argus-summary.md scanner-summaries/gitleaks.md
          cat gitleaks-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload Gitleaks artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: gitleaks-reports
        path: gitleaks-reports/
        retention-days: 30
      if: always()

    - name: Upload Gitleaks SARIF
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        sarif_file: gitleaks-reports/argus-results.sarif
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('gitleaks-reports/argus-results.sarif') != ''
      continue-on-error: true

    - name: Upload Gitleaks summary section
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: scanner-summary-gitleaks
        path: scanner-summaries/gitleaks.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Gitleaks results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@0.7.0
      with:
        summary_file: scanner-summaries/gitleaks.md
        comment_marker: gitleaks-scanner-comment-marker
        title: '🔑 Gitleaks Secrets Detection Results'
        fallback_message: 'No Gitleaks results available'
