name: 'Gitleaks Secrets Scanner'
description: 'Run Gitleaks secrets detection via Argus SDK and generate reports'
author: 'Argus'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'true'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Severity threshold — fail if findings meet or exceed this level (critical, high, medium, low, none).'
    required: false
    default: 'none'
  gitleaks_config:
    description: 'Path to a gitleaks configuration file (e.g., "path/to/gitleaks.toml")'
    required: false
    default: ''
  scan_path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'

outputs:
  secrets_count:
    description: 'Number of secrets detected'
    value: ${{ steps.scan.outputs.secrets_count }}
  high_count:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high_count }}
  total_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action.
    # Gitleaks requires fetch-depth: 0 for full git history scanning.
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #     with:
    #       persist-credentials: false
    #       fetch-depth: 0
    #   - uses: ./.github/actions/scanner-gitleaks

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run Gitleaks via Argus SDK
      id: scan
      shell: bash
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        SCAN_PATH: ${{ inputs.scan_path }}
      run: |
        mkdir -p gitleaks-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan gitleaks \
          --path "${SCAN_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./gitleaks-reports \
          --output-vars ./gitleaks-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f gitleaks-reports/counts.env ] && cat gitleaks-reports/counts.env >> "$GITHUB_OUTPUT"

        # Remap total_count to secrets_count for backward compatibility
        if [ -f gitleaks-reports/counts.env ]; then
          echo "secrets_count=$(grep total_count gitleaks-reports/counts.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
        fi

        # Copy markdown summary for PR comment artifact
        if [ -f "gitleaks-reports/argus-summary.md" ]; then
          cp gitleaks-reports/argus-summary.md scanner-summaries/gitleaks.md
          cat gitleaks-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload Gitleaks artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: gitleaks-reports
        path: gitleaks-reports/
        retention-days: 30
      if: always()

    - name: Upload Gitleaks SARIF
      uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
      with:
        sarif_file: gitleaks-reports/argus-results.sarif
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('gitleaks-reports/argus-results.sarif') != ''
      continue-on-error: true

    - name: Upload Gitleaks summary section
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scanner-summary-gitleaks
        path: scanner-summaries/gitleaks.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Gitleaks results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.10.0
      with:
        summary_file: scanner-summaries/gitleaks.md
        comment_marker: gitleaks-scanner-comment-marker
        title: '🔑 Gitleaks Secrets Detection Results'
        fallback_message: 'No Gitleaks results available'
