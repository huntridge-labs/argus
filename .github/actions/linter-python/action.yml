name: 'Python Linter'
description: |
  Run Python code quality checks using flake8 via Argus SDK.

  This action checks Python code for style violations using flake8.
  Results are uploaded as artifacts and can be aggregated by the
  linting-summary action.

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
  - uses: huntridge-labs/argus/.github/actions/linter-python@1.4.1
    with:
      fail_on_issues: false
      max_line_length: '120'
  ```

inputs:
  fail_on_issues:
    description: 'Fail the job if linting issues are found'
    required: false
    default: 'false'
  paths:
    description: 'Paths to lint (space-separated). Defaults to entire repository.'
    required: false
    default: '.'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  max_line_length:
    description: 'Maximum line length for flake8. Configure in argus.yml for SDK-based runs.'
    required: false
    default: '120'
  flake8_ignore:
    description: 'Flake8 error codes to ignore (comma-separated). Configure in argus.yml for SDK-based runs.'
    required: false
    default: 'E203,W503'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'

outputs:
  issues_count:
    description: 'Total number of linting issues found'
    value: ${{ steps.scan.outputs.issue_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/linter-python

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run Python Linter via Argus SDK
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.paths }}
        FAIL_ON_ISSUES: ${{ inputs.fail_on_issues }}
      run: |
        mkdir -p python-lint-reports scanner-summaries

        # Map fail_on_issues boolean to severity threshold
        SEVERITY="none"
        if [ "$FAIL_ON_ISSUES" = "true" ]; then
          SEVERITY="info"
        fi

        SCAN_EXIT=0
        python -m argus scan lint-python \
          --path "${SCAN_PATH}" \
          --severity-threshold "${SEVERITY}" \
          --format sarif --format json --format markdown \
          --output-dir ./python-lint-reports \
          --output-vars ./python-lint-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f python-lint-reports/counts.env ] && cat python-lint-reports/counts.env >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment and step summary
        if [ -f "python-lint-reports/argus-summary.md" ]; then
          cp python-lint-reports/argus-summary.md scanner-summaries/python-lint.md
          cat python-lint-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload Python lint artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: python-lint-reports
        path: python-lint-reports/
        retention-days: 30
      if: always()

    - name: Upload Python lint summary section
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: linter-summary-python
        path: scanner-summaries/python-lint.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Python lint results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.4.1
      with:
        summary_file: scanner-summaries/python-lint.md
        comment_marker: python-linter-comment-marker
        title: '🐍 Python Code Quality Results'
        fallback_message: 'No Python linting results available'

branding:
  icon: 'code'
  color: 'blue'
