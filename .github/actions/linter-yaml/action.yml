name: 'YAML Linter'
description: |
  Run yamllint for YAML file validation and style checking via Argus SDK.

  This action validates YAML files for syntax errors and style violations
  using yamllint. Results are uploaded as artifacts and can be aggregated
  by the linting-summary action.

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
  - uses: huntridge-labs/argus/.github/actions/linter-yaml@1.8.0
    with:
      fail_on_issues: false
      config_file: '.yamllint.yml'
  ```

inputs:
  fail_on_issues:
    description: 'Fail the job if linting issues are found'
    required: false
    default: 'false'
  config_file:
    description: 'Path to yamllint configuration file. Configure in argus.yml for SDK-based runs.'
    required: false
    default: ''
  paths:
    description: 'Paths to lint (space-separated). Defaults to entire repository.'
    required: false
    default: '.'
  python_version:
    description: 'Python version to use for yamllint'
    required: false
    default: '3.12'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'

outputs:
  issues_count:
    description: 'Number of linting issues found'
    value: ${{ steps.scan.outputs.issue_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/linter-yaml

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run YAML Linter via Argus SDK
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.paths }}
        FAIL_ON_ISSUES: ${{ inputs.fail_on_issues }}
      run: |
        mkdir -p yaml-lint-reports scanner-summaries

        # Map fail_on_issues boolean to severity threshold
        SEVERITY="none"
        if [ "$FAIL_ON_ISSUES" = "true" ]; then
          SEVERITY="info"
        fi

        SCAN_EXIT=0
        python -m argus scan lint-yaml \
          --path "${SCAN_PATH}" \
          --severity-threshold "${SEVERITY}" \
          --format sarif --format json --format markdown \
          --output-dir ./yaml-lint-reports \
          --output-vars ./yaml-lint-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f yaml-lint-reports/counts.env ] && cat yaml-lint-reports/counts.env >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment and step summary
        if [ -f "yaml-lint-reports/argus-summary.md" ]; then
          cp yaml-lint-reports/argus-summary.md scanner-summaries/yaml-lint.md
          cat yaml-lint-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload YAML lint artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: yaml-lint-reports
        path: yaml-lint-reports/
        retention-days: 30
      if: always()

    - name: Upload YAML lint summary section
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: linter-summary-yaml
        path: scanner-summaries/yaml-lint.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with YAML lint results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.8.0
      with:
        summary_file: scanner-summaries/yaml-lint.md
        comment_marker: yaml-linter-comment-marker
        title: '📄 YAML Linting Results'
        fallback_message: 'No YAML linting results available'

branding:
  icon: 'file-text'
  color: 'yellow'
