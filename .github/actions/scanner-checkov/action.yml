name: 'Checkov Scanner'
description: |
  Run Checkov infrastructure-as-code scanning and generate reports.

  This action analyzes IaC for security misconfigurations using Checkov,
  supporting multiple frameworks including Terraform, CloudFormation,
  Kubernetes, and more.

  Results integrate with security-summary for aggregated reporting.

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Optional Environment Variables:**
  - BC_API_KEY: Prisma Cloud API key for enhanced severity scoring and features

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
  - uses: huntridge-labs/argus/.github/actions/scanner-checkov@1.7.0
    env:
      GITHUB_TOKEN: (secrets.GITHUB_TOKEN)
      BC_API_KEY: (secrets.BC_API_KEY)  # Optional: for severity info
    with:
      iac_path: 'infrastructure'
      framework: 'terraform'
      fail_on_severity: 'high'
  ```

author: 'Argus'

branding:
  icon: 'check-square'
  color: 'green'

inputs:
  iac_path:
    description: 'Relative path to the infrastructure-as-code directory to scan'
    required: false
    default: 'infrastructure'
  framework:
    description: 'IaC framework to scan (terraform, cloudformation, kubernetes, etc.)'
    required: false
    default: 'terraform'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository (uploads SARIF to Security tab)'
    required: false
    default: 'false'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'true'
  fail_on_severity:
    description: 'Fail if findings at or above this severity. Options: none, low, medium, high, critical. Note: Checkov does not natively support severity-based filtering; any value other than "none" will fail on any failed check.'
    required: false
    default: 'none'
  api_key:
    description: 'Prisma Cloud API key for enhanced features (severity scoring, advanced reporting). Optional - works without it but with reduced functionality.'
    required: false
    default: ''

outputs:
  critical_count:
    description: 'Number of critical severity findings'
    value: ${{ steps.results.outputs.critical_count }}
  high_count:
    description: 'Number of high severity findings'
    value: ${{ steps.results.outputs.high_count }}
  medium_count:
    description: 'Number of medium severity findings'
    value: ${{ steps.results.outputs.medium_count }}
  low_count:
    description: 'Number of low severity findings'
    value: ${{ steps.results.outputs.low_count }}
  total_count:
    description: 'Total number of findings'
    value: ${{ steps.results.outputs.total_count }}
  passed_count:
    description: 'Number of passed checks'
    value: ${{ steps.results.outputs.passed_count }}
  has_iac:
    description: 'Whether IaC directory was found and scanned'
    value: ${{ steps.validate.outputs.has_iac }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-checkov

    - name: Validate scan directory
      id: validate
      shell: bash
      env:
        IAC_PATH_INPUT: ${{ inputs.iac_path }}
      run: |
        IAC_PATH="$IAC_PATH_INPUT"
        if [ -z "$IAC_PATH" ]; then
          IAC_PATH='infrastructure'
        fi

        if [ ! -d "$IAC_PATH" ]; then
          echo "Directory '$IAC_PATH' not found. Skipping Checkov scan."
          echo "has_iac=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "has_iac=true" >> "$GITHUB_OUTPUT"
        echo "iac_path=$IAC_PATH" >> "$GITHUB_OUTPUT"
        echo "Found IaC directory: $IAC_PATH"

    - name: Set up Python
      if: steps.validate.outputs.has_iac == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'

    - name: Install Argus SDK
      if: steps.validate.outputs.has_iac == 'true'
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run Checkov via Argus SDK
      id: scan
      if: steps.validate.outputs.has_iac == 'true'
      shell: bash
      env:
        IAC_PATH: ${{ steps.validate.outputs.iac_path }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
      run: |
        mkdir -p checkov-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan checkov \
          --path "${IAC_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./checkov-reports \
          --output-vars ./checkov-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f checkov-reports/counts.env ] && cat checkov-reports/counts.env >> "$GITHUB_OUTPUT"

        # passed_count is checkov-specific metadata not in counts.env
        JSON_FILE="checkov-reports/argus-results.json"
        if [ -f "$JSON_FILE" ]; then
          echo "passed_count=$(jq '.results[0].metadata.passed_count // 0' "$JSON_FILE")" >> "$GITHUB_OUTPUT"
        fi

        # Copy markdown summary for PR comment artifact
        if [ -f "checkov-reports/argus-summary.md" ]; then
          cp checkov-reports/argus-summary.md scanner-summaries/checkov.md
          cat checkov-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Collect results
      id: results
      if: always()
      shell: bash
      env:
        HAS_IAC: ${{ steps.validate.outputs.has_iac }}
        SCAN_CRITICAL: ${{ steps.scan.outputs.critical_count }}
        SCAN_HIGH: ${{ steps.scan.outputs.high_count }}
        SCAN_MEDIUM: ${{ steps.scan.outputs.medium_count }}
        SCAN_LOW: ${{ steps.scan.outputs.low_count }}
        SCAN_TOTAL: ${{ steps.scan.outputs.total_count }}
        SCAN_PASSED: ${{ steps.scan.outputs.passed_count }}
      run: |
        if [ "$HAS_IAC" = "true" ]; then
          echo "critical_count=${SCAN_CRITICAL:-0}" >> "$GITHUB_OUTPUT"
          echo "high_count=${SCAN_HIGH:-0}" >> "$GITHUB_OUTPUT"
          echo "medium_count=${SCAN_MEDIUM:-0}" >> "$GITHUB_OUTPUT"
          echo "low_count=${SCAN_LOW:-0}" >> "$GITHUB_OUTPUT"
          echo "total_count=${SCAN_TOTAL:-0}" >> "$GITHUB_OUTPUT"
          echo "passed_count=${SCAN_PASSED:-0}" >> "$GITHUB_OUTPUT"
        else
          echo "critical_count=0" >> "$GITHUB_OUTPUT"
          echo "high_count=0" >> "$GITHUB_OUTPUT"
          echo "medium_count=0" >> "$GITHUB_OUTPUT"
          echo "low_count=0" >> "$GITHUB_OUTPUT"
          echo "total_count=0" >> "$GITHUB_OUTPUT"
          echo "passed_count=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Checkov reports
      if: steps.validate.outputs.has_iac == 'true' && always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: checkov-reports
        path: checkov-reports/
        retention-days: 30
      continue-on-error: true

    - name: Upload SARIF to GitHub Security
      if: inputs.enable_code_security == 'true' && steps.validate.outputs.has_iac == 'true' && always() && github.actor != 'nektos/act' && hashFiles('checkov-reports/argus-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
      with:
        sarif_file: checkov-reports/argus-results.sarif
        category: checkov
      continue-on-error: true

    - name: Upload scanner summary
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scanner-summary-checkov
        path: scanner-summaries/checkov.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Checkov results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.7.0
      with:
        summary_file: scanner-summaries/checkov.md
        comment_marker: checkov-scanner-comment-marker
        title: '✅ Checkov IaC Security Results'
        fallback_message: 'No Checkov results available'
