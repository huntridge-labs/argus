name: 'Security Summary'
description: |
  Aggregate all security scan results into a unified report.

  This action is designed to run as the FINAL job in your security workflow,
  after all scanner jobs have completed. It downloads scanner summary artifacts
  (default pattern: `scanner-summary-*`), stitches them together, and — when
  `scan_statuses` is provided — renders a per-scanner pass/fail table at the
  top so downstream consumers can distinguish "no findings" from "scanner
  crashed and produced nothing."

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Basic Usage (discovery-only):**
  ```yaml
  security-summary:
    runs-on: ubuntu-latest
    needs: [bandit-scan, gitleaks-scan, trivy-iac-scan, clamav-scan]
    if: always()
    steps:
      - uses: huntridge-labs/argus/.github/actions/security-summary@1.2.1
  ```

  **With status gating (recommended):**

  Pass `scan_statuses` — a JSON object mapping scanner name to the corresponding
  job's `result` — to render a pass/fail/skipped table at the top of the report.
  This prevents the silent-failure mode where a crashed scanner produces no
  summary and the aggregator reports "no findings" as if everything was healthy.

  ```yaml
  security-summary:
    runs-on: ubuntu-latest
    needs: [bandit-scan, gitleaks-scan, container-scan, zap-scan]
    if: always()
    steps:
      - uses: huntridge-labs/argus/.github/actions/security-summary@1.2.1
        with:
          scan_statuses: |
            {
              "bandit": "$[[ needs.bandit-scan.result ]]",
              "gitleaks": "$[[ needs.gitleaks-scan.result ]]",
              "container": "$[[ needs.container-scan.result ]]",
              "zap": "$[[ needs.zap-scan.result ]]"
            }
  ```

  The `$[[ ... ]]` values above are placeholders: a composite action cannot
  reference the `needs` context, so a real GitHub expression here would fail
  to load this manifest. In your own workflow use the standard expression
  syntax wrapping `needs.<job>.result` for each scanner.

inputs:
  summary_pattern:
    description: 'Artifact pattern to match scanner summaries'
    required: false
    default: 'scanner-summary-*'
  title:
    description: 'Title for the summary report'
    required: false
    default: '🔒 Security Scan Summary'
  show_metadata:
    description: 'Show workflow metadata (run number, branch, commit)'
    required: false
    default: 'true'
  show_stats:
    description: 'Show statistics about scanner results'
    required: false
    default: 'true'
  post_pr_comment:
    description: 'Post combined summary as PR comment'
    required: false
    default: 'true'
  scan_statuses:
    description: |
      Optional JSON object mapping scanner name to job result
      (success|failure|cancelled|skipped). When provided, a per-scanner pass/fail
      table is rendered at the top of the report and the overall status is derived
      from it (any failure => job exits non-zero unless `fail_on_scanner_failure`
      is "false"). When absent, the report falls back to a summary-only view.
    required: false
    default: ''
  fail_on_scanner_failure:
    description: |
      When "true" (the default) and `scan_statuses` is provided, the action
      exits non-zero if any listed scanner is not "success" or "skipped". Set
      to "false" to render the report but never block the job.
    required: false
    default: 'true'
  comment_marker:
    description: |
      HTML-comment marker used to identify the bot's summary comment on a PR
      so subsequent runs update the same comment instead of spawning new ones.
      Override when migrating from a pre-existing marker (e.g., pass
      `security-hardening-comment-marker` when replacing the legacy
      reusable-workflow inline summary step to keep the same PR comment
      thread in consumer repos).
    required: false
    default: 'security-summary-comment-marker'

outputs:
  overall_status:
    description: 'Derived verdict: success, failure, or unknown (when scan_statuses is empty).'
    value: ${{ steps.generate.outputs.overall_status }}
  failed_count:
    description: 'Number of scanners in scan_statuses that did not succeed.'
    value: ${{ steps.generate.outputs.failed_count }}

runs:
  using: 'composite'
  steps:
    - name: Download all scanner summaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: ${{ inputs.summary_pattern }}
        path: scanner-summaries
        merge-multiple: true
      continue-on-error: true

    - name: Generate combined summary
      id: generate
      shell: bash
      env:
        SUMMARY_TITLE: ${{ inputs.title }}
        SHOW_METADATA: ${{ inputs.show_metadata }}
        SHOW_STATS: ${{ inputs.show_stats }}
        SCAN_STATUSES_JSON: ${{ inputs.scan_statuses }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        mkdir -p combined-summaries
        # Generate the job-step summary (with title) and the PR comment body (without title).
        python3 "${{ github.action_path }}/scripts/generate_summary.py" \
          "$GITHUB_STEP_SUMMARY" true
        python3 "${{ github.action_path }}/scripts/generate_summary.py" \
          combined-summaries/security.md false

    - name: Comment PR with security summary
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.2.1
      with:
        summary_file: combined-summaries/security.md
        comment_marker: ${{ inputs.comment_marker }}
        title: '${{ inputs.title }}'
        fallback_message: 'No security scan results available'

    - name: Fail job when any scanner reported failure
      if: inputs.fail_on_scanner_failure == 'true' && steps.generate.outputs.overall_status == 'failure'
      shell: bash
      env:
        FAILED_COUNT: ${{ steps.generate.outputs.failed_count }}
      run: |
        echo "::error title=Security scanner failure::${FAILED_COUNT} scanner(s) did not complete successfully. See the status table in the summary for details."
        exit 1

branding:
  icon: 'file-text'
  color: 'blue'
