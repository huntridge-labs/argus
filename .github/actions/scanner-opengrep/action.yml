name: 'OpenGrep Scanner'
description: |
  Run OpenGrep SAST analysis and generate reports.

  This action analyzes code for security vulnerabilities using OpenGrep,
  a pattern-based static analysis tool. It supports multiple languages
  including Python, JavaScript, Go, Java, and more.

  Results integrate with security-summary for aggregated reporting.

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  - uses: huntridge-labs/argus/.github/actions/scanner-opengrep@0.7.0
    with:
      fail_on_severity: 'high'
  ```

author: 'Argus'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  config:
    description: 'OpenGrep config (e.g., auto, p/default, p/security-audit, or path to custom rules)'
    required: false
    default: 'auto'
  paths:
    description: 'Paths to scan (space-separated)'
    required: false
    default: '.'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository (uploads SARIF to Security tab)'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Fail if findings at or above this severity. Options: none, low, medium, high'
    required: false
    default: 'none'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'

outputs:
  error_count:
    description: 'Number of error severity findings'
    value: ${{ steps.scan.outputs.error_count }}
  warning_count:
    description: 'Number of warning severity findings'
    value: ${{ steps.scan.outputs.warning_count }}
  info_count:
    description: 'Number of info severity findings'
    value: ${{ steps.scan.outputs.info_count }}
  total_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-opengrep

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install OpenGrep
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Installing OpenGrep"
        # Pinned version with checksum — updated by .github/workflows/update-pinned-tools.yml
        OPENGREP_VERSION="1.18.0"
        OPENGREP_CHECKSUM="65390e16db45db1258967578c73eacac6e4ab9cd20074d7dc1aeb695e2696203"
        curl -sSfL "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86" -o opengrep
        echo "${OPENGREP_CHECKSUM}  opengrep" | sha256sum -c --quiet
        chmod +x opengrep
        sudo mv opengrep /usr/local/bin/opengrep
        echo "::endgroup::"

    - name: Install Argus SDK
      shell: bash
      run: pip install pyyaml

    - name: Run OpenGrep via Argus SDK
      id: scan
      shell: bash
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        CONFIG_INPUT: ${{ inputs.config }}
        PATHS_INPUT: ${{ inputs.paths }}
      run: |
        mkdir -p opengrep-reports scanner-summaries

        # Build a temporary argus config with scanner-specific settings
        CONFIG_EXTRA=""
        if [ -n "$CONFIG_INPUT" ] && [ "$CONFIG_INPUT" != "auto" ]; then
          CONFIG_EXTRA="    config: \"$CONFIG_INPUT\""
        fi

        cat > /tmp/argus-opengrep.yml <<ARGUSCFG
        version: "1.0"
        scanners:
          opengrep:
            enabled: true
            path: "${PATHS_INPUT}"
        ${CONFIG_EXTRA}
        reporting:
          formats:
            - sarif
            - json
            - markdown
          severity_threshold: "${FAIL_ON_SEVERITY:-none}"
          output_dir: "./opengrep-reports"
        execution:
          backend: local
        ARGUSCFG

        # Run argus scan (exit code 1 = findings above threshold)
        SCAN_EXIT=0
        python -m argus scan opengrep \
          --config /tmp/argus-opengrep.yml \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Parse severity counts from JSON output
        # SDK maps: ERROR→high, WARNING→medium, INFO→low
        ERROR=0; WARNING=0; INFO=0; TOTAL=0
        JSON_FILE="opengrep-reports/argus-results.json"
        if [ -f "$JSON_FILE" ]; then
          ERROR=$(jq '.results[0].high_count // 0' "$JSON_FILE")
          WARNING=$(jq '.results[0].medium_count // 0' "$JSON_FILE")
          INFO=$(jq '.results[0].low_count // 0' "$JSON_FILE")
          TOTAL=$(jq '.results[0].total_count // 0' "$JSON_FILE")
        fi

        echo "error_count=$ERROR" >> "$GITHUB_OUTPUT"
        echo "warning_count=$WARNING" >> "$GITHUB_OUTPUT"
        echo "info_count=$INFO" >> "$GITHUB_OUTPUT"
        echo "total_count=$TOTAL" >> "$GITHUB_OUTPUT"

        echo "Found: ERROR=$ERROR, WARNING=$WARNING, INFO=$INFO, TOTAL=$TOTAL"

        # Copy markdown summary for PR comment artifact
        if [ -f "opengrep-reports/argus-summary.md" ]; then
          cp opengrep-reports/argus-summary.md scanner-summaries/opengrep.md
          cat opengrep-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload OpenGrep artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: opengrep-reports
        path: opengrep-reports/
        retention-days: 30
      if: always()
      continue-on-error: true

    - name: Upload OpenGrep SARIF
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        sarif_file: opengrep-reports/argus-results.sarif
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('opengrep-reports/argus-results.sarif') != ''
      continue-on-error: true

    - name: Upload scanner summary
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: scanner-summary-opengrep
        path: scanner-summaries/opengrep.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with OpenGrep results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@0.7.0
      with:
        summary_file: scanner-summaries/opengrep.md
        comment_marker: opengrep-comment-marker
        title: '🔍 OpenGrep SAST Results'
        fallback_message: 'No OpenGrep results available'
