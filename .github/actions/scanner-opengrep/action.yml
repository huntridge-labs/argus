name: 'OpenGrep Scanner'
description: |
  Run OpenGrep SAST analysis and generate reports.

  This action analyzes code for security vulnerabilities using OpenGrep,
  a pattern-based static analysis tool. It supports multiple languages
  including Python, JavaScript, Go, Java, and more.

  Results integrate with security-summary for aggregated reporting.

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
  - uses: huntridge-labs/argus/.github/actions/scanner-opengrep@1.9.2
    with:
      fail_on_severity: 'high'
  ```

author: 'Argus'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  config:
    description: 'OpenGrep config (e.g., auto, p/default, p/security-audit, or path to custom rules)'
    required: false
    default: 'auto'
  paths:
    description: 'Paths to scan (space-separated)'
    required: false
    default: '.'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository (uploads SARIF to Security tab)'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Fail if findings at or above this severity. Options: none, low, medium, high'
    required: false
    default: 'none'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'

outputs:
  error_count:
    description: 'Number of error severity findings'
    value: ${{ steps.scan.outputs.error_count }}
  warning_count:
    description: 'Number of warning severity findings'
    value: ${{ steps.scan.outputs.warning_count }}
  info_count:
    description: 'Number of info severity findings'
    value: ${{ steps.scan.outputs.info_count }}
  total_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-opengrep

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run OpenGrep via Argus SDK
      id: scan
      shell: bash
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        PATHS_INPUT: ${{ inputs.paths }}
      run: |
        mkdir -p opengrep-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan opengrep \
          --path "${PATHS_INPUT}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./opengrep-reports \
          --output-vars ./opengrep-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f opengrep-reports/counts.env ] && cat opengrep-reports/counts.env >> "$GITHUB_OUTPUT"

        # Remap SDK severity names to action output names (ERROR→high, WARNING→medium, INFO→low)
        if [ -f opengrep-reports/counts.env ]; then
          echo "error_count=$(grep high_count opengrep-reports/counts.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "warning_count=$(grep medium_count opengrep-reports/counts.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "info_count=$(grep low_count opengrep-reports/counts.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
        fi

        # Copy markdown summary for PR comment artifact
        if [ -f "opengrep-reports/argus-summary.md" ]; then
          cp opengrep-reports/argus-summary.md scanner-summaries/opengrep.md
          cat opengrep-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload OpenGrep artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: opengrep-reports
        path: opengrep-reports/
        retention-days: 30
      if: always()
      continue-on-error: true

    - name: Upload OpenGrep SARIF
      uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
      with:
        sarif_file: opengrep-reports/argus-results.sarif
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('opengrep-reports/argus-results.sarif') != ''
      continue-on-error: true

    - name: Upload scanner summary
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scanner-summary-opengrep
        path: scanner-summaries/opengrep.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with OpenGrep results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.9.2
      with:
        summary_file: scanner-summaries/opengrep.md
        comment_marker: opengrep-comment-marker
        title: '🔍 OpenGrep SAST Results'
        fallback_message: 'No OpenGrep results available'
