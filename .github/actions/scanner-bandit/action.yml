name: 'Bandit Python Security Scanner'
description: 'Run Bandit security scanner on Python code and generate reports'
author: 'Argus'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'true'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Severity threshold — fail if findings meet or exceed this level (critical, high, medium, low, none).'
    required: false
    default: 'none'
  bandit_config_file:
    description: 'Path to Bandit configuration file (e.g. pyproject.toml, .bandit). Passed as bandit -c flag.'
    required: false
    default: ''
  scan_path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'

outputs:
  critical_count:
    description: 'Number of critical severity issues found'
    value: ${{ steps.scan.outputs.critical_count }}
  high_count:
    description: 'Number of high severity issues found'
    value: ${{ steps.scan.outputs.high_count }}
  medium_count:
    description: 'Number of medium severity issues found'
    value: ${{ steps.scan.outputs.medium_count }}
  low_count:
    description: 'Number of low severity issues found'
    value: ${{ steps.scan.outputs.low_count }}
  issue_count:
    description: 'Total number of issues found'
    value: ${{ steps.scan.outputs.issue_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-bandit

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run Bandit via Argus SDK
      id: scan
      shell: bash
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        SCAN_PATH: ${{ inputs.scan_path }}
      run: |
        mkdir -p bandit-reports scanner-summaries

        SCAN_EXIT=0
        python -m argus scan bandit \
          --path "${SCAN_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./bandit-reports \
          --output-vars ./bandit-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f bandit-reports/counts.env ] && cat bandit-reports/counts.env >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment and step summary
        if [ -f "bandit-reports/argus-summary.md" ]; then
          cp bandit-reports/argus-summary.md scanner-summaries/bandit.md
          cat bandit-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload Bandit artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: bandit-reports
        path: bandit-reports/
        retention-days: 30
      if: always()

    - name: Upload Bandit SARIF
      uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
      with:
        sarif_file: bandit-reports/argus-results.sarif
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('bandit-reports/argus-results.sarif') != ''
      continue-on-error: true

    - name: Upload Bandit summary section
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scanner-summary-bandit
        path: scanner-summaries/bandit.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Bandit results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.7.0
      with:
        summary_file: scanner-summaries/bandit.md
        comment_marker: bandit-scanner-comment-marker
        title: '🐍 Bandit Python Security Results'
        fallback_message: 'No Bandit results available'
