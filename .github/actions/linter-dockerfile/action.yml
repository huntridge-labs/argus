name: 'Dockerfile Linter'
description: |
  Run Dockerfile linting using Hadolint via Argus SDK.

  This action validates Dockerfiles for best practices, security issues,
  and common mistakes using Hadolint. Results are uploaded as artifacts
  and can be aggregated by the linting-summary action.

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
  - uses: huntridge-labs/argus/.github/actions/linter-dockerfile@1.7.0
    with:
      fail_on_issues: false
  ```

inputs:
  fail_on_issues:
    description: 'Fail the job if linting issues are found'
    required: false
    default: 'false'
  paths:
    description: 'Paths to search for Dockerfiles (space-separated). Defaults to entire repository.'
    required: false
    default: '.'
  config_file:
    description: 'Path to hadolint configuration file. Configure in argus.yml for SDK-based runs.'
    required: false
    default: ''
  ignore_rules:
    description: 'Hadolint rules to ignore (comma-separated, e.g., DL3008,DL3009). Configure in argus.yml for SDK-based runs.'
    required: false
    default: ''
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'

outputs:
  issues_count:
    description: 'Number of linting issues found'
    value: ${{ steps.scan.outputs.issue_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/linter-dockerfile

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run Dockerfile Linter via Argus SDK
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.paths }}
        FAIL_ON_ISSUES: ${{ inputs.fail_on_issues }}
      run: |
        mkdir -p dockerfile-lint-reports scanner-summaries

        # Map fail_on_issues boolean to severity threshold
        SEVERITY="none"
        if [ "$FAIL_ON_ISSUES" = "true" ]; then
          SEVERITY="info"
        fi

        SCAN_EXIT=0
        python -m argus scan lint-dockerfile \
          --path "${SCAN_PATH}" \
          --severity-threshold "${SEVERITY}" \
          --format sarif --format json --format markdown \
          --output-dir ./dockerfile-lint-reports \
          --output-vars ./dockerfile-lint-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f dockerfile-lint-reports/counts.env ] && cat dockerfile-lint-reports/counts.env >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment and step summary
        if [ -f "dockerfile-lint-reports/argus-summary.md" ]; then
          cp dockerfile-lint-reports/argus-summary.md scanner-summaries/dockerfile-lint.md
          cat dockerfile-lint-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload Dockerfile lint artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: dockerfile-lint-reports
        path: dockerfile-lint-reports/
        retention-days: 30
      if: always()

    - name: Upload Dockerfile lint summary section
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: linter-summary-dockerfile
        path: scanner-summaries/dockerfile-lint.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Dockerfile lint results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.7.0
      with:
        summary_file: scanner-summaries/dockerfile-lint.md
        comment_marker: dockerfile-linter-comment-marker
        title: '📦 Dockerfile Linting Results'
        fallback_message: 'No Dockerfile linting results available'

branding:
  icon: 'box'
  color: 'blue'
