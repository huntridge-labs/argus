name: 'Terraform Linter'
description: |
  Run Terraform formatting and validation checks via Argus SDK.

  This action validates Terraform files using terraform fmt, terraform validate,
  and optionally TFLint. Results are uploaded as artifacts and can be aggregated
  by the linting-summary action.

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  - uses: huntridge-labs/argus/.github/actions/linter-terraform@1.0.1
    with:
      fail_on_issues: false
      terraform_version: 'latest'
  ```

inputs:
  fail_on_issues:
    description: 'Fail the job if linting issues are found'
    required: false
    default: 'false'
  paths:
    description: 'Paths to search for Terraform files (space-separated). Defaults to entire repository.'
    required: false
    default: '.'
  terraform_version:
    description: 'Terraform version to use. Configure in argus.yml for SDK-based runs.'
    required: false
    default: 'latest'
  run_tflint:
    description: 'Run TFLint in addition to terraform fmt/validate. Configure in argus.yml for SDK-based runs.'
    required: false
    default: 'true'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'

outputs:
  issues_count:
    description: 'Total number of linting issues found'
    value: ${{ steps.scan.outputs.issue_count }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/linter-terraform

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run Terraform Linter via Argus SDK
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.paths }}
        FAIL_ON_ISSUES: ${{ inputs.fail_on_issues }}
      run: |
        mkdir -p terraform-lint-reports scanner-summaries

        # Map fail_on_issues boolean to severity threshold
        SEVERITY="none"
        if [ "$FAIL_ON_ISSUES" = "true" ]; then
          SEVERITY="info"
        fi

        SCAN_EXIT=0
        python -m argus scan lint-terraform \
          --path "${SCAN_PATH}" \
          --severity-threshold "${SEVERITY}" \
          --format sarif --format json --format markdown \
          --output-dir ./terraform-lint-reports \
          --output-vars ./terraform-lint-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f terraform-lint-reports/counts.env ] && cat terraform-lint-reports/counts.env >> "$GITHUB_OUTPUT"

        # Copy markdown summary for PR comment and step summary
        if [ -f "terraform-lint-reports/argus-summary.md" ]; then
          cp terraform-lint-reports/argus-summary.md scanner-summaries/terraform-lint.md
          cat terraform-lint-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload Terraform lint artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: terraform-lint-reports
        path: terraform-lint-reports/
        retention-days: 30
      if: always()

    - name: Upload Terraform lint summary section
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: linter-summary-terraform
        path: scanner-summaries/terraform-lint.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with Terraform lint results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.0.1
      with:
        summary_file: scanner-summaries/terraform-lint.md
        comment_marker: terraform-linter-comment-marker
        title: '🏗️ Terraform Linting Results'
        fallback_message: 'No Terraform linting results available'

branding:
  icon: 'layers'
  color: 'purple'
