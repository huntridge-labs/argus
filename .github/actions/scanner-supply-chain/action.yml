name: 'Supply Chain Security Scanner'
description: |
  Scan GitHub Actions workflows for security issues using zizmor and actionlint.

  Detects template injection, unpinned actions, excessive permissions, impostor commits,
  credential leakage, cache poisoning, and other supply chain vulnerabilities.

  Results integrate with security-summary for aggregated reporting.

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  - uses: huntridge-labs/argus/.github/actions/scanner-supply-chain@1.2.1
    with:
      github_token: (secrets.GITHUB_TOKEN)
      scan_path: '.github/'
      fail_on_severity: 'high'
  ```

author: 'Argus'

branding:
  icon: 'link'
  color: 'purple'

inputs:
  github_token:
    description: 'GitHub token for API access (needed for online audits)'
    required: true
  scan_path:
    description: 'Path to scan for workflow YAML files'
    required: false
    default: '.'
  fail_on_severity:
    description: 'Fail if findings at or above this severity. Options: none, low, medium, high.'
    required: false
    default: 'none'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository (uploads SARIF to Security tab)'
    required: false
    default: 'false'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'
  persona:
    description: 'Zizmor audit strictness: regular (default), pedantic, or auditor'
    required: false
    default: 'regular'
  zizmor_config:
    description: 'Path to zizmor configuration file'
    required: false
    default: ''
  run_actionlint:
    description: 'Also run actionlint for workflow syntax checking'
    required: false
    default: 'true'
  job_id:
    description: 'Job ID for artifact naming'
    required: false
    default: ${{ github.job }}

outputs:
  high_count:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high_count }}
  medium_count:
    description: 'Number of medium severity findings'
    value: ${{ steps.scan.outputs.medium_count }}
  low_count:
    description: 'Number of low severity findings'
    value: ${{ steps.scan.outputs.low_count }}
  info_count:
    description: 'Number of informational findings'
    value: ${{ steps.scan.outputs.info_count }}
  total_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total_count }}
  scan_status:
    description: 'Overall scan status (clean or findings)'
    value: ${{ steps.scan.outputs.scan_status }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-supply-chain

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.14'

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run supply chain scan via Argus SDK
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SCAN_PATH: ${{ inputs.scan_path }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
      run: |
        mkdir -p supply-chain-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan supply-chain \
          --path "${SCAN_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./supply-chain-reports \
          --output-vars ./supply-chain-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f supply-chain-reports/counts.env ] && cat supply-chain-reports/counts.env >> "$GITHUB_OUTPUT"

        # Fold critical into high for backward compatibility (action has no critical_count output)
        if [ -f supply-chain-reports/counts.env ]; then
          CRITICAL=$(grep critical_count supply-chain-reports/counts.env | cut -d= -f2)
          HIGH_RAW=$(grep high_count supply-chain-reports/counts.env | cut -d= -f2)
          TOTAL=$(grep total_count supply-chain-reports/counts.env | cut -d= -f2)
          MEDIUM=$(grep medium_count supply-chain-reports/counts.env | cut -d= -f2)
          LOW=$(grep low_count supply-chain-reports/counts.env | cut -d= -f2)
          HIGH=$(( ${CRITICAL:-0} + ${HIGH_RAW:-0} ))
          INFO=$(( ${TOTAL:-0} - HIGH - ${MEDIUM:-0} - ${LOW:-0} ))
          if [ "$INFO" -lt 0 ]; then INFO=0; fi
          echo "high_count=$HIGH" >> "$GITHUB_OUTPUT"
          echo "info_count=$INFO" >> "$GITHUB_OUTPUT"
          PASSED=$(grep '^passed=' supply-chain-reports/counts.env | cut -d= -f2)
          if [ "$PASSED" = "true" ]; then
            echo "scan_status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "scan_status=findings" >> "$GITHUB_OUTPUT"
          fi
        fi

        # Copy markdown summary for PR comment artifact
        if [ -f "supply-chain-reports/argus-summary.md" ]; then
          cp supply-chain-reports/argus-summary.md scanner-summaries/supply-chain.md
          cat supply-chain-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload SARIF to GitHub Security
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('supply-chain-reports/argus-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
      with:
        sarif_file: supply-chain-reports/argus-results.sarif
        category: zizmor
      continue-on-error: true

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: supply-chain-reports-${{ inputs.job_id }}
        path: supply-chain-reports/
        retention-days: 30
      continue-on-error: true

    - name: Upload scanner summary
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scanner-summary-supply-chain-${{ inputs.job_id }}
        path: scanner-summaries/supply-chain.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.2.1
      with:
        summary_file: scanner-summaries/supply-chain.md
        comment_marker: supply-chain-scanner-comment-marker
        title: '🔗 Supply Chain Security Scan Results'
        fallback_message: '⚠️ Supply chain scan summary generation failed. Check action logs.'
