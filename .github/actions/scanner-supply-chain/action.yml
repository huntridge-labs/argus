name: 'Supply Chain Security Scanner'
description: |
  Scan GitHub Actions workflows for security issues using zizmor and actionlint.

  Detects template injection, unpinned actions, excessive permissions, impostor commits,
  credential leakage, cache poisoning, and other supply chain vulnerabilities.

  Results integrate with security-summary for aggregated reporting.

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  - uses: huntridge-labs/argus/.github/actions/scanner-supply-chain@0.7.0
    with:
      github_token: (secrets.GITHUB_TOKEN)
      scan_path: '.github/'
      fail_on_severity: 'high'
  ```

author: 'Argus'

branding:
  icon: 'link'
  color: 'purple'

inputs:
  github_token:
    description: 'GitHub token for API access (needed for online audits)'
    required: true
  scan_path:
    description: 'Path to scan for workflow YAML files'
    required: false
    default: '.'
  fail_on_severity:
    description: 'Fail if findings at or above this severity. Options: none, low, medium, high.'
    required: false
    default: 'none'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository (uploads SARIF to Security tab)'
    required: false
    default: 'false'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'
  persona:
    description: 'Zizmor audit strictness: regular (default), pedantic, or auditor'
    required: false
    default: 'regular'
  zizmor_config:
    description: 'Path to zizmor configuration file'
    required: false
    default: ''
  run_actionlint:
    description: 'Also run actionlint for workflow syntax checking'
    required: false
    default: 'true'
  job_id:
    description: 'Job ID for artifact naming'
    required: false
    default: ${{ github.job }}

outputs:
  high_count:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high_count }}
  medium_count:
    description: 'Number of medium severity findings'
    value: ${{ steps.scan.outputs.medium_count }}
  low_count:
    description: 'Number of low severity findings'
    value: ${{ steps.scan.outputs.low_count }}
  info_count:
    description: 'Number of informational findings'
    value: ${{ steps.scan.outputs.info_count }}
  total_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total_count }}
  scan_status:
    description: 'Overall scan status (clean or findings)'
    value: ${{ steps.scan.outputs.scan_status }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-supply-chain

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: |
        # Pinned version — updated by .github/workflows/update-pinned-tools.yml
        ZIZMOR_VERSION="1.23.1"
        pip install --quiet pyyaml "zizmor==${ZIZMOR_VERSION}"

    - name: Install actionlint
      if: inputs.run_actionlint == 'true'
      shell: bash
      run: |
        ACTIONLINT_VERSION="1.7.12"
        ACTIONLINT_CHECKSUM="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        ACTIONLINT_TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_TARBALL}" -o "${ACTIONLINT_TARBALL}"
        echo "${ACTIONLINT_CHECKSUM}  ${ACTIONLINT_TARBALL}" | sha256sum -c --quiet
        tar -xzf "${ACTIONLINT_TARBALL}" actionlint
        rm -f "${ACTIONLINT_TARBALL}"
        sudo mv actionlint /usr/local/bin/actionlint

    - name: Run supply chain scan via Argus SDK
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SCAN_PATH: ${{ inputs.scan_path }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        PERSONA: ${{ inputs.persona }}
        ZIZMOR_CONFIG: ${{ inputs.zizmor_config }}
        RUN_ACTIONLINT: ${{ inputs.run_actionlint }}
      run: |
        mkdir -p supply-chain-reports scanner-summaries

        # Build a temporary argus config with scanner-specific settings
        ZIZMOR_CFG=""
        if [ -n "$ZIZMOR_CONFIG" ] && [ -f "$ZIZMOR_CONFIG" ]; then
          ZIZMOR_CFG="    zizmor_config: \"${ZIZMOR_CONFIG}\""
        fi

        cat > /tmp/argus-supply-chain.yml <<ARGUSCFG
        version: "1.0"
        scanners:
          supply-chain:
            enabled: true
            path: "${SCAN_PATH}"
            persona: "${PERSONA}"
            run_actionlint: "${RUN_ACTIONLINT}"
            github_token: "${GITHUB_TOKEN}"
        ${ZIZMOR_CFG}
        reporting:
          formats:
            - sarif
            - json
            - markdown
          severity_threshold: "${FAIL_ON_SEVERITY:-none}"
          output_dir: "./supply-chain-reports"
        execution:
          backend: local
        ARGUSCFG

        # Run argus scan (exit code 1 = findings above threshold)
        SCAN_EXIT=0
        python -m argus scan supply-chain \
          --config /tmp/argus-supply-chain.yml \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Parse severity counts from JSON output
        # Fold critical into high for backward compatibility (action has no critical_count output)
        HIGH=0; MEDIUM=0; LOW=0; INFO=0; TOTAL=0
        JSON_FILE="supply-chain-reports/argus-results.json"
        if [ -f "$JSON_FILE" ]; then
          CRITICAL=$(jq '.critical_count // 0' "$JSON_FILE")
          HIGH_RAW=$(jq '.high_count // 0' "$JSON_FILE")
          HIGH=$((CRITICAL + HIGH_RAW))
          MEDIUM=$(jq '.medium_count // 0' "$JSON_FILE")
          LOW=$(jq '.low_count // 0' "$JSON_FILE")
          TOTAL=$(jq '.total_count // 0' "$JSON_FILE")
          INFO=$((TOTAL - HIGH - MEDIUM - LOW))
          if [ "$INFO" -lt 0 ]; then INFO=0; fi
        fi

        echo "high_count=$HIGH" >> "$GITHUB_OUTPUT"
        echo "medium_count=$MEDIUM" >> "$GITHUB_OUTPUT"
        echo "low_count=$LOW" >> "$GITHUB_OUTPUT"
        echo "info_count=$INFO" >> "$GITHUB_OUTPUT"
        echo "total_count=$TOTAL" >> "$GITHUB_OUTPUT"

        echo "Results: HIGH=$HIGH, MEDIUM=$MEDIUM, LOW=$LOW, INFO=$INFO, TOTAL=$TOTAL"

        if [ "$TOTAL" -gt 0 ]; then
          echo "scan_status=findings" >> "$GITHUB_OUTPUT"
          if [ "$HIGH" -gt 0 ]; then
            echo "::warning title=Supply Chain Findings::Found $HIGH high severity supply chain security findings"
          fi
        else
          echo "scan_status=clean" >> "$GITHUB_OUTPUT"
          echo "✅ No supply chain security findings"
        fi

        # Copy markdown summary for PR comment artifact
        if [ -f "supply-chain-reports/argus-summary.md" ]; then
          cp supply-chain-reports/argus-summary.md scanner-summaries/supply-chain.md
          cat supply-chain-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload SARIF to GitHub Security
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('supply-chain-reports/argus-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        sarif_file: supply-chain-reports/argus-results.sarif
        category: zizmor
      continue-on-error: true

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: supply-chain-reports-${{ inputs.job_id }}
        path: supply-chain-reports/
        retention-days: 30
      continue-on-error: true

    - name: Upload scanner summary
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: scanner-summary-supply-chain-${{ inputs.job_id }}
        path: scanner-summaries/supply-chain.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@0.7.0
      with:
        summary_file: scanner-summaries/supply-chain.md
        comment_marker: supply-chain-scanner-comment-marker
        title: '🔗 Supply Chain Security Scan Results'
        fallback_message: '⚠️ Supply chain scan summary generation failed. Check action logs.'
