name: 'ZAP DAST Scanner'
description: |
  Run ZAP (Zed Attack Proxy) DAST scanning via the Argus SDK.

  Supports two modes:
  - **URL mode**: Scan an already-running target via --target
  - **Container mode**: Start a container image, scan it, stop it via --image

  The SDK's DastEngine handles target lifecycle, health checking, ZAP scanning, and cleanup.

  **Usage Example:**
  ```yaml
  # Scan a running target
  - uses: ./.github/actions/scanner-zap
    with:
      target_url: 'http://localhost:8080'
      scan_type: baseline
      fail_on_severity: 'high'

  # Start a container, scan it, stop it
  - uses: ./.github/actions/scanner-zap
    with:
      app_image_ref: 'myapp:latest'
      app_ports: '8080'
      scan_type: full
  ```

  Note: Compose mode is not yet supported in the SDK. Use url or container mode.

inputs:
  scan_name:
    description: 'Unique scan identifier (for artifact naming)'
    required: false
    default: 'zap-scan'
  scan_type:
    description: 'ZAP scan type: baseline or full'
    required: false
    default: 'baseline'
  target_url:
    description: 'Target URL to scan (for url mode — scan an already-running target)'
    required: false
    default: ''
  app_image_ref:
    description: 'Container image to start, scan, and stop (for container mode)'
    required: false
    default: ''
  app_ports:
    description: 'Port to expose on the target container (e.g., 8080)'
    required: false
    default: ''
  app_env:
    description: 'Environment variables for the target container (KEY=VALUE, one per line)'
    required: false
    default: ''
  startup_timeout:
    description: 'Seconds to wait for target container readiness (default: 60)'
    required: false
    default: '60'
  fail_on_severity:
    description: 'Fail threshold: none, low, medium, high, critical (default: none)'
    required: false
    default: 'none'
  enable_code_security:
    description: 'Upload SARIF to GitHub Code Security (default: false)'
    required: false
    default: 'false'
  post_pr_comment:
    description: 'Post results as PR comment (default: false)'
    required: false
    default: 'false'
  job_id:
    description: 'Job ID for artifact naming'
    required: false
    default: ${{ github.job }}
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'

outputs:
  findings_count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings_count }}
  high_count:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high_count }}
  medium_count:
    description: 'Number of medium severity findings'
    value: ${{ steps.scan.outputs.medium_count }}
  low_count:
    description: 'Number of low severity findings'
    value: ${{ steps.scan.outputs.low_count }}
  info_count:
    description: 'Number of informational findings'
    value: ${{ steps.scan.outputs.info_count }}
  scan_status:
    description: 'Overall scan status (passed or failed)'
    value: ${{ steps.scan.outputs.scan_status }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus SDK
      shell: bash
      run: pip install pyyaml

    - name: Run ZAP via Argus SDK
      id: scan
      shell: bash
      env:
        SCAN_TYPE: ${{ inputs.scan_type }}
        TARGET_URL: ${{ inputs.target_url }}
        APP_IMAGE_REF: ${{ inputs.app_image_ref }}
        APP_PORTS: ${{ inputs.app_ports }}
        APP_ENV: ${{ inputs.app_env }}
        STARTUP_TIMEOUT: ${{ inputs.startup_timeout }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
      run: |
        set -euo pipefail
        mkdir -p zap-reports scanner-summaries

        # Build the argus scan zap command
        CMD="python -m argus scan zap"
        CMD="$CMD --scan-type ${SCAN_TYPE}"
        CMD="$CMD --format json --format markdown --format sarif"
        CMD="$CMD --output-dir ./zap-reports --no-timestamp"

        if [ -n "$TARGET_URL" ]; then
          CMD="$CMD --target $TARGET_URL"
        elif [ -n "$APP_IMAGE_REF" ]; then
          CMD="$CMD --image $APP_IMAGE_REF"
          if [ -n "$APP_PORTS" ]; then
            CMD="$CMD --port $APP_PORTS"
          fi
          CMD="$CMD --startup-timeout $STARTUP_TIMEOUT"
        else
          echo "Error: either target_url or app_image_ref is required"
          exit 1
        fi

        # Pass environment variables to target container
        if [ -n "$APP_ENV" ]; then
          while IFS= read -r line; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            CMD="$CMD --env $line"
          done <<< "$APP_ENV"
        fi

        # Pass severity threshold to SDK
        if [ "$FAIL_ON_SEVERITY" != "none" ]; then
          CMD="$CMD --severity $FAIL_ON_SEVERITY"
        fi

        # Run scan (exit code 1 = findings above threshold)
        SCAN_EXIT=0
        eval "$CMD" || SCAN_EXIT=$?

        # Parse severity counts from JSON output
        HIGH=0; MEDIUM=0; LOW=0; INFO=0; TOTAL=0
        JSON_FILE="zap-reports/dast-scan.json"
        if [ -f "$JSON_FILE" ]; then
          HIGH=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('high_count', 0))")
          MEDIUM=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('medium_count', 0))")
          LOW=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('low_count', 0))")
          INFO=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('info_count', 0))")
          TOTAL=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('total_findings', 0))")
        fi

        echo "findings_count=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "high_count=$HIGH" >> "$GITHUB_OUTPUT"
        echo "medium_count=$MEDIUM" >> "$GITHUB_OUTPUT"
        echo "low_count=$LOW" >> "$GITHUB_OUTPUT"
        echo "info_count=$INFO" >> "$GITHUB_OUTPUT"

        echo "ZAP Results: HIGH=$HIGH, MEDIUM=$MEDIUM, LOW=$LOW, INFO=$INFO, TOTAL=$TOTAL"

        # Copy markdown summary for PR comment and step summary
        if [ -f "zap-reports/dast-scan.md" ]; then
          cp zap-reports/dast-scan.md scanner-summaries/zap.md
          cat zap-reports/dast-scan.md >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$SCAN_EXIT" -ne 0 ]; then
          echo "scan_status=failed" >> "$GITHUB_OUTPUT"
          exit $SCAN_EXIT
        else
          echo "scan_status=passed" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload ZAP artifacts
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: zap-reports-${{ inputs.job_id }}
        path: zap-reports/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload ZAP SARIF
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('zap-reports/argus-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        sarif_file: zap-reports/argus-results.sarif
      continue-on-error: true

    - name: Upload ZAP summary
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: scanner-summary-zap-${{ inputs.job_id }}
        path: scanner-summaries/zap.md
        retention-days: 7
        if-no-files-found: warn
      continue-on-error: true

    - name: Comment PR with ZAP results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@0.7.0
      with:
        summary_file: scanner-summaries/zap.md
        comment_marker: zap-dast-comment-${{ inputs.job_id }}
        title: 'ZAP DAST Scan Results'
        fallback_message: 'No ZAP scan results available'
