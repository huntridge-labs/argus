name: 'OSV Dependency Scanner'
description: |
  Run Google OSV-Scanner for dependency vulnerability scanning.

  Scans lockfiles and SBOMs for known vulnerabilities using the OSV database.
  Works on any event trigger (push, PR, schedule). Uses the official
  google/osv-scanner-action Docker image from ghcr.io.

  Results integrate with security-summary for aggregated reporting.

  **Required Environment Variables:**
  - GITHUB_TOKEN: GitHub token for API access (set automatically in workflows)

  **Usage Example:**
  ```yaml
  - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
  - uses: huntridge-labs/argus/.github/actions/scanner-osv@1.2.1
    env:
      GITHUB_TOKEN: (secrets.GITHUB_TOKEN)
    with:
      scan_path: '.'
      fail_on_severity: 'high'
  ```

author: 'Argus'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  scan_path:
    description: 'Path to scan for lockfiles and dependency manifests'
    required: false
    default: '.'
  lockfile:
    description: 'Specific lockfile path to scan (auto-discovers if empty)'
    required: false
    default: ''
  recursive:
    description: 'Scan subdirectories recursively for lockfiles'
    required: false
    default: 'true'
  enable_code_security:
    description: 'Whether GitHub Code Security is enabled for this repository (uploads SARIF to Security tab)'
    required: false
    default: 'false'
  post_pr_comment:
    description: 'Whether to post PR comments'
    required: false
    default: 'false'
  config_file:
    description: 'Path to osv-scanner.toml config file for filtering (e.g. ignore dev dependencies)'
    required: false
    default: ''
  fail_on_severity:
    description: 'Fail if findings at or above this severity. Options: none, low, medium, high, critical.'
    required: false
    default: 'none'
  job_id:
    description: 'Job ID for artifact naming'
    required: false
    default: ${{ github.job }}

outputs:
  critical_count:
    description: 'Number of critical severity findings'
    value: ${{ steps.scan.outputs.critical_count }}
  high_count:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high_count }}
  medium_count:
    description: 'Number of medium severity findings'
    value: ${{ steps.scan.outputs.medium_count }}
  low_count:
    description: 'Number of low severity findings'
    value: ${{ steps.scan.outputs.low_count }}
  total_count:
    description: 'Total number of vulnerability findings'
    value: ${{ steps.scan.outputs.total_count }}
  scan_status:
    description: 'Overall scan status (clean or vulnerable)'
    value: ${{ steps.scan.outputs.scan_status }}

runs:
  using: 'composite'
  steps:
    # IMPORTANT: Caller must checkout the repository before calling this action
    # Example:
    #   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    #   - uses: ./.github/actions/scanner-osv

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: Install Argus SDK
      shell: bash
      # Install the SDK from the checked-out composite source. This matches
      # the consumer-scoped intent of composite actions (``uses: .../<wrapper>@tag``
      # implicitly pins the SDK version to the same tag) and sidesteps the
      # PyPI-release lag that would break ``pip install argus-security>=X``
      # for consumers until after the release ships. Works identically for
      # internal test-actions runs (where the argus repo is the consumer
      # checkout) and for external consumers (where the composite's own
      # checkout under ``$GITHUB_ACTION_PATH`` is the SDK source). See
      # scanner-container/action.yml for the original rationale.
      run: pip install "${{ github.action_path }}/../../.."

    - name: Run OSV scan via Argus SDK
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.scan_path }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
      run: |
        mkdir -p osv-reports scanner-summaries

        # SDK auto-discovers argus.yml if present; works without one too
        SCAN_EXIT=0
        python -m argus scan osv \
          --path "${SCAN_PATH}" \
          --severity-threshold "${FAIL_ON_SEVERITY:-none}" \
          --format sarif --format json --format markdown \
          --output-dir ./osv-reports \
          --output-vars ./osv-reports/counts.env \
          --no-timestamp \
          || SCAN_EXIT=$?

        # Forward counts to GitHub Actions outputs
        [ -f osv-reports/counts.env ] && cat osv-reports/counts.env >> "$GITHUB_OUTPUT"

        # Derive scan_status from passed flag
        if [ -f osv-reports/counts.env ]; then
          PASSED=$(grep '^passed=' osv-reports/counts.env | cut -d= -f2)
          if [ "$PASSED" = "true" ]; then
            echo "scan_status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "scan_status=vulnerable" >> "$GITHUB_OUTPUT"
          fi
        fi

        # Copy markdown summary for PR comment artifact
        if [ -f "osv-reports/argus-summary.md" ]; then
          cp osv-reports/argus-summary.md scanner-summaries/osv.md
          cat osv-reports/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $SCAN_EXIT

    - name: Upload SARIF to GitHub Security
      if: inputs.enable_code_security == 'true' && always() && github.actor != 'nektos/act' && hashFiles('osv-reports/argus-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        sarif_file: osv-reports/argus-results.sarif
        category: osv-scanner
      continue-on-error: true

    - name: Upload OSV reports
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: osv-reports-${{ inputs.job_id }}
        path: osv-reports/
        retention-days: 30
      continue-on-error: true

    - name: Upload scanner summary
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: scanner-summary-osv-${{ inputs.job_id }}
        path: scanner-summaries/osv.md
        retention-days: 7
      continue-on-error: true

    - name: Comment PR with OSV results
      if: github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'
      uses: huntridge-labs/argus/.github/actions/comment-pr@1.2.1
      with:
        summary_file: scanner-summaries/osv.md
        comment_marker: osv-scanner-comment-marker
        title: '📦 OSV Dependency Scan Results'
        fallback_message: 'No OSV scan results available'
