# Dependabot configuration for automated dependency updates
# Groups updates by semantic version level (major, minor, patch) to reduce PR noise
# See: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# SUPPLY CHAIN POLICY: Weekly schedule provides natural delay. Dependabot lacks
# minimumReleaseAge (Renovate has this for tool versions). Manual review required
# before merging — check release age and community reports for new versions.
# Ref: Trivy supply chain attack GHSA-69fq-xp46-6x23, March 2026.

version: 2
updates:
  # GitHub Actions - grouped by semantic version level
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    # Group updates by semantic version level
    groups:
      # Major version updates (e.g., v1 -> v2)
      # These require careful review as they may contain breaking changes
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

      # Minor and patch version updates (e.g., v1.2 -> v1.3, v1.2.3 -> v1.2.4)
      # New features and bug fixes, generally safe to update together
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Commit message configuration
    commit-message:
      prefix: "chore(deps)"

    # PR configuration
    open-pull-requests-limit: 10

    # Labels for PRs
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"

    # Allow Dependabot to rebase PRs
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      pip-all:
        patterns:
          - "*"

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "python"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # Docker images (Argus custom Dockerfiles)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      docker-all:
        patterns:
          - "*"

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "docker"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # NPM dependencies - grouped by semantic version level
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "npm"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
