# Dependabot configuration for automated dependency updates
# Groups updates by semantic version level (major, minor, patch) to reduce PR noise
# See: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# SUPPLY CHAIN POLICY: Weekly schedule provides natural delay. Dependabot lacks
# minimumReleaseAge (Renovate has this for tool versions). Manual review required
# before merging — check release age and community reports for new versions.
# Ref: Trivy supply chain attack GHSA-69fq-xp46-6x23, March 2026.

version: 2
updates:
  # GitHub Actions updates are handled by Renovate (.github/renovate.json),
  # not Dependabot. Dependabot's per-directory github-actions updater timed
  # out scanning the composite-action directories and, with a cooldown set,
  # skipped frequently-released actions (dependabot-core #11645 / #13691).
  # Renovate scans workflows + composite action.yml repo-wide in one pass.
  # See #196.

  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      pip-all:
        patterns:
          - "*"

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "python"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # Docker images (Argus custom Dockerfiles + devcontainer + test fixtures)
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/.devcontainer"
      - "/tests/fixtures/test-apps/node-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      docker-all:
        patterns:
          - "*"

    # NOTE on Python pre-release base images (#290): Dependabot's docker manager
    # can sort e.g. python:3.15.0b2-alpine ahead of the stable 3.14.x line. There
    # is NO valid dependabot.yml way to filter these out — docker `ignore.versions`
    # uses Bundler version-requirement syntax, so substring globs like "*0b*" are
    # rejected as invalid version requirements (they broke config validation), and
    # ignoring pre-release docker tags via `versions` is unsupported upstream
    # (dependabot-core #15154). A pre-release base-image PR, if it recurs, is caught
    # by the mandatory manual review below + the 7-day cooldown; FROM lines are
    # SHA-digest pinned, so nothing auto-applies. Revisit if #15154 ships a fix.

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "docker"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # NPM dependencies - grouped by semantic version level
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # The hold on conventional-changelog-conventionalcommits v10 is lifted.
    # @release-it/conventional-changelog@12 moved to the render-function stack
    # (conventional-changelog-writer@9), which is what v10's function templates
    # need, so the preset and the writer now agree. The two are a matched pair
    # in BOTH directions — writer@8 with preset v10 renders an empty changelog,
    # writer@9 with preset v9 dies with "headerPartial is not a function" — so
    # never bump one across a major without the other. release-it@21 is part of
    # the same set, and @j-ulrich/release-it-regex-bumper must be >=5.6.0 for
    # its peer range to admit release-it 21.

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "npm"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
