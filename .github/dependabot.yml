# Dependabot configuration for automated dependency updates
# Groups updates by semantic version level (major, minor, patch) to reduce PR noise
# See: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# SUPPLY CHAIN POLICY: Weekly schedule provides natural delay. Dependabot lacks
# minimumReleaseAge (Renovate has this for tool versions). Manual review required
# before merging — check release age and community reports for new versions.
# Ref: Trivy supply chain attack GHSA-69fq-xp46-6x23, March 2026.

version: 2
updates:
  # GitHub Actions updates are handled by Renovate (.github/renovate.json),
  # not Dependabot. Dependabot's per-directory github-actions updater timed
  # out scanning the composite-action directories and, with a cooldown set,
  # skipped frequently-released actions (dependabot-core #11645 / #13691).
  # Renovate scans workflows + composite action.yml repo-wide in one pass.
  # See #196.

  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      pip-all:
        patterns:
          - "*"

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "python"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # Docker images (Argus custom Dockerfiles + devcontainer + test fixtures)
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/.devcontainer"
      - "/tests/fixtures/test-apps/node-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      docker-all:
        patterns:
          - "*"

    # Skip Python pre-release base images. Dependabot's docker manager sorts
    # e.g. python:3.15.0b2-alpine ahead of the stable 3.14.x line and proposes
    # it (see #290); Dependabot owns the Dockerfile FROM lines (Renovate, which
    # has ignoreUnstable, only handles the ARG tool versions + source-pinned
    # tags). Track stable Python only — the final X.Y.0 release is still picked
    # up; only aN / bN / rcN pre-releases are ignored.
    ignore:
      - dependency-name: "python"
        versions: ["*0a*", "*0b*", "*0rc*"]

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "docker"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # NPM dependencies - grouped by semantic version level
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"

    groups:
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Hold conventional-changelog-conventionalcommits at v9.x. v10 replaced
    # Handlebars template strings with render functions (@conventional-changelog/
    # template), which require conventional-changelog-writer@9. Our release
    # toolchain's writer is pinned transitively by @release-it/conventional-
    # changelog@11 (latest), which still depends on conventional-changelog@7 →
    # writer@8 (Handlebars) and conventionalcommits@^9.3.1. Under v10 the
    # changelog renders EMPTY (commits parse + pass filtering but the Handlebars
    # writer can't compile function templates). Re-enable the major bump once
    # @release-it/conventional-changelog ships support for the render-function
    # stack (core@8 / writer@9). See the release-preview "Verify changelog
    # structure" gate.
    ignore:
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"
      - "npm"
      - "automated"

    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
