# Trivy Container Scanner - Reusable Workflow
#
# Runs the Trivy container scanner via the argus Python CLI.
# Equivalent to: python -m argus scan container --image <ref> --scanners trivy
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/container-scanning.yml

name: Trivy Container Scanner

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Container image reference to scan (e.g., nginx:latest, ghcr.io/owner/image:tag)'
        required: true
        type: string
      registry_username:
        description: 'Username for registry authentication (leave empty for public images)'
        required: false
        type: string
        default: ''
      enable_code_security:
        description: 'Whether to upload SARIF to GitHub Security'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical.'
        required: false
        type: string
        default: 'none'
  workflow_call:
    inputs:
      image_ref:
        description: 'Container image reference to scan (e.g., nginx:latest, ghcr.io/owner/image:tag)'
        required: true
        type: string
      scan_name:
        description: 'Name for the scan artifacts'
        required: false
        type: string
        default: 'container'
      registry_username:
        description: 'Username for registry authentication (leave empty for public images)'
        required: false
        type: string
        default: ''
      enable_code_security:
        description: 'Whether to upload SARIF to GitHub Security'
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical. Set to "none" to never fail.'
        required: false
        type: string
        default: 'none'
    secrets:
      registry_password:
        description: 'Password/token for registry authentication'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  packages: read

jobs:
  trivy-container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Argus
        run: |
          pip install --quiet pyyaml
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run scan
        run: |
          python -m argus scan container \
            --image "$IMAGE_REF" \
            --scanners trivy \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json \
            --output-dir ./argus-results \
            --verbose
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: trivy-container-reports-${{ inputs.scan_name || 'trivy-scan' }}
          path: ./argus-results/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.2.0
        with:
          summary_file: ./argus-results/argus-results.md
          comment_marker: container-${{ inputs.scan_name || 'trivy-scan' }}-comment-marker
          title: 'Trivy Container Scan Results'
          fallback_message: 'No Trivy container results available'
