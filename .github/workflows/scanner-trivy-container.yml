# Trivy Container Scanner - Reusable Workflow
#
# Runs the Trivy container scanner via the argus Python CLI.
# Equivalent to: python -m argus scan container --image <ref> --scanners trivy
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/container-scanning.yml

name: Trivy Container Scanner

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Container image reference to scan (e.g., nginx:latest, ghcr.io/owner/image:tag)'
        required: true
        type: string
      registry_username:
        description: 'Username for registry authentication (leave empty for public images)'
        required: false
        type: string
        default: ''
      enable_code_security:
        description: 'Whether to upload SARIF to GitHub Security'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical.'
        required: false
        type: string
        default: 'none'
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      image_ref:
        description: 'Container image reference to scan (e.g., nginx:latest, ghcr.io/owner/image:tag)'
        required: true
        type: string
      scan_name:
        description: 'Name for the scan artifacts'
        required: false
        type: string
        default: 'container'
      registry_username:
        description: 'Username for registry authentication (leave empty for public images)'
        required: false
        type: string
        default: ''
      enable_code_security:
        description: 'Whether to upload SARIF to GitHub Security'
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical. Set to "none" to never fail.'
        required: false
        type: string
        default: 'none'
    secrets:
      registry_password:
        description: 'Password/token for registry authentication'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  packages: read

jobs:
  trivy-container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.9.2

      - name: Run scan
        run: |
          python -m argus scan container \
            --image "$IMAGE_REF" \
            --scanners trivy \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json --format markdown \
            --output-dir ./argus-results \
            --verbose
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-container-reports-${{ inputs.scan_name || 'trivy-scan' }}
          path: ./argus-results/
          retention-days: 30

      - name: Build scanner summary
        if: always()
        env:
          SCAN_NAME: ${{ inputs.scan_name || 'trivy-scan' }}
        run: |
          mkdir -p scanner-summaries
          SAFE=$(printf '%s' "$SCAN_NAME" | tr -c 'A-Za-z0-9._-' '_')
          {
            echo "<details><summary>🐳 Trivy Container (${SCAN_NAME})</summary>"
            echo ""
            if [ -f ./argus-results/argus-summary.md ]; then
              cat ./argus-results/argus-summary.md
            else
              echo "_No 🐳 Trivy Container findings summary was produced._"
            fi
            echo ""
            echo "</details>"
          } > "scanner-summaries/trivy-container-${SAFE}.md"

      - name: Upload scanner summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-summary-trivy-container-${{ inputs.scan_name || 'trivy-scan' }}
          path: scanner-summaries/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.9.2
        with:
          summary_file: ./argus-results/argus-summary.md
          comment_marker: trivy-container-${{ inputs.scan_name || 'trivy-scan' }}-comment-marker
          title: 'Trivy Container Scan Results'
          fallback_message: 'No Trivy container results available'
