# Publish argus-security to PyPI
#
# TestPyPI: published on every PR (dev version) for validation
# PyPI: published on release tags only
#
# Uses Trusted Publishing (OIDC) — no API tokens needed.
# Configure at: https://pypi.org/manage/project/argus-security/settings/publishing/
#              https://test.pypi.org/manage/project/argus-security/settings/publishing/

name: Publish to PyPI

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Inspect package contents
        run: |
          echo "=== Wheel contents ==="
          unzip -l dist/*.whl | head -50
          echo ""
          echo "=== File count ==="
          unzip -l dist/*.whl | tail -1

      - name: Safety check
        run: |
          pip install pyyaml
          python -m scripts.ci.check_package

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: dist
          path: dist/

  test-install:
    name: Test Install (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built package
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Smoke test
        run: |
          argus --version
          argus scan --list
          argus scan --help
          argus classify --help
          argus completion zsh > /dev/null

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'pull_request'
    needs: [build, test-install]
    runs-on: ubuntu-latest
    environment: testpypi

    steps:
      - name: Download built package
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b54a53e2c3f5f0e6f5708353 # v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/
        continue-on-error: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-install]
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download built package
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b54a53e2c3f5f0e6f5708353 # v1.12.4
