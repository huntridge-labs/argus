# ClamAV Malware Scanner - Reusable Workflow
#
# Runs the ClamAV scanner via the argus Python CLI.
# Equivalent to: python -m argus scan clamav
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/all-scanners.yml

name: ClamAV Malware Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      scan_path:
        description: 'Path to scan (file, directory, or archive). Defaults to repository root.'
        required: false
        type: string
        default: '.'
      fail_on_severity:
        description: 'Fail the job if malware is found. ClamAV does not support severity-based filtering - any value other than "none" will fail if malware is detected.'
        required: false
        type: string
        default: 'none'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  clamav-scan:
    name: ClamAV Malware Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.8.1

      - name: Run scan
        run: |
          python -m argus scan clamav \
            --path "$SCAN_PATH" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json \
            --output-dir ./argus-results \
            --verbose
        env:
          SCAN_PATH: ${{ inputs.scan_path || '.' }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clamav-reports
          path: ./argus-results/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.8.1
        with:
          summary_file: ./argus-results/argus-results.md
          comment_marker: clamav-scanner-comment-marker
          title: 'ClamAV Malware Scan Results'
          fallback_message: 'No ClamAV results available'
