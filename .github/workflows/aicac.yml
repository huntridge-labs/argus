name: AICaC Adoption

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  aicac:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Needed to commit badge updates
      pull-requests: write   # Needed to create PRs
      issues: write          # Needed by AICaC to create migration issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check if .ai directory exists
        id: check-aicac
        run: |
          if [ -d ".ai" ]; then
            echo "mode=maintain" >> "$GITHUB_OUTPUT"
            echo "📁 .ai/ directory found - running in maintain mode"
          else
            echo "mode=setup" >> "$GITHUB_OUTPUT"
            echo "🚀 .ai/ directory not found - running in setup mode"
          fi

      - name: Run AICaC Action
        uses: eFAILution/AICaC/.github/actions/aicac-adoption@f4aa30fbce55a1c6c120375ef5b029730a490141 # 0.6.0
        with:
          mode: ${{ steps.check-aicac.outputs.mode }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-badge: 'true'
          suggest-toon: 'false'
          # v0.6.0's auto-migrate + regenerate-index create local (unsigned)
          # commits and push them (migrate branch / index sync). main's ruleset
          # requires verified signatures, so those pushes are rejected (GH013)
          # and the job fails on push to main. Keep both off — the migration
          # suggestion surfaces as an issue, not a push. This is the #225 guard,
          # retained on the 0.6.0 bump now that .ai/ is v2 (so the validation
          # itself passes). A PR run won't hit this; push-to-main would.
          auto-migrate: 'false'
          regenerate-index: 'false'
