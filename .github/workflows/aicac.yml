name: AICaC Adoption

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  aicac:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Needed to commit badge updates
      pull-requests: write   # Needed to create PRs
      issues: write          # Needed by AICaC to create migration issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check if .ai directory exists
        id: check-aicac
        run: |
          if [ -d ".ai" ]; then
            echo "mode=maintain" >> "$GITHUB_OUTPUT"
            echo "📁 .ai/ directory found - running in maintain mode"
          else
            echo "mode=setup" >> "$GITHUB_OUTPUT"
            echo "🚀 .ai/ directory not found - running in setup mode"
          fi

      - name: Run AICaC Action
        uses: eFAILution/AICaC/.github/actions/aicac-adoption@a76d235ee2b26b0faa7c66124128acc837eb7c1d # 0.3.0
        with:
          mode: ${{ steps.check-aicac.outputs.mode }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-badge: 'true'
          suggest-toon: 'false'
