# ZAP DAST Scanner - Reusable Workflow
#
# Runs the ZAP DAST scanner via the argus Python CLI.
# Equivalent to: python -m argus scan zap --target <url>
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/dast-scanning.yml

name: ZAP DAST Scanner

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Target mode: url (already running), docker-run (run container), compose'
        required: false
        type: choice
        options:
          - url
          - docker-run
          - compose
        default: url
      scan_type:
        description: 'ZAP scan type: baseline, full, or api'
        required: false
        type: choice
        options:
          - baseline
          - full
          - api
        default: baseline
      target_url:
        description: 'Target URL for baseline/full scans'
        required: false
        type: string
        default: ''
      api_spec:
        description: 'OpenAPI/Swagger spec URL (for api scans)'
        required: false
        type: string
        default: ''
      app_image_ref:
        description: 'Container image (for docker-run mode)'
        required: false
        type: string
        default: ''
      app_ports:
        description: 'Port mappings (e.g., 8080:8080)'
        required: false
        type: string
        default: '8080:8080'
      max_duration_minutes:
        description: 'Max scan duration in minutes'
        required: false
        type: number
        default: 10
      fail_on_severity:
        description: 'Fail threshold: none, low, medium, high, critical'
        required: false
        type: string
        default: 'none'

  workflow_call:
    inputs:
      scan_name:
        description: 'Unique scan identifier (for artifact naming)'
        required: false
        type: string
        default: 'zap-scan'
      scan_mode:
        description: 'Target mode: url, docker-run, or compose'
        required: false
        type: string
        default: url
      scan_type:
        description: 'ZAP scan type: baseline, full, or api'
        required: false
        type: string
        default: baseline
      target_url:
        description: 'Target URL for baseline/full scans'
        required: false
        type: string
        default: ''
      api_spec:
        description: 'OpenAPI/Swagger spec URL (for api scans)'
        required: false
        type: string
        default: ''
      healthcheck_url:
        description: 'URL to poll until target is ready'
        required: false
        type: string
        default: ''
      app_image_ref:
        description: 'Container image (for docker-run mode)'
        required: false
        type: string
        default: ''
      app_build_context:
        description: 'Docker build context (for local builds)'
        required: false
        type: string
        default: ''
      app_dockerfile:
        description: 'Dockerfile path (for local builds)'
        required: false
        type: string
        default: ''
      app_image_tag:
        description: 'Tag for locally built image'
        required: false
        type: string
        default: ''
      app_ports:
        description: 'Port mappings (e.g., 8080:8080)'
        required: false
        type: string
        default: '8080:8080'
      compose_file:
        description: 'Docker compose file path'
        required: false
        type: string
        default: 'docker-compose.yml'
      compose_build:
        description: 'Run docker compose with --build'
        required: false
        type: boolean
        default: true
      max_duration_minutes:
        description: 'Max scan duration in minutes'
        required: false
        type: number
        default: 10
      rules_file_name:
        description: 'ZAP rules file to ignore alerts (.tsv)'
        required: false
        type: string
        default: ''
      cmd_options:
        description: 'Additional ZAP command-line options'
        required: false
        type: string
        default: ''
      fail_on_severity:
        description: 'Fail threshold: none, low, medium, high, critical'
        required: false
        type: string
        default: 'none'
      allow_failure:
        description: 'Continue workflow on scan failure'
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Post results as PR comment'
        required: false
        type: boolean
        default: false
      allow_issue_writing:
        description: 'Enable ZAP native GitHub Issue creation'
        required: false
        type: boolean
        default: false
      registry_username:
        description: 'Registry username (for private images)'
        required: false
        type: string
        default: ''
    secrets:
      registry_password:
        description: 'Registry password/token for private images'
        required: false

permissions:
  contents: read
  actions: read
  packages: read
  pull-requests: write

jobs:
  zap-scan:
    name: ZAP ${{ inputs.scan_type }} scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.2.1

      - name: Run scan
        run: |
          # Build argus scan zap command based on scan mode
          ARGUS_CMD="python -m argus scan zap"

          if [ -n "$TARGET_URL" ]; then
            ARGUS_CMD="$ARGUS_CMD --target $TARGET_URL"
          elif [ -n "$APP_IMAGE_REF" ]; then
            ARGUS_CMD="$ARGUS_CMD --image $APP_IMAGE_REF"
          fi

          ARGUS_CMD="$ARGUS_CMD --scan-type $SCAN_TYPE"
          ARGUS_CMD="$ARGUS_CMD --severity-threshold $SEVERITY_THRESHOLD"
          ARGUS_CMD="$ARGUS_CMD --format terminal --format sarif --format json"
          ARGUS_CMD="$ARGUS_CMD --output-dir ./argus-results"
          ARGUS_CMD="$ARGUS_CMD --verbose"

          eval "$ARGUS_CMD"
        env:
          TARGET_URL: ${{ inputs.target_url }}
          APP_IMAGE_REF: ${{ inputs.app_image_ref }}
          SCAN_TYPE: ${{ inputs.scan_type || 'baseline' }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}
          APP_PORTS: ${{ inputs.app_ports || '8080:8080' }}
          MAX_DURATION_MINUTES: ${{ inputs.max_duration_minutes || '10' }}
          SCAN_MODE: ${{ inputs.scan_mode || 'url' }}
          API_SPEC: ${{ inputs.api_spec }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-reports-${{ inputs.scan_name || 'zap-scan' }}
          path: ./argus-results/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.2.1
        with:
          summary_file: ./argus-results/argus-results.md
          comment_marker: zap-dast-comment-${{ inputs.scan_name || 'zap-scan' }}
          title: 'ZAP DAST Scan Results'
          fallback_message: 'No ZAP results available'
