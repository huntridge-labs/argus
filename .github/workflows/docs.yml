name: Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # ``argus`` itself is installed alongside the MkDocs deps so the
        # docsite builder can introspect ``SCANNER_REGISTRY`` /
        # ``LINTER_REGISTRY`` / the ``argus.reporters`` entry-point
        # group / the argparse subcommand list when it renders the
        # interactive architecture page. Without the SDK on PATH the
        # page silently skips, the ``Architecture`` nav entry points
        # at a missing file, and ``mkdocs build --strict`` fails.
        run: pip install 'mkdocs>=1.6,<2' 'mkdocs-material>=9.7,<10' pyyaml mike -e .

      - name: Resolve docs ref
        # Per-trigger blob ref so the docsite's cross-repo links point
        # to content that actually exists at the matching version,
        # instead of always hardcoding ``main`` (which is the bug this
        # step closes — see docs/developer/SDK-ROADMAP.md → Docsite
        # Maintenance → "Version-aware GITHUB_BLOB rewrite").
        #
        #   release           → version tag from version.yaml (e.g. 0.7.2)
        #   pull_request      → PR head SHA (immutable, exists during the run)
        #   push:main         → "main"
        #   workflow_dispatch → "main"
        #
        # Release tags are bare semver (no `v` prefix) — release-it's
        # ``tagName: "${version}"`` setting in .release-it.json produces
        # ``1.0.0`` not ``v1.0.0``. Keep this REF in sync.
        #
        # The PR head SHA comes from ``github.event.pull_request.head.sha``,
        # which is sourced from a controlled set (hex SHA only) but still
        # routed through ``env:`` per workflow-injection best practices.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            release)
              VERSION=$(head -1 version.yaml | awk '{print $1}')
              REF="${VERSION}"
              ;;
            pull_request)
              REF="${PR_HEAD_SHA}"
              ;;
            *)
              REF="main"
              ;;
          esac
          echo "ARGUS_DOCS_REF=${REF}" >> "$GITHUB_ENV"

      - name: Validate docsite config
        run: cd scripts && python -m docsite --validate

      - name: Build docs
        run: cd scripts && python -m docsite --output-dir /tmp/argus-docs --ref "$ARGUS_DOCS_REF"

      - name: Verify site builds
        run: cd /tmp/argus-docs && mkdocs build --strict --site-dir /tmp/site

      - name: Configure git for mike
        if: github.event_name == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy versioned docs
        if: github.event_name == 'release'
        run: |
          VERSION=$(head -1 version.yaml | awk '{print $1}')
          mike deploy --push --update-aliases "$VERSION" latest \
            --config-file /tmp/argus-docs/mkdocs.yml
          mike set-default --push latest \
            --config-file /tmp/argus-docs/mkdocs.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
