# OSV Dependency Scanner - Reusable Workflow
#
# Runs the OSV scanner via the argus Python CLI.
# Equivalent to: python -m argus scan osv
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/sast-only.yml

name: OSV Dependency Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail if findings at or above this severity. Options: none, low, medium, high, critical.'
        required: false
        type: string
        default: 'none'
      scan_path:
        description: 'Path to scan for lockfiles and dependency manifests'
        required: false
        type: string
        default: '.'
      lockfile:
        description: 'Specific lockfile path to scan (auto-discovers if empty)'
        required: false
        type: string
        default: ''
      recursive:
        description: 'Scan subdirectories recursively for lockfiles'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  osv-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.12.0

      - name: Run scan
        run: |
          python -m argus scan osv \
            --path "$SCAN_PATH" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json --format markdown \
            --output-dir ./argus-results \
            --verbose
        env:
          SCAN_PATH: ${{ inputs.scan_path || '.' }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}
          OSV_LOCKFILE: ${{ inputs.lockfile }}
          OSV_RECURSIVE: ${{ inputs.recursive }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-reports
          path: ./argus-results/
          retention-days: 30

      - name: Build scanner summary
        if: always()
        run: |
          mkdir -p scanner-summaries
          {
            echo "<details><summary>📦 OSV (Dependencies)</summary>"
            echo ""
            if [ -f ./argus-results/argus-summary.md ]; then
              cat ./argus-results/argus-summary.md
            else
              echo "_No 📦 OSV (Dependencies) findings summary was produced._"
            fi
            echo ""
            echo "</details>"
          } > scanner-summaries/osv.md

      - name: Upload scanner summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-summary-osv
          path: scanner-summaries/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.12.0
        with:
          summary_file: ./argus-results/argus-summary.md
          comment_marker: osv-scanner-comment-marker
          title: 'OSV Dependency Scan Results'
          fallback_message: 'No OSV results available'
