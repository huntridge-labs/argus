# Publish release artifacts — triggered by version tags from release-it
#
# Publishes to PyPI and GHCR when release-it creates a tag.
# Both jobs run under the 'prod' protected environment.
#
# Flow: release.yml → release-it creates vX.Y.Z tag → this workflow triggers
#
# If publishing fails, re-run this workflow from the Actions tab.
# No need to re-run release-it — the tag already exists.

name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build pyyaml
          python -m build

      - name: Safety check
        run: python -m scripts.ci.check_package

      - name: Smoke test
        run: |
          pip install dist/*.whl
          argus --version
          argus scan --list

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  publish-containers:
    name: Publish Container Images
    runs-on: ubuntu-latest
    environment:
      name: prod
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Get release version from tag
        id: version
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push images
        env:
          IMAGE_REGISTRY: ghcr.io/huntridge-labs/argus
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for pair in \
            "scanner-bandit:docker/Dockerfile.bandit" \
            "scanner-opengrep:docker/Dockerfile.opengrep" \
            "scanner-supply-chain:docker/Dockerfile.supply-chain" \
            "cli:docker/Dockerfile.cli"; do
            IMAGE="${pair%%:*}"
            DOCKERFILE="${pair#*:}"
            FULL_TAG="${IMAGE_REGISTRY}/${IMAGE}"

            docker buildx build \
              --push \
              --platform linux/amd64,linux/arm64 \
              --tag "${FULL_TAG}:${VERSION}" \
              --tag "${FULL_TAG}:latest" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --file "${DOCKERFILE}" \
              .

            echo "Pushed ${FULL_TAG}:${VERSION} and ${FULL_TAG}:latest"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3
        continue-on-error: true

      - name: Sign images
        env:
          IMAGE_REGISTRY: ghcr.io/huntridge-labs/argus
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for IMAGE in scanner-bandit scanner-opengrep scanner-supply-chain cli; do
            FULL_TAG="${IMAGE_REGISTRY}/${IMAGE}"
            cosign sign --yes "${FULL_TAG}:${VERSION}" 2>/dev/null || true
            cosign sign --yes "${FULL_TAG}:latest" 2>/dev/null || true
          done
        continue-on-error: true

      - name: Summary
        env:
          IMAGE_REGISTRY: ghcr.io/huntridge-labs/argus
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Release Published"
            echo ""
            echo "### PyPI"
            echo "pip install argus-security==${VERSION}"
            echo ""
            echo "### Container Images"
            echo "| Image | Tags |"
            echo "|-------|------|"
            for IMAGE in scanner-bandit scanner-opengrep scanner-supply-chain cli; do
              echo "| ${IMAGE_REGISTRY}/${IMAGE} | ${VERSION}, latest |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
