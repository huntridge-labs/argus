# Trivy IaC Scanner - Reusable Workflow
#
# Runs the Trivy IaC scanner via the argus Python CLI.
# Equivalent to: python -m argus scan trivy-iac
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/infrastructure-scanning.yml

name: Trivy IaC Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      iac_path:
        description: 'Relative path to the infrastructure-as-code directory to scan'
        required: false
        type: string
        default: 'infrastructure'
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found. Options: none, low, medium, high, critical. Set to "none" to never fail.'
        required: false
        type: string
        default: 'none'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  trivy-iac-scan:
    name: Trivy IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.11.0

      - name: Run scan
        run: |
          python -m argus scan trivy-iac \
            --path "$SCAN_PATH" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json --format markdown \
            --output-dir ./argus-results \
            --verbose
        env:
          SCAN_PATH: ${{ inputs.iac_path || 'infrastructure' }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-iac-reports
          path: ./argus-results/
          retention-days: 30

      - name: Build scanner summary
        if: always()
        run: |
          mkdir -p scanner-summaries
          {
            echo "<details><summary>🏗️ Trivy IaC</summary>"
            echo ""
            if [ -f ./argus-results/argus-summary.md ]; then
              cat ./argus-results/argus-summary.md
            else
              echo "_No 🏗️ Trivy IaC findings summary was produced._"
            fi
            echo ""
            echo "</details>"
          } > scanner-summaries/trivy-iac.md

      - name: Upload scanner summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-summary-trivy-iac
          path: scanner-summaries/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.11.0
        with:
          summary_file: ./argus-results/argus-summary.md
          comment_marker: trivy-iac-scanner-comment-marker
          title: 'Trivy IaC Security Results'
          fallback_message: 'No Trivy IaC results available'
