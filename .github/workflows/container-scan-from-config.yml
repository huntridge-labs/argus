name: Container Scan from Config

# Reusable workflow for scanning multiple container images defined in a config file.
# Uses composite actions - no script checkouts needed.
#
# Usage Example:
#   permissions:
#     contents: read
#     security-events: write
#     actions: read
#     pull-requests: write
#     id-token: write
#     packages: read
#   jobs:
#     scan:
#       uses: huntridge-labs/argus/.github/workflows/container-scan-from-config.yml@1.8.0
#       with:
#         config_file: 'containers.yml'
#       secrets: inherit  # Required for dynamic secret resolution
#
# Config File Format (YAML example):
#   containers:
#     - name: my-app
#       image: myregistry.io/my-app:latest
#       registry:
#         auth_secret: MY_REGISTRY_TOKEN  # Any secret name from your repo
#       scanners: [trivy, grype]
#
# How Secret Resolution Works:
# 1. Your config specifies auth_secret: "MY_REGISTRY_TOKEN" (any secret name)
# 2. You use secrets: inherit to pass ALL your repo secrets to this workflow
# 3. This workflow uses secrets[matrix.registry_auth_secret] to resolve dynamically
# 4. The secret value is passed to scanner-container as registry_password
#
# IMPORTANT: You MUST use 'secrets: inherit' for this to work.
# This allows the workflow to dynamically access whichever secret your config references.
#
# Required Permissions (caller must grant these):
#   contents: read          - Checkout repository and read config files
#   security-events: write  - Upload SARIF results to GitHub Security tab
#   actions: read           - Download artifacts from scanner jobs
#   pull-requests: write    - Post PR comments with scan results
#   id-token: write         - OIDC token for registry authentication
#   packages: read          - Pull container images from GitHub Packages

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to container config file (YAML, JSON, or JS)'
        required: false
        default: 'examples/container-config.example.yml'
        type: string
  workflow_call:
    inputs:
      config_file:
        description: 'Path to container config file (YAML, JSON, or JS)'
        required: false
        default: 'examples/container-config.example.yml'
        type: string
    # No explicit secrets declared - callers MUST use 'secrets: inherit'
    # This allows dynamic secret resolution via secrets[matrix.registry_auth_secret]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  id-token: write
  packages: read

env:
  # Use current branch/PR when testing in argus repo, otherwise use release tag
  HRL_REF: ${{ github.repository == 'huntridge-labs/argus' && (github.head_ref || github.ref_name) || '1.8.0' }}

jobs:
  parse-config:
    name: Parse Container Config
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      has_containers: ${{ steps.parse.outputs.has_containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Parse container config
        id: parse
        uses: huntridge-labs/argus/.github/actions/parse-container-config@1.8.0
        with:
          config_file: ${{ inputs.config_file }}

  scan-containers:
    name: Scan ${{ matrix.name }}
    needs: parse-config
    if: needs.parse-config.outputs.has_containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.parse-config.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.8.0

      - name: Authenticate to container registry
        if: matrix.registry_username != ''
        env:
          REGISTRY_PASSWORD: ${{ secrets[matrix.registry_auth_secret] }}
          REGISTRY_USERNAME: ${{ matrix.registry_username }}
          IMAGE_REF: ${{ matrix.image }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning title=Missing Registry Password::No registry password found for configured auth secret"
            exit 0
          fi

          REGISTRY=$(echo "$IMAGE_REF" | cut -d'/' -f1)
          if [[ "$REGISTRY" != *"."* ]] && [[ "$REGISTRY" != *":"* ]]; then
            REGISTRY="docker.io"
          fi

          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Run container security scanners via argus CLI
        id: scan
        env:
          ARGUS_IMAGE_REF: ${{ matrix.image }}
          ARGUS_SCANNERS: ${{ matrix.scanners }}
          ARGUS_FAIL_ON_SEVERITY: ${{ matrix.fail_on_severity }}
          ARGUS_ENABLE_CODE_SECURITY: ${{ matrix.enable_code_security }}
          CONTAINER_NAME: ${{ matrix.name || matrix.image }}
        run: |
          # Write reports to a fixed dir (no timestamp) and publish the
          # per-container markdown as a scanner-summary-container-* artifact so
          # the scan-summary job (security-summary) can stitch it. Capture the
          # scan exit code so the markdown is copied even when findings fail
          # the severity gate, then re-exit with it.
          SCAN_EXIT=0
          python -m argus scan container \
            --image "$ARGUS_IMAGE_REF" \
            --scanners "$ARGUS_SCANNERS" \
            --severity-threshold "$ARGUS_FAIL_ON_SEVERITY" \
            --output-dir ./container-reports \
            --no-timestamp \
            --format markdown --format sarif || SCAN_EXIT=$?

          SAFE_NAME=$(printf '%s' "$CONTAINER_NAME" | tr '/' '-' | tr -cd '[:alnum:]._-')
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p scanner-summaries
          if [ -f container-reports/container-scan.md ]; then
            cp container-reports/container-scan.md "scanner-summaries/container-${SAFE_NAME}.md"
          fi

          exit $SCAN_EXIT

      - name: Upload container summary section
        if: always() && steps.scan.outputs.safe_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-summary-container-${{ steps.scan.outputs.safe_name }}
          path: scanner-summaries/container-${{ steps.scan.outputs.safe_name }}.md
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

  scan-summary:
    name: Container Scan Summary
    runs-on: ubuntu-latest
    needs: [parse-config, scan-containers]
    if: always()
    steps:
      - name: Generate container scan summary
        uses: huntridge-labs/argus/.github/actions/security-summary@1.8.0
        with:
          summary_pattern: 'scanner-summary-container-*'
          title: '🐳 Container Security Scan Results'
          comment_marker: 'container-scan-parallel-comment'
          post_pr_comment: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
