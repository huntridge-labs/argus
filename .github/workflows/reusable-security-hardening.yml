name: Reusable Security Hardening Pipeline

on:
  workflow_call:
    inputs:
      scanners:
        description: 'Comma-separated list of scanners to run (codeql, opengrep, bandit, gitleaks, container, infrastructure, trivy-iac, checkov, trivy-container, grype, lint, clamav, sbom, zap, osv, dependency-review, supply-chain, dependencies, all, sast, secrets, etc.). Note: zap (DAST) is opt-in and is not included in "all" by default.'
        required: false
        default: 'all'
        type: string
      scan_type:
        description: '(Deprecated) Legacy scan type selector. Prefer the scanners input.'
        required: false
        default: ''
        type: string
      python_version:
        description: 'Python version to use'
        required: false
        default: '3.12'
        type: string
      aws_region:
        description: 'AWS region for infrastructure scans'
        required: false
        default: 'us-east-1'
        type: string
      iac_path:
        description: 'Directory that contains infrastructure-as-code (Terraform) files'
        required: false
        default: 'infrastructure'
        type: string
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        default: true
        type: boolean
      codeql_languages:
        description: 'Comma-separated list of languages for CodeQL analysis (e.g., "python,javascript"). Leave empty for auto-detection.'
        required: false
        default: ''
        type: string
      codeql_config_file:
        description: 'Path to CodeQL config file. Leave empty to auto-detect project config or generate one.'
        required: false
        default: ''
        type: string
      codeql_query_suite:
        description: 'CodeQL query suite to use (security-extended, security-and-quality, or default). Ignored if codeql_config_file is set.'
        required: false
        default: 'security-extended,security-and-quality'
        type: string
      codeql_scan_paths:
        description: 'Comma-separated list of paths to scan (empty = scan everything). Ignored if codeql_config_file is set.'
        required: false
        default: ''
        type: string
      codeql_ignore_paths:
        description: 'Comma-separated list of paths to ignore. Ignored if codeql_config_file is set.'
        required: false
        default: '**/node_modules/**,**/venv/**,**/__pycache__/**'
        type: string
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository (required for CodeQL scanning)'
        required: false
        default: false
        type: boolean
      clamav_scan_path:
        description: 'Path for ClamAV to scan (file, directory, or archive). Defaults to repository root.'
        required: false
        default: '.'
        type: string
      container_image_ref:
        description: |
          Container image to scan with the trivy-container / grype scanners
          (e.g. ghcr.io/owner/app:tag). These scanners are opt-in (not part of
          `all`); when they are selected but this is empty, their jobs are
          skipped rather than scanning a placeholder image.
        required: false
        default: ''
        type: string
      allow_failure:
        description: |
          Whether to allow the workflow to continue when any scanner fails or reports findings
          above the severity threshold. Default is `false` — any scanner that crashes, is
          cancelled, or reports blocking findings fails the overall workflow. Set to `true`
          for informational-only runs that must always complete green.
        required: false
        default: false
        type: boolean
      severity_threshold:
        description: 'Minimum severity level that will cause job failure when allow_failure is false. Options: low, medium, high, critical'
        required: false
        default: 'high'
        type: string
      bandit_config_file:
        description: 'Path to Bandit configuration file (e.g. pyproject.toml, .bandit). Passed as bandit -c flag.'
        required: false
        default: ''
        type: string
      gitleaks_enable_comments:
        description: 'Enable GitLeaks inline PR comments (requires GITLEAKS_LICENSE)'
        required: false
        default: true
        type: boolean
      gitleaks_notify_user_list:
        description: 'Comma-separated list of GitHub usernames to notify on secret detection (e.g., "@user1,@user2")'
        required: false
        default: ''
        type: string
      gitleaks_enable_summary:
        description: 'Enable GitLeaks job summary'
        required: false
        default: true
        type: boolean
      gitleaks_enable_upload_artifact:
        description: 'Enable uploading SARIF artifact when secrets are detected'
        required: false
        default: true
        type: boolean
      gitleaks_config:
        description: 'Path to a gitleaks configuration file (e.g., "path/to/gitleaks.toml")'
        required: false
        default: ''
        type: string

      supply_chain_scan_path:
        description: 'Path to scan for GitHub Actions workflows and actions'
        required: false
        default: '.'
        type: string
      supply_chain_persona:
        description: 'Zizmor audit strictness: regular (default), pedantic, or auditor'
        required: false
        default: 'regular'
        type: string
      supply_chain_zizmor_config:
        description: 'Path to zizmor configuration file'
        required: false
        default: ''
        type: string

      zap_scan_mode:
        description: 'ZAP: how to obtain a running target: url (already running), docker-run (run a single container), compose (run docker compose)'
        required: false
        default: 'url'
        type: string
      zap_config_file:
        description: 'ZAP: optional config file (YAML or JSON) to define targets, scan type, and options. When provided, it takes precedence over the other zap_* inputs.'
        required: false
        default: ''
        type: string
      zap_target_urls:
        description: 'ZAP: comma-separated list of target URLs (required for baseline/full)'
        required: false
        default: ''
        type: string
      zap_healthcheck_url:
        description: 'ZAP: optional URL to poll until ready (defaults to first target URL)'
        required: false
        default: ''
        type: string
      zap_app_image_ref:
        description: 'ZAP: when scan_mode=docker-run, container image to start'
        required: false
        default: ''
        type: string
      zap_app_ports:
        description: 'ZAP: when scan_mode=docker-run, comma-separated port mappings (e.g., 8080:8080,3000:3000)'
        required: false
        default: '8080:8080'
        type: string
      zap_compose_file:
        description: 'ZAP: when scan_mode=compose, path to docker compose file'
        required: false
        default: 'docker-compose.yml'
        type: string
      zap_scan_type:
        description: 'ZAP: scan type: baseline (passive), full (active), api (OpenAPI/Swagger)'
        required: false
        default: 'baseline'
        type: string
      zap_api_spec:
        description: 'ZAP: when scan_type=api, URL or file path to OpenAPI/Swagger spec'
        required: false
        default: ''
        type: string
      zap_max_duration_minutes:
        description: 'ZAP: max minutes per target for ZAP to run'
        required: false
        default: 10
        type: number

      osv_scan_path:
        description: 'OSV: path to scan for lockfiles and dependency manifests'
        required: false
        default: '.'
        type: string
      osv_lockfile:
        description: 'OSV: specific lockfile path to scan (auto-discovers if empty)'
        required: false
        default: ''
        type: string
      osv_recursive:
        description: 'OSV: scan subdirectories recursively for lockfiles'
        required: false
        default: true
        type: boolean

      dependency_review_vulnerability_check:
        description: 'Dependency Review: enable vulnerability checking'
        required: false
        default: true
        type: boolean
      dependency_review_license_check:
        description: 'Dependency Review: enable license compliance checking'
        required: false
        default: false
        type: boolean
      dependency_review_allow_licenses:
        description: 'Dependency Review: comma-separated SPDX license identifiers to allow'
        required: false
        default: ''
        type: string
      dependency_review_deny_licenses:
        description: 'Dependency Review: comma-separated SPDX license identifiers to deny'
        required: false
        default: ''
        type: string
    secrets:
      AWS_ACCOUNT_ID:
        description: 'AWS Account ID for infrastructure scans'
        required: false
      GITLEAKS_LICENSE:
        description: 'License key for GitLeaks scans within a Github Organization. Obtain from https://gitleaks.io'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  checks: write
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ inputs.aws_region }}
  PYTHON_VERSION: ${{ inputs.python_version }}

jobs:
  scan-coordinator:
    name: Scan Coordinator
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    outputs:
      selected_scanners: ${{ steps.resolve.outputs.selected_scanners }}
      selected_scanners_json: ${{ steps.resolve.outputs.selected_scanners_json }}
      run_codeql: ${{ steps.resolve.outputs.run_codeql }}
      run_opengrep: ${{ steps.resolve.outputs.run_opengrep }}
      run_bandit: ${{ steps.resolve.outputs.run_bandit }}
      run_gitleaks: ${{ steps.resolve.outputs.run_gitleaks }}
      run_container: ${{ steps.resolve.outputs.run_container }}
      run_sbom: ${{ steps.resolve.outputs.run_sbom }}
      run_trivy_iac: ${{ steps.resolve.outputs.run_trivy_iac }}
      run_checkov: ${{ steps.resolve.outputs.run_checkov }}
      run_trivy_container: ${{ steps.resolve.outputs.run_trivy_container }}
      run_grype: ${{ steps.resolve.outputs.run_grype }}
      run_lint: ${{ steps.resolve.outputs.run_lint }}
      run_clamav: ${{ steps.resolve.outputs.run_clamav }}
      run_zap: ${{ steps.resolve.outputs.run_zap }}
      run_osv: ${{ steps.resolve.outputs.run_osv }}
      run_dependency_review: ${{ steps.resolve.outputs.run_dependency_review }}
      run_supply_chain: ${{ steps.resolve.outputs.run_supply_chain }}
      run_any: ${{ steps.resolve.outputs.run_any }}

    steps:
    - name: Resolve scanner selection
      id: resolve
      shell: bash
      env:
        SCANNERS_INPUT: ${{ inputs.scanners }}
        SCAN_TYPE_INPUT: ${{ inputs.scan_type }}
      run: |
        set -euo pipefail

        declare -A RUN=(
          [codeql]=false
          [opengrep]=false
          [bandit]=false
          [gitleaks]=false
          [container]=false
          [trivy-iac]=false
          [checkov]=false
          [trivy-container]=false
          [grype]=false
          [lint]=false
          [clamav]=false
          [sbom]=false
          [zap]=false
          [osv]=false
          [dependency-review]=false
          [supply-chain]=false
        )

        DEFAULT_SCANNERS=(codeql opengrep bandit gitleaks container trivy-iac checkov sbom)
        SELECTED=()

        normalize() {
          echo "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' \t' | tr '_' '-'
        }

        add_scanner() {
          local key="$1"
          if [[ -z "${RUN[$key]+_}" ]]; then
            echo "::notice title=Unknown scanner token::Scanner '$key' is not recognized and will be ignored."
            return
          fi
          if [[ "${RUN[$key]}" != "true" ]]; then
            RUN[$key]=true
            SELECTED+=("$key")
          fi
        }

        reset_selection() {
          SELECTED=()
          for key in "${!RUN[@]}"; do
            RUN[$key]=false
          done
        }

        apply_token() {
          local token="$1"
          case "$token" in
            '' ) ;;
            all|full)
              # sbom (Syft) generates a repo SBOM on every default run — it is in
              # DEFAULT_SCANNERS and included here so `all` and DEFAULT_SCANNERS
              # agree. The excluded scanners are opt-in/context-specific: the
              # container scanners need an image (container_image_ref), zap needs
              # a target URL, and dependency-review needs a pull_request event.
              local -a exclude=(trivy-container grype zap dependency-review)
              for key in "${!RUN[@]}"; do
                if [[ " ${exclude[*]} " != *" ${key} "* ]]; then
                  add_scanner "$key"
                fi
              done
              ;;
            sast|sast-only)
              for key in codeql opengrep bandit gitleaks; do add_scanner "$key"; done
              ;;
            secrets|secrets-only) add_scanner gitleaks ;;
            codeql|code-ql) add_scanner codeql ;;
            semgrep|opengrep|open-grep) add_scanner opengrep ;;
            bandit) add_scanner bandit ;;
            gitleaks|git-leaks) add_scanner gitleaks ;;
            container|containers|container-scan|docker) add_scanner container ;;
            infrastructure|infra|iac|terraform)
              # `infrastructure` is an alias for the trivy-iac + checkov per-scanner
              # workflows (the compound infrastructure-scan.yml is deprecated, #327).
              add_scanner trivy-iac
              add_scanner checkov
              ;;
            sbom) add_scanner sbom ;;
            trivy-iac|trivyiac) add_scanner trivy-iac ;;
            checkov) add_scanner checkov ;;
            trivy-container|trivycontainer) add_scanner trivy-container ;;
            grype) add_scanner grype ;;
            lint|linting|code-quality) add_scanner lint ;;
            clamav|malware|antivirus) add_scanner clamav ;;
            zap|dast) add_scanner zap ;;
            osv|osv-scanner) add_scanner osv ;;
            dependency-review|dep-review) add_scanner dependency-review ;;
            supply-chain|supply_chain|supplychain|actions-security) add_scanner supply-chain ;;
            dependencies|deps|dependency)
              for key in osv dependency-review; do add_scanner "$key"; done
              ;;
            none|off) reset_selection ;;
            *)
              echo "::notice title=Unknown scanner token::Value '$token' is not recognized and will be ignored."
              ;;
          esac
        }

        SCANNERS_RAW="$SCANNERS_INPUT"
        SCAN_TYPE_RAW="$(normalize "$SCAN_TYPE_INPUT")"

        if [[ -z "$SCANNERS_RAW" || "$SCANNERS_RAW" == "default" ]]; then
          case "$SCAN_TYPE_RAW" in
            codeql-only) SCANNERS_RAW='codeql' ;;
            sast-only) SCANNERS_RAW='sast' ;;
            container-only) SCANNERS_RAW='container' ;;
            infrastructure-only) SCANNERS_RAW='infrastructure' ;;
            full|'') SCANNERS_RAW='all' ;;
            *)
              echo "::notice title=Unknown legacy scan type::Scan type '$SCAN_TYPE_RAW' not recognized. Falling back to 'all'."
              SCANNERS_RAW='all'
              ;;
          esac
        fi

        IFS=',' read -ra TOKENS <<< "$SCANNERS_RAW"
        for raw in "${TOKENS[@]}"; do
          apply_token "$(normalize "$raw")"
        done

        if [[ ${#SELECTED[@]} -eq 0 ]]; then
          for key in "${DEFAULT_SCANNERS[@]}"; do add_scanner "$key"; done
        fi

        # Disable CodeQL BEFORE emitting run_* outputs. CodeQL requires GitHub
        # Code Security to be enabled; when it isn't we must finalize
        # RUN[codeql]=false here so the emit loop below writes run_codeql=false
        # and RUN_ANY reflects the real selection. Doing this after the loop
        # (the previous behavior) left a stale run_codeql=true in
        # $GITHUB_OUTPUT, so the scanner-codeql job still triggered despite the
        # "skipped" warning.
        ENABLE_CODE_SECURITY="${{ inputs.enable_code_security }}"
        if [[ "${RUN[codeql]}" == "true" && "$ENABLE_CODE_SECURITY" != "true" ]]; then
          echo "::warning title=CodeQL Disabled::GitHub Code Security is not enabled for this repository. CodeQL scanning will be skipped."
          RUN[codeql]=false
          # Remove codeql as a discrete element. Substring replacement
          # (${SELECTED[@]/codeql}) would leave an empty "" entry that pollutes
          # selected_scanners and selected_scanners_json.
          PRUNED=()
          for item in "${SELECTED[@]}"; do
            [[ "$item" == "codeql" ]] && continue
            PRUNED+=("$item")
          done
          SELECTED=("${PRUNED[@]}")
        fi

        RUN_ANY=false
        for key in "${!RUN[@]}"; do
          if [[ "${RUN[$key]}" == "true" ]]; then
            RUN_ANY=true
          fi
          output_key="${key//-/_}"
          echo "run_${output_key}=${RUN[$key]}" >> "$GITHUB_OUTPUT"
        done

        if [[ "$RUN_ANY" == "false" ]]; then
          echo "::warning title=No scanners selected::No scanners were selected. The workflow will execute the summary only."
        fi

        echo "run_any=$RUN_ANY" >> "$GITHUB_OUTPUT"

        SELECTED_STR=$(IFS=','; echo "${SELECTED[*]}")
        if [[ -z "$SELECTED_STR" ]]; then
          SELECTED_STR=""
        fi

        if [[ ${#SELECTED[@]} -eq 0 ]]; then
          SELECTED_JSON='[]'
        else
          SELECTED_JSON='['
          for item in "${SELECTED[@]}"; do
            SELECTED_JSON+="\"$item\","
          done
          SELECTED_JSON="${SELECTED_JSON%,}]"
        fi

        echo "selected_scanners=$SELECTED_STR" >> "$GITHUB_OUTPUT"
        echo "selected_scanners_json=$SELECTED_JSON" >> "$GITHUB_OUTPUT"

        echo ""
        echo "Resolved scanners: ${SELECTED_STR:-none}"
        echo "Legacy scan_type input: ${SCAN_TYPE_RAW:-'<not provided>'}"

  code-quality-linting:
    name: Code Quality & Linting
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_lint == 'true'
    uses: huntridge-labs/argus/.github/workflows/linting.yml@1.9.0
    with:
      post_pr_comment: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    secrets: inherit

  scanner-codeql:
    name: CodeQL Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_codeql == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-codeql.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      codeql_languages: ${{ inputs.codeql_languages }}
      config_file: ${{ inputs.codeql_config_file }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-opengrep:
    name: OpenGrep Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_opengrep == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-opengrep.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-bandit:
    name: Bandit Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_bandit == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-bandit.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
      bandit_config_file: ${{ inputs.bandit_config_file }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-gitleaks:
    name: Gitleaks Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_gitleaks == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-gitleaks.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
      gitleaks_enable_comments: ${{ inputs.gitleaks_enable_comments }}
      gitleaks_notify_user_list: ${{ inputs.gitleaks_notify_user_list }}
      gitleaks_enable_summary: ${{ inputs.gitleaks_enable_summary }}
      gitleaks_enable_upload_artifact: ${{ inputs.gitleaks_enable_upload_artifact }}
      gitleaks_config: ${{ inputs.gitleaks_config }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  scanner-clamav:
    name: ClamAV Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_clamav == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-clamav.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      scan_path: ${{ inputs.clamav_scan_path }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-container:
    name: Container Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_container == 'true'
    uses: huntridge-labs/argus/.github/workflows/container-scan.yml@1.9.0
    with:
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      allow_failure: ${{ inputs.allow_failure }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
      pull-requests: write
    secrets: inherit

  scanner-sbom:
    name: SBOM Generator
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_sbom == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-syft.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      enable_code_security: ${{ inputs.enable_code_security }}
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
      pull-requests: write
    secrets: inherit

  scanner-trivy-iac:
    name: Trivy IaC Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_trivy_iac == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-trivy-iac.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      iac_path: ${{ inputs.iac_path }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-checkov:
    name: Checkov Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_checkov == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-checkov.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      iac_path: ${{ inputs.iac_path }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-trivy-container:
    name: Trivy Container Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_trivy_container == 'true' && inputs.container_image_ref != ''
    uses: huntridge-labs/argus/.github/workflows/scanner-trivy-container.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      image_ref: ${{ inputs.container_image_ref }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
      pull-requests: write
    secrets: inherit

  scanner-grype:
    name: Grype Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_grype == 'true' && inputs.container_image_ref != ''
    uses: huntridge-labs/argus/.github/workflows/scanner-grype.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      image_ref: ${{ inputs.container_image_ref }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
      pull-requests: write
    secrets: inherit

  scanner-zap:
    name: ZAP (DAST) Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_zap == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-zap.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      scan_mode: ${{ inputs.zap_scan_mode }}
      scan_type: ${{ inputs.zap_scan_type }}
      target_url: ${{ inputs.zap_target_urls }}
      api_spec: ${{ inputs.zap_api_spec }}
      healthcheck_url: ${{ inputs.zap_healthcheck_url }}
      app_image_ref: ${{ inputs.zap_app_image_ref }}
      app_ports: ${{ inputs.zap_app_ports }}
      compose_file: ${{ inputs.zap_compose_file }}
      max_duration_minutes: ${{ inputs.zap_max_duration_minutes }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
      post_pr_comment: false
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: write
    secrets: inherit

  scanner-osv:
    name: OSV Dependency Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_osv == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-osv.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
      scan_path: ${{ inputs.osv_scan_path }}
      lockfile: ${{ inputs.osv_lockfile }}
      recursive: ${{ inputs.osv_recursive }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-dependency-review:
    name: Dependency Review Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_dependency_review == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-dependency-review.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
      vulnerability_check: ${{ inputs.dependency_review_vulnerability_check }}
      license_check: ${{ inputs.dependency_review_license_check }}
      allow_licenses: ${{ inputs.dependency_review_allow_licenses }}
      deny_licenses: ${{ inputs.dependency_review_deny_licenses }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  scanner-supply-chain:
    name: Supply Chain Scanner
    needs: scan-coordinator
    if: needs.scan-coordinator.outputs.run_supply_chain == 'true'
    uses: huntridge-labs/argus/.github/workflows/scanner-supply-chain.yml@1.9.0
    with:
      allow_failure: ${{ inputs.allow_failure }}
      post_pr_comment: false
      enable_code_security: ${{ inputs.enable_code_security }}
      scan_path: ${{ inputs.supply_chain_scan_path }}
      fail_on_severity: ${{ inputs.allow_failure == false && inputs.severity_threshold || 'none' }}
      persona: ${{ inputs.supply_chain_persona }}
      zizmor_config: ${{ inputs.supply_chain_zizmor_config }}
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    secrets: inherit

  # ============================================
  # Security Summary
  # ---
  # Delegates to the reusable `security-summary` composite action. Passes the
  # per-scanner `needs.*.result` so the aggregator can render a pass/fail/skipped
  # table at the top of the report. With `allow_failure: false` (the default),
  # any failed scanner causes this job to exit non-zero, blocking the overall
  # workflow — no more silent "0 findings" greens when a scanner crashed.
  # ============================================
  security-summary:
    name: Security Hardening Summary
    runs-on: ubuntu-latest
    needs:
      - scan-coordinator
      - code-quality-linting
      - scanner-codeql
      - scanner-opengrep
      - scanner-bandit
      - scanner-gitleaks
      - scanner-clamav
      - scanner-container
      - scanner-sbom
      - scanner-trivy-iac
      - scanner-checkov
      - scanner-trivy-container
      - scanner-grype
      - scanner-zap
      - scanner-osv
      - scanner-dependency-review
      - scanner-supply-chain
    if: always()
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout argus for composite action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: huntridge-labs/argus
          ref: 1.9.0
          path: .argus-actions

      - name: Aggregate scanner results
        uses: ./.argus-actions/.github/actions/security-summary
        with:
          title: '🛡️ Security Hardening Pipeline Results'
          post_pr_comment: ${{ inputs.post_pr_comment }}
          fail_on_scanner_failure: ${{ inputs.allow_failure == false }}
          # Preserve the legacy comment marker from the pre-refactor inline
          # summary step so consumer PRs keep updating the same comment
          # rather than accruing an orphaned one after upgrade.
          comment_marker: 'security-hardening-comment-marker'
          scan_statuses: |
            {
              "lint":              "${{ needs.code-quality-linting.result }}",
              "codeql":            "${{ needs.scanner-codeql.result }}",
              "opengrep":          "${{ needs.scanner-opengrep.result }}",
              "bandit":            "${{ needs.scanner-bandit.result }}",
              "gitleaks":          "${{ needs.scanner-gitleaks.result }}",
              "clamav":            "${{ needs.scanner-clamav.result }}",
              "container":         "${{ needs.scanner-container.result }}",
              "sbom":              "${{ needs.scanner-sbom.result }}",
              "trivy-iac":         "${{ needs.scanner-trivy-iac.result }}",
              "checkov":           "${{ needs.scanner-checkov.result }}",
              "trivy-container":   "${{ needs.scanner-trivy-container.result }}",
              "grype":             "${{ needs.scanner-grype.result }}",
              "zap":               "${{ needs.scanner-zap.result }}",
              "osv":               "${{ needs.scanner-osv.result }}",
              "dependency-review": "${{ needs.scanner-dependency-review.result }}",
              "supply-chain":      "${{ needs.scanner-supply-chain.result }}"
            }
