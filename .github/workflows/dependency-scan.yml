# Dependency Security Scanner - Reusable Workflow
#
# COMPOUND WRAPPER: Runs OSV (via argus CLI) + Dependency Review scanners in parallel.
# OSV scanning: argus/scanners/osv.py (invoked via `python -m argus scan osv`)
# Dependency Review: .github/actions/scanner-dependency-review/action.yml (GitHub-native)
#
# Note: Dependency Review only works on pull_request events.
# On other triggers it skips gracefully with a warning annotation.
#
# For GHES users: Use the composite actions directly instead of this workflow.

name: Dependency Security Scanner

on:
  workflow_dispatch:
    inputs:
      scan_path:
        description: 'Path to scan for lockfiles and dependency manifests'
        required: false
        type: string
        default: '.'
      fail_on_severity:
        description: 'Fail if findings at or above this severity. Options: none, low, medium, high, critical.'
        required: false
        type: string
        default: 'none'

  workflow_call:
    inputs:
      scan_path:
        description: 'Path to scan for lockfiles and dependency manifests'
        required: false
        type: string
        default: '.'
      lockfile:
        description: 'Specific lockfile path to scan (auto-discovers if empty)'
        required: false
        type: string
        default: ''
      recursive:
        description: 'Scan subdirectories recursively for lockfiles'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail if findings at or above this severity. Options: none, low, medium, high, critical.'
        required: false
        type: string
        default: 'none'
      post_pr_comment:
        description: 'Post results as PR comment'
        required: false
        type: boolean
        default: true
      vulnerability_check:
        description: 'Dependency Review: enable vulnerability checking'
        required: false
        type: boolean
        default: true
      license_check:
        description: 'Dependency Review: enable license compliance checking'
        required: false
        type: boolean
        default: false
      allow_licenses:
        description: 'Dependency Review: comma-separated SPDX license identifiers to allow'
        required: false
        type: string
        default: ''
      deny_licenses:
        description: 'Dependency Review: comma-separated SPDX license identifiers to deny'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  osv-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.2.1

      - name: Run OSV Scanner via argus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGUS_SCAN_PATH: ${{ inputs.scan_path }}
          ARGUS_LOCKFILE: ${{ inputs.lockfile }}
          ARGUS_RECURSIVE: ${{ inputs.recursive }}
          ARGUS_POST_PR_COMMENT: ${{ inputs.post_pr_comment }}
          ARGUS_ENABLE_CODE_SECURITY: ${{ inputs.enable_code_security }}
          ARGUS_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        run: |
          python -m argus scan osv \
            --path "$ARGUS_SCAN_PATH" \
            --severity-threshold "$ARGUS_FAIL_ON_SEVERITY" \
            --format markdown --format sarif

  # Dependency Review uses the GitHub-native composite action (not argus CLI)
  # because it requires the GitHub dependency graph API.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run Dependency Review Scanner
        uses: huntridge-labs/argus/.github/actions/scanner-dependency-review@1.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          vulnerability_check: ${{ inputs.vulnerability_check }}
          license_check: ${{ inputs.license_check }}
          allow_licenses: ${{ inputs.allow_licenses }}
          deny_licenses: ${{ inputs.deny_licenses }}
          post_pr_comment: ${{ inputs.post_pr_comment }}
          enable_code_security: ${{ inputs.enable_code_security }}
          fail_on_severity: ${{ inputs.fail_on_severity }}
