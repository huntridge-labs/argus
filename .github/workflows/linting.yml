# Code Quality and Linting Pipeline - Reusable Workflow
#
# THIN WRAPPER: This workflow delegates to individual linter composite actions.
# All linting logic is in:
#   - .github/actions/linter-yaml/action.yml
#   - .github/actions/linter-json/action.yml
#   - .github/actions/linter-python/action.yml
#   - .github/actions/linter-javascript/action.yml
#   - .github/actions/linter-dockerfile/action.yml
#   - .github/actions/linter-terraform/action.yml
#   - .github/actions/linting-summary/action.yml
#
# NOTE: Linters are not yet part of the argus scanner registry.
# They will be migrated to the argus CLI in a future release.
# Until then, this workflow continues to use composite actions directly.
#
# For GHES users: Use the composite actions directly instead of this workflow.
# See: examples/github-enterprise/

name: Code Quality and Linting Pipeline

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      fail_on_issues:
        description: 'Fail the workflow if linting issues are found'
        required: false
        type: boolean
        default: false
      fail_on_tool_error:
        description: |
          Fail the workflow when a linter tool itself errors (a crash — argus exit
          code 2), independent of fail_on_issues. Default false: a tool error is
          always surfaced in the job log, the status table, and the PR comment, but
          only blocks the pipeline when this is true.
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Post linting summary as PR comment'
        required: false
        type: boolean
        default: true
    outputs:
      linting_status:
        description: "Overall linting status"
        value: ${{ jobs.linting-summary.outputs.status }}
      issues_found:
        description: "Number of issues found"
        value: ${{ jobs.linting-summary.outputs.issues_found }}

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      yaml_issues: ${{ steps.lint.outputs.issues_count }}
      yaml_tool_status: ${{ steps.lint.outputs.tool_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run YAML Linter
        id: lint
        uses: huntridge-labs/argus/.github/actions/linter-yaml@1.9.1

  json-lint:
    name: JSON Validation
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      json_issues: ${{ steps.lint.outputs.issues_count }}
      json_tool_status: ${{ steps.lint.outputs.tool_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run JSON Linter
        id: lint
        uses: huntridge-labs/argus/.github/actions/linter-json@1.9.1

  python-lint:
    name: Python Code Quality
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      python_issues: ${{ steps.lint.outputs.issues_count }}
      python_tool_status: ${{ steps.lint.outputs.tool_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run Python Linter
        id: lint
        uses: huntridge-labs/argus/.github/actions/linter-python@1.9.1

  javascript-lint:
    name: JavaScript Code Quality
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      js_issues: ${{ steps.lint.outputs.issues_count }}
      js_tool_status: ${{ steps.lint.outputs.tool_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run JavaScript Linter
        id: lint
        uses: huntridge-labs/argus/.github/actions/linter-javascript@1.9.1

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      docker_issues: ${{ steps.lint.outputs.issues_count }}
      docker_tool_status: ${{ steps.lint.outputs.tool_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run Dockerfile Linter
        id: lint
        uses: huntridge-labs/argus/.github/actions/linter-dockerfile@1.9.1

  terraform-lint:
    name: Terraform Linting
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      terraform_issues: ${{ steps.lint.outputs.issues_count }}
      terraform_tool_status: ${{ steps.lint.outputs.tool_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run Terraform Linter
        id: lint
        uses: huntridge-labs/argus/.github/actions/linter-terraform@1.9.1

  linting-summary:
    name: Linting Summary
    runs-on: ubuntu-latest
    needs: [yaml-lint, json-lint, python-lint, javascript-lint, dockerfile-lint, terraform-lint]
    if: always()
    outputs:
      status: ${{ steps.summary.outputs.overall_status }}
      issues_found: ${{ steps.totals.outputs.total_issues }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Tally linter issue counts
        id: totals
        env:
          YAML_ISSUES: ${{ needs.yaml-lint.outputs.yaml_issues }}
          JSON_ISSUES: ${{ needs.json-lint.outputs.json_issues }}
          PYTHON_ISSUES: ${{ needs.python-lint.outputs.python_issues }}
          JS_ISSUES: ${{ needs.javascript-lint.outputs.js_issues }}
          DOCKER_ISSUES: ${{ needs.dockerfile-lint.outputs.docker_issues }}
          TERRAFORM_ISSUES: ${{ needs.terraform-lint.outputs.terraform_issues }}
        run: |
          total=0
          for v in "$YAML_ISSUES" "$JSON_ISSUES" "$PYTHON_ISSUES" "$JS_ISSUES" "$DOCKER_ISSUES" "$TERRAFORM_ISSUES"; do
            case "$v" in
              ''|*[!0-9]*) n=0 ;;
              *) n="$v" ;;
            esac
            total=$((total + n))
          done
          echo "total_issues=$total" >> "$GITHUB_OUTPUT"
          echo "Linting issues found: $total"

      - name: Generate Linting Summary
        id: summary
        uses: huntridge-labs/argus/.github/actions/linting-summary@1.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          post_pr_comment: ${{ inputs.post_pr_comment }}
          # Drive the per-linter status table from each linter's tool_status
          # output (ok|error), NOT needs.*.result. The lint jobs use
          # continue-on-error, which can mask a job's result; tool_status is
          # written by the linter action from the argus exit code (2 = tool
          # error, distinct from 1 = findings) and always propagates. A tool
          # error → "failure" in the table, so a crashed linter is visible in the
          # check summary and PR comment instead of the report reading "clean".
          # Whether a tool error BLOCKS is governed by fail_on_tool_error;
          # findings remain governed solely by fail_on_issues below.
          fail_on_scanner_failure: ${{ inputs.fail_on_tool_error }}
          scan_statuses: |
            {
              "yaml":       "${{ needs.yaml-lint.outputs.yaml_tool_status == 'error' && 'failure' || 'success' }}",
              "json":       "${{ needs.json-lint.outputs.json_tool_status == 'error' && 'failure' || 'success' }}",
              "python":     "${{ needs.python-lint.outputs.python_tool_status == 'error' && 'failure' || 'success' }}",
              "javascript": "${{ needs.javascript-lint.outputs.js_tool_status == 'error' && 'failure' || 'success' }}",
              "dockerfile": "${{ needs.dockerfile-lint.outputs.docker_tool_status == 'error' && 'failure' || 'success' }}",
              "terraform":  "${{ needs.terraform-lint.outputs.terraform_tool_status == 'error' && 'failure' || 'success' }}"
            }

      - name: Fail if issues found
        if: inputs.fail_on_issues == true && steps.totals.outputs.total_issues != '0'
        run: |
          echo "::error::Found ${TOTAL} linting issues"
          exit 1
        env:
          TOTAL: ${{ steps.totals.outputs.total_issues }}
