name: Test AI Summary

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI provider to use for summary generation'
        required: true
        default: 'copilot'
        type: choice
        options:
          - copilot
          - claude
        #  - gemini
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test-ai-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download real scanner summaries
        uses: actions/download-artifact@v4
        with:
          pattern: scanner-summary-*
          path: /tmp/scanner-summaries
          merge-multiple: true
          run-id: 22650413724
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run AI Summary
        uses: ./.github/actions/ai-summary
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        with:
          provider: 'copilot'
          post_issue: 'true'
          post_pr_comment: 'false'
          fail_on_ai_error: 'false'
          skip_download: 'true'