      #- name: Upload mock summaries as artifacts
       # uses: actions/upload-artifact@v4
        #with:
         # name: scanner-summary-trivy
          #path: /tmp/mock-summaries/scanner-summary-trivy.md

      #- name: Upload mock gitleaks summary
       # uses: actions/upload-artifact@v4
        #with:
         # name: scanner-summary-gitleaks
          #path: /tmp/mock-summaries/scanner-summary-gitleaks.md

      - name: Download scanner summaries
        uses: actions/download-artifact@v4
        with:
          pattern: scanner-summary-*
          path: /tmp/scanner-summaries
          merge-multiple: true
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run AI Summary
        uses: ./.github/actions/ai-summary
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:            ${{ inputs.pr_number }}
          PR_URL:               https://github.com/${{ github.repository }}/pull/${{ inputs.pr_number }}
        with:
          provider: ${{ inputs.provider }}
          post_issue: 'true'
          post_pr_comment: 'false'
          fail_on_ai_error: 'true'

      - name: Verify summary generated
        shell: bash
        run: |
          echo "## AI Security Summary Results" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/ai-summary.md ]; then
            echo "✅ Summary generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Provider:** \`${{ inputs.provider }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**PR:** #${{ inputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
            echo "**Source run:** \`${{ steps.resolve.outputs.run_id }}\`" >> $GITHUB_STEP_SUMMARY
            LINES=$(wc -l < /tmp/ai-summary.md)
            echo "**Output size:** ${LINES} lines" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Summary file not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi