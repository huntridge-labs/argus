name: AI Security Summary

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI provider to use for summary generation'
        required: true
        default: 'copilot'
        type: choice
        options:
          - copilot
          - claude
          #  - gemini
      pr_number:
        description: 'PR number that has a completed security scan run'
        required: true
        type: string

  #pull_request:
  #  branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  ai-summary:
    name: AI Security Summary / ${{ inputs.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run ID from PR number
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Looking up latest completed test-actions.yml run for PR #${{ inputs.pr_number }}..."

          RUN_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/test-actions.yml/runs?event=pull_request&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.pull_requests[].number == ${{ inputs.pr_number }})] | first | .id")
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::error::No completed test-actions.yml run found for PR #${{ inputs.pr_number }}. Ensure the security scan workflow has run against this PR first."
            exit 1
          fi

          echo "Found run ID: "$RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      #- name: Create mock scanner summaries
      #  run: |
       #   mkdir -p /tmp/mock-summaries

        #  cat > /tmp/mock-summaries/scanner-summary-trivy.md << 'EOF'
