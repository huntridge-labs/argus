# Gitleaks Secrets Scanner - Reusable Workflow
#
# Runs the Gitleaks scanner via the argus Python CLI.
# Equivalent to: python -m argus scan gitleaks
#
# Note: Uses fetch-depth: 0 for full git history scanning.
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/sast-only.yml

name: Gitleaks Secrets Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if secrets are found. Gitleaks does not support severity-based filtering - any value other than "none" will fail if secrets are detected.'
        required: false
        type: string
        default: 'none'
      gitleaks_enable_comments:
        description: 'Enable GitLeaks inline PR comments (requires GITLEAKS_LICENSE)'
        required: false
        type: boolean
        default: true
      gitleaks_notify_user_list:
        description: 'Comma-separated list of GitHub usernames to notify on secret detection (e.g., "@user1,@user2")'
        required: false
        type: string
        default: ''
      gitleaks_enable_summary:
        description: 'Enable GitLeaks job summary'
        required: false
        type: boolean
        default: true
      gitleaks_enable_upload_artifact:
        description: 'Enable uploading SARIF artifact when secrets are detected'
        required: false
        type: boolean
        default: true
      gitleaks_config:
        description: 'Path to a gitleaks configuration file (e.g., "path/to/gitleaks.toml")'
        required: false
        type: string
        default: ''
    secrets:
      GITLEAKS_LICENSE:
        description: 'License key for GitLeaks scans within a Github Organization. Obtain from https://gitleaks.io'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  secrets-detection:
    name: Secrets Detection - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for gitleaks

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.11.0

      - name: Run scan
        run: |
          python -m argus scan gitleaks \
            --path "$SCAN_PATH" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json --format markdown \
            --output-dir ./argus-results \
            --verbose
        env:
          SCAN_PATH: '.'
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}
          GITLEAKS_CONFIG: ${{ inputs.gitleaks_config }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload artifacts
        if: always() && inputs.gitleaks_enable_upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-reports
          path: ./argus-results/
          retention-days: 30

      - name: Build scanner summary
        if: always()
        run: |
          mkdir -p scanner-summaries
          {
            echo "<details><summary>🔑 Gitleaks (Secrets)</summary>"
            echo ""
            if [ -f ./argus-results/argus-summary.md ]; then
              cat ./argus-results/argus-summary.md
            else
              echo "_No 🔑 Gitleaks (Secrets) findings summary was produced._"
            fi
            echo ""
            echo "</details>"
          } > scanner-summaries/gitleaks.md

      - name: Upload scanner summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-summary-gitleaks
          path: scanner-summaries/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.11.0
        with:
          summary_file: ./argus-results/argus-summary.md
          comment_marker: gitleaks-scanner-comment-marker
          title: 'Gitleaks Secrets Detection Results'
          fallback_message: 'No Gitleaks results available'
