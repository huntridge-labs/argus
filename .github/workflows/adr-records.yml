name: ADR Records

# Checks issue-keyed ADRs (ADR-483). See AGENTS.md, "Issues, branches, and
# records". No paths: filter on purpose: the job gates itself with a job-level
# `if`, so it always reports a status and can be a required check (a skipped
# job counts as passing; a check that never starts stays pending).
#
# Fork PRs: `pull_request` runs with a read-only token and no secrets, which
# is all this needs. The head branch name comes from the fork and is only
# passed through an environment variable, never interpolated into a script.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  adr-records:
    name: ADR Records
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # On pull_request this is the merge commit; HEAD^1 is the base.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'

      - name: Install Python dependencies
        # Runtime deps only, exactly as uv.lock pins them (the checker needs PyYAML).
        run: UV_PROJECT_ENVIRONMENT="$pythonLocation" uv sync --locked --no-dev --no-install-project --inexact

      - name: Check ADR records
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python -m scripts.ci.adr_records check --branch="$HEAD_REF" --base=HEAD^1
          else
            python -m scripts.ci.adr_records check
          fi
