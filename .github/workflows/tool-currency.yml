# Weekly backstop for scanner pin staleness.
#
# Renovate is the primary path and stays so. This exists because Renovate can
# know about an update and still not land it: osv-scanner sat 46 days behind
# and tflint 17 days behind while both appeared on the Dependency Dashboard and
# the container-images group merged three times in between. Nothing in the repo
# noticed until someone asked.
#
# Deliberately reports instead of failing. A tool releasing upstream is not a
# defect in our code, and hard-failing on it would redden main for reasons no
# commit caused. The report lands in a single reused issue so it is visible
# without adding noise.

name: Tool Currency

on:
  schedule:
    # Wednesday morning: after Renovate's weekday runs have had several
    # chances, so anything still listed here is genuinely stuck.
    - cron: '0 13 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tool-currency
  cancel-in-progress: false

jobs:
  report:
    name: Report stale scanner pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Compare pins against adoptable upstream releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/ci/check_tool_currency.py --format=markdown > report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert the report issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = 'Scanner pin currency report';
            const clean = body.includes('Nothing to do');

            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'dependencies' }
            );
            const issue = existing.find(i => i.title === title);

            const footer = [
              '',
              '---',
              '',
              'Renovate is the primary update path; this is a backstop for updates it',
              'knows about but has not landed. Pins listed here have already cleared the',
              '7-day minimum release age, so they are safe to adopt now.',
              '',
              `Generated by \`tool-currency.yml\` (run ${context.runId}).`,
            ].join('\n');

            if (clean) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'Every tracked pin is current. Closing.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
              }
              core.info('All pins current.');
              return;
            }

            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: body + footer,
              });
              core.info(`Updated issue #${issue.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: body + footer, labels: ['dependencies', 'automated'],
              });
              core.info(`Opened issue #${created.data.number}.`);
            }
