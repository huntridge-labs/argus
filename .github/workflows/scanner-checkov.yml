# Checkov IaC Scanner - Reusable Workflow
#
# Runs the Checkov scanner via the argus Python CLI.
# Equivalent to: python -m argus scan checkov
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/infrastructure-scanning.yml

name: Checkov Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      iac_path:
        description: 'Relative path to the infrastructure-as-code directory to scan'
        required: false
        type: string
        default: 'infrastructure'
      framework:
        description: 'IaC framework to scan (terraform, cloudformation, kubernetes, etc.)'
        required: false
        type: string
        default: 'terraform'
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if any check fails. Checkov does not support severity-based filtering - any value other than "none" will fail on any failed check.'
        required: false
        type: string
        default: 'none'
    secrets:
      BC_API_KEY:
        description: 'Prisma Cloud API key for enhanced severity scoring and features'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  checkov-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.9.1

      - name: Run scan
        run: |
          python -m argus scan checkov \
            --path "$SCAN_PATH" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json --format markdown \
            --output-dir ./argus-results \
            --verbose
        env:
          SCAN_PATH: ${{ inputs.iac_path || 'infrastructure' }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}
          CHECKOV_FRAMEWORK: ${{ inputs.framework || 'terraform' }}
          BC_API_KEY: ${{ secrets.BC_API_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkov-reports
          path: ./argus-results/
          retention-days: 30

      - name: Build scanner summary
        if: always()
        run: |
          mkdir -p scanner-summaries
          {
            echo "<details><summary>🏗️ Checkov (IaC)</summary>"
            echo ""
            if [ -f ./argus-results/argus-summary.md ]; then
              cat ./argus-results/argus-summary.md
            else
              echo "_No 🏗️ Checkov (IaC) findings summary was produced._"
            fi
            echo ""
            echo "</details>"
          } > scanner-summaries/checkov.md

      - name: Upload scanner summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-summary-checkov
          path: scanner-summaries/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.9.1
        with:
          summary_file: ./argus-results/argus-summary.md
          comment_marker: checkov-scanner-comment-marker
          title: 'Checkov IaC Security Results'
          fallback_message: 'No Checkov results available'
