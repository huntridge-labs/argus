name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    # Run on PRs to any branch

permissions:
  contents: read

jobs:
  unit-tests:
    name: All Unit Tests
    runs-on: ubuntu-latest

    steps:

      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-deadfixtures

      - name: Run all tests
        run: pytest

      - name: Check for dead fixtures
        if: always()
        run: |
          pip install pytest-deadfixtures
          python -m pytest --dead-fixtures --no-cov -q 2>&1 || true

      - name: Coverage Report Summary
        if: always()
        run: |
          {
            echo "## Coverage Report"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/python.lcov ]; then
            {
              echo "### Python Coverage"
              echo "\`\`\`"
              head -20 coverage/python.lcov || true
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test Summary
        if: always()
        run: |
          {
            echo "## Unit Test Results"
            echo ""
            echo "✅ All tests completed!"
            echo ""
            echo "**Test Coverage:**"
            echo "- Python tests (utilities, ClamAV & docsite)"
            echo "- Action schema validation"
            echo ""
            echo "See detailed coverage reports in artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-reports
          path: |
            coverage/
            htmlcov/
          retention-days: 30
