name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    # Run on PRs to any branch

permissions:
  contents: read

jobs:
  unit-tests:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install the package itself with every optional extra so all
          # test modules can actually run. Tests for optional features
          # (argus view terminal / argus view browser / MCP server / AI classifier)
          # guard their imports with pytest.importorskip or module-level
          # stubs — without the extras those tests either skip or run
          # against fake stubs, and codecov's patch metric flags the
          # unexercised test bodies as missing coverage. Installing
          # [all] runs the real tests against the real code paths.
          pip install -e '.[all]'
          pip install pytest-deadfixtures

      - name: Build MUMPS tree-sitter grammar
        # Compiles janus-llm/tree-sitter-mumps at the pinned SHA into
        # ~/.cache/argus/grammars/mumps.so so the M scanner's per-rule
        # integration tests in argus/tests/scanners/test_mumps_rules.py can
        # actually run instead of skip. The script is idempotent and
        # the compile takes ~15s on ubuntu-latest.
        run: scripts/build-mumps-grammar.sh

      - name: Run all tests
        # ARGUS_MUMPS_GRAMMAR is unset on purpose: parser.py probes
        # ~/.cache/argus/grammars/mumps.so by default and the build
        # step writes there. Setting an explicit path here would
        # diverge from the default lookup, which is the path users
        # without an env var actually take.
        run: pytest

      - name: Run E2E tests (slow, Docker-dependent)
        if: matrix.python-version == '3.13'
        # Container-invocation smoke (test_container_smoke.py) is excluded
        # here — it has a dedicated, blocking, changed-scanner-scoped job
        # (container-smoke.yml). Running it here too would re-pull every
        # scanner image unscoped and swallow failures behind `|| true`.
        # The remaining slow docker-integration tests stay non-blocking for
        # now; de-`|| true`-ing them is a separate follow-up (needs flake
        # hardening + the git-config-isolation fix).
        run: pytest -m slow --no-cov -q --ignore=argus/tests/test_container_smoke.py || true

      - name: Check version reference coverage
        if: matrix.python-version == '3.13'
        run: python -m scripts.ci.check_version_refs

      - name: Check CLI docs are up to date
        if: matrix.python-version == '3.13'
        run: python -m scripts.ci.check_cli_docs

      - name: Check container image manifests
        if: matrix.python-version == '3.13'
        run: python -m scripts.ci.check_container_images

      - name: Check .ai/ files are in sync with the SDK
        if: matrix.python-version == '3.13'
        run: python -m scripts.ci.check_architecture_sync

      - name: Check for dead fixtures
        if: always()
        run: |
          pip install pytest-deadfixtures
          python -m pytest --dead-fixtures --no-cov -q 2>&1 || true

      - name: Coverage Report Summary
        if: always()
        run: |
          {
            echo "## Coverage Report"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/python.lcov ]; then
            {
              echo "### Python Coverage"
              echo "\`\`\`"
              head -20 coverage/python.lcov || true
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test Summary
        if: always()
        run: |
          {
            echo "## Unit Test Results"
            echo ""
            echo "✅ All tests completed!"
            echo ""
            echo "**Test Coverage:**"
            echo "- Python tests (utilities, ClamAV & docsite)"
            echo "- Action schema validation"
            echo ""
            echo "See detailed coverage reports in artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage/python.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports-py${{ matrix.python-version }}
          path: |
            coverage/
            htmlcov/
          retention-days: 30
