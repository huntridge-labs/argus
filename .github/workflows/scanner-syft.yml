# Syft SBOM Generator - Reusable Workflow
#
# NOTE: Syft SBOM generation is not yet supported by the argus CLI.
# This workflow keeps the composite action call until argus supports SBOM natively.
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/container-scanning.yml

name: Generate SBOM

on:
  workflow_dispatch:
    inputs:
      scan_path:
        description: 'Directory or file path to scan'
        required: false
        type: string
        default: '.'
      scan_image:
        description: 'Container image to scan (e.g., nginx:latest, ghcr.io/owner/image:tag)'
        required: false
        type: string
        default: ''
      registry_username:
        description: 'Username for registry authentication (leave empty for public images)'
        required: false
        type: string
        default: ''
      output_format:
        description: 'SBOM output format: cyclonedx-json, spdx-json, syft-json, or table'
        required: false
        type: string
        default: 'cyclonedx-json'
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      scan_path:
        description: 'Directory or file path to scan'
        required: false
        type: string
        default: '.'
      scan_image:
        description: 'Container image to scan (e.g., nginx:latest, ghcr.io/owner/image:tag)'
        required: false
        type: string
        default: ''
      registry_username:
        description: 'Username for registry authentication (leave empty for public images)'
        required: false
        type: string
        default: ''
      output_format:
        description: 'SBOM output format: cyclonedx-json, spdx-json, syft-json, or table'
        required: false
        type: string
        default: 'cyclonedx-json'
    secrets:
      registry_password:
        description: 'Password/token for registry authentication'
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  packages: read

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run Syft SBOM Generator
        uses: huntridge-labs/argus/.github/actions/scanner-syft@1.10.0
        with:
          scan_path: ${{ inputs.scan_path }}
          scan_image: ${{ inputs.scan_image }}
          output_format: ${{ inputs.output_format }}
          registry_username: ${{ inputs.registry_username }}
          registry_password: ${{ secrets.registry_password }}
          post_pr_comment: false
          enable_code_security: ${{ inputs.enable_code_security }}
