name: Test Argus CLI

# Integration test for the argus Python CLI.
# Validates that `argus scan` works end-to-end.
# The engine handles tool execution — no manual tool installs here.

on:
  pull_request:
    paths:
      - 'argus/**'
      - 'argus.yml'
      - '.github/workflows/security-scan.yml'
      - '.github/workflows/test-reusable-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: test-argus-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-argus-cli:
    name: Argus CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Argus
        run: |
          pip install --quiet pyyaml
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test --version
        run: python -m argus scan --version 2>&1 || true

      - name: Test --list
        run: python -m argus scan --list

      - name: Test scan with config
        run: |
          python -m argus scan \
            --config argus.yml \
            --format terminal \
            --format sarif \
            --format json \
            --verbose || true

      - name: Verify outputs exist
        run: |
          echo "Checking output files..."
          for f in argus-results/argus-results.json argus-results/argus-results.sarif; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f (expected if no scanners available locally or via Docker)"
            fi
          done

      - name: Verify SARIF structure if produced
        run: |
          if [ -f "argus-results/argus-results.sarif" ]; then
            python3 -c "
          import json
          data = json.load(open('argus-results/argus-results.sarif'))
          assert data.get('version') == '2.1.0', 'Bad SARIF version'
          assert 'runs' in data, 'Missing runs'
          print('SARIF valid:', len(data['runs']), 'run(s)')
          "
          fi

  test-results:
    name: CLI Test Results
    if: always()
    needs: [test-argus-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULT: ${{ needs.test-argus-cli.result }}
        run: |
          if [ "$RESULT" = "failure" ]; then
            echo "Argus CLI integration tests failed"
            exit 1
          fi
