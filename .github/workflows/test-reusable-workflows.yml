name: Test Argus SDK Integration

# Integration test for the argus Python SDK.
# Validates that `argus scan` works end-to-end with real scanners.
# Complements test-unit.yml (unit tests) and test-actions.yml (composite actions).

on:
  pull_request:
    paths:
      - 'argus/**'
      - 'argus.yml'
      - '.github/workflows/security-scan.yml'
      - '.github/workflows/test-reusable-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: test-argus-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-argus-scan:
    name: Argus SDK / scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Argus SDK
        run: |
          pip install --quiet pyyaml
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install bandit
        run: pip install --quiet 'bandit[toml,sarif]>=1.7.5'

      - name: Test scanner listing
        run: |
          python -m argus scan --list

      - name: Test single scanner scan
        run: |
          python -m argus scan bandit \
            --path . \
            --format terminal \
            --format json \
            --output-dir ./test-results \
            --verbose || true
          test -f test-results/argus-results.json

      - name: Test config-driven scan
        run: |
          python -m argus scan \
            --config argus.yml \
            --format sarif \
            --output-dir ./config-results \
            --verbose || true
          test -f config-results/argus-results.sarif

      - name: Verify SARIF structure
        run: |
          python3 -c "
          import json
          data = json.load(open('config-results/argus-results.sarif'))
          assert data.get('version') == '2.1.0', 'Bad SARIF version'
          assert 'runs' in data, 'Missing runs'
          print('SARIF valid:', len(data['runs']), 'run(s)')
          "

  test-results:
    name: SDK Test Results
    if: always()
    needs: [test-argus-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULT: ${{ needs.test-argus-scan.result }}
        run: |
          if [ "$RESULT" = "failure" ]; then
            echo "Argus SDK integration tests failed"
            exit 1
          fi
