name: Test Argus CLI

# Integration test for the argus Python CLI.
# Builds custom container images from the branch, then validates
# that argus scan works end-to-end with real scanner execution.
# Failures here MUST block merge.

on:
  pull_request:
    paths:
      - 'argus/**'
      - 'argus.yml'
      - 'docker/**'
      - '.github/workflows/security-scan.yml'
      - '.github/workflows/test-reusable-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: test-argus-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-argus-cli:
    name: Argus CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Argus
        run: |
          pip install --quiet pyyaml
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # Build custom images so all scanners can execute
      - name: Build custom scanner images
        run: |
          for pair in \
            "scanner-bandit:docker/Dockerfile.bandit" \
            "scanner-opengrep:docker/Dockerfile.opengrep" \
            "scanner-supply-chain:docker/Dockerfile.supply-chain"; do
            IMAGE="${pair%%:*}"
            DOCKERFILE="${pair#*:}"
            TAG="ghcr.io/huntridge-labs/argus/${IMAGE}:1.0.0"
            docker build --quiet --tag "${TAG}" --file "${DOCKERFILE}" .
          done

      - name: Test scanner listing
        run: |
          OUTPUT=$(python -m argus scan --list)
          echo "$OUTPUT"
          # Verify all 10 scanners are registered
          for scanner in bandit clamav trivy-iac gitleaks osv checkov opengrep supply-chain zap container; do
            echo "$OUTPUT" | grep -q "$scanner" || { echo "FAIL: $scanner not listed"; exit 1; }
          done

      - name: Test scan produces output
        run: |
          set +e
          python -m argus scan \
            --config argus.yml \
            --format terminal \
            --format sarif \
            --format json \
            --output-dir ./cli-test-results \
            --verbose
          EXIT_CODE=$?
          set -e

          # Exit 0 = pass, 1 = findings above threshold (expected), 2 = error
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "::error::Argus scan failed with error (exit code 2)"
            exit 2
          fi
          echo "Scan completed with exit code $EXIT_CODE"

      - name: Verify output files exist
        run: |
          for f in cli-test-results/argus-results.json cli-test-results/argus-results.sarif; do
            test -f "$f" || { echo "FAIL: $f not produced"; exit 1; }
          done

      - name: Verify SARIF structure
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('cli-test-results/argus-results.sarif'))
          assert data.get('version') == '2.1.0', f'Bad SARIF version: {data.get(\"version\")}'
          assert 'runs' in data, 'Missing runs in SARIF'
          print(f'SARIF valid: {len(data[\"runs\"])} run(s)')
          "

      - name: Verify JSON structure
        run: |
          python3 -c "
          import json
          data = json.load(open('cli-test-results/argus-results.json'))
          results = data.get('results', [])
          assert len(results) > 0, 'No scanner results produced'
          scanners = [r['scanner'] for r in results]
          print(f'Scanners executed: {scanners}')
          total = sum(len(r.get('findings', [])) for r in results)
          print(f'Total findings: {total}')
          "

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: argus-cli-test-results
          path: cli-test-results/
          retention-days: 7

  test-results:
    name: CLI Test Results
    if: always()
    needs: [test-argus-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULT: ${{ needs.test-argus-cli.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Argus CLI integration tests failed: $RESULT"
            exit 1
          fi
