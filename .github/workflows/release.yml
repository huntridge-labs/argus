name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Type of release (patch, minor, major, prerelease)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease
      dryRun:
        description: 'Dry run (preview only, no actual release)'
        required: false
        default: true
        type: boolean

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/releases/latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun != 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: npm test

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Release (Auto)
        if: github.event_name == 'push' || github.event.inputs.releaseType == 'auto'
        run: npm run release:ci
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HUSKY: 0

      - name: Release (Specific Type)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.releaseType != 'auto'
        run: npm run release:ci -- "$RELEASE_TYPE"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HUSKY: 0
          RELEASE_TYPE: ${{ github.event.inputs.releaseType }}

  dry-run:
    name: Release Preview (Dry Run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: npm test

      - name: Release Preview
        run: |
          # Run release-it dry run to see what would be released
          echo "Running release-it dry run..."
          echo "Note: A post-processed changelog with categorization will be shown after the dry run output."
          echo ""
          npm run release:dry 2>&1 | tee release_dry_output.txt

          # Extract and process the changelog section to show categorized version
          if grep -q "Changelog:" release_dry_output.txt; then
            echo ""
            echo "============================================"
            echo "📋 PROCESSED CHANGELOG (with categorization)"
            echo "============================================"
            echo "The actual CHANGELOG.md will be modified using scripts/release-it-process-changelog.js as shown below:"
            echo ""

            # Extract raw changelog
            sed -n '/^Changelog:/,/^Updating version/p' release_dry_output.txt | sed '1d;$d' | sed 's/^//' > changelog_preview.md

            # Create temp file for processing
            echo "# Temp Changelog" > temp_preview.md
            echo "" >> temp_preview.md
            cat changelog_preview.md >> temp_preview.md

            # Process with our script
            node scripts/release-it-process-changelog.js temp_preview.md

            # Show processed changelog
            tail -n +3 temp_preview.md
            echo "============================================"
          fi
        env:
          HUSKY: 0

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.result == 'success'
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build pyyaml
          python -m build

      - name: Safety check
        run: python -m scripts.ci.check_package

      - name: Smoke test
        run: |
          pip install dist/*.whl
          argus --version
          argus scan --list

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b54a53e2c3f5f0e6f5708353 # v1.12.4

  publish-containers:
    name: Publish Container Images
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.result == 'success'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write  # For cosign signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          persist-credentials: false

      - name: Get release version
        id: version
        run: |
          VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('version.yaml'))['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push images
        run: |
          for pair in \
            "scanner-bandit:docker/Dockerfile.bandit" \
            "scanner-opengrep:docker/Dockerfile.opengrep" \
            "scanner-supply-chain:docker/Dockerfile.supply-chain" \
            "cli:docker/Dockerfile.cli"; do
            IMAGE="${pair%%:*}"
            DOCKERFILE="${pair#*:}"
            FULL_TAG="${IMAGE_REGISTRY}/${IMAGE}"

            docker buildx build \
              --push \
              --platform linux/amd64 \
              --tag "${FULL_TAG}:${VERSION}" \
              --tag "${FULL_TAG}:latest" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --file "${DOCKERFILE}" \
              .

            echo "Pushed ${FULL_TAG}:${VERSION} and ${FULL_TAG}:latest"
          done
        env:
          IMAGE_REGISTRY: ghcr.io/huntridge-labs/argus
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3
        continue-on-error: true

      - name: Sign images with cosign
        if: steps.version.outputs.version != ''
        run: |
          for IMAGE in scanner-bandit scanner-opengrep scanner-supply-chain cli; do
            FULL_TAG="${IMAGE_REGISTRY}/${IMAGE}"

            # Sign the versioned tag
            cosign sign --yes "${FULL_TAG}:${VERSION}" 2>/dev/null || \
              echo "Warning: cosign signing failed for ${FULL_TAG}:${VERSION} (non-fatal)"

            # Sign the latest tag
            cosign sign --yes "${FULL_TAG}:latest" 2>/dev/null || \
              echo "Warning: cosign signing failed for ${FULL_TAG}:latest (non-fatal)"
          done
        env:
          IMAGE_REGISTRY: ghcr.io/huntridge-labs/argus
          VERSION: ${{ steps.version.outputs.version }}
        continue-on-error: true

      - name: Post publish summary
        run: |
          {
            echo "## Container Images Published"
            echo ""
            echo "Version: \`${VERSION}\`"
            echo ""
            echo "| Image | Tags |"
            echo "|-------|------|"
            for IMAGE in scanner-bandit scanner-opengrep scanner-supply-chain cli; do
              echo "| \`${IMAGE_REGISTRY}/${IMAGE}\` | \`${VERSION}\`, \`latest\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_REGISTRY: ghcr.io/huntridge-labs/argus
          VERSION: ${{ steps.version.outputs.version }}
