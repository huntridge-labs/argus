# Build-once-promote-everywhere release pipeline.
#
# A single ``release`` job owns the whole lifecycle so failure semantics
# are unambiguous (a container build failure stops everything before any
# state is published) and orchestration stays in one place. The
# ``dry-run`` job runs in parallel for previews.
#
# Step order inside ``release``:
#
#   1. Tests
#   2. Build 5 multi-arch images, push to GHCR under ``build-<sha>-<run>``
#      → capture ``sha256:`` index digests in $GITHUB_ENV
#   3. syft SBOM per image per platform + an index BOM, each signed as a
#      GitHub artifact attestation, uploaded as ``image-sboms-<sha12>``
#      (ADR-489)
#   4. release-it bumps versions / regenerates changelog / commits / tags
#      and creates the GitHub release as a DRAFT
#      → ``after:bump`` hook pins ``<version>@sha256:<digest>`` into
#         ``argus/containers.py`` using the digests from step 2
#   5. (if release cut) Re-tag images :``<version>`` + :latest (manifest-only)
#   6. (if release cut) cosign-sign images by digest
#   7. (if release cut) Attach the step 3 SBOMs + bundles to the draft
#   8. (if release cut) Build wheel from now-bumped state, smoke test,
#      publish to PyPI via OIDC
#   9. (if release cut) Publish the draft release
#  10. (if release cut) Write summary
#
# The release is a draft until step 9 because the repo has immutable
# releases on: once published, GitHub refuses new assets (HTTP 422), so
# the SBOMs have to go up first. Publishing last also means a failed run
# leaves a draft to fix, never a locked, half-finished release.
#
# Order rationale: containers + signatures must exist before the wheel
# lands on PyPI so a user running ``pip install`` never gets a wheel
# pointing at unsigned or non-existent images.
#
# Orphan ``build-<sha>`` tags from runs that didn't cut a release age out
# via ``.github/workflows/ghcr-prune.yml`` (14-day grace, keeps semver +
# ``latest`` forever).

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Type of release (auto, patch, minor, major, prerelease)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease
      preReleaseId:
        description: 'Pre-release id (e.g. rc, beta). Combines with releaseType — e.g. major + rc → 1.0.0-rc.0.'
        required: false
        default: ''
        type: string
      dryRun:
        description: 'Dry run (preview only, no actual release)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # ── Dry-run preview ─────────────────────────────────────────────────
  # Runs in parallel with the real pipeline so every push to main shows
  # what release-it would produce. No side effects — pure preview.
  dry-run:
    name: Release Preview (Dry Run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          # No dependency cache in a publishing workflow (cache poisoning).
          enable-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        # ``.[all]`` pulls in every optional extra (ai, completion, mcp,
        # terminal, browser) so pytest can collect tests that import
        # optional packages (textual, fastapi, mcp, etc.) at module top.
        # Without this, test collection fails before release-it ever
        # runs its dry-run. Versions come from uv.lock (ADR-043), installed
        # into the setup-python interpreter so release-it's python3 hooks
        # see them; --locked fails on a stale lock.
        run: UV_PROJECT_ENVIRONMENT="$pythonLocation" uv sync --locked --all-extras --inexact

      - name: Run tests
        run: pnpm test

      - name: Release Preview
        run: |
          echo "Running release-it dry run..."
          echo "Note: A post-processed changelog with categorization will be shown after the dry run output."
          echo ""
          pnpm run release:dry 2>&1 | tee release_dry_output.txt

          if grep -q "Changelog:" release_dry_output.txt; then
            echo ""
            echo "============================================"
            echo "PROCESSED CHANGELOG (with categorization)"
            echo "============================================"
            echo "The actual CHANGELOG.md will be modified using scripts/release-it-process-changelog.js as shown below:"
            echo ""
            sed -n '/^Changelog:/,/^Updating version/p' release_dry_output.txt | sed '1d;$d' | sed 's/^//' > changelog_preview.md
            echo "# Temp Changelog" > temp_preview.md
            echo "" >> temp_preview.md
            cat changelog_preview.md >> temp_preview.md
            node scripts/release-it-process-changelog.js temp_preview.md
            tail -n +3 temp_preview.md
            echo "============================================"
          fi
        env:
          HUSKY: 0

  # ── Release (build → bump → sign → publish, all in one job) ─────────
  # Containers are built as a step inside this job — if the build fails,
  # release-it never runs and nothing gets published. The build pushes
  # to a throwaway ``:build-<sha>-<run>`` tag; promotion to ``:<VERSION>``
  # and ``:latest`` happens after release-it determines the version.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/releases/latest
    permissions:
      contents: write       # release-it commits, tags, pushes
      issues: write         # release-it creates GitHub release
      pull-requests: write
      packages: write       # buildx push + imagetools create on GHCR
      id-token: write       # cosign keyless signing + SBOM attestations + PyPI OIDC trusted publish
      attestations: write   # actions/attest stores the SBOM attestations (ADR-489)
    # Manual-only. Pushes to main no longer auto-trigger a publishing
    # release (that queued a prod-gated run per merge that had to be
    # cancelled). Cut releases deliberately via the Actions "Run workflow"
    # button — weekly cadence, or ad-hoc for hotfixes. The dry-run preview
    # below still runs on every push for visibility.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun != 'true'

    env:
      IMAGE_REGISTRY: ghcr.io/huntridge-labs/argus

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          # No dependency cache in a publishing workflow (cache poisoning).
          enable-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        # ``.[all]`` pulls in every optional extra (ai, completion, mcp,
        # terminal, browser) so pytest can collect tests that import
        # optional packages (textual, fastapi, mcp, etc.) at module top.
        # Versions come from uv.lock (ADR-043), installed into the
        # setup-python interpreter so release-it's python3 hooks and the
        # later build / smoke steps share it; --locked fails on a stale lock.
        run: UV_PROJECT_ENVIRONMENT="$pythonLocation" uv sync --locked --all-extras --inexact

      - name: Run tests
        run: pnpm test

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push containers (build-id tag)
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUILD_TAG="build-${COMMIT_SHA:0:12}-${RUN_ID}"
          echo "BUILD_TAG=${BUILD_TAG}" >> "$GITHUB_ENV"
          echo "Build tag: ${BUILD_TAG}"

          # Image short-name : Dockerfile : env-key. The env-key is the
          # uppercase suffix used by both:
          #   - the release-it after:bump hook (ARGUS_DIGEST_<KEY>)
          #   - the cosign signing step (<KEY>_DIGEST)
          IMAGES=(
            "scanner-bandit:docker/Dockerfile.bandit:SCANNER_BANDIT"
            "scanner-opengrep:docker/Dockerfile.opengrep:SCANNER_OPENGREP"
            "scanner-supply-chain:docker/Dockerfile.supply-chain:SCANNER_SUPPLY_CHAIN"
            "cli:docker/Dockerfile.cli:CLI"
            "scanner-mumps:docker/Dockerfile.mumps:SCANNER_MUMPS"
          )

          # Single source of truth: export the bare image names so the
          # promote / cosign / release-notes steps below all iterate the
          # SAME set as the build. Adding a scanner to IMAGES now
          # propagates everywhere — previously those steps carried their
          # own hardcoded lists, and a missing entry shipped a release
          # with an unpromoted image (scanner-mumps had no :VERSION tag,
          # breaking its pin in argus/containers.py).
          IMAGE_NAMES=""
          for entry in "${IMAGES[@]}"; do
            IFS=':' read -r NAME _ _ <<< "$entry"
            IMAGE_NAMES="${IMAGE_NAMES:+${IMAGE_NAMES} }${NAME}"
          done
          echo "IMAGE_NAMES=${IMAGE_NAMES}" >> "$GITHUB_ENV"

          for entry in "${IMAGES[@]}"; do
            IFS=':' read -r IMAGE DOCKERFILE KEY <<< "$entry"
            FULL_REF="${IMAGE_REGISTRY}/${IMAGE}:${BUILD_TAG}"
            META_FILE="/tmp/${KEY}.metadata.json"

            echo "::group::Building ${IMAGE}"
            docker buildx build \
              --push \
              --platform linux/amd64,linux/arm64 \
              --tag "${FULL_REF}" \
              --metadata-file "${META_FILE}" \
              --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${REPO}" \
              --file "${DOCKERFILE}" \
              .

            DIGEST=$(jq -r '."containerimage.digest"' "${META_FILE}")
            if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
              echo "::error::No digest produced for ${IMAGE}"
              exit 1
            fi
            # ARGUS_DIGEST_<KEY> is consumed by the release-it after:bump
            # hook (scripts/release_it/inject_image_digests.py). <KEY>_DIGEST
            # is used by the cosign step below.
            echo "ARGUS_DIGEST_${KEY}=${DIGEST}" >> "$GITHUB_ENV"
            echo "${KEY}_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
            echo "Built ${FULL_REF} (${DIGEST})"
            echo "::endgroup::"
          done

      # ── Image SBOMs (ADR-489) ────────────────────────────────────────
      # Every image gets three signed CycloneDX documents: one syft SBOM
      # per platform (subject = that platform's manifest digest) and a
      # small index BOM (subject = the index digest, which is what a tag
      # resolves to and what argus/containers.py pins). syft runs from its
      # digest pin in argus/containers.py and reads the PUSHED image from
      # the registry by digest, never a daemon copy. These steps sit before
      # release-it with no continue-on-error: an SBOM or attestation
      # failure stops the job before any version, tag or release exists.
      - name: Generate image SBOMs
        env:
          COMMIT_SHA: ${{ github.sha }}
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SBOM_SHA12="${COMMIT_SHA:0:12}"
          # Outside the checkout on purpose: release-it's before:release
          # hook runs `git add .`, which would commit files left in it.
          SBOM_DIR="${RUNNER_TEMP}/image-sboms"
          echo "SBOM_SHA12=${SBOM_SHA12}" >> "$GITHUB_ENV"
          echo "SBOM_DIR=${SBOM_DIR}" >> "$GITHUB_ENV"
          IMAGE_ARGS=()
          for IMAGE in ${IMAGE_NAMES}; do
            KEY=$(echo "${IMAGE}" | tr 'a-z-' 'A-Z_')
            DIGEST_VAR="${KEY}_DIGEST"
            IMAGE_ARGS+=(--image "${IMAGE}@${!DIGEST_VAR}")
          done
          # Writes the SBOMs plus image-sboms-<sha12>.json, and exports
          # SBOM_<KEY>_<VARIANT>_DIGEST / _PATH for the attest steps below.
          python -m scripts.ci.image_sboms generate \
            --registry "${IMAGE_REGISTRY}" \
            --sha12 "${SBOM_SHA12}" \
            --out-dir "${SBOM_DIR}" \
            "${IMAGE_ARGS[@]}"

      # One actions/attest call per SBOM (the action signs one predicate
      # per call). Step ids are attest-<image>-<variant>; the collect step
      # finds the bundles by those ids, and
      # tests/unit/test_image_sboms.py fails if this list drifts from
      # the IMAGES array above.
      - name: Attest SBOM (scanner-bandit, linux/amd64)
        id: attest-scanner-bandit-linux-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-bandit
          subject-digest: ${{ env.SBOM_SCANNER_BANDIT_LINUX_AMD64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_BANDIT_LINUX_AMD64_PATH }}

      - name: Attest SBOM (scanner-bandit, linux/arm64)
        id: attest-scanner-bandit-linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-bandit
          subject-digest: ${{ env.SBOM_SCANNER_BANDIT_LINUX_ARM64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_BANDIT_LINUX_ARM64_PATH }}

      - name: Attest SBOM (scanner-bandit, index)
        id: attest-scanner-bandit-index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-bandit
          subject-digest: ${{ env.SBOM_SCANNER_BANDIT_INDEX_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_BANDIT_INDEX_PATH }}

      - name: Attest SBOM (scanner-opengrep, linux/amd64)
        id: attest-scanner-opengrep-linux-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-opengrep
          subject-digest: ${{ env.SBOM_SCANNER_OPENGREP_LINUX_AMD64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_OPENGREP_LINUX_AMD64_PATH }}

      - name: Attest SBOM (scanner-opengrep, linux/arm64)
        id: attest-scanner-opengrep-linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-opengrep
          subject-digest: ${{ env.SBOM_SCANNER_OPENGREP_LINUX_ARM64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_OPENGREP_LINUX_ARM64_PATH }}

      - name: Attest SBOM (scanner-opengrep, index)
        id: attest-scanner-opengrep-index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-opengrep
          subject-digest: ${{ env.SBOM_SCANNER_OPENGREP_INDEX_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_OPENGREP_INDEX_PATH }}

      - name: Attest SBOM (scanner-supply-chain, linux/amd64)
        id: attest-scanner-supply-chain-linux-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-supply-chain
          subject-digest: ${{ env.SBOM_SCANNER_SUPPLY_CHAIN_LINUX_AMD64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_SUPPLY_CHAIN_LINUX_AMD64_PATH }}

      - name: Attest SBOM (scanner-supply-chain, linux/arm64)
        id: attest-scanner-supply-chain-linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-supply-chain
          subject-digest: ${{ env.SBOM_SCANNER_SUPPLY_CHAIN_LINUX_ARM64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_SUPPLY_CHAIN_LINUX_ARM64_PATH }}

      - name: Attest SBOM (scanner-supply-chain, index)
        id: attest-scanner-supply-chain-index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-supply-chain
          subject-digest: ${{ env.SBOM_SCANNER_SUPPLY_CHAIN_INDEX_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_SUPPLY_CHAIN_INDEX_PATH }}

      - name: Attest SBOM (cli, linux/amd64)
        id: attest-cli-linux-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/cli
          subject-digest: ${{ env.SBOM_CLI_LINUX_AMD64_DIGEST }}
          sbom-path: ${{ env.SBOM_CLI_LINUX_AMD64_PATH }}

      - name: Attest SBOM (cli, linux/arm64)
        id: attest-cli-linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/cli
          subject-digest: ${{ env.SBOM_CLI_LINUX_ARM64_DIGEST }}
          sbom-path: ${{ env.SBOM_CLI_LINUX_ARM64_PATH }}

      - name: Attest SBOM (cli, index)
        id: attest-cli-index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/cli
          subject-digest: ${{ env.SBOM_CLI_INDEX_DIGEST }}
          sbom-path: ${{ env.SBOM_CLI_INDEX_PATH }}

      - name: Attest SBOM (scanner-mumps, linux/amd64)
        id: attest-scanner-mumps-linux-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-mumps
          subject-digest: ${{ env.SBOM_SCANNER_MUMPS_LINUX_AMD64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_MUMPS_LINUX_AMD64_PATH }}

      - name: Attest SBOM (scanner-mumps, linux/arm64)
        id: attest-scanner-mumps-linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-mumps
          subject-digest: ${{ env.SBOM_SCANNER_MUMPS_LINUX_ARM64_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_MUMPS_LINUX_ARM64_PATH }}

      - name: Attest SBOM (scanner-mumps, index)
        id: attest-scanner-mumps-index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/scanner-mumps
          subject-digest: ${{ env.SBOM_SCANNER_MUMPS_INDEX_DIGEST }}
          sbom-path: ${{ env.SBOM_SCANNER_MUMPS_INDEX_PATH }}

      - name: Collect SBOM attestation bundles
        # Checks each bundle signs the expected subject digest with its
        # own SBOM, then saves it as <sbom>.sigstore.json.
        env:
          ATTEST_STEPS: ${{ toJSON(steps) }}
        run: python -m scripts.ci.image_sboms collect --sha12 "${SBOM_SHA12}" --out-dir "${SBOM_DIR}"

      - name: Upload image SBOMs
        # Every run, released or not. 30 days covers the 14-day grace on
        # build-<sha> tags; released SBOMs also live on the GitHub release.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-sboms-${{ env.SBOM_SHA12 }}
          path: ${{ env.SBOM_DIR }}/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Capture version before release
        run: |
          VERSION_BEFORE=$(node -p "require('./package.json').version")
          echo "VERSION_BEFORE=${VERSION_BEFORE}" >> "$GITHUB_ENV"
          echo "Pre-release version: ${VERSION_BEFORE}"

      - name: Release (Auto)
        if: github.event.inputs.releaseType == 'auto'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HUSKY: 0
          PRE_RELEASE_ID: ${{ github.event.inputs.preReleaseId || '' }}
        run: |
          if [ -n "$PRE_RELEASE_ID" ]; then
            pnpm run release:ci -- --preRelease="$PRE_RELEASE_ID"
          else
            pnpm run release:ci
          fi

      - name: Release (Specific Type)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.releaseType != 'auto'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HUSKY: 0
          RELEASE_TYPE: ${{ github.event.inputs.releaseType }}
          PRE_RELEASE_ID: ${{ github.event.inputs.preReleaseId || '' }}
        run: |
          if [ -n "$PRE_RELEASE_ID" ]; then
            pnpm run release:ci -- "$RELEASE_TYPE" --preRelease="$PRE_RELEASE_ID"
          else
            pnpm run release:ci -- "$RELEASE_TYPE"
          fi

      - name: Capture released version
        run: |
          VERSION_AFTER=$(node -p "require('./package.json').version")
          if [ "$VERSION_AFTER" = "$VERSION_BEFORE" ]; then
            echo "::notice::No release cut — version unchanged (${VERSION_AFTER}). Skipping promote/publish."
            echo "RELEASED=" >> "$GITHUB_ENV"
          else
            echo "RELEASED=true" >> "$GITHUB_ENV"
            echo "VERSION=${VERSION_AFTER}" >> "$GITHUB_ENV"
            # A prerelease (X.Y.Z-rc.N) gets its own tag but never :latest (ADR-500).
            case "$VERSION_AFTER" in
              *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV"; echo "Released prerelease ${VERSION_AFTER}" ;;
              *)   echo "PRERELEASE=" >> "$GITHUB_ENV"; echo "Released ${VERSION_AFTER}" ;;
            esac
          fi

      - name: Promote containers (re-tag :VERSION, plus :latest unless a prerelease)
        if: env.RELEASED == 'true'
        run: |
          set -euo pipefail
          for IMAGE in ${IMAGE_NAMES}; do
            SRC="${IMAGE_REGISTRY}/${IMAGE}:${BUILD_TAG}"
            TAGS=(--tag "${IMAGE_REGISTRY}/${IMAGE}:${VERSION}")
            if [ "${PRERELEASE}" != "true" ]; then
              TAGS+=(--tag "${IMAGE_REGISTRY}/${IMAGE}:latest")
            fi
            docker buildx imagetools create "${TAGS[@]}" "${SRC}"
            echo "Promoted ${SRC} → ${TAGS[*]}"
          done

      - name: Install cosign
        if: env.RELEASED == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images by digest
        # Signing by digest (not tag) means the signature stays valid even
        # if the :VERSION or :latest tag is later moved. Fails the
        # workflow on any failure (no continue-on-error) — an unsigned
        # release would silently break image verification in the SDK.
        if: env.RELEASED == 'true'
        run: |
          set -euo pipefail
          # Same source as build/promote. The per-image digest captured at
          # build time lives in env var <KEY>_DIGEST, where KEY is the
          # image name upper-cased with '-' → '_' (scanner-mumps →
          # SCANNER_MUMPS), matching the IMAGES array keys above.
          for IMAGE in ${IMAGE_NAMES}; do
            KEY=$(echo "${IMAGE}" | tr 'a-z-' 'A-Z_')
            DIGEST_VAR="${KEY}_DIGEST"
            cosign sign --yes "${IMAGE_REGISTRY}/${IMAGE}@${!DIGEST_VAR}"
            echo "Signed ${IMAGE} @ ${!DIGEST_VAR}"
          done
          echo "All images signed by digest"

      - name: Package SBOMs for the GitHub release
        # One archive in place of ~30 loose assets (#514): the same files as
        # the image-sboms-<sha12> artifact, under one top-level directory.
        # Sorted names, fixed owner and mtime, and gzip -n keep the bytes
        # stable for a given set of SBOMs.
        if: env.RELEASED == 'true'
        run: |
          set -euo pipefail
          NAME="argus-${VERSION}-image-sboms"
          ARCHIVE="${RUNNER_TEMP}/${NAME}.tar.gz"
          ( cd "${SBOM_DIR}" && ls -- *.json ) \
            | tar -C "${SBOM_DIR}" --sort=name --owner=0 --group=0 --numeric-owner \
                --mtime='1970-01-01 00:00:00Z' --transform "s,^,${NAME}/," \
                -cf - --files-from=- \
            | gzip -n > "${ARCHIVE}"
          ( cd "${RUNNER_TEMP}" && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          tar -tzf "${ARCHIVE}"
          echo "SBOM_ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Attest the SBOM archive
        # Build provenance for the archive itself, so a downloaded copy
        # verifies with gh attestation verify <file> --repo <repo>. Each
        # SBOM inside also carries its own .sigstore.json bundle.
        id: sbom-archive-attestation
        if: env.RELEASED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.SBOM_ARCHIVE }}

      - name: Attach SBOMs to the GitHub release
        # release-it has created the release by now as a draft (its tag is
        # the bare version). It must still be a draft: an immutable release
        # refuses new assets once published.
        if: env.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${VERSION}" "${SBOM_ARCHIVE}" "${SBOM_ARCHIVE}.sha256" \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Verify pinned image manifests resolve
        # The chore(release): commit skips the Unit Tests workflow (and the
        # manifest check it runs), so a promotion miss used to ship
        # undetected and only surface later on an unrelated PR. release-it
        # has already rewritten argus/containers.py with the new version +
        # digests; verify every pinned tag@digest actually resolves on
        # GHCR before we build the wheel and publish to PyPI.
        if: env.RELEASED == 'true'
        run: |
          set +e
          python -m scripts.ci.check_container_images
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::One or more pinned images failed manifest check — a release tag was likely not promoted. Aborting before publish."
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::warning::docker unavailable — image manifest check skipped"
          fi

      - name: Build wheel
        # release-it has already bumped argus/__init__.py and rewritten
        # argus/containers.py with the new digests via the after:bump
        # hook. The wheel built here references signed, promoted images.
        if: env.RELEASED == 'true'
        run: |
          pip install build pyyaml
          python -m build

      - name: Safety check
        if: env.RELEASED == 'true'
        run: python -m scripts.ci.check_package

      - name: Smoke test
        # ARGUS_NO_UPDATE_CHECK=1 disables the background PyPI poll
        # daemon thread that races C-extension imports on hosted
        # Python 3.13.13 (the suspected root cause of the SIGSEGV
        # flake — see scripts/ci/argus_smoke.sh header). The retry
        # helper stays as belt-and-suspenders.
        if: env.RELEASED == 'true'
        env:
          ARGUS_NO_UPDATE_CHECK: "1"
        run: |
          pip install dist/*.whl
          argus --version
          scripts/ci/argus_smoke.sh

      - name: Publish to PyPI
        if: env.RELEASED == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish the GitHub release
        # Last, so the release only becomes public (and immutable) once the
        # images, signatures, SBOMs and PyPI wheel are all out. The release
        # token, not GITHUB_TOKEN, so the `release: published` event still
        # triggers docs.yml (events made with GITHUB_TOKEN start no runs).
        if: env.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Summary
        if: env.RELEASED == 'true'
        run: |
          {
            echo "## Release ${VERSION}"
            echo ""
            echo "### PyPI"
            echo "\`\`\`"
            echo "pip install argus-security==${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "### Container Images"
            echo "| Image | Tags |"
            echo "|-------|------|"
            for IMAGE in ${IMAGE_NAMES}; do
              if [ "${PRERELEASE}" = "true" ]; then
                echo "| ${IMAGE_REGISTRY}/${IMAGE} | ${VERSION} (prerelease, :latest unchanged) |"
              else
                echo "| ${IMAGE_REGISTRY}/${IMAGE} | ${VERSION}, latest |"
              fi
            done
            echo ""
            echo "### SBOMs"
            echo "Signed CycloneDX SBOMs (per platform + index) are attached to the release. Verify one with:"
            echo "\`\`\`"
            echo "gh attestation verify oci://${IMAGE_REGISTRY}/<image>:${VERSION} --repo ${GITHUB_REPOSITORY} --predicate-type https://cyclonedx.org/bom"
            echo "\`\`\`"
            echo ""
            echo "### Build artifacts"
            echo "- Intermediate build tag: \`${BUILD_TAG}\` (will be pruned in 14 days)"
          } >> "$GITHUB_STEP_SUMMARY"
