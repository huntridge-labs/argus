# Infrastructure Security Scanner - Reusable Workflow
#
# DEPRECATED (#327): This compound wrapper does not emit scanner-summary-* artifacts
# or PR comments, so its findings never reach an aggregated summary. It is no longer
# used by reusable-security-hardening.yml — the `infrastructure` scanner key now runs
# the per-scanner scanner-trivy-iac.yml + scanner-checkov.yml workflows, which produce
# summaries, comments, and correct failure gating. Prefer those directly; this file is
# retained only for backward compatibility and will be removed in a future release.
#
# COMPOUND WRAPPER: Runs Trivy IaC + Checkov scanners in parallel via the argus CLI.
# Scanner implementations: argus/scanners/trivy_iac.py, argus/scanners/checkov.py
#
# For GHES users: Use the composite actions directly instead of this workflow.
# See: examples/github-enterprise/infrastructure-scanning.yml

name: Infrastructure Security Scanner

on:
  workflow_dispatch:
    inputs:
      iac_path:
        description: 'Relative path to the infrastructure-as-code directory to scan'
        required: false
        type: string
        default: '.'
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found'
        required: false
        type: string
        default: 'none'

  workflow_call:
    inputs:
      iac_path:
        description: 'Relative path to the infrastructure-as-code directory to scan'
        required: false
        type: string
        default: '.'
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: 'Fail the job if vulnerabilities at or above this severity are found'
        required: false
        type: string
        default: 'none'
      post_pr_comment:
        description: 'Post results as PR comment'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  trivy-iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.10.0

      - name: Run Trivy IaC Scanner via argus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGUS_IAC_PATH: ${{ inputs.iac_path }}
          ARGUS_POST_PR_COMMENT: ${{ inputs.post_pr_comment }}
          ARGUS_ENABLE_CODE_SECURITY: ${{ inputs.enable_code_security }}
          ARGUS_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        run: |
          python -m argus scan trivy-iac \
            --path "$ARGUS_IAC_PATH" \
            --severity-threshold "$ARGUS_FAIL_ON_SEVERITY" \
            --format markdown --format sarif

  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.10.0

      - name: Run Checkov Scanner via argus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGUS_IAC_PATH: ${{ inputs.iac_path }}
          ARGUS_POST_PR_COMMENT: ${{ inputs.post_pr_comment }}
          ARGUS_ENABLE_CODE_SECURITY: ${{ inputs.enable_code_security }}
          ARGUS_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        run: |
          python -m argus scan checkov \
            --path "$ARGUS_IAC_PATH" \
            --severity-threshold "$ARGUS_FAIL_ON_SEVERITY" \
            --format markdown --format sarif
