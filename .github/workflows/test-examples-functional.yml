name: Validate Examples

# This workflow validates example workflow files to ensure they work correctly
# by dynamically discovering and testing examples without code duplication

on:
  pull_request:
    paths:
      - 'examples/**'
      - '.github/actions/**'
      - '.github/workflows/test-examples-functional.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Discover and Validate All Example Files
  # ============================================================================
  discover-examples:
    name: Discover Example Files
    runs-on: ubuntu-latest
    outputs:
      workflow-examples: ${{ steps.discover.outputs.workflow-examples }}
      config-examples: ${{ steps.discover.outputs.config-examples }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Discover example files
        id: discover
        run: |
          # Find workflow examples (simple - just in workflows/ subdirectory)
          WORKFLOW_EXAMPLES=$(find examples/workflows -name "*.yml" -type f 2>/dev/null | jq -R -s -c 'split("\n")[:-1]')
          echo "workflow-examples=$WORKFLOW_EXAMPLES" >> "$GITHUB_OUTPUT"

          # Fail if fewer than 3 workflow examples found (prevents silent empty-matrix passes)
          EXAMPLE_COUNT=$(echo "$WORKFLOW_EXAMPLES" | jq 'length')
          echo "Found $EXAMPLE_COUNT workflow examples"
          if [ "$EXAMPLE_COUNT" -lt 3 ]; then
            echo "::error::Expected at least 3 workflow examples but found $EXAMPLE_COUNT. This may indicate missing or deleted example files."
            exit 1
          fi

          {
            echo "## Discovered Examples"
            echo ""
            echo "**Workflow Examples:** ($EXAMPLE_COUNT found)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$WORKFLOW_EXAMPLES" | jq -r '.[]' | while read -r file; do
            [ -n "$file" ] && echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # ============================================================================
  # Validate Syntax, References, and Structure
  # ============================================================================
  validate-examples:
    name: Validate ${{ matrix.example }}
    runs-on: ubuntu-latest
    needs: discover-examples
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover-examples.outputs.workflow-examples) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Validate YAML syntax
        run: |
          echo "Validating: ${MATRIX_EXAMPLE}"
          python -c "import yaml; yaml.safe_load(open('${MATRIX_EXAMPLE}'))"
          echo "✅ Valid YAML syntax" >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX_EXAMPLE: ${{ matrix.example }}

      - name: Validate action references
        run: |
          # Extract and validate action paths exist locally
          REMOTE_ACTIONS=$(grep -oE 'huntridge-labs/argus\.github/actions/[^@[:space:]]+' "${MATRIX_EXAMPLE}" || true)

          ERRORS=0
          for action in $REMOTE_ACTIONS; do
            # Remove the repo prefix to get local path
            LOCAL_PATH="${action#huntridge-labs/argus}"

            if [ ! -d "$LOCAL_PATH" ]; then
              echo "❌ **Referenced action does not exist:** \`$action\`" >> "$GITHUB_STEP_SUMMARY"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi

          echo "✅ All action references valid" >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX_EXAMPLE: ${{ matrix.example }}

      - name: Validate required structure
        run: |
          # Check that workflow has required elements
          if ! grep -q "name:" "${MATRIX_EXAMPLE}"; then
            echo "❌ **Missing workflow name**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! grep -q "on:" "${MATRIX_EXAMPLE}"; then
            echo "❌ **Missing trigger (on:)**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! grep -q "jobs:" "${MATRIX_EXAMPLE}"; then
            echo "❌ **Missing jobs definition**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ Required workflow structure present" >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX_EXAMPLE: ${{ matrix.example }}

  # ============================================================================
  # Validate Configuration Examples
  # ============================================================================
  validate-configs:
    name: Validate Config Files
    runs-on: ubuntu-latest
    needs: discover-examples
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate container configs
        run: |
          echo "## Configuration Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          ERRORS=0

          # Validate container config examples
          for config in examples/configs/container-config.example.{yml,json}; do
            if [ -f "$config" ]; then
              echo "Testing: $config"

              # Validate it's valid YAML/JSON
              if [[ "$config" == *.yml ]]; then
                if python -c "import yaml; yaml.safe_load(open('$config'))" 2>/dev/null; then
                  echo "✅ \`$(basename "$config")\` is valid YAML" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "❌ \`$(basename "$config")\` invalid YAML syntax" >> "$GITHUB_STEP_SUMMARY"
                  ERRORS=$((ERRORS + 1))
                fi
              elif [[ "$config" == *.json ]]; then
                if python -c "import json; json.load(open('$config'))" 2>/dev/null; then
                  echo "✅ \`$(basename "$config")\` is valid JSON" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "❌ \`$(basename "$config")\` invalid JSON syntax" >> "$GITHUB_STEP_SUMMARY"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi

      - name: Validate ZAP configs
        run: |
          for config in examples/configs/zap-config*.yml; do
            if [ -f "$config" ]; then
              echo "Validating: $config"
              python -c "import yaml; yaml.safe_load(open('$config'))"
              echo "✅ \`$(basename "$config")\` is valid YAML" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # ============================================================================
  # Audit example workflows against current action.yml input contracts
  # Runs once across the whole tree (cross-action correlation, not
  # per-example). Catches the bug class where a contract trim leaves
  # documented examples passing inputs the action no longer accepts —
  # composite actions only emit a runtime warning for those, so the
  # drift never surfaces in the syntax-only validate-examples matrix.
  # See scripts/ci/check_example_inputs.py for the audit logic.
  # ============================================================================
  audit-action-inputs:
    name: Audit Example Action Inputs
    runs-on: ubuntu-latest
    needs: discover-examples
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Audit example with-keys against action.yml inputs
        run: |
          # --gh-annotations emits ::error file=...:: lines that render
          # inline in the PR Files-changed view, pinpointing the
          # offending example.
          python -m scripts.ci.check_example_inputs --gh-annotations

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Example Action-Input Audit"
            echo ""
            echo "Checks every \`uses: huntridge-labs/argus/.github/actions/<name>@1.2.1 step in"
            echo "\`examples/**\` against its action's current \`action.yml::inputs\` list."
            echo ""
            echo "Source of truth: \`.github/actions/<name>/action.yml\`."
            echo "Audit script: \`scripts/ci/check_example_inputs.py\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Final Summary
  # ============================================================================
  examples-summary:
    name: Examples Validation Summary
    runs-on: ubuntu-latest
    needs:
      - validate-examples
      - validate-configs
      - audit-action-inputs
    if: always()

    steps:
      - name: Generate Summary
        env:
          NEEDS_VALIDATE_EXAMPLES_RESULT: ${{ needs.validate-examples.result }}
          NEEDS_VALIDATE_CONFIGS_RESULT: ${{ needs.validate-configs.result }}
          NEEDS_AUDIT_ACTION_INPUTS_RESULT: ${{ needs.audit-action-inputs.result }}
        run: |
          examples_status="❌ Failed"
          [ "$NEEDS_VALIDATE_EXAMPLES_RESULT" = "success" ] && examples_status="✅ Passed"
          configs_status="❌ Failed"
          [ "$NEEDS_VALIDATE_CONFIGS_RESULT" = "success" ] && configs_status="✅ Passed"
          audit_status="❌ Failed"
          [ "$NEEDS_AUDIT_ACTION_INPUTS_RESULT" = "success" ] && audit_status="✅ Passed"

          {
            echo "# Example Validation Results"
            echo ""
            echo "| Validation Type | Status |"
            echo "|-----------------|--------|"
            echo "| Workflow Examples | $examples_status |"
            echo "| Config Examples | $configs_status |"
            echo "| Action-Input Audit | $audit_status |"
            echo ""
            echo "> **Note**: Functional testing of actions is handled by \`test-actions.yml\`"
            echo "> This workflow focuses on validating example **documentation** is correct."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$NEEDS_VALIDATE_EXAMPLES_RESULT" = "success" ] && \
             [ "$NEEDS_VALIDATE_CONFIGS_RESULT" = "success" ] && \
             [ "$NEEDS_AUDIT_ACTION_INPUTS_RESULT" = "success" ]; then
            echo "✅ **All examples validated successfully!**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Some validations failed - review above for details**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
