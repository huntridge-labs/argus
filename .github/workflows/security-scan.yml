name: Security Scan (Argus)

# Argus scans itself using published container images.
# Runs on push to main (after release publishes images) and weekly.
# PRs use build-containers.yml which builds images from the branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  argus-scan:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    name: Argus Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'

      - name: Install Argus
        # An editable install (with every extra) gives the reporter
        # registry a discoverable ``argus.reporters`` entry-point set and
        # pulls in PyYAML / Pydantic / etc. as declared dependencies (no
        # separate ``pip install pyyaml`` needed). The runtime built-in
        # fallback in argus.reporters keeps a bare PYTHONPATH install
        # working too (issue #172), but CI installs the ordinary way so the
        # install path is exercised on every run. Versions come from uv.lock
        # (ADR-043); --no-dev skips the test tooling the scan doesn't need.
        run: UV_PROJECT_ENVIRONMENT="$pythonLocation" uv sync --locked --all-extras --no-dev --inexact --quiet

      - name: Run Argus scan
        id: scan
        run: |
          set +e
          python -m argus scan --config argus.yml --verbose
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "::error::Argus scan failed with error (exit code 2)"
            exit 2
          fi

      - name: Upload SARIF results
        if: always() && hashFiles('argus-results/argus-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: argus-results/argus-results.sarif
          category: argus-dogfood
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: argus-scan-results
          path: argus-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post scan summary
        if: always()
        run: |
          if [ -f "argus-results/argus-summary.md" ]; then
            cat argus-results/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "argus-results/argus-results.json" ]; then
            {
              echo "## Argus Security Scan"
              python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          results = data.get('results', [])
          total = sum(len(r.get('findings', [])) for r in results)
          scanners = [r['scanner'] for r in results]
          print(f'Scanned with {len(results)} scanner(s): {\", \".join(scanners)}')
          print(f'Total findings: {total}')
          " argus-results/argus-results.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
