name: Security Scan (Argus)

# Dogfood: we use argus to scan argus.
# PRs test the commit's argus CLI. Main tests the release.
# The argus engine handles tool execution — local if available,
# Docker container fallback otherwise. No manual tool installs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  argus-scan:
    name: Argus Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Argus
        run: |
          pip install --quiet pyyaml
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run Argus scan
        run: |
          python -m argus scan --config argus.yml --verbose || true

      - name: Upload SARIF results
        if: always() && hashFiles('argus-results/argus-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: argus-results/argus-results.sarif
          category: argus-dogfood
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: argus-scan-results
          path: argus-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post scan summary
        if: always()
        run: |
          if [ -f "argus-results/argus-summary.md" ]; then
            cat argus-results/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "argus-results/argus-results.json" ]; then
            echo "## Argus Security Scan" >> "$GITHUB_STEP_SUMMARY"
            python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          results = data.get('results', [])
          total = sum(len(r.get('findings', [])) for r in results)
          print(f'Scanned with {len(results)} scanner(s), found {total} finding(s)')
          " argus-results/argus-results.json >> "$GITHUB_STEP_SUMMARY"
          fi
