name: Security Scan (Argus)

# Dogfood: we use argus to scan argus.
# PRs build custom container images from the branch, then scan with them.
# Main/scheduled scans use published images from GHCR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  argus-scan:
    name: Argus Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Argus
        run: |
          pip install --quiet pyyaml
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # Build custom images from this branch so the scan uses the PR's code.
      # Official images (gitleaks, clamav, osv, trivy, etc.) are pulled from
      # their authors' registries. Only our custom images need building.
      - name: Build custom scanner images
        run: |
          echo "Building custom argus container images from this branch..."
          for pair in \
            "scanner-bandit:docker/Dockerfile.bandit" \
            "scanner-opengrep:docker/Dockerfile.opengrep" \
            "scanner-supply-chain:docker/Dockerfile.supply-chain"; do
            IMAGE="${pair%%:*}"
            DOCKERFILE="${pair#*:}"
            TAG="ghcr.io/huntridge-labs/argus/${IMAGE}:1.0.0"
            echo "  Building ${TAG}..."
            docker build --quiet --tag "${TAG}" --file "${DOCKERFILE}" . || {
              echo "::warning::Failed to build ${IMAGE} — scanner will be unavailable"
            }
          done
          echo "Done."

      - name: Run Argus scan
        id: scan
        run: |
          set +e
          python -m argus scan --config argus.yml --verbose
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Exit 0 = pass, 1 = findings above threshold (informational), 2 = error
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "::error::Argus scan failed with error (exit code 2)"
            exit 2
          fi

      - name: Upload SARIF results
        if: always() && hashFiles('argus-results/argus-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: argus-results/argus-results.sarif
          category: argus-dogfood
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: argus-scan-results
          path: argus-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post scan summary
        if: always()
        run: |
          if [ -f "argus-results/argus-summary.md" ]; then
            cat argus-results/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "argus-results/argus-results.json" ]; then
            {
              echo "## Argus Security Scan"
              python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          results = data.get('results', [])
          total = sum(len(r.get('findings', [])) for r in results)
          scanners = [r['scanner'] for r in results]
          print(f'Scanned with {len(results)} scanner(s): {\", \".join(scanners)}')
          print(f'Total findings: {total}')
          " argus-results/argus-results.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
