name: Security Scan (Argus)

# Argus scans itself using published container images.
# Runs on push to main (after release publishes images) and weekly.
# PRs use build-containers.yml which builds images from the branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  argus-scan:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    name: Argus Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install Argus
        # ``pip install --editable .`` (with the [all] extra) gives the
        # reporter registry a discoverable ``argus.reporters``
        # entry-point set, mirrors how end users install argus, and
        # pulls in PyYAML / Pydantic / etc. as declared dependencies
        # (no separate ``pip install pyyaml`` needed). The runtime
        # built-in fallback in argus.reporters keeps a bare PYTHONPATH
        # install working too (issue #172), but CI installs the
        # ordinary way so the install path is exercised on every run.
        run: pip install --quiet --editable '.[all]'

      - name: Run Argus scan
        id: scan
        run: |
          set +e
          python -m argus scan --config argus.yml --verbose
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "::error::Argus scan failed with error (exit code 2)"
            exit 2
          fi

      - name: Upload SARIF results
        if: always() && hashFiles('argus-results/argus-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: argus-results/argus-results.sarif
          category: argus-dogfood
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: argus-scan-results
          path: argus-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post scan summary
        if: always()
        run: |
          if [ -f "argus-results/argus-summary.md" ]; then
            cat argus-results/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "argus-results/argus-results.json" ]; then
            {
              echo "## Argus Security Scan"
              python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          results = data.get('results', [])
          total = sum(len(r.get('findings', [])) for r in results)
          scanners = [r['scanner'] for r in results]
          print(f'Scanned with {len(results)} scanner(s): {\", \".join(scanners)}')
          print(f'Total findings: {total}')
          " argus-results/argus-results.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
