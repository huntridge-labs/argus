name: Security Scan (Argus)

# Argus scans itself using published container images.
# Runs on push to main (after release publishes images) and weekly.
# PRs use build-containers.yml which builds images from the branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  argus-scan:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    name: Argus Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install Argus
        run: |
          pip install --quiet pyyaml
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run Argus scan
        id: scan
        run: |
          set +e
          python -m argus scan --config argus.yml --verbose
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "::error::Argus scan failed with error (exit code 2)"
            exit 2
          fi

      - name: Upload SARIF results
        if: always() && hashFiles('argus-results/argus-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: argus-results/argus-results.sarif
          category: argus-dogfood
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: argus-scan-results
          path: argus-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post scan summary
        if: always()
        run: |
          if [ -f "argus-results/argus-summary.md" ]; then
            cat argus-results/argus-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "argus-results/argus-results.json" ]; then
            {
              echo "## Argus Security Scan"
              python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          results = data.get('results', [])
          total = sum(len(r.get('findings', [])) for r in results)
          scanners = [r['scanner'] for r in results]
          print(f'Scanned with {len(results)} scanner(s): {\", \".join(scanners)}')
          print(f'Total findings: {total}')
          " argus-results/argus-results.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
