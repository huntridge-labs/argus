# Supply Chain Security Scanner - Reusable Workflow
#
# Runs the supply-chain scanner via the argus Python CLI.
# Equivalent to: python -m argus scan supply-chain
#
# For GHES users: Use the composite action directly instead of this workflow.
# See: examples/github-enterprise/all-scanners.yml

name: Supply Chain Security Scanner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      allow_failure:
        description: 'When true (default) the scan never fails the job (non-blocking); when false, a scan crash or a fail_on_severity breach fails the job so a caller/pipeline can gate on it.'
        required: false
        type: boolean
        default: true
      post_pr_comment:
        description: 'Whether to post PR comments'
        required: false
        type: boolean
        default: true
      enable_code_security:
        description: 'Whether GitHub Code Security is enabled for this repository'
        required: false
        type: boolean
        default: false
      scan_path:
        description: 'Path to scan for GitHub Actions workflows and actions'
        required: false
        type: string
        default: '.'
      fail_on_severity:
        description: 'Fail if findings at or above this severity. Options: none, low, medium, high.'
        required: false
        type: string
        default: 'none'
      persona:
        description: 'Zizmor audit strictness: regular (default), pedantic, or auditor'
        required: false
        type: string
        default: 'regular'
      zizmor_config:
        description: 'Path to zizmor configuration file'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  supply-chain-scan:
    name: Supply Chain Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.allow_failure == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Argus
        uses: huntridge-labs/argus/.github/actions/setup-argus@1.12.0

      - name: Run scan
        run: |
          python -m argus scan supply-chain \
            --path "$SCAN_PATH" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --format terminal --format sarif --format json --format markdown \
            --output-dir ./argus-results \
            --verbose
        env:
          SCAN_PATH: ${{ inputs.scan_path || '.' }}
          SEVERITY_THRESHOLD: ${{ inputs.fail_on_severity || 'none' }}
          ZIZMOR_PERSONA: ${{ inputs.persona || 'regular' }}
          ZIZMOR_CONFIG: ${{ inputs.zizmor_config }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-reports
          path: ./argus-results/
          retention-days: 30

      - name: Build scanner summary
        if: always()
        run: |
          mkdir -p scanner-summaries
          {
            echo "<details><summary>🔗 Supply Chain (zizmor + actionlint)</summary>"
            echo ""
            if [ -f ./argus-results/argus-summary.md ]; then
              cat ./argus-results/argus-summary.md
            else
              echo "_No 🔗 Supply Chain (zizmor + actionlint) findings summary was produced._"
            fi
            echo ""
            echo "</details>"
          } > scanner-summaries/supply-chain.md

      - name: Upload scanner summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-summary-supply-chain
          path: scanner-summaries/
          retention-days: 30

      - name: Upload SARIF
        if: inputs.enable_code_security && always() && github.actor != 'nektos/act'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: ./argus-results/argus-results.sarif
        continue-on-error: true

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && inputs.post_pr_comment
        uses: huntridge-labs/argus/.github/actions/comment-pr@1.12.0
        with:
          summary_file: ./argus-results/argus-summary.md
          comment_marker: supply-chain-scanner-comment-marker
          title: 'Supply Chain Security Results'
          fallback_message: 'No Supply Chain results available'
