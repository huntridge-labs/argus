[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-security"
dynamic = ["version"]
description = "Unified security scanning — SAST, containers, IaC, secrets, dependencies, and DAST from a single CLI."
readme = "README_PYPI.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.11"
keywords = ["security", "scanning", "sast", "dast", "iac", "secrets", "containers", "compliance", "devsecops"]
authors = [
    {name = "Huntridge Labs"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
    # Linting is a core scan capability, not optional. Tools that are
    # themselves Python packages get bundled directly so
    # ``argus scan lint-*`` works after a clean
    # ``pip install argus-security`` with no extra setup. Native-binary
    # linters (hadolint, terraform, tflint) come in via the container
    # backend instead.
    "yamllint>=1.30",   # lint-yaml
    "flake8>=6.0",      # lint-python
]

[project.optional-dependencies]
# AI classification for SCN detector (argus classify --enable-ai).
# httpx[socks] is pulled in explicitly — anthropic + openai both
# instantiate an httpx.Client during SDK construction, and httpx
# only picks up a SOCKS proxy transport when the socksio package
# is present. Developer environments with an ``ALL_PROXY``/``HTTPS_PROXY``
# that uses ``socks5://`` would otherwise ImportError every test
# that builds a provider object, even tests that never make an
# actual HTTP call.
ai = [
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "httpx[socks]>=0.24",
]
# Shell tab completion
completion = ["argcomplete>=3.0"]
# MCP server for AI assistant integration
mcp = ["mcp>=1.0.0"]
# Terminal interface for `argus view --interface=terminal`
terminal = ["textual>=0.80"]
# Browser interface for `argus view --interface=browser` (localhost web UI)
browser = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
# All optional features
all = ["argus-security[ai,completion,mcp,terminal,browser]"]

[project.scripts]
argus = "argus.cli:main"

[project.urls]
Homepage = "https://argus.huntridgelabs.com"
Documentation = "https://huntridge-labs.github.io/argus"
Repository = "https://github.com/huntridge-labs/argus"
Issues = "https://github.com/huntridge-labs/argus/issues"
Changelog = "https://github.com/huntridge-labs/argus/blob/main/CHANGELOG.md"

# ── Package contents (whitelist — only these files ship) ──────────

[tool.setuptools.dynamic]
version = {attr = "argus.__version__"}

[tool.setuptools.packages.find]
include = ["argus", "argus.*"]
# Explicitly exclude tests, fixtures, and non-SDK code
exclude = [
    "argus.tests",
    "argus.tests.*",
    "tests",
    "tests.*",
]

[tool.setuptools.package-data]
# Include schema files and logo
argus = ["../argus-config.schema.json", "../img/argus_logo.txt"]
# Web UI templates and static assets live next to the Python package but
# aren't .py files; setuptools won't pick them up automatically. Listing
# them here ships them inside the built wheel.
"argus.viewers.browser" = ["templates/*.j2", "static/*"]

# ── Tool configuration ────────────────────────────────────────────

[tool.bandit]
exclude_dirs = [
    ".husky",
    ".github",
    "tests",
    "docs",
    "__pycache__",
    "venv",
    "node_modules",
]
skips = ["B101", "B601"]
