[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-security"
dynamic = ["version"]
description = "Unified security scanning — SAST, containers, IaC, secrets, dependencies, and DAST from a single CLI."
readme = "README_PYPI.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.11"
keywords = ["security", "scanning", "sast", "dast", "iac", "secrets", "containers", "compliance", "devsecops"]
authors = [
    {name = "Huntridge Labs"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# AI classification for SCN detector (argus classify --enable-ai)
ai = ["anthropic>=0.39.0", "openai>=1.0.0", "requests>=2.31.0"]
# Shell tab completion
completion = ["argcomplete>=3.0"]
# MCP server for AI assistant integration
mcp = ["mcp>=1.0.0"]
# Interactive findings browser (argus browse)
browse = ["textual>=0.80"]
# Local read-only web UI (argus serve)
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
# All optional features
all = ["argus-security[ai,completion,mcp,browse,serve]"]

[project.scripts]
argus = "argus.cli:main"

[project.urls]
Homepage = "https://argus.huntridgelabs.com"
Documentation = "https://huntridge-labs.github.io/argus"
Repository = "https://github.com/huntridge-labs/argus"
Issues = "https://github.com/huntridge-labs/argus/issues"
Changelog = "https://github.com/huntridge-labs/argus/blob/main/CHANGELOG.md"

# ── Package contents (whitelist — only these files ship) ──────────

[tool.setuptools.dynamic]
version = {attr = "argus.__version__"}

[tool.setuptools.packages.find]
include = ["argus", "argus.*"]
# Explicitly exclude tests, fixtures, and non-SDK code
exclude = [
    "argus.tests",
    "argus.tests.*",
    "tests",
    "tests.*",
]

[tool.setuptools.package-data]
# Include schema files and logo
argus = ["../argus-config.schema.json", "../img/argus_logo.txt"]

# ── Tool configuration ────────────────────────────────────────────

[tool.bandit]
exclude_dirs = [
    ".husky",
    ".github",
    "tests",
    "docs",
    "__pycache__",
    "venv",
    "node_modules",
]
skips = ["B101", "B601"]
